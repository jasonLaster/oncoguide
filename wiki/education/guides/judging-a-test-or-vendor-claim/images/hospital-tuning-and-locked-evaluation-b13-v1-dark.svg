<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1495" viewBox="0 0 760 1495" role="img" aria-labelledby="title desc"><title id="title">Who helped choose the rule?</title><desc id="desc">Fictional Hospital A tuning and reused evaluation versus a locked rule tested on separate Hospital B patients.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#f4f0e3" stroke-width="1.5"/></marker></defs><rect width="760" height="1495" fill="#142531"/><g font-family="system-ui,Arial,sans-serif" fill="#f4f0e3"><text x="30" y="52" font-size="38" font-weight="750" fill="#f4f0e3" text-anchor="start">Follow the patients, not the logo.</text><text x="30" y="104" font-size="31" font-weight="400" fill="#bdced5" text-anchor="start">Two fictional validation slides</text><rect x="24" y="137" width="712" height="489" rx="20" fill="#653e4c" stroke="#f0a0b8" stroke-width="2"/><text x="46" y="184" font-size="34" font-weight="750" fill="#f4f0e3" text-anchor="start">SLIDE A · same patients return</text><circle cx="90" cy="225" r="10" fill="#203b47" stroke="#f0a0b8" stroke-width="3"/><path d="M74 268 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#f0a0b8" stroke-width="3"/><circle cx="145" cy="225" r="10" fill="#203b47" stroke="#f0a0b8" stroke-width="3"/><path d="M129 268 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#f0a0b8" stroke-width="3"/><circle cx="200" cy="225" r="10" fill="#203b47" stroke="#f0a0b8" stroke-width="3"/><path d="M184 268 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#f0a0b8" stroke-width="3"/><text x="260" y="237" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Hospital A patients</text><text x="260" y="277" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">with known outcomes</text><path d="M380 292 V338" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="350" width="550" height="96" rx="20" fill="#142531" stroke="#f0a0b8" stroke-width="2"/><text x="380" y="390" font-size="32" font-weight="700" fill="#f4f0e3" text-anchor="middle">Choose variables + threshold</text><text x="380" y="430" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="middle">using A outcomes</text><path d="M380 451 V501" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><text x="46" y="546" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Rerun A → report performance on A</text><text x="46" y="588" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Same data informed the rule and its score.</text><rect x="24" y="656" width="712" height="535" rx="20" fill="#26584f" stroke="#78dcc8" stroke-width="2"/><text x="46" y="707" font-size="33" font-weight="750" fill="#f4f0e3" text-anchor="start">SLIDE B · keep the test separate</text><text x="45" y="759" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">A: fit + tune → lock the whole method</text><text x="45" y="800" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Variables, processing and threshold fixed</text><path d="M380 819 V866" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="878" width="540" height="102" rx="20" fill="#142531" stroke="#78dcc8" stroke-width="2"/><text x="380" y="920" font-size="32" font-weight="700" fill="#f4f0e3" text-anchor="middle">Apply locked rule to Hospital B</text><text x="380" y="960" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="middle">Separate patients and outcomes</text><circle cx="90" cy="1032" r="10" fill="#203b47" stroke="#78dcc8" stroke-width="3"/><path d="M74 1075 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#78dcc8" stroke-width="3"/><circle cx="145" cy="1032" r="10" fill="#203b47" stroke="#78dcc8" stroke-width="3"/><path d="M129 1075 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#78dcc8" stroke-width="3"/><circle cx="200" cy="1032" r="10" fill="#203b47" stroke="#78dcc8" stroke-width="3"/><path d="M184 1075 q0 -34 16 -30 q16 -4 16 30" fill="none" stroke="#78dcc8" stroke-width="3"/><text x="256" y="1037" font-size="29" font-weight="400" fill="#f4f0e3" text-anchor="start">Report B performance</text><text x="256" y="1076" font-size="29" font-weight="400" fill="#f4f0e3" text-anchor="start">and failed-test denominator</text><text x="45" y="1153" font-size="31" font-weight="700" fill="#f4f0e3" text-anchor="start">No B outcomes feed back into tuning.</text><rect x="24" y="1221" width="712" height="234" rx="20" fill="#634c2c" stroke="#f4c27c" stroke-width="2"/><text x="44" y="1267" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">Outside development is a useful test.</text><text x="44" y="1310" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">Still ask: suitable population? calibration?</text><text x="44" y="1353" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">uncertainty? clinical decision benefit?</text><text x="44" y="1396" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">A new hospital alone answers none of these.</text></g></svg>