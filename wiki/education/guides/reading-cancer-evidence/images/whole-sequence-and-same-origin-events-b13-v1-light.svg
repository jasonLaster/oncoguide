<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1590" viewBox="0 0 760 1590" role="img" aria-labelledby="title desc"><title id="title">Two whole sequences, one starting clock</title><desc id="desc">Fictional study drug versus placebo before and after surgery; postoperative component is not separately randomized.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#193746" stroke-width="1.5"/></marker></defs><rect width="760" height="1590" fill="#fffaf2"/><g font-family="system-ui,Arial,sans-serif" fill="#193746"><text x="30" y="53" font-size="40" font-weight="750" fill="#193746" text-anchor="start">A trial tests what it assigns.</text><text x="30" y="107" font-size="31" font-weight="400" fill="#455e69" text-anchor="start">Fictional trial · adults with operable cancer</text><rect x="24" y="141" width="712" height="580" rx="20" fill="#edf4f2" stroke="#66818b" stroke-width="2"/><text x="380" y="186" font-size="33" font-weight="750" fill="#193746" text-anchor="middle">ONE RANDOMIZATION · clock starts</text><path d="M380 203 V247" fill="none" stroke="#193746" stroke-width="3"/><path d="M380 247 H210 V287" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 247 H550 V287" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="337" font-size="32" font-weight="750" fill="#147d75" text-anchor="middle">A: study drug</text><text x="550" y="337" font-size="32" font-weight="750" fill="#76549d" text-anchor="middle">B: placebo</text><rect x="60" y="365" width="300" height="114" rx="20" fill="#c8e7dd" stroke="#147d75" stroke-width="2"/><text x="210" y="410" font-size="29" font-weight="700" fill="#193746" text-anchor="middle">Before surgery</text><text x="210" y="454" font-size="29" font-weight="400" fill="#193746" text-anchor="middle">Drug + chemo</text><path d="M210 485 V514" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="552" font-size="30" font-weight="700" fill="#193746" text-anchor="middle">Same surgery</text><path d="M210 567 V597" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="610" width="300" height="77" rx="20" fill="#c8e7dd" stroke="#147d75" stroke-width="2"/><text x="210" y="660" font-size="29" font-weight="700" fill="#193746" text-anchor="middle">Drug afterward</text><rect x="400" y="365" width="300" height="114" rx="20" fill="#e6dcf2" stroke="#76549d" stroke-width="2"/><text x="550" y="410" font-size="29" font-weight="700" fill="#193746" text-anchor="middle">Before surgery</text><text x="550" y="454" font-size="29" font-weight="400" fill="#193746" text-anchor="middle">Placebo + chemo</text><path d="M550 485 V514" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="552" font-size="30" font-weight="700" fill="#193746" text-anchor="middle">Same surgery</text><path d="M550 567 V597" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="610" width="300" height="77" rx="20" fill="#e6dcf2" stroke="#76549d" stroke-width="2"/><text x="550" y="660" font-size="29" font-weight="700" fill="#193746" text-anchor="middle">Placebo afterward</text><text x="30" y="777" font-size="32" font-weight="700" fill="#193746" text-anchor="start">Compare A’s whole sequence with B’s.</text><text x="30" y="820" font-size="32" font-weight="700" fill="#193746" text-anchor="start">No second randomization isolates the drug</text><text x="30" y="863" font-size="32" font-weight="700" fill="#193746" text-anchor="start">given only after surgery.</text><rect x="24" y="913" width="712" height="386" rx="20" fill="#edf4f2" stroke="#66818b" stroke-width="2"/><text x="44" y="958" font-size="32" font-weight="750" fill="#193746" text-anchor="start">Same origin, different event definitions</text><text x="44" y="1004" font-size="30" font-weight="400" fill="#193746" text-anchor="start">Both clocks begin at randomization.</text><text x="45" y="1060" font-size="30" font-weight="700" fill="#193746" text-anchor="start">Alex: recurrence → alive at cutoff</text><path d="M55 1100 H687" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380" cy="1100" r="8" fill="#f1d0d9" stroke="#a94865" stroke-width="3"/><text x="55" y="1149" font-size="29" font-weight="400" fill="#193746" text-anchor="start">Combined event: yes · Death-only: no</text><text x="45" y="1210" font-size="30" font-weight="700" fill="#193746" text-anchor="start">Sam: death without prior recurrence</text><text x="45" y="1258" font-size="29" font-weight="400" fill="#193746" text-anchor="start">Combined event: yes · Death-only: yes</text><rect x="24" y="1330" width="712" height="218" rx="20" fill="#f5dfb5" stroke="#996020" stroke-width="2"/><text x="44" y="1378" font-size="29" font-weight="400" fill="#193746" text-anchor="start">Illustrative sequence, not a dosing schedule.</text><text x="44" y="1420" font-size="29" font-weight="400" fill="#193746" text-anchor="start">No effect size or component benefit shown.</text><text x="44" y="1462" font-size="29" font-weight="400" fill="#193746" text-anchor="start">A pCR–outcome association alone does not</text><text x="44" y="1504" font-size="29" font-weight="400" fill="#193746" text-anchor="start">validate pCR as a trial-level surrogate.</text></g></svg>