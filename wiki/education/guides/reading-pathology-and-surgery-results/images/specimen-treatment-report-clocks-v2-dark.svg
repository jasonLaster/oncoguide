<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="art-title art-description"><title id="art-title">New report, old tissue?</title><desc id="art-description">A shared day-0-to-120 timeline separates biopsy A at day 0 and surgery tissue B at day 100 from treatment plan and record rows. Four treatment events are planned at days 10, 30, 50 and 80; administrations are documented at 10, 50 and 80, while 30 is explicitly held. A day-120 addendum refers back to stored biopsy A, with no new sample.</desc><style>:root{color:#edf1e8}
text{fill:#edf1e8;font-family:Arial,Helvetica,sans-serif}
.title{font-weight:700;letter-spacing:-.3px}.section{font-weight:700}.note{font-weight:400}.label{font-weight:500}
.muted{fill:#bdcbcd}.panel{fill:#223238;stroke:#667c82;stroke-width:1}
.tissue{fill:#625e50;stroke:#87806c;stroke-width:1.5}.fiber{fill:none;stroke:#87806c;stroke-width:1.1}
.leader{fill:none;stroke:#edf1e8;stroke-width:1.4}.reference{fill:none;stroke:#a4bfce;stroke-width:1.6;stroke-dasharray:5 4}
.inkedge{fill:none;stroke:#edf1e8;stroke-width:4}.oldedge{fill:none;stroke:#edf1e8;stroke-width:3;stroke-dasharray:6 4}
.invasive{fill:#d78d7c;stroke:#583940;stroke-width:1.2}.nucleus{fill:#583940}
.duct{fill:#ab8a78;stroke:#ece1f2;stroke-width:1.6}.lumen{fill:#223238;stroke:#ece1f2;stroke-width:1.2}
.situ{fill:url(#situ-hatch);stroke:#ece1f2;stroke-width:1.2}.node{fill:#698b78;stroke:#b4cdbf;stroke-width:1.8}
.grid{stroke:#667c82;stroke-width:.9;stroke-dasharray:2 5;fill:none}.axis{stroke:#667c82;stroke-width:1;fill:none}
.planned{fill:#223238;stroke:#a4bfce;stroke-width:2.5}.administered{fill:#a4bfce;stroke:#edf1e8;stroke-width:1}.held{fill:#223238;stroke:#ece1f2;stroke-width:2.5}
.soft{fill:#2f434b;stroke:none}.bracket{fill:none;stroke:#edf1e8;stroke-width:1.3}</style><defs><pattern id="situ-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ad95bd"/><path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#ece1f2" stroke-width="1.1"/></pattern><marker id="reference-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a4bfce"/></marker></defs><rect width="360" height="760" fill="#1a272c"/><text x="24" y="38" class="title" font-size="24" text-anchor="start">New report, old tissue?</text><text x="24" y="72" class="label" font-size="15" text-anchor="start">Three clocks; plan and record differ</text><text x="24" y="99" class="muted" font-size="14.5" text-anchor="start">Arbitrary days, not a treatment schedule</text><text x="80" y="126" class="section" font-size="15" text-anchor="start">Fictional relative days</text><line x1="80" y1="162" x2="344" y2="162" class="axis"/><line x1="80.0" y1="158" x2="80.0" y2="166" class="axis"/><text x="80.0" y="151" class="label" font-size="15" text-anchor="middle">0</text><line x1="80.0" y1="172" x2="80.0" y2="592" class="grid"/><line x1="124.0" y1="158" x2="124.0" y2="166" class="axis"/><text x="124.0" y="151" class="label" font-size="15" text-anchor="middle">20</text><line x1="124.0" y1="172" x2="124.0" y2="592" class="grid"/><line x1="168.0" y1="158" x2="168.0" y2="166" class="axis"/><text x="168.0" y="151" class="label" font-size="15" text-anchor="middle">40</text><line x1="168.0" y1="172" x2="168.0" y2="592" class="grid"/><line x1="212.0" y1="158" x2="212.0" y2="166" class="axis"/><text x="212.0" y="151" class="label" font-size="15" text-anchor="middle">60</text><line x1="212.0" y1="172" x2="212.0" y2="592" class="grid"/><line x1="256.0" y1="158" x2="256.0" y2="166" class="axis"/><text x="256.0" y="151" class="label" font-size="15" text-anchor="middle">80</text><line x1="256.0" y1="172" x2="256.0" y2="592" class="grid"/><line x1="300.0" y1="158" x2="300.0" y2="166" class="axis"/><text x="300.0" y="151" class="label" font-size="15" text-anchor="middle">100</text><line x1="300.0" y1="172" x2="300.0" y2="592" class="grid"/><line x1="344.0" y1="158" x2="344.0" y2="166" class="axis"/><text x="344.0" y="151" class="label" font-size="15" text-anchor="middle">120</text><line x1="344.0" y1="172" x2="344.0" y2="592" class="grid"/><text x="80" y="204" class="label" font-size="14.5" text-anchor="start">A: biopsy before treatment</text><text x="80" y="225" class="label" font-size="14.5" text-anchor="start">B: tissue after documented events</text><text x="24" y="182" class="section" font-size="18" text-anchor="start">Collection</text><circle id="collection-A" data-day="0" cx="80.0" cy="245" r="7" class="planned"/><text x="80.0" y="235" class="section" font-size="16" text-anchor="middle">A</text><text x="80.0" y="276" class="label" font-size="16" text-anchor="middle">0</text><circle id="collection-B" data-day="100" cx="300.0" cy="245" r="7" class="planned"/><text x="300.0" y="235" class="section" font-size="16" text-anchor="middle">B</text><text x="300.0" y="276" class="label" font-size="16" text-anchor="middle">100</text><text x="24" y="310" class="section" font-size="18" text-anchor="start">Treatment</text><text x="8" y="340" class="label" font-size="16" text-anchor="start">Plan</text><text x="8" y="420" class="label" font-size="15" text-anchor="start">Record</text><rect id="plan-P1" data-day="10" x="95.0" y="328" width="14" height="14" class="planned"/><text x="102.0" y="364" class="label" font-size="16" text-anchor="middle">10</text><rect id="plan-P2" data-day="30" x="139.0" y="328" width="14" height="14" class="planned"/><text x="146.0" y="364" class="label" font-size="16" text-anchor="middle">30</text><rect id="plan-P3" data-day="50" x="183.0" y="328" width="14" height="14" class="planned"/><text x="190.0" y="364" class="label" font-size="16" text-anchor="middle">50</text><rect id="plan-P4" data-day="80" x="249.0" y="328" width="14" height="14" class="planned"/><text x="256.0" y="364" class="label" font-size="16" text-anchor="middle">80</text><circle id="record-P1" data-day="10" data-state="administration" cx="102.0" cy="415" r="7" class="administered"/><text x="102.0" y="444" class="label" font-size="16" text-anchor="middle">10</text><path id="record-P2" data-day="30" data-state="held" d="M146.0 407L154.0 415L146.0 423L138.0 415Z" class="held"/><text x="146.0" y="469" class="section" font-size="16" text-anchor="middle">Held</text><text x="146.0" y="444" class="label" font-size="16" text-anchor="middle">30</text><circle id="record-P3" data-day="50" data-state="administration" cx="190.0" cy="415" r="7" class="administered"/><text x="190.0" y="444" class="label" font-size="16" text-anchor="middle">50</text><circle id="record-P4" data-day="80" data-state="administration" cx="256.0" cy="415" r="7" class="administered"/><text x="256.0" y="444" class="label" font-size="16" text-anchor="middle">80</text><text x="24" y="502" class="section" font-size="16" text-anchor="start">4 planned; 3 documented; 1 held</text><text x="24" y="527" class="muted" font-size="15" text-anchor="start">Hold reason not supplied</text><text x="8" y="580" class="section" font-size="15" text-anchor="start">Report</text><text x="344" y="555" class="label" font-size="16" text-anchor="end">Addendum on stored A</text><circle id="report-A" data-day="120" cx="344" cy="575" r="7" class="planned"/><text x="344" y="609" class="label" font-size="16" text-anchor="end">120</text><text x="24" y="610" class="label" font-size="15" text-anchor="start">No new sample</text><path id="reference-to-A" d="M344 583V630H3V245H73" class="reference" marker-end="url(#reference-arrow)"/><text x="110" y="656" class="section" font-size="16" text-anchor="start">Describes biopsy A</text><rect x="24" y="674" width="12" height="12" class="planned"/><text x="46" y="686" class="label" font-size="15" text-anchor="start">Planned event</text><circle cx="30" cy="709" r="6" class="administered"/><text x="46" y="714" class="label" font-size="15" text-anchor="start">Documented administration</text><path d="M30 732L37 739L30 746L23 739Z" class="held"/><text x="46" y="744" class="label" font-size="15" text-anchor="start">Held (not administered)</text></svg>
