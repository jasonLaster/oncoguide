<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2260" viewBox="0 0 600 2260" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Same count, different places; capture units and assigned cells</title>
