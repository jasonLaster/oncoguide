<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Which RNA was recovered? Which barcode holds it?</title><desc id="desc">A whole-cell cartoon contains nuclear and cytoplasmic RNA, while an isolated nucleus contains nuclear RNA including unfinished transcripts. In a droplet example, barcode A receives one cell, B one nucleus, and C two cells, showing that a barcode labels a reaction compartment rather than certifying one pure cell. An invented source-to-recovery cartoon drops one cell type during preparation/capture and shows ambient RNA outside a cell. Shapes, barcodes and recovery are invented; missing recovered cells or states do not establish biological absence.</desc><metadata>Original hand-authored SVG by agent:/root/batch09_author_group3. No image model or generation service used. Private prospective illustration; independent and human review pending. All geometry schematic; toy values invented.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#486677"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="96" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="49" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">Which RNA was recovered?</text><text x="32" y="85" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">Which barcode holds it?</text><rect x="12" y="124" width="576" height="228" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="163" font-size="30" font-weight="700" fill="#24343e" text-anchor="start">1  RNA comes from compartments</text><circle cx="149" cy="252" r="47" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="152" cy="250" r="16.45" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="149" cy="252" r="25" fill="#e9edef" stroke="#486677" stroke-width="3"/><path d="M133 252q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M133 252q8 -12 16 0t16 0" fill="none" stroke="#ecc1cc" stroke-width="4"/><path d="M131 289q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M131 289q8 -12 16 0t16 0" fill="none" stroke="#b9d9c7" stroke-width="4"/><path d="M134 217q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M134 217q8 -12 16 0t16 0" fill="none" stroke="#b9d9c7" stroke-width="4"/><circle cx="432" cy="252" r="36" fill="#e9edef" stroke="#486677" stroke-width="3"/><path d="M416 242q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M416 242q8 -12 16 0t16 0" fill="none" stroke="#ecc1cc" stroke-width="4"/><path d="M416 265q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M416 265q8 -12 16 0t16 0" fill="none" stroke="#ecc1cc" stroke-width="4"/><text x="58" y="200" font-size="28" font-weight="700" fill="#24343e" text-anchor="start">Whole cell</text><text x="357" y="200" font-size="28" font-weight="700" fill="#24343e" text-anchor="start">Nucleus</text><text x="39" y="330" font-size="28" font-weight="400" fill="#24343e" text-anchor="start">Nuclear + cytoplasmic</text><text x="354" y="330" font-size="28" font-weight="400" fill="#24343e" text-anchor="start">Nuclear RNA</text><rect x="12" y="368" width="576" height="222" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="407" font-size="30" font-weight="700" fill="#24343e" text-anchor="start">2  A barcode labels a droplet</text><circle cx="107" cy="481" r="50" fill="#e9edef" stroke="#486677" stroke-width="3"/><circle cx="129" cy="454" r="12" fill="#efd19b" stroke="#486677" stroke-width="3"/><text x="107" y="563" font-size="28" font-weight="700" fill="#24343e" text-anchor="middle">A</text><circle cx="300" cy="481" r="50" fill="#e9edef" stroke="#486677" stroke-width="3"/><circle cx="322" cy="454" r="12" fill="#efd19b" stroke="#486677" stroke-width="3"/><text x="300" y="563" font-size="28" font-weight="700" fill="#24343e" text-anchor="middle">B</text><circle cx="493" cy="481" r="50" fill="#e9edef" stroke="#486677" stroke-width="3"/><circle cx="515" cy="454" r="12" fill="#efd19b" stroke="#486677" stroke-width="3"/><text x="493" y="563" font-size="28" font-weight="700" fill="#24343e" text-anchor="middle">C: doublet</text><circle cx="99" cy="488" r="22" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="102" cy="486" r="7.699999999999999" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="292" cy="488" r="25" fill="#e9edef" stroke="#486677" stroke-width="3"/><path d="M276 487q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M276 487q8 -12 16 0t16 0" fill="none" stroke="#ecc1cc" stroke-width="4"/><circle cx="475" cy="483" r="18" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="478" cy="481" r="6.3" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="508" cy="493" r="18" fill="#ecc1cc" stroke="#486677" stroke-width="3"/><circle cx="511" cy="491" r="6.3" fill="#e9edef" stroke="#486677" stroke-width="2"/><rect x="12" y="606" width="576" height="170" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="645" font-size="30" font-weight="700" fill="#24343e" text-anchor="start">3  Recovery filters the starting set</text><circle cx="59" cy="687" r="17" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="62" cy="685" r="5.949999999999999" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="112" cy="693" r="17" fill="#ecc1cc" stroke="#486677" stroke-width="3"/><circle cx="115" cy="691" r="5.949999999999999" fill="#e9edef" stroke="#486677" stroke-width="2"/><path d="M148 688Q165 664.2 182 688Q165 711.8 148 688Z" fill="#efd19b" stroke="#486677" stroke-width="3"/><circle cx="165" cy="688" r="5" fill="#e9edef" stroke="#486677" stroke-width="3"/><path d="M205 691L297 691" fill="none" stroke="#486677" stroke-width="3" marker-end="url(#arrow)"/><circle cx="339" cy="689" r="17" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="342" cy="687" r="5.949999999999999" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="394" cy="689" r="17" fill="#ecc1cc" stroke="#486677" stroke-width="3"/><circle cx="397" cy="687" r="5.949999999999999" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="449" cy="689" r="19" fill="none" stroke="#486677" stroke-width="3"/><path d="M435 675L463 703" fill="none" stroke="#ecc1cc" stroke-width="3"/><path d="M495 687q8 -12 16 0t16 0" fill="none" stroke="#486677" stroke-width="7"/><path d="M495 687q8 -12 16 0t16 0" fill="none" stroke="#b9d9c7" stroke-width="4"/><text x="32" y="753" font-size="28" font-weight="400" fill="#24343e" text-anchor="start">Lost in recovery does not mean absent.</text><rect x="12" y="792" width="576" height="96" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="826" font-size="28" font-weight="400" fill="#24343e" text-anchor="start">Toy cells + barcodes; capture is partial.</text><text x="32" y="860" font-size="28" font-weight="400" fill="#24343e" text-anchor="start">Ambient RNA and identity need checks.</text></g></svg>
