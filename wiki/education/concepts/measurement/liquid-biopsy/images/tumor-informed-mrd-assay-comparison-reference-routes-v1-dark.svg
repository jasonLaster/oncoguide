<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1200" viewBox="0 0 780 1200" role="img" aria-labelledby="title desc"><title id="title">What builds the detector?</title><desc id="desc">Two reference branches join one illustrative later-plasma testing stage. A tumor-informed mutation strategy selects features from suitable sampled tumor material. A tumor-naive strategy begins with predefined features and rules. A single finite plasma tube represents a shared input constraint, not duplicated molecules or equal assay performance. Both routes retain source attribution, sample-quality, calling-rule and intended-use validation requirements.</desc><metadata>Original editable code-authored scientific diagram. Model and creation source commit null. Source quantities are illustrative, not empirical. Independent review pending.</metadata><defs><style>.panel{stroke:#1d333c;}.ink{fill:#f3eee1;stroke:none;}.muted{fill:#d0dce0;stroke:none;}.edge{stroke:#accbd3;}.panel{fill:#1d333c;stroke:#accbd3;} .glyphtext{fill:#24343e;stroke:none;} .glyphborder{stroke:#24343e;} text{font-family:Arial,Helvetica,sans-serif;} path,circle,rect{stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#accbd3"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#bcd7de"/><path d="M-3 12 L12 -3 M9 15 L15 9" stroke="#24343e" stroke-width="2"/></pattern></defs><rect width="780" height="1200" fill="#14242b"/><text x="42" y="65" font-size="42" font-weight="700" class="ink" text-anchor="start">What builds the detector?</text><text x="42" y="113" font-size="32" font-weight="400" class="muted" text-anchor="start">Comparison axis: reference strategy</text><rect x="34" y="151" width="330" height="393" rx="24" fill="none" class="panel" stroke-width="2" /><text x="59" y="201" font-size="34" font-weigh