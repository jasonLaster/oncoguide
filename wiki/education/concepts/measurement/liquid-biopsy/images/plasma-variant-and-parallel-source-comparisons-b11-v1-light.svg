<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1290" viewBox="0 0 600 1290" role="img" aria-labelledby="title desc"><title id="title">A real variant still needs a source</title><desc id="desc">Parallel schematic blood-cell and solid-tumor compartments release DNA into a shared plasma pool. In a separate fictional comparison the same generic variant V is detected in plasma and blood-cell DNA, but not detected in the sampled tumor material. The final panel says this supports a blood-cell contribution while tumor non-detection remains bounded by sampling and assay limits.</desc><rect x="5" y="5" width="590" height="1280" rx="20" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#203346" font-weight="700" text-anchor="start">A real variant still needs a source</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="478" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#203346" font-weight="700" text-anchor="start">1  Two compartments can contribute DNA</text><circle cx="150" cy="264" r="53" fill="#d7edf3" stroke="#267898" stroke-width="2"/><circle cx="145" cy="267" r="16.96" fill="#d7edf3" stroke="#267898" stroke-width="2"/><text x="150" y="273" font-family="system-ui,sans-serif" font-size="26" fill="#267898" font-weight="700" text-anchor="middle">blood</text><circle cx="446" cy="264" r="53" fill="#f3dfe7" stroke="#9b4860" stroke-width="2"/><circle cx="441" cy="267" r="16.96" fill="#f3dfe7" stroke="#9b4860" stroke-width="2"/><text x="446" y="273" font-family="system-ui,sans-serif" font-size="26" fill="#9b4860" font-weight="700" text-anchor="middle">tumor</text><text x="60" y="195" font-family="system-ui,sans-serif" font-size="25" fill="#267898" font-weight="500" text-anchor="start">blood-cell clone</text><text x="365" y="195" font-family="system-ui,sans-serif" font-size="25" fill="#9b4860" font-weight="500" text-anchor="start">solid tumor</text><path d="M172 326 L246 399" fill="none" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M246 399 L235.4241311931887 395.9749381855711" fill="none" stroke="#267898" stroke-width="3" stroke-linecap="round"/><path d="M246 399 L242.8313354412132 388.46626538620376" fill="none" stroke="#267898" stroke-width="3" stroke-linecap="round"/><path d="M424 326 L352 399" fill="none" stroke="#9b4860" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M352 399 L355.02406950717847 388.4238474095845" fill="none" stroke="#9b4860" stroke-width="3" stroke-linecap="round"/><path d="M352 399 L362.5334372635696 395.8303471145182" fill="none" stroke="#9b4860" stroke-width="3" stroke-linecap="round"/><path d="M255 391 L255 478 Q300.0 523 345 478 L345 391 Z" fill="#d7edf3" stroke="#a4b8c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M251 391 L349 391" fill="none" stroke="#267898" stroke-width="5" stroke-linecap="round"/><path d="M278 420 L298 423" fill="none" stroke="#667787" stroke-width="5" stroke-linecap="round"/><path d="M307 435 L327 438" fill="none" stroke="#667787" stroke-width="5" stroke-linecap="round"/><path d="M282 470 L302 473" fill="none" stroke="#73538f" stroke-width="5" stroke-linecap="round"/><text x="37" y="551" font-family="system-ui,sans-serif" font-size="25" fill="#203346" font-weight="500" text-anchor="start">The pool alone does not label cell of origin.</text><rect x="20" y="610" width="560" height="330" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="652" font-family="system-ui,sans-serif" font-size="28" fill="#203346" font-weight="700" text-anchor="start">2  Same V, parallel specimen evidence</text><text x="43" y="699" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Plasma</text><rect x="302" y="670" width="244" height="46" rx="9" fill="#ece1f4" stroke="#73538f" stroke-width="2"/><text x="321" y="699" font-family="system-ui,sans-serif" font-size="25" fill="#73538f" font-weight="500" text-anchor="start">V detected</text><text x="43" y="774" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Blood cells</text><rect x="302" y="745" width="244" height="46" rx="9" fill="#d7edf3" stroke="#267898" stroke-width="2"/><text x="321" y="774" font-family="system-ui,sans-serif" font-size="25" fill="#267898" font-weight="500" text-anchor="start">V detected</text><text x="43" y="849" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Tumor sample</text><rect x="302" y="820" width="244" height="46" rx="9" fill="#f3dfe7" stroke="#9b4860" stroke-width="2"/><text x="321" y="849" font-family="system-ui,sans-serif" font-size="25" fill="#9b4860" font-weight="500" text-anchor="start">V not detected</text><text x="43" y="910" font-family="system-ui,sans-serif" font-size="25" fill="#203346" font-weight="500" text-anchor="start">Each result retains its own assay limits.</text><rect x="20" y="960" width="560" height="296" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="1002" font-family="system-ui,sans-serif" font-size="28" fill="#203346" font-weight="700" text-anchor="start">3  What follows from that comparison?</text><text x="43" y="1046" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Blood-cell contribution is supported.</text><text x="43" y="1079" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Tumor non-detection is not biological zero.</text><text x="43" y="1112" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">Shared variants and sampling can leave</text><text x="43" y="1145" font-family="system-ui,sans-serif" font-size="26" fill="#485c70" font-weight="500" text-anchor="start">some attribution unresolved.</text><text x="43" y="1220" font-family="system-ui,sans-serif" font-size="25" fill="#9b4860" font-weight="500" text-anchor="start">A source clue is not a clinical risk forecast.</text></svg>
