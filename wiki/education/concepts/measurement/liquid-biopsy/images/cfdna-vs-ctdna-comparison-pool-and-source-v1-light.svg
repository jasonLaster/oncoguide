<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1430" viewBox="0 0 780 1430" role="img" aria-labelledby="title desc"><title id="title">Same pool, different question</title><desc id="desc">The upper scene defines source classes within sampled cfDNA: a known non-tumor class lies outside the possible tumor-derived ctDNA subset. It is a definition diagram, not an assignment of unknown fragments. A finite plasma tube accompanies a separate lower source-assignment task showing a sampled cfDNA fragment with unresolved origin and dashed possible routes to tumor and non-tumor sources. Neither route is selected, so ctDNA membership remains unresolved. Yield measures recovered DNA amount and cannot settle either origin. Colors, symbol counts and areas are schematic, not attribution evidence, percentages or living-cell counts.</desc><metadata>Original editable code-authored scientific diagram. Model and creation source commit null. Source quantities are illustrative, not empirical. Independent review pending.</metadata><defs><style>.panel{stroke:#fffdf7;}.ink{fill:#24343e;stroke:none;}.muted{fill:#435c66;stroke:none;}.edge{stroke:#456474;}.panel{fill:#fffdf7;stroke:#456474;} .glyphtext{fill:#24343e;stroke:none;} .glyphborder{stroke:#24343e;} text{font-family:Arial,Helvetica,sans-serif;} path,circle,rect{stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456474"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#bcd7de"/><path d="M-3 12 L12 -3 M9 15 L15 9" stroke="#24343e" stroke-width="2"/></pattern></defs><rect width="780" height="1430" fill="#faf6ed"/><text x="42" y="65" font-size="42" font-weight="700" class="ink" text-anchor="start">Same pool, different question</text><text x="42" y="113" font-size="32" font-weight="400" class="muted" text-anchor="start">Comparison axis: cell source</text><rect x="34" y="147" width="712" height="279" rx="24" fill="none" class="panel" stroke-width="2" /><text x="70" y="197" font-size="34" font-weight="700" class="ink" text-anchor="start">Non-tumor cells</text><text x="468" y="197" font-size="34" font-weight="700" class="ink" text-anchor="start">Tumor cells</text><circle cx="193" cy="286" r="55" fill="#bcd7de" class="edge" stroke-width="6.0"/><circle cx="193" cy="286" r="55" fill="#bcd7de" class="glyphborder" stroke-width="3"/><circle cx="187" cy="288" r="19.8" fill="#afcbbf" class="edge" stroke-width="5.0"/><circle cx="187" cy="288" r="19.8" fill="#afcbbf" class="glyphborder" stroke-width="2"/><path d="M173 286 q14 -10 28 0 M173 296 q14 -10 28 0" class="glyphborder" stroke-width="2" fill="none" /><path d="M526 286 Q514 247.5 553.5 231 Q581 215 608.5 231 Q646 264.0 636 286 Q654 319.0 597.5 341 Q542.5 351 526 286 Z" class="edge" stroke-width="6.0" fill="#e6adb8" /><path d="M526 286 Q514 247.5 553.5 231 Q581 215 608.5 231 Q646 264.0 636 286 Q654 319.0 597.5 341 Q542.5 351 526 286 Z" class="glyphborder" stroke-width="3" fill="#e6adb8" /><circle cx="575" cy="288" r="19.8" fill="#e6adb8" class="edge" stroke-width="5.0"/><circle cx="575" cy="288" r="19.8" fill="#e6adb8" class="glyphborder" stroke-width="2"/><path d="M561 286 q14 -10 28 0 M561 296 q14 -10 28 0" class="glyphborder" stroke-width="2" fill="none" /><text x="223" y="400" font-size="32" font-weight="400" class="muted" text-anchor="start">May contribute DNA</text><path d="M193 352 C193 428 253 428 253 480" class="edge" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 9"/><path d="M581 352 C581 428 556 428 556 480" class="edge" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 9"/><rect x="34" y="476" width="712" height="381" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="527" font-size="32" font-weight="700" class="ink" text-anchor="start">cfDNA • sampled DNA 