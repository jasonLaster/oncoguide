 <title>An average is not a guarantee</title>
 <desc>An explicitly fictional fixed-volume independent-random sampling model: expected original target count one permits a zero count with probability exp(-1), about 36.8%. Possible count sketches are not observed frequencies or equal probabilities.</desc>
