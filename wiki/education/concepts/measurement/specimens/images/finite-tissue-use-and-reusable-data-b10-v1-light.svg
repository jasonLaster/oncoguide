<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Tissue leaves the block. Data can be copied.</title><desc id="desc">A finite tissue block becomes a smaller remaining block as sections are allocated to slides and extraction. One-way arrows carry physical material into those uses; stored slides can remain, while extraction changes the material and loses its original architecture. A separate digital dataset branches into two copies with no reverse arrow to the original block. No universal section thickness, test count or allocation is prescribed.</desc><metadata>Original authored SVG by agent:/root/batch10_author_group2; no image model used. Private candidate; expert and learner review pending. All shapes schematic, not quantitative.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486677"/></marker></defs><rect width="600" height="1000" fill="#f3f0e8"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="100" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="52" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">Tissue leaves the block.</text><text x="32" y="87" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">Data can be copied.</text><rect x="12" y="130" width="576" height="295" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="169" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Physical material: one-way use</text><rect x="45" y="223" width="110" height="82" rx="7" fill="#efd19b" stroke="#486677" stroke-width="2"/><path d="M62 243q25 -18 60 5t-4 42q-42 18 -62 -8Z" fill="#ecc1cc" stroke="#486677" stroke-width="2"/><rect x="350" y="238" width="110" height="64" rx="7" fill="#efd19b" stroke