<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Capture secretion, count spots</title><desc id="desc">Cells in a well release green cytokine dots toward capture antibodies on a membrane. After the cells are removed, developed spots remain. Invented matched wells have 100,000 input cells each: vehicle 5 spots, peptide 30 spots, and a separate positive control. Arithmetic gives 250 background-subtracted spot-forming units per million input cells, without a positivity or killing claim.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3c7d9" /></marker></defs>
