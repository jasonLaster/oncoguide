<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">A reagent tests a paired target</title><desc id="desc">A labeled scaffold carries four schematic copies of peptide P held by HLA-A*02:01. Two copies contact receptors on a sampled T cell, showing multivalent attachment. An identity key distinguishes peptide, HLA and label; binding does not show that tumor cells naturally display that pair or are killed. Peptide P is invented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667b" /></marker></defs>
