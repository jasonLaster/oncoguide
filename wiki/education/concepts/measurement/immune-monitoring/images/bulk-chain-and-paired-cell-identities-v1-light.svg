n miss chains or misassign linkage</text><text x="40" y="1330" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">Paired identity still needs antigen/function tests</text><text x="40" y="1382" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">Sequence identity is not a killing measurement</text></svg>
