<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450" role="img" aria-labelledby="title desc"><title id="title">A beta match can hide another alpha</title><desc id="desc">Three invented sampled T cells carry simplified alpha/beta pairs X/B, Y/B and Z/C. The bulk beta-chain view pools B, B and C without alpha linkage. In the paired-cell view separate sampled-cell boxes link each alpha and beta chain, exposing two different alpha identities behind shared beta B. Labels are fictional identities, not sequence or cell-count results. Read abundance is not automatically cell abundance; pairing does not establish antigen specificity, function or killing.</desc><metadata>Original hand-authored editable SVG by agent:/root/batch09_author_group2. No image-generation invocation. Invented teaching example; human review pending. No patient result or clinical threshold.</metadata><style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="780" height="1450" fill="#faf6ed"/><text x="40" y="63" fill="#253b44" font-size="38" font-weight="700" text-anchor="start">A beta match can hide another alpha</text><text x="40" y="108" fill="#435f69" font-size="30" font-weight="400" text-anchor="start">Invented chain labels • sampled linkage matters</text><rect x="35" y="145" width="710" height="385" rx="18" fill="#fffdf8" stroke="#476573" stroke-width="3"/><text x="65" y="195" fill="#253b44" font-size="34" font-weight="700" text-anchor="start">Bulk beta-chain view</text><circle cx="154" cy="294" r="58" fill="#9eced8" stroke="#476573" stroke-width="2"/><circle cx="151" cy="296" r="19.14" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="144" cy="287" r="2.5" fill="#253b44" stroke="#476573" stroke-width="2"/><circle cx="163" cy="287" r="2.5" fill="#253b44" stroke="#476573" stroke-width="2"/><path d="M146 307 q8 7 16 0" fill="none" stroke="#253b44" stroke-width="2"/><text x="154" y="385" fill=