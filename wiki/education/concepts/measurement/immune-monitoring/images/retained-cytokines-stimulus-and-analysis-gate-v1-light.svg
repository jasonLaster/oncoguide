<text x="42" y="627" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">3  Flow analysis + controls</tspan></text>
<rect x="50" y="647" width="120" height="93" rx="0" fill="#ffffff" stroke="#52667b" stroke-width="3" />
