<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Retain, stain, then count</title><desc id="desc">A stimulated cell contains retained green cytokine molecules because a transport-inhibition barrier interrupts outward transport. A separate fixed, permeable cell allows fluorescent antibody entry. A conceptual flow gate counts cytokine-positive cells within a named parent population; the fixed-cell readout does not measure secretion or target-cell killing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667b" /></marker></defs>
<rect x="14" y="8" width="572" height="55" rx="12" fill="#f1f6fa" /><text x="24" y="48" fill="#182b40" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="24" dy="0">Retain, stain, then count</tspan></text>
<rect x="24" y="80" width="552" height="291" rx="16" fill="#f1f6fa" />
<text x="42" y="122" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">1  Stimulus + time window</tspan></text>
