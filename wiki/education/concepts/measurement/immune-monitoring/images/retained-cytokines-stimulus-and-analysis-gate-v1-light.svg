<text x="42" y="433" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">2  Fix, permeabilize + stain</tspan></text>
<circle cx="113" cy="505" r="40" fill="none" stroke="#1874af" stroke-width="4" />
<circle cx="100" cy="493" r="5" fill="#0b805f" />
