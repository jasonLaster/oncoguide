<circle cx="214" cy="270" r="8" fill="#0b805f" />
<path d="M 250 238 H 312" fill="none" stroke="#0b805f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<path d="M 302 206 V 276" fill="none" stroke="#b34559" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
<text x="337" y="221" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="337" dy="0">Transport</tspan><tspan x="337" dy="38">inhibited</tspan></text>
<text x="45" y="357" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="45" dy="0">Cytokines retained inside</tspan></text>
