<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450" role="img" aria-labelledby="title desc"><title id="title">Compare death with its background</title><desc id="desc">Two invented wells are measured at the same fictional 2-hour endpoint with the same identifiable target definition: target-only has 30 dead target events out of 100 and targets plus effectors has 40 out of 100. Each target glyph summarizes 10 target events; these are aggregate illustrations rather than individual fates. Matched bars show 30% and 40%, a 10 percentage-point effector-associated excess. Effectors remain outside the target denominator. The subtraction does not identify which individual deaths effectors caused, establish a normalized-lysis value or predict patient response.</desc><metadata>Original hand-authored editable SVG by agent:/root/batch09_author_group2. No image-generation invocation. Invented teaching example; human review pending. No patient result or clinical threshold.</metadata><style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="780" height="1450" fill="#faf6ed"/><text x="40" y="63" fill="#253b44" font-size="38" font-weight="700" text-anchor="start">Compare death with its background</text><text x="40" y="108" fill="#435f69" font-size="30" font-weight="400" text-anchor="start">Invented matched wells • same 2-hour endpoint</text><rect x="35" y="145" width="710" height="376" rx="18" fill="#fffdf8" stroke="#476573" stroke-width="3"/><text x="65" y="196" fill="#253b44" font-size="34" font-weight="700" text-anchor="start">Target-only</text><text x="65" y="238" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">100 identifiable target events • same target type</text><rect x="67" y="258" width="470" height="165" rx="80" fill="#f0ece1" stroke="#476573" stroke-width="3"/><circle cx="102" cy="292" r="21" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="99"