<text x="42" y="753" fill="#eef5fc" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="42" dy="0">Blue A unchanged; others fall</tspan></text>
<rect x="24" y="784" width="552" height="100" rx="12" fill="#172a3c" stroke="#b3c7d9" stroke-width="3" stroke-dasharray="8 6" />
<text x="42" y="824" fill="#eef5fc" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="42" dy="0">Larger share ≠ more cells</tspan><tspan x="42" dy="38">or known tumor specificity.</tspan></text>
</svg>
