<text x="148" y="307" fill="#eef5fc" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="148" dy="0">25</tspan></text>
<text x="316" y="307" fill="#eef5fc" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="316" dy="0">B</tspan></text>
