<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Recover a blood fraction</title><desc id="desc">A conceptual density-separated blood tube shows plasma above a recovered mononuclear-cell interface, density medium below it, and red cells with many conventional granulocytes near the bottom. A separate recovered mixture contains lymphocytes and monocytes with possible contaminants. It samples blood, not tumor or lymph node.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667b" /></marker></defs>
<rect x="14" y="8" width="572" height="103" rx="12" fill="#f1f6fa" /><text x="24" y="48" fill="#182b40" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="24" dy="0">Recover a blood fraction</tspan></text>
<text x="24" y="98" fill="#465b72" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Conceptual density separation</tspan></text>
