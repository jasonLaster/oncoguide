<circle cx="159" cy="305" r="10" fill="#ffffff" />
<circle cx="156" cy="305" r="4" fill="#7753a6" />
<circle cx="214" cy="305" r="10" fill="#ffffff" />
<circle cx="211" cy="305" r="4" fill="#7753a6" />
<path d="M 250 306 H 285" fill="none" stroke="#0b805f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="289" y="199" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="289" dy="0">Plasma</tspan></text>
<text x="289" y="286" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="289" dy="0">Recovered</tspan><tspan x="289" dy="38">interface</tspan></text>
<text x="289" y="387" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="289" dy="0">Density</tspan><tspan x="289" dy="38">medium</tspan></text>
<text x="289" y="459" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="289" dy="0">Red cells +</tspan><tspan x="289" dy="38">granulocytes</tspan></text>
<rect x="24" y="554" width="552" height="209" rx="16" fill="#f1f6fa" />
<text x="42" y="595" fill="#182b40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">Recovered mix: check quality</tspan></text>
