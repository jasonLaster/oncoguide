<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450" role="img" aria-labelledby="title desc"><title id="title">Which population is the parent?</title><desc id="desc">Nested invented gate boxes show 12,000 recorded events, 10,000 quality-selected recovered cells, 1,000 T-cell events and 100 reagent-binding events. Debris, pairs and dead-cell events are excluded before the recovered-cell denominator. The same 100 binding events are 10% of 1,000 T cells and 1% of 10,000 recovered cells. Box areas are not proportional. No concentration, whole-body count or killing result is inferred.</desc><metadata>Original hand-authored editable SVG by agent:/root/batch09_author_group2. No image-generation invocation. Invented teaching example; human review pending. No patient result or clinical threshold.</metadata><style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="780" height="1450" fill="#172831"/><text x="40" y="63" fill="#f4f2ea" font-size="38" font-weight="700" text-anchor="start">Which population is the parent?</text><text x="40" y="108" fill="#d0dde0" font-size="30" font-weight="400" text-anchor="start">Invented sample • selected events, not a census</text><rect x="35" y="145" width="710" height="785" rx="18" fill="#213c47" stroke="#b4cbd2" stroke-width="3"/><text x="65" y="195" fill="#f4f2ea" font-size="34" font-weight="700" text-anchor="start">12,000 recorded events</text><circle cx="100" cy="246" r="15" fill="#9eced8" stroke="#b4cbd2" stroke-width="2"/><circle cx="97" cy="248" r="4.95" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><circle cx="146" cy="251" r="15" fill="#9eced8" stroke="#b4cbd2" stroke-width="2"/><circle cx="143" cy="253" r="4.95" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><circle cx="202" cy="247" r="15" fill="#9eced8" stroke="#b4cbd2" stroke-width="2"/><circle cx="199" cy="249" r="4.95" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><circle cx="247" cy="242" r="6" fill="#ebc780" stroke="#b4cbd2" stroke-width="2"/><circle cx="270" cy="255" r="8" fill="#ebc780" stroke="#b4cbd2" stroke-width="2"/><circle cx="320" cy="245" r="14" fill="#9eced8" stroke="#b4cbd2" stroke-width="2"/><circle cx="317" cy="247" r="4.62" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><circle cx="338" cy="245" r="14" fill="#9eced8" stroke="#b4cbd2" stroke-width="2"/><circle cx="335" cy="247" r="4.62" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><circle cx="390" cy="245" r="15" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><circle cx="387" cy="247" r="4.95" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="2"/><text x="65" y="307" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Exclude debris, pairs and dead-cell events</text><text x="65" y="351" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Quality controls guide selection boundaries</text><rect x="72" y="387" width="635" height="500" rx="18" fill="#9eced8" stroke="#b4cbd2" stroke-width="3"/><text x="99" y="436" fill="#253b44" font-size="32" font-weight="700" text-anchor="start">10,000 recovered gated cells</text><text x="99" y="478" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">10,000 / 12,000 recorded events</text><rect x="107" y="523" width="565" height="318" rx="18" fill="#b4d1ba" stroke="#b4cbd2" stroke-width="3"/><text x="132" y="572" fill="#253b44" font-size="32" font-weight="700" text-anchor="start">1,000 T-cell events</text><text x="132" y="614" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">1,000 / 10,000 = 10% of parent</text><rect x="142" y="657" width="495" height="143" rx="18" fill="#ebc780" stroke="#b4cbd2" stroke-width="3"/><text x="165" y="706" fill="#253b44" font-size="30" font-weight="700" text-anchor="start">100 reagent-binding events</text><text x="165" y="752" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">100 / 1,000 T cells = 10%</text><rect x="35" y="966" width="710" height="258" rx="18" fill="#213c47" stroke="#b4cbd2" stroke-width="3"/><text x="65" y="1017" fill="#f4f2ea" font-size="34" font-weight="700" text-anchor="start">Same 100 events. Two questions.</text><text x="65" y="1071" fill="#f4f2ea" font-size="32" font-weight="400" text-anchor="start">Among T cells: 100 / 1,000 = 10%</text><text x="65" y="1123" fill="#f4f2ea" font-size="32" font-weight="400" text-anchor="start">Among recovered cells: 100 / 10,000 = 1%</text><text x="65" y="1175" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Excluded events are outside these parents</text><text x="40" y="1280" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Nested boxes show membership, not area ratios</text><text x="40" y="1330" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">No cells/mL or body-wide total is inferred</text><text x="40" y="1380" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Binding / marker identity does not prove killing</text></svg>
