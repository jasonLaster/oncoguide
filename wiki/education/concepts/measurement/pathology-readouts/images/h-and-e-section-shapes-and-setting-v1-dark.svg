<text x="40" y="1235" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Appearance is not a molecular census.</tspan><tspan x="40" dy="46">Nearby depth can show a different mixture.</tspan></text>
