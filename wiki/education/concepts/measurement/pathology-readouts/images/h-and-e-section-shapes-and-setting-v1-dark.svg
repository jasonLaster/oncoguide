<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1330" viewBox="0 0 780 1330" role="img" aria-labelledby="title desc"><title id="title">H&amp;E: morphology in a represented section</title><desc id="desc">A fictional tissue block and selected thin section lead to a schematic cell cluster beside pink extracellular matrix. Blue-purple nuclei and pink cytoplasm/matrix reflect broad H&amp;E stain classes, not gene activity or named-protein abundance. The scene does not classify invasion, malignancy or cell viability. Nearby depth can contain a different arrangement and tissue outside the represented section remains unobserved.</desc>
