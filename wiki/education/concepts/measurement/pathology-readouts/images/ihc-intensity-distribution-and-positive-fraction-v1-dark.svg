<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450" role="img" aria-labelledby="title desc"><title id="title">110 and 50% ask different questions</title><desc id="desc">One hundred invented eligible cells are represented by 100 circles grouped by staining intensity: 50 unstained, 10 weak, 20 moderate and 20 strong. The same 100-cell denominator gives 50% positive cells, whereas intensity weights one, two and three give H-score 10 plus 40 plus 60 equals 110. Category rows are an explanatory grouping, not tissue geography. Allred is a separate categorical system. Neither quantity is a molecule count, a universal clinical cutoff or an interchangeable assay output.</desc><metadata>Original hand-authored editable SVG by agent:/root/batch09_author_group2. No image-generation invocation. Invented teaching example; human review pending. No patient result or clinical threshold.</metadata><style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="780" height="1450" fill="#172831"/><text x="40" y="63" fill="#f4f2ea" font-size="38" font-weight="700" text-anchor="start">110 and 50% ask different questions</text><text x="40" y="108" fill="#d0dde0" font-size="30" font-weight="400" text-anchor="start">Invented 100 eligible cells • one scoring population</text><rect x="35" y="145" width="710" height="623" rx="18" fill="#213c47" stroke="#b4cbd2" stroke-width="3"/><text x="65" y="195" fill="#f4f2ea" font-size="32" font-weight="700" text-anchor="start">Staining intensity in the same cell set</text><circle cx="109" cy="242" r="15" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><circle cx="171" cy="242" r="15" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><circle cx="233" cy="242" r="15" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><circle cx="295" cy="242" r="15" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><circle cx="357" cy="242" r="15" fill="#344b55" stroke="#b4cbd2" st