><text x="65" y="691" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">One circle = one fictional eligible cell</text><text x="65" y="735" fill="#f4f2ea" font-size="28" font-weight="400" text-anchor="start">Rows group categories; this is not tissue geography</text><rect x="35" y="804" width="710" height="353" rx="18" fill="#213c47" stroke="#b4cbd2" stroke-width="3"/><text x="65" y="855" fill="#f4f2ea" font-size="32" font-weight="700" text-anchor="start">Keep each category in the denominator</text><circle cx="81" cy="898" r="12" fill="#344b55" stroke="#b4cbd2" stroke-width="2"/><text x="110" y="908" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Unstained</text><text x="365" y="908" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">50 / 100 = 50%</text><text x="634" y="908" fill="#f4f2ea" font-size="30" font-weight="700" text-anchor="start">× 0</text><circle cx="81" cy="955" r="12" fill="#ebc780" stroke="#b4cbd2" stroke-width="2"/><text x="110" y="965" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Weak</text><text x="365" y="965" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">10 / 100 = 10%</text><text x="634" y="965" fill="#f4f2ea" font-size="30" font-weight="700" text-anchor="start">× 1</text><circle cx="81" cy="1012" r="12" fill="#c38b52" stroke="#b4cbd2" stroke-width="2"/><text x="110" y="1022" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Moderate</text><text x="365" y="1022" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">20 / 100 = 20%</text><text x="634" y="1022" fill="#f4f2ea" font-size="30" font-weight="700" text-anchor="start">× 2</text><circle cx="81" cy="1069" r="12" fill="#824626" stroke="#b4cbd2" stroke-width="2"/><text x="110" y="1079" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Strong</text><text x="365" y="1079" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">20 / 100 = 20%</text><text x="634" y="1079" fill="#f4f2ea" font-size="30" font-weight="700" text-anchor="start">× 3</text><rect x="35" y="1194" width="710" height="146" rx="18" fill="#213c47" stroke="#b4cbd2" stroke-width="3"/><text x="65" y="1244" fill="#f4f2ea" font-size="31" font-weight="700" text-anchor="start">H-score: 10×1 + 20×2 + 20×3 = 110</text><text x="65" y="1296" fill="#f4f2ea" font-size="30" font-weight="400" text-anchor="start">Positive fraction: (10+20+20) / 100 = 50%</text><text x="40" y="1400" fill="#f4f2ea" font-size="29" font-weight="400" text-anchor="start">Allred is separate • no molecule count or cutoff</text></svg>
