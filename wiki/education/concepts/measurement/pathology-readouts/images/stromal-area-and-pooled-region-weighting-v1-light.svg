<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450" role="img" aria-labelledby="title desc"><title id="title">A larger region carries more area</title><desc id="desc">A schematic pretend pretreatment section distinguishes excluded malignant nests and eligible stroma inside invasive-tumor borders. Separate invented area blocks show region A with four equal units of eligible stroma and 0.4 units occupied by infiltrate, and B with one equal unit of stroma and 0.6 occupied units. At the same scale, the pooled-area fraction is 1/5, or 20%; the unweighted regional mean is 35%. Area, not cell count, is the denominator. This toy geometry is not a mandated pixel workflow; pretreatment and residual-bed methods remain distinct.</desc><metadata>Original hand-authored editable SVG by agent:/root/batch09_author_group2. No image-generation invocation. Invented teaching example; human review pending. No patient result or clinical threshold.</metadata><style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="780" height="1450" fill="#faf6ed"/><text x="40" y="63" fill="#253b44" font-size="38" font-weight="700" text-anchor="start">A larger region carries more area</text><text x="40" y="108" fill="#435f69" font-size="30" font-weight="400" text-anchor="start">Invented area map • pretend pretreatment section</text><rect x="35" y="145" width="710" height="388" rx="18" fill="#fffdf8" stroke="#476573" stroke-width="3"/><text x="65" y="195" fill="#253b44" font-size="31" font-weight="700" text-anchor="start">Select eligible stroma inside tumor borders</text><rect x="68" y="230" width="408" height="245" rx="7" fill="#f0ece1" stroke="#476573" stroke-width="3" stroke-dasharray="9 8"/><circle cx="100" cy="270" r="28" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="97" cy="272" r="9.24" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="127" cy="279" r="21" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="124" cy="281" r="6.930000000000001" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="277" cy="395" r="28" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="274" cy="397" r="9.24" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="304" cy="404" r="21" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="301" cy="406" r="6.930000000000001" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="400" cy="277" r="28" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="397" cy="279" r="9.24" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><circle cx="427" cy="286" r="21" fill="#e8a9b3" stroke="#476573" stroke-width="2"/><circle cx="424" cy="288" r="6.930000000000001" fill="#b4d1ba" stroke="#476573" stroke-width="2"/><rect x="174" y="265" width="88" height="125" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="340" y="333" width="85" height="100" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><text x="500" y="276" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">Pink nests:</text><text x="500" y="316" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">excluded</text><text x="500" y="380" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">Green:</text><text x="500" y="420" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">stroma</text><text x="65" y="505" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">Also exclude necrosis, artifacts and normal tissue</text><rect x="35" y="572" width="710" height="465" rx="18" fill="#fffdf8" stroke="#476573" stroke-width="3"/><text x="65" y="622" fill="#253b44" font-size="32" font-weight="700" text-anchor="start">Now compare only the eligible areas</text><text x="65" y="675" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">A: 4 units of stroma • 0.4 units infiltrate</text><rect x="71" y="707" width="135" height="110" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="71" y="707" width="13.5" height="110" rx="0" fill="#ebc780" stroke="#476573" stroke-width="3"/><rect x="221" y="707" width="135" height="110" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="221" y="707" width="13.5" height="110" rx="0" fill="#ebc780" stroke="#476573" stroke-width="3"/><rect x="371" y="707" width="135" height="110" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="371" y="707" width="13.5" height="110" rx="0" fill="#ebc780" stroke="#476573" stroke-width="3"/><rect x="521" y="707" width="135" height="110" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="521" y="707" width="13.5" height="110" rx="0" fill="#ebc780" stroke="#476573" stroke-width="3"/><text x="65" y="859" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">B: 1 unit of stroma • 0.6 units infiltrate</text><rect x="71" y="889" width="135" height="110" rx="0" fill="#b4d1ba" stroke="#476573" stroke-width="3"/><rect x="71" y="889" width="81" height="110" rx="0" fill="#ebc780" stroke="#476573" stroke-width="3"/><text x="243" y="928" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">Same area scale</text><text x="243" y="974" fill="#253b44" font-size="28" font-weight="400" text-anchor="start">Gold = occupied infiltrate area</text><rect x="35" y="1076" width="710" height="174" rx="18" fill="#fffdf8" stroke="#476573" stroke-width="3"/><text x="65" y="1127" fill="#253b44" font-size="31" font-weight="700" text-anchor="start">Pooled area: (0.4 + 0.6) / (4 + 1)</text><text x="65" y="1174" fill="#253b44" font-size="34" font-weight="700" text-anchor="start">= 1 / 5 = 20%</text><text x="65" y="1220" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">Unweighted mean: (10% + 60%) / 2 = 35%</text><text x="40" y="1300" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">Area is the denominator, not tumor-cell count</text><text x="40" y="1350" fill="#253b44" font-size="30" font-weight="400" text-anchor="start">Toy geometry is not a mandated pixel workflow</text><text x="40" y="1400" fill="#253b44" font-size="29" font-weight="400" text-anchor="start">Residual-bed scoring uses a distinct setting/method</text></svg>
