<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1330" viewBox="0 0 600 1330" role="img" aria-labelledby="title desc"><title id="title">Three different evidence questions</title><desc id="desc">Three fictional mechanism panels pair HLA-A DNA tiles with schematic surface display: loss of placeholder allele A1 while A2 remains; retained A1 and A2 with reduced expression; and retained HLA-A tiles with impaired B2M support. Dashed links mark display effects as requiring separate measurement; other class-I alleles may remain after one allele is lost.</desc><rect x="5" y="5" width="590" height="1320" rx="20" fill="#0e1822" stroke="#0e1822" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#eef4f7" font-weight="700" text-anchor="start">Three different evidence questions</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="374" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">1  Allele-specific DNA loss</text><text x="42" y="203" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">HLA-A DNA</text><rect x="45" y="226" width="82" height="56" rx="10" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><text x="86" y="263" font-family="system-ui,sans-serif" font-size="26" fill="#8bd6ec" font-weight="700" text-anchor="middle">A1</text><rect x="147" y="226" width="82" height="56" rx="10" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="188" y="263" font-family="system-ui,sans-serif" font-size="26" fill="#8ddbc3" font-weight="700" text-anchor="middle">A2</text><path d="M47 229 L125 279" fill="none" stroke="#f4a9c0" stroke-width="4" stroke-linecap="round"/><path d="M47 279 L125 229" fill="none" stroke="#f4a9c0" stroke-width="4" stroke-linecap="round"/><path d="M250 253 L295 253" fill="none" stroke="#c0d0dc" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M295 253 L285.3465918192059 258.2736809246462" fill="none" stroke="#c0d0dc" stroke-width="3" stroke-linecap="round"/><path d="M295 253 L285.3465918192059 247.72631907535376" fill="none" stroke="#c0d0dc" stroke-width="3" stroke-linecap="round"/><path d="M315 312 L547 312" fill="none" stroke="#b4c4d0" stroke-width="7" stroke-linecap="round"/><path d="M425 306 V256 M410 252 Q425 277 440 252" fill="none" stroke="#8ddbc3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="438" cy="290" r="6" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><path d="M514 306 V256 M499 252 Q514 277 529 252" fill="none" stroke="#cbb2ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="527" cy="290" r="6" fill="#413453" stroke="#cbb2ef" stroke-width="2"/><text x="325" y="359" font-family="system-ui,sans-serif" font-size="24" fill="#c0d0dc" font-weight="500" text-anchor="start">surface schematic</text><text x="43" y="412" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">A1 lost; A2 and other alleles may remain.</text><text x="43" y="445" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">This DNA call does not measure display.</text><rect x="20" y="506" width="560" height="374" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="548" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">2  Reduced expression</text><text x="42" y="597" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">HLA-A DNA</text><rect x="45" y="620" width="82" height="56" rx="10" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><text x=