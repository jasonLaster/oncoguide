<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1210" viewBox="0 0 780 1210" role="img" aria-labelledby="title desc"><title id="title">Carry eligible territory into mutation density</title><desc id="desc">Both fictional workflows count 24 eligible mutations; a 6-by-4 inventory of 24 neutral tokens illustrates a count without asserting mutation positions or identical variants. Workflow 1 uses two eligible megabases and gives 12 mutations per megabase. Workflow 2 uses one eligible megabase and gives 24 mutations per megabase. Territory bars use the same length scale. Counting, filtering and calibration rules remain method-specific; these are not clinical cutoff or response statements.</desc>
