<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1320" viewBox="0 0 780 1320" role="img" aria-labelledby="title desc"><title id="title">Copies and versions are different</title><desc id="desc">Idealized uniform modeled region states contrast 1+1 copies of A and B with 2+0 copies of A only; both total two. Separate copy-loss 1+0 and gain 2+1 states have totals one and three. A and B are arbitrary versions, not parental assignments or functional states. Ribbon glyphs represent region copies, not whole genomes or replicated chromatids.</desc>
