<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1320" viewBox="0 0 780 1320" role="img" aria-labelledby="title desc"><title id="title">Where does the assay look?</title><desc id="desc">Three design tracks align to the same illustrative DNA interval. Gray boxes above identify exons among intervening sequence. The toy panel targets one exon and a selected non-exon region, exome sequencing targets primarily the exon boxes, and genome sequencing targets the broader interval. Blank positions are outside the toy design; hatched patches mark illustrative potential usable-evidence gaps, including a difficult repeat-like region on the genome track. Widths, coordinates and gaps are schematic, not an assay dataset, fixed category property, measured depth or performance ranking.</desc><metadata>Original editable code-authored scientific diagram. Model and creation source commit null. Source quantities are illustrative, not empirical. Independent review pending.</metadata><defs><style>.panel{stroke:#fffdf7;}.ink{fill:#24343e;stroke:none;}.muted{fill:#435c66;stroke:none;}.edge{stroke:#456474;}.panel{fill:#fffdf7;stroke:#456474;} .glyphtext{fill:#24343e;stroke:none;} .glyphborder{stroke:#24343e;} text{font-family:Arial,Helvetica,sans-serif;} path,circle,rect{stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456474"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#bcd7de"/><path d="M-3 12 L12 -3 M9 15 L15 9" stroke="#24343e" stroke-width="2"/></pattern></defs><rect width="780" height="1320" fill="#faf6ed"/><text x="42" y="65" font-size="42" font-weight="700" class="ink" text-anchor="start">Where does the assay look?</text><text x="42" y="113" font-size="32" font-weight="400" class="muted" text-anchor="start">Comparison axis: position along DNA</text><rect x="34" y="150" width="712" height="238" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="200" font-size="34" font-weight="700" class="ink" text-anchor="start">One illustrative DNA interval</text><path d="M95 274 H688" class="edge" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="65" y="353" font-size="32" font-weight="400" class="ink" text-anchor="start">Exons sit among other DNA sequence.</text><rect x="120" y="239" width="90" height="61" rx="8" fill="#c4cbd0" class="edge" stroke-width="6.0" /><rect x="120" y="239" width="90" height="61" rx="8" fill="#c4cbd0" class="glyphborder" stroke-width="3" /><rect x="310" y="239" width="75" height="61" rx="8" fill="#c4cbd0" class="edge" stroke-width="6.0" /><rect x="310" y="239" width="75" height="61" rx="8" fill="#c4cbd0" class="glyphborder" stroke-width="3" /><rect x="530" y="239" width="110" height="61" rx="8" fill="#c4cbd0" class="edge" stroke-width="6.0" /><rect x="530" y="239" width="110" height="61" rx="8" fill="#c4cbd0" class="glyphborder" stroke-width="3" /><text x="285" y="233" font-size="32" font-weight="400" class="ink" text-anchor="start">Exons</text><path d="M334 240 L351 253" class="edge" stroke-width="2" fill="none" /><rect x="34" y="414" width="712" height="188" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="457" font-size="34" font-weight="700" class="ink" text-anchor="start">Panel</text><path d="M95 505 H688" class="edge" stroke-width="3" fill="none" /><rect x="120" y="481" width="90" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="120" y="481" width="90" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="420" y="481" width="51" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="420" y="481" width="51" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="170" y="481" width="22" height="48" rx="0" fill="url(#hatch)" class="edge" stroke-width="2" /><text x="65" y="572" font-size="32" font-weight="400" class="ink" text-anchor="start">Selected regions; may include introns.</text><rect x="34" y="624" width="712" height="188" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="667" font-size="34" font-weight="700" class="ink" text-anchor="start">Exome (WES)</text><path d="M95 715 H688" class="edge" stroke-width="3" fill="none" /><rect x="120" y="691" width="90" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="120" y="691" width="90" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="310" y="691" width="75" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="310" y="691" width="75" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="530" y="691" width="110" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="530" y="691" width="110" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="352" y="691" width="21" height="48" rx="0" fill="url(#hatch)" class="edge" stroke-width="2" /><text x="65" y="782" font-size="32" font-weight="400" class="ink" text-anchor="start">Primarily exons; capture varies.</text><rect x="34" y="834" width="712" height="188" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="877" font-size="34" font-weight="700" class="ink" text-anchor="start">Genome (WGS)</text><path d="M95 925 H688" class="edge" stroke-width="3" fill="none" /><rect x="95" y="901" width="593" height="48" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="95" y="901" width="593" height="48" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><rect x="473" y="901" width="45" height="48" rx="0" fill="url(#hatch)" class="edge" stroke-width="2" /><text x="65" y="992" font-size="32" font-weight="400" class="ink" text-anchor="start">Broad coding and noncoding territory.</text><text x="458" y="877" font-size="32" font-weight="400" class="ink" text-anchor="start">Repeat?</text><path d="M495 883 V900" class="edge" stroke-width="2" fill="none" /><rect x="66" y="1087" width="37" height="32" rx="5" fill="#bcd7de" class="edge" stroke-width="5.0" /><rect x="66" y="1087" width="37" height="32" rx="5" fill="#bcd7de" class="glyphborder" stroke-width="2" /><text x="120" y="1113" font-size="32" font-weight="400" class="ink" text-anchor="start">Intended target</text><rect x="416" y="1087" width="37" height="32" rx="0" fill="url(#hatch)" class="edge" stroke-width="2" /><text x="470" y="1113" font-size="32" font-weight="400" class="ink" text-anchor="start">Example gap</text><text x="42" y="1180" font-size="32" font-weight="400" class="ink" text-anchor="start">Blank: not targeted in this toy design.</text><text x="42" y="1220" font-size="32" font-weight="400" class="ink" text-anchor="start">Hatch: usable evidence needs checking.</text><text x="42" y="1290" font-size="32" font-weight="400" class="muted" text-anchor="start">No coordinates, depth or detection rate implied.</text></svg>
