<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Territory asks “where?” Depth asks “how many?”</title><desc id="desc">A toy assay marks a selected DNA territory and a region outside its design. A local zoom aligns four invented reads across position P and two across position Q, giving depths of 4× and 2× at those specific positions. A second targeted region R has no usable aligned reads despite being included in the design. The schematic complements the preserved panel/exome/genome territory illustration; it is not a category ranking, coverage threshold, variant-detection probability or clinical-utility claim.</desc><metadata>Original hand-authored SVG by agent:/root/batch09_author_group3. No image model or generation service used. Private prospective illustration; independent and human review pending. All geometry schematic; toy values invented.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b6cbd5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="96" rx="12" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="49" font-size="32" font-weight="700" fill="#f3f1e8" text-anchor="start">Territory asks “where?”</text><text x="32" y="85" font-size="32" font-weight="700" fill="#f3f1e8" text-anchor="start">Depth asks “how many?”</text><rect x="12" y="124" width="576" height="200" rx="12" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="163" font-size="30" font-weight="700" fill="#f3f1e8" text-anchor="start">1  Mark the intended territory</text><path d="M57 223L531 223" fill="none" stroke="#b6cbd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="198" width="236" height="50" rx="4" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><text 