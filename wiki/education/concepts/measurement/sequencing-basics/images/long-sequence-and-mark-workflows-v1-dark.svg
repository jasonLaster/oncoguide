<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1350" viewBox="0 0 780 1350" role="img" aria-labelledby="title desc"><title id="title">Connected sequence and chemical marks are different evidence</title><desc id="desc">An illustrative long DNA molecule connects two sequence features and carries a cytosine mark. Native instrument signal plus a supported modification model may recover mark evidence. Ordinary amplification of unconverted DNA copies the sequence without faithfully copying original methylation marks; the copied products omit the mark. A separate fictional native-DNA assay calls eight of ten usable molecules methylated at one site, giving 80 percent of usable molecules, not malignant cells or gene silencing.</desc>
