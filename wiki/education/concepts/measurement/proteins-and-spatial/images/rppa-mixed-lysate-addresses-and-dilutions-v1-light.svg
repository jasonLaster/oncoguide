<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">A printed spot is a mixture. Its address names a sample.</title><desc id="desc">Invented cells from a defined specimen are disrupted into a tube containing mixed protein shapes. A printed array uses rows for samples A and B and columns for toy dilutions 1, one-half and one-quarter; every spot retains mixed protein symbols. Two replicate array layouts receive separate antibodies for R and phospho-R. Print addresses are sample/dilution labels rather than cell positions. Specificity, calibration and loading normalization remain assay-specific; this is not all-protein or single-cell spatial measurement.</desc><metadata>Original hand-authored SVG by agent:/root/batch09_author_group3. No image model or generation service used. Private prospective illustration; independent and human review pending. All geometry schematic; toy values invented.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#486677"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="96" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="49" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">A printed spot is a mixture.</text><text x="32" y="85" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">Its address names a sample.</text><rect x="12" y="124" width="576" height="200" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="163" font-size="30" font-weight="700" fill="#24343e" text-anchor="start">1  Disrupt cells into mixed lysate</text><circle cx="69" cy="216" r="24" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="72" cy="214" r="8.399999999999999" fill="#e9edef" stroke="#48