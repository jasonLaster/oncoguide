<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1220" viewBox="0 0 600 1220" role="img" aria-labelledby="title desc"><title id="title">Detection is not a dependable amount</title><desc id="desc">A fictional calibration plot has blank/background, detected-below-quantification, validated quantification and upper-saturation regions, with scattered replicate response dots and no transferable concentration values. A second panel keys those reporting regions; a third contrasts a measured peptide in an extract with an unresolved cell-surface location. Replicate dispersion appears as dots on the calibration curve.</desc><rect x="5" y="5" width="590" height="1210" rx="20" fill="#0e1822" stroke="#0e1822" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#eef4f7" font-weight="700" text-anchor="start">Detection is not a dependable amount</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="542" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">1  One analyte, one fictional calibration</text><rect x="75" y="228" width="80" height="275" rx="0" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><rect x="155" y="228" width="100" height="275" rx="0" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><rect x="255" y="228" width="200" height="275" rx="0" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><rect x="455" y="228" width="90" height="275" rx="0" fill="#413453" stroke="#cbb2ef" stroke-width="2"/><path d="M75 503 L545 503" fill="none" stroke="#eef4f7" stroke-width="3" stroke-linecap="round"/><path d="M75 503 L75 223" fill="none" stroke="#eef4f7" stroke-width="3" stroke-linecap="round"/><path d="M80 491 Q150 483 183 455 L438 280 Q480 252 540 252" fill="none" stroke="#eef4f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="119" cy="472" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="119" cy="501" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="119" cy="486" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="202" cy="424" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="202" cy="459" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="202" cy="442" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="319" cy="365" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="319" cy="357" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="319" cy="369" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="509" cy="247" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="509" cy="253" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="509" cy="258" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><path d="M155 228 L155 503" fill="none" stroke="#71899b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><path d="M255 228 L255 503" fill="none" stroke="#71899b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><path d="M455 228 L455 503" fill="none" stroke="#71899b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="84" y="201" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Response ↑</text><text x="90" y="546" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Known peptide input →</text><text x="42" y="593" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Spacing is illustrative, with arbitrary units.</text><text x="42" y="626" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Limits belong to this analyte and matrix.</text><rect x="20" y="674" width="560" height="255" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="716" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">2  What each region permits</text><circle cx="45" cy="750" r="7" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><text x="64" y="759" font-family="system-ui,sans-serif" font-size="24" fill="#b4c4d0" font-weight="500" text-anchor="start">Blank/background: no detection claim</text><circle cx="45" cy="789" r="7" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><text x="64" y="798" font-family="system-ui,sans-serif" font-size="24" fill="#f4a9c0" font-weight="500" text-anchor="start">Detected below LLOQ: no reliable amount</text><circle cx="45" cy="828" r="7" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="64" y="837" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="500" text-anchor="start">Validated range: report amount + units</text><circle cx="45" cy="867" r="7" fill="#413453" stroke="#cbb2ef" stroke-width="2"/><text x="64" y="876" font-family="system-ui,sans-serif" font-size="24" fill="#cbb2ef" font-weight="500" text-anchor="start">Upper saturation: response flattens</text><rect x="20" y="949" width="560" height="239" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="991" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">3  Peptide amount ≠ surface location</text><path d="M63 1022 L63 1096 Q95.5 1141 128 1096 L128 1022 Z" fill="#1d4b5b" stroke="#71899b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 1022 L132 1022" fill="none" stroke="#8bd6ec" stroke-width="5" stroke-linecap="round"/><path d="M84 1055 q8 -15 15 0 q8 15 15 0" fill="none" stroke="#8bd6ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="1055" font-family="system-ui,sans-serif" font-size="26" fill="#8bd6ec" font-weight="500" text-anchor="start">Extracted peptide</text><text x="153" y="1092" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Cell of origin and location?</text><text x="43" y="1155" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Tight repeats alone do not rule out bias.</text></svg>
