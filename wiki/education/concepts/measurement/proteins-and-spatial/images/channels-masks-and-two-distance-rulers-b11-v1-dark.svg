<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1220" viewBox="0 0 600 1220" role="img" aria-labelledby="title desc"><title id="title">A nearby cell is a measured relation</title><desc id="desc">Separate synthetic blue and rose marker channels are aligned to one fictional tissue field. An overlay adds dashed estimated cell boundaries and two different rulers: center-to-center crosses the cells, while boundary-to-boundary spans only the gap. The bottom panel separates measured channels, estimated masks and calculated distances without claiming contact or recognition.</desc><rect x="5" y="5" width="590" height="1210" rx="20" fill="#0e1822" stroke="#0e1822" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#eef4f7" font-weight="700" text-anchor="start">A nearby cell is a measured relation</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="310" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">1  Measured, registered marker channels</text><rect x="45" y="205" width="235" height="155" rx="12" fill="#0e1822" stroke="#71899b" stroke-width="2"/><circle cx="110" cy="277" r="11" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><circle cx="215" cy="277" r="11" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><circle cx="90" cy="267" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="98" cy="295" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="122" cy="261" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="128" cy="289" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="113" cy="299" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="87" cy="283" r="4" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><text x="75" y="395" font-family="system-ui,sans-serif" font-size="26" fill="#8bd6ec" font-weight="500" text-anchor="start">channel A</text><rect x="315" y="205" width="235" height="155" rx="12" fill="#0e1822" stroke="#71899b" stroke-width="2"/><circle cx="380" cy="277" r="11" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><circle cx="485" cy="277" r="11" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><circle cx="465" cy="267" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="473" cy="295" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="497" cy="261" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="503" cy="289" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="488" cy="299" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="462" cy="283" r="4" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><text x="345" y="395" font-family="system-ui,sans-serif" font-size="26" fill="#f4a9c0" font-weight="500" text-anchor="start">channel B</text><rect x="20" y="442" width="560" height="446" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="484" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">2  Overlay + estimated masks</text><text x="43" y="530" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Same field enlarged; masks are estimated.</text><circle cx="205" cy="638" r="83" fill="#182836" stroke="#8bd6ec" stroke-width="2" stroke-dasharray="7 6"/><circle cx="205" cy="638" r="20" fill="#344653" stroke="#b4c4d0" stroke-width="2"/><circle cx="205" cy="638" r="4" fill="#0e1822" stroke="#eef4f7" stroke-width="2"/><circle cx="168.8095238095238" cy="619.9047619047619" r="7.238095238095238" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="183.28571428571428" cy="670.5714285714286" r="