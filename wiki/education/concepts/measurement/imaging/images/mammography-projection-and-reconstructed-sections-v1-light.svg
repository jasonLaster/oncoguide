<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1340" viewBox="0 0 780 1340" role="img" aria-labelledby="title desc"><title id="title">Mammography: overlap, reconstructed sections and histology</title><desc id="desc">Fictional compressed tissue contains a circular structure and triangular structure at different depths but the same projected position. A single X-ray view overlays them. Multiple-angle views can support computed sections with less overlap. Those computed X-ray sections are distinct from a physically cut, stained tissue section; no object is classified as cancer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6564"/></marker></defs>
<rect x="0" y="0" width="780" height="1340" rx="0" fill="#faf4e9" />
<text x="40" y="61" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">A projection overlaps tissue</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Computed sections remain X-ray images</tspan></text>
<rect x="24" y="145" width="732" height="390" rx="18" fill="#fffdf7" stroke="#c8d0c5" stroke-width="2" />
