<text x="402" y="390" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="402" dy="0">Two depths</tspan><tspan x="402" dy="46">overlap below.</tspan></text>
<text x="76" y="503" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="76" dy="0">Detector projection</tspan></text>
