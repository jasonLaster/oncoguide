<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">MRI: pattern, span and selected voxel volume</title><desc id="desc">Original fictional MRI reports NME span 60 mm and research FTV 0.6 mL. DCE is a sequence of contrast-dependent images, BPE is normal background enhancement, NME is a distinguishable non-mass pattern. Voxel selection is a symbolic cartoon, without the voxel sizes/counts needed to recalculate the reported volume. Brightness does not establish histology or viable-cell count.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6564"/></marker></defs>
