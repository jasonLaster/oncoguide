<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1340" viewBox="0 0 780 1340" role="img" aria-labelledby="title desc"><title id="title">PET-CT: named tracer, anatomy and signal spreading</title><desc id="desc">Matched fictional schematic sections compare CT structural boundaries with 18F-FDG PET distribution. A separate high-activity small region is shown as a broader and lower-peak PET image, illustrating finite-resolution dilution without numeric calibration or a simulated scanner run. Uptake can arise from normal tissue, inflammation or malignant tissue; brightness does not identify the cells.</desc>
