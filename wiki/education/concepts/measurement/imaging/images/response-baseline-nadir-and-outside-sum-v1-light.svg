<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">Response criteria: baseline versus nadir</title><desc id="desc">Exact original fictional target sums are 100, 60 and 73 mm. The plot has a zero-based linear millimeter axis and equally spaced visit labels without asserted time intervals. From baseline the final value is 27 percent lower; from nadir it is 13 mm or approximately 21.7 percent higher. These meet target-lesion RECIST 1.1 progression arithmetic, under the original assumptions of comparable measurements, no new lesions and no non-target progression. Overall assessment and iRECIST rules are separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4e6564"/></marker></defs>
<rect x="0" y="0" width="780" height="1360" rx="0" fill="#faf4e9" />
<text x="40" y="61" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Carry the right reference</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Exact fictional target sums, in mm</tspan></text>
<rect x="24" y="145" width="732" height="455" rx="18" fill="#fffdf7" stroke="#c8d0c5" stroke-width="2" />
<text x="47" y="200" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="47" dy="0">1. Follow the selected target sum</tspan></text>
<path d="M110 510 L707 510" fill="none" stroke="#4e6564" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M110 510 L110 260" fill="none" stroke="#4e6564" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M111 510.0 L703 510.0" fill="none" stroke="#c8d0c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="93" y="523.0" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="end"><tspan x="93" dy="0">0</tspan></text>
<path d="M111 397.5 L703 397.5" fill="none" stroke="#c8d0c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="93" y="410.5" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="end"><tspan x="93" dy="0">50</tspan></text>
<path d="M111 285.0 L703 285.0" fill="none" stroke="#c8d0c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="93" y="298.0" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="end"><tspan x="93" dy="0">100</tspan></text>
<path d="M198 285.0 L416 375.0 L642 345.75" fill="none" stroke="#315f51" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="198" cy="285.0" r="10" fill="#9a6825" stroke="#293c40" stroke-width="2" />
<text x="198" y="256.0" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="198" dy="0">100 mm</tspan></text>
<text x="198" y="569" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="198" dy="0">Start</tspan></text>
<circle cx="416" cy="375.0" r="10" fill="#9a6825" stroke="#293c40" stroke-width="2" />
<text x="416" y="346.0" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="416" dy="0">60 mm</tspan></text>
<text x="416" y="569" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="416" dy="0">Lowest</tspan></text>
<circle cx="642" cy="345.75" r="10" fill="#9a6825" stroke="#293c40" stroke-width="2" />
<text x="642" y="316.75" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="642" dy="0">73 mm</tspan></text>
<text x="642" y="569" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#293c40" text-anchor="middle"><tspan x="642" dy="0">Now</tspan></text>
<rect x="24" y="625" width="732" height="325" rx="18" fill="#fffdf7" stroke="#c8d0c5" stroke-width="2" />
<text x="47" y="680" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="47" dy="0">2. Choose baseline or nadir</tspan></text>
<text x="48" y="735" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">From baseline: (73 − 100) / 100</tspan><tspan x="48" dy="46">= −27%</tspan></text>
<text x="48" y="846" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">From nadir: (73 − 60) / 60</tspan><tspan x="48" dy="46">≈ +21.7%; absolute rise = 13 mm</tspan></text>
<rect x="24" y="975" width="732" height="235" rx="18" fill="#fffdf7" stroke="#c8d0c5" stroke-width="2" />
<text x="47" y="1030" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="47" dy="0">3. Check findings outside this sum</tspan></text>
<text x="48" y="1080" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">Non-target progression: assumed absent</tspan><tspan x="48" dy="46">New lesions: assumed absent</tspan><tspan x="48" dy="46">Comparable measurements assumed</tspan></text>
<text x="40" y="1265" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Target PD math: ≥20% and ≥5 mm met.</tspan><tspan x="40" dy="46">No treatment decision follows.</tspan></text>
</svg>
