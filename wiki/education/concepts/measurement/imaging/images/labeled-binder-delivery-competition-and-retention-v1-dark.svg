<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Follow the labeled binder</title><desc id="desc">A radiolabeled Y-shaped binder travels from blood to tissue, where it competes with an unlabeled binder for targets. Text notes that clearance and retained label alter signal over time. Signal includes blood delivery, access, binding and retention at a specified imaging time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3c7d9" /></marker></defs>
