<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Printing is the starting plan</title><desc id="desc">Three stages show planned cell-containing ink and a temporary channel path, a constructed gel with an empty channel, then separate geometry, cell-health, flow and barrier checks. A lined channel is shown beside a bare channel; neither the plan nor a channel alone proves an organ or clinical prediction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52667b" /></marker></defs>
