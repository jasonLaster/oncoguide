<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1125" viewBox="0 0 600 1125" role="img" aria-labelledby="title desc"><title id="title">Cell lines: a maintained culture with a history</title><desc id="desc">A documented bank vial leads through transfer into a new culture vessel and then two illustrative passage branches. Each branch records passage and culture conditions. Three independent checks ask about authentication identity, contamination purity and relevant phenotype. A shared cell-line name does not guarantee identical biology; passage counts transfers and gives no universal division or drift rate.</desc><rect width="600" height="1125" fill="#131f2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#f3eee4" font-weight="700" text-anchor="start">One name, several histories</text><text x="28" y="86" font-size="26" fill="#c3d0dc" font-weight="400" text-anchor="start">Illustrative lineage · no drift rate assumed</text><rect x="24" y="119" width="552" height="126" rx="20" fill="#1d2d3b" stroke="#637f94" stroke-width="2"/><rect x="51" y="143" width="42" height="90" rx="8" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><rect x="49" y="135" width="46" height="20" rx="4" fill="#70d9c4" stroke="#70d9c4" stroke-width="2"/><path d="M60 186 L83 186" fill="none" stroke="#70d9c4" stroke-width="3" stroke-dasharray=""/><path d="M60 199 L83 199" fill="none" stroke="#70d9c4" stroke-width="3" stroke-dasharray=""/><text x="125" y="156" font-size="26" fill="#f3eee4" font-weight="500" text-anchor="start">Documented source / bank</text><text x="125" y="188" font-size="26" fill="#f3eee4" font-weight="500" text-anchor="start">Line identity + starting history</text><path d="M300 257 L300 300" fill="none" stroke="#c3d0dc" stroke-width="3" stroke-dasharray=""/><path d="M293 290 L300 300 L307 290" fill="none" stroke="#c3d0dc" stroke-width="3"/><path d="M280 315 H320 V340 L345 405 Q351 420 334 420 H265 Q250 420 255 405 L280 340 Z" fill="#233b45" stroke="#70d9c4" stroke-width="3"/><circle cx="280" cy="383" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="280" cy="383" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="307" cy="385" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="307" cy="385" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="295" cy="406" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="295" cy="406" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="325" cy="407" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="325" cy="407" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><text x="300" y="462" font-size="26" fill="#f3eee4" font-weight="600" text-anchor="middle">Transfer into a new vessel</text><path d="M300 479 L300 504" fill="none" stroke="#c3d0dc" stroke-width="3" stroke-dasharray=""/><path d="M161 504 L439 504" fill="none" stroke="#c3d0dc" stroke-width="3" stroke-dasharray=""/><path d="M161 504 L161 540" fill="none" stroke="#c3d0dc" stroke-width="3" stroke-dasharray=""/><path d="M154 530 L161 540 L168 530" fill="none" stroke="#c3d0dc" stroke-width="3"/><path d="M439 504 L439 540" fill="none" stroke="#c3d0dc" stroke-width="3" stroke-dasharray=""/><path d="M432 530 L439 540 L446 530" fill="none" stroke="#c3d0dc" stroke-width="3"/><path d="M137 558 H177 V583 L202 648 Q208 663 191 663 H122 Q107 663 112 648 L137 583 Z" fill="#233b45" stroke="#70d9c4" stroke-width="3"/><circle cx="137" cy="626" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="137" cy="626" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="164" cy="628" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="164" cy="628" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="152" cy="649" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="152" cy="649" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="182" cy="650" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="182" cy="650" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><path d="M415 558 H455 V583 L480 648 Q486 663 469 663 H400 Q385 663 390 648 L415 583 Z" fill="#233b45" stroke="#70d9c4" stroke-width="3"/><circle cx="415" cy="626" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="415" cy="626" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="442" cy="628" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="442" cy="628" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="430" cy="649" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="430" cy="649" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><circle cx="460" cy="650" r="7" fill="#233b45" stroke="#70d9c4" stroke-width="2"/><circle cx="460" cy="650" r="3.8500000000000005" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><text x="160" y="706" font-size="27" fill="#f3eee4" font-weight="700" text-anchor="middle">Branch A</text><text x="439" y="706" font-size="27" fill="#f3eee4" font-weight="700" text-anchor="middle">Branch B</text><text x="300" y="746" font-size="25" fill="#c3d0dc" font-weight="500" text-anchor="middle">Record passage + culture conditions</text><rect x="24" y="775" width="552" height="186" rx="20" fill="#1d2d3b" stroke="#637f94" stroke-width="2"/><text x="44" y="809" font-size="25" fill="#f3eee4" font-weight="700" text-anchor="start">Independent checks for each branch</text><text x="44" y="850" font-size="26" fill="#c9a4ef" font-weight="700" text-anchor="start">Identity</text><text x="190" y="850" font-size="25" fill="#f3eee4" font-weight="400" text-anchor="start">Authentication match?</text><text x="44" y="890" font-size="26" fill="#70d9c4" font-weight="700" text-anchor="start">Purity</text><text x="190" y="890" font-size="25" fill="#f3eee4" font-weight="400" text-anchor="start">Contamination test?</text><text x="44" y="930" font-size="26" fill="#ffba83" font-weight="700" text-anchor="start">Phenotype</text><text x="190" y="930" font-size="25" fill="#f3eee4" font-weight="400" text-anchor="start">Relevant behavior retained?</text><rect x="24" y="983" width="552" height="128" rx="20" fill="#233b45" stroke="#637f94" stroke-width="2"/><text x="42" y="1017" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">Same line name does not promise same biology.</text><text x="42" y="1049" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">A passage counts transfers, not a universal</text><text x="42" y="1081" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">number of divisions or a drift rate.</text></g></svg>
