<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">One weighing is mass. Repeated weighs give a rate.</title><desc id="desc">A fluid-filled channel loops inside a suspended vibrating beam; a passing cell shifts its frequency, calibrated to buoyant mass. An invented graph follows the same toy cell at 0, 0.5 and 1 hour with masses of 10, 11 and 12 picograms; slope is 2 picograms per hour. A separate invented matched-group rate comparison of 2 versus 0.5 picograms per hour yields a 75 percent lower positive rate. Neither reduced rate nor buoyant mass alone demonstrates shrinkage, death or patient response.</desc><metadata>Original hand-authored SVG by agent:/root/batch09_author_group3. No image model or generation service used. Private prospective illustration; independent and human review pending. All geometry schematic; toy values invented.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b6cbd5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="96" rx="12" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="49" font-size="32" font-weight="700" fill="#f3f1e8" text-anchor="start">One weighing is mass.</text><text x="32" y="85" font-size="32" font-weight="700" fill="#f3f1e8" text-anchor="start">Repeated weighs give a rate.</text><rect x="12" y="124" width="576" height="210" rx="12" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="163" font-size="30" font-weight="700" fill="#f3f1e8" text-anchor="start">1  Weigh a cell relative to fluid</text><rect x="63" y="186" width="293" height="87" rx="5" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><rect x="33" y="188" width="55" height="84" rx="3" fill="#b6cbd5" stroke="#b6cbd5" stroke-width="2"/><path 