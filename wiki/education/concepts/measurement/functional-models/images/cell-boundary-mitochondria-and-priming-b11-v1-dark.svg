<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img" aria-labelledby="title desc"><title id="title">Which membrane are we reading?</title><desc id="desc">A high-level cell cutaway shows a gapped, permeabilized cell boundary around a mitochondrion. A separate mitochondrial zoom distinguishes outer and inner membranes, cytochrome c initially between them, and possible release into cytosol. A final comparison separates mitochondrial priming readout, intact-cell death measurement and clinical benefit without a protocol or experimental settings.</desc><rect x="5" y="5" width="590" height="1260" rx="20" fill="#0e1822" stroke="#0e1822" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#eef4f7" font-weight="700" text-anchor="start">Which membrane are we reading?</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="404" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">1  Outer cell boundary: access is changed</text><path d="M180 216 C115 226 100 388 189 433 C260 475 385 450 416 374 M421 340 C425 244 341 192 236 207" fill="none" stroke="#8bd6ec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 268 C183 267 170 358 231 385 C295 414 367 372 347 315 C335 278 277 253 240 268 Z" fill="#214a40" stroke="#8ddbc3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 283 C204 287 199 341 239 363 C279 385 329 356 327 321 C317 292 269 276 236 283 Z" fill="none" stroke="#8ddbc3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M482 347 L395 347" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><path d="M395 347 L404.6534081807941 341.7263190753538" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><path d="M395 347 L404.6534081807941 352.2736809246462" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><text x="438" y="250" font-family="system-ui,sans-serif" font-size="24" fill="#8bd6ec" font-weight="500" text-anchor="start">cell</text><text x="438" y="283" font-family="system-ui,sans-serif" font-size="24" fill="#8bd6ec" font-weight="500" text-anchor="start">boundary</text><text x="438" y="316" font-family="system-ui,sans-serif" font-size="24" fill="#8bd6ec" font-weight="500" text-anchor="start">gap</text><text x="39" y="477" font-family="system-ui,sans-serif" font-size="25" fill="#eef4f7" font-weight="500" text-anchor="start">Permeabilized cell ≠ intact living-cell test.</text><rect x="20" y="536" width="560" height="407" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="578" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">2  Mitochondrial outer membrane responds</text><path d="M144 655 C70 680 90 831 181 850 C280 880 373 821 341 727 M326 695 C290 649 207 636 164 649" fill="none" stroke="#8ddbc3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 680 C108 699 131 807 191 826 C256 847 323 795 306 741 C291 700 215 665 165 680 Z" fill="none" stroke="#8ddbc3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="669" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="127" cy="749" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="192" cy="846" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="311" cy="814" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="350" cy="692" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><circle cx="395" cy="659" r="6" fill="#593340" stroke="#f4a9c0" stroke-width="2"/><path d="M303 706 L397 665" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><path d="M397 665 L390.2600380057 673.693268218305" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><path d="M397 665 L386.0432500241598 664.0255104069689" fill="none" stroke="#f4a9c0" stroke-width="3" stroke-linecap="round"/><text x="405" y="702" font-family="system-ui,sans-serif" font-size="23" fill="#f4a9c0" font-weight="500" text-anchor="start">cytochrome c</text><text x="405" y="735" font-family="system-ui,sans-serif" font-size="23" fill="#f4a9c0" font-weight="500" text-anchor="start">in cytosol</text><path d="M98 730 L52 687" fill="none" stroke="#c0d0dc" stroke-width="3" stroke-linecap="round"/><text x="37" y="612" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="500" text-anchor="start">outer</text><text x="37" y="645" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="500" text-anchor="start">membrane</text><path d="M131 757 L60 779" fill="none" stroke="#c0d0dc" stroke-width="3" stroke-linecap="round"/><text x="37" y="810" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="500" text-anchor="start">inner</text><text x="37" y="843" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="500" text-anchor="start">membrane</text><text x="38" y="902" font-family="system-ui,sans-serif" font-size="24" fill="#c0d0dc" font-weight="500" text-anchor="start">Before release: between the two membranes.</text><rect x="20" y="963" width="560" height="274" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="1005" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">3  Three endpoints, three questions</text><text x="43" y="1045" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Priming: mitochondrial response to challenge</text><text x="43" y="1078" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Death: separately measured intact-cell fate</text><text x="43" y="1111" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Benefit: clinical outcome in people</text><text x="43" y="1186" font-family="system-ui,sans-serif" font-size="25" fill="#f4a9c0" font-weight="500" text-anchor="start">No assay settings or treatment claim shown.</text></svg>
