<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Who made it into the organoid?</title><desc id="desc">Three schematic cards trace a mixed source specimen to a selected epithelial organoid in matrix and then an optional co-culture. Blue round epithelial cells organize around a lumen; rose immune cells and gold spindle-shaped stromal cells are missing from the pictured epithelial culture. Separate added immune and stromal cells enter a new experiment. Shapes and counts are invented, not measured composition. Self-organization does not recreate complete tissue, host immunity or rank model performance.</desc><metadata>Original hand-authored SVG by agent:/root/batch09_author_group3. No image model or generation service used. Private prospective illustration; independent and human review pending. All geometry schematic; toy values invented.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#486677"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="96" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="49" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">Who made it into</text><text x="32" y="85" font-size="32" font-weight="700" fill="#24343e" text-anchor="start">the organoid?</text><rect x="12" y="124" width="576" height="200" rx="12" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="163" font-size="30" font-weight="700" fill="#24343e" text-anchor="start">1  Start with mixed tissue</text><rect x="37" y="183" width="230" height="103" rx="12" fill="#e9edef" stroke="#486677" stroke-width="2"/><circle cx="70" cy="216" r="16" fill="#b7dce5" stroke="#486677" stroke-width="3"/><circle cx="73" cy="214" r="5.6" fill="#e9edef" stro