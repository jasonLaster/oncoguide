<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1380" viewBox="0 0 600 1380" role="img" aria-labelledby="title desc"><title id="title">What exactly did the model predict?</title><desc id="desc">Two fictional task panels show training/reference pairs and reserved tests. In measurement completion, an image from a held-out donor has missing RNA filled with a computed diamond. In intervention prediction, measured responses to familiar X inform a prediction for Y whose response was withheld from development. A final panel says donor and intervention holdouts test different claims, and computed outputs must be compared with independent measurements.</desc><rect x="5" y="5" width="590" height="1370" rx="20" fill="#0e1822" stroke="#0e1822" stroke-width="2"/><text x="30" y="46" font-family="system-ui,sans-serif" font-size="32" fill="#eef4f7" font-weight="700" text-anchor="start">What exactly did the model predict?</text><text x="30" y="83" font-family="system-ui,sans-serif" font-size="26" fill="#c0d0dc" font-weight="500" text-anchor="start">Fictional teaching scene; no clinical cutoff</text><rect x="20" y="112" width="560" height="405" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="154" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">1  Fill a missing observation</text><text x="43" y="198" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Training/reference: images paired with RNA</text><text x="43" y="231" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">from a defined measured population.</text><rect x="75" y="256" width="65" height="58" rx="7" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="108" cy="284" r="14" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><rect x="75" y="332" width="65" height="48" rx="7" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="107" y="364" font-family="system-ui,sans-serif" font-size="22" fill="#8ddbc3" font-weight="700" text-anchor="middle">RNA</text><rect x="185" y="256" width="65" height="58" rx="7" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="218" cy="284" r="14" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><rect x="185" y="332" width="65" height="48" rx="7" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="217" y="364" font-family="system-ui,sans-serif" font-size="22" fill="#8ddbc3" font-weight="700" text-anchor="middle">RNA</text><rect x="295" y="256" width="65" height="58" rx="7" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="328" cy="284" r="14" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><rect x="295" y="332" width="65" height="48" rx="7" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="327" y="364" font-family="system-ui,sans-serif" font-size="22" fill="#8ddbc3" font-weight="700" text-anchor="middle">RNA</text><rect x="435" y="256" width="65" height="58" rx="7" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="468" cy="284" r="14" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><path d="M468 330 L506 356 L468 382 L430 356 Z" fill="#413453" stroke="#cbb2ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="468" y="364" font-family="system-ui,sans-serif" font-size="22" fill="#cbb2ef" font-weight="700" text-anchor="middle">RNA</text><text x="408" y="408" font-family="system-ui,sans-serif" font-size="24" fill="#cbb2ef" font-weight="500" text-anchor="start">held-out donor</text><text x="43" y="447" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Output: computed missing RNA value.</text><text x="43" y="480" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Test: compare with masked measured RNA.</text><rect x="20" y="537" width="560" height="464" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="579" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">2  Forecast an unseen intervention</text><text x="43" y="623" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Training: measured responses to familiar X</text><text x="43" y="656" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">in the stated cell/reference population.</text><circle cx="109" cy="744" r="31" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><circle cx="104" cy="747" r="9.92" fill="#1d4b5b" stroke="#8bd6ec" stroke-width="2"/><text x="109" y="807" font-family="system-ui,sans-serif" font-size="24" fill="#8bd6ec" font-weight="700" text-anchor="middle">control</text><circle cx="276" cy="744" r="31" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><circle cx="271" cy="747" r="9.92" fill="#214a40" stroke="#8ddbc3" stroke-width="2"/><text x="276" y="807" font-family="system-ui,sans-serif" font-size="24" fill="#8ddbc3" font-weight="700" text-anchor="middle">X</text><path d="M342 687 L342 822" fill="none" stroke="#71899b" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="457" cy="744" r="31" fill="#413453" stroke="#cbb2ef" stroke-width="2"/><circle cx="452" cy="747" r="9.92" fill="#413453" stroke="#cbb2ef" stroke-width="2"/><text x="457" y="807" font-family="system-ui,sans-serif" font-size="24" fill="#cbb2ef" font-weight="700" text-anchor="middle">Y withheld</text><text x="43" y="870" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Output: computed Y response.</text><text x="43" y="903" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Y response unavailable during development.</text><text x="43" y="936" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Test later against reserved measured response.</text><rect x="20" y="1021" width="560" height="323" rx="18" fill="#182836" stroke="#71899b" stroke-width="2"/><text x="38" y="1063" font-family="system-ui,sans-serif" font-size="28" fill="#eef4f7" font-weight="700" text-anchor="start">3  Match the held-out unit to the claim</text><text x="43" y="1110" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">A new donor tests donor generalization.</text><text x="43" y="1143" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">A new intervention tests intervention transfer.</text><text x="43" y="1176" font-family="system-ui,sans-serif" font-size="25" fill="#c0d0dc" font-weight="500" text-anchor="start">Neither automatically tests a new cell type.</text><text x="43" y="1250" font-family="system-ui,sans-serif" font-size="25" fill="#f4a9c0" font-weight="500" text-anchor="start">Computed ≠ measured. Compare baselines</text><text x="43" y="1283" font-family="system-ui,sans-serif" font-size="25" fill="#f4a9c0" font-weight="500" text-anchor="start">and retain population, task and version.</text></svg>
