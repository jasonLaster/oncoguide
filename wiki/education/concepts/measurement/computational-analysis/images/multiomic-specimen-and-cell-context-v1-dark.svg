<circle cx="191.99999999999994" cy="592.0577136594005" r="5.28" fill="#c4a2d5"/>
<circle cx="282.0" cy="592.0577136594005" r="24" fill="#223a3e" stroke="#95c9b4" stroke-width="4"/>
<circle cx="282.0" cy="592.0577136594005" r="5.28" fill="#c4a2d5"/>
