<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">Keep specimen and cell location with each layer</title><desc id="desc">In the original fictional Target Q example, specimen S at time T1 supplies a bulk-RNA measurement and a protein image; they are paired at specimen level, not identical single-cell observations. The mixed sample includes normal vessel cells with Q protein seen mainly there, and malignant cells whose accessible target remains unresolved. A dashed imputed value is labeled as model-estimated, not measured. A separate different specimen or time is not a paired observation. No model or target assay was executed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c0d0ca"/></marker></defs>
<rect x="0" y="0" width="780" height="1360" rx="0" fill="#192b2f" />
<text x="40" y="61" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Track origin, location and evidence</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Fictional Target Q example</tspan></text>
<rect x="24" y="145" width="732" height="280" rx="18" fill="#223a3e" stroke="#66827a" stroke-width="2" />
<text x="47" y="200" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="47" dy="0">1. Paired at specimen level</tspan></text>
<text x="47" y="242" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="47" dy="0">Specimen S • time T1</tspan></text>
<path d="M220 266 L148 315" fill="none" stroke="#c0d0ca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<path d="M320 266 L496 315" fill="none" stroke="#c0d0ca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="70" y="367" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="70" dy="0">Bulk RNA:</tspan><tspan x="70" dy="45">Q abundant</tspan></text>
<text x="412" y="367" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="412" dy="0">Tissue image:</tspan><tspan x="412" dy="45">Q location</tspan></text>
<rect x="24" y="450" width="732" height="445" rx="18" fill="#223a3e" stroke="#66827a" stroke-width="2" />
<text x="47" y="505" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="47" dy="0">2. Locate the protein signal in cells</tspan></text>
<ellipse cx="237" cy="670" rx="117" ry="116" fill="#405d6c" stroke="#9fcadd" stroke-width="3"/>
<ellipse cx="237" cy="670" rx="64" ry="61" fill="#223a3e" stroke="#9fcadd" stroke-width="3"/>
