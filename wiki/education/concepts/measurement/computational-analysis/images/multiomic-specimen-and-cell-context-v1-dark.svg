<text x="48" y="837" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Normal vessel cells:</tspan><tspan x="48" dy="45">Q protein seen</tspan></text>
<text x="433" y="837" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="433" dy="0">Malignant cells:</tspan><tspan x="433" dy="45">accessible Q?</tspan></text>
<rect x="24" y="920" width="732" height="260" rx="18" fill="#223a3e" stroke="#66827a" stroke-width="2" />
<text x="47" y="975" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="47" dy="0">3. Measured or model-estimated?</tspan></text>
<rect x="52" y="1014" width="667" height="54" rx="12" fill="none" stroke="#c4a2d5" stroke-width="2" stroke-dasharray="10 8"/>
<text x="75" y="1052" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="75" dy="0">Imputed Q = model estimate</tspan></text>
<text x="47" y="1139" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="47" dy="0">Other specimen / time ≠ paired evidence.</tspan></text>
<text x="40" y="1240" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Protein image ≠ RNA-cell location.</tspan><tspan x="40" dy="48">Malignant-cell accessible Q is unresolved.</tspan></text>
</svg>
