<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc"><title id="title">A percentile rank locates a model score; a predicted concentration describes another output.</title><desc id="desc">Fictional NetMHCpan-4.1-style EL reference histogram has 1000 peptide scores and a four-peptide stronger-scoring tail illustrating 0.4 percent rank. Predicted binding IC50 of 40 nanomolar is a separate BA output, not observed presentation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9bafc2"/></marker></defs>
