<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">BRCAness: a resemblance that needs evidence</title><desc id="desc">Two explicitly labeled tumor-sample time points separate cause, history and function. Earlier repair disruption accompanies historical scar marks and assay evidence of impairment. A possible transition during tumor evolution leads to a later restoration mechanism and current RAD51 foci, while the identical old scar marks remain. This is a possible selected-study transition, not a universal frequency; scores and functional assays retain method and time conditions and do not establish inheritance or guaranteed drug response.</desc><rect width="600" height="1000" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#233344" font-weight="700" text-anchor="start">Old scars, a new repair state</text><text x="28" y="86" font-size="26" fill="#46586a" font-weight="400" text-anchor="start">Three questions. Two time points.</text><rect x="24" y="112" width="552" height="296" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="44" y="148" font-size="28" fill="#233344" font-weight="700" text-anchor="start">Time 1 · earlier tumor sample</text><text x="44" y="194" font-size="26" fill="#6b4387" font-weight="700" text-anchor="start">Cause</text><text x="175" y="194" font-size="26" fill="#233344" font-weight="400" text-anchor="start">Repair pathway disrupted</text><text x="44" y="247" font-size="26" fill="#6b4387" font-weight="700" text-anchor="start">History</text><path d="M190 252 L302 252" fill="none" stroke="#6b4387" stroke-width="12" stroke-dasharray=""/><path d="M212 239 L220 265" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><path d="M247 239 L255 265" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><path d="M278 239 L286 265" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><text x="328" y="260" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Scars accumulate</text><text x="44" y="313" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">Function</text><circle cx="204" cy="352" r="28" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="204" cy="352" r="15.400000000000002" fill="#ffffff" stroke="#176c69" stroke-width="2"/><text x="251" y="338" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Evidence of impaired repair</text><text x="251" y="370" font-size="24" fill="#233344" font-weight="400" text-anchor="start">under the assay conditions</text><path d="M300 408 L300 426" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><rect x="51" y="426" width="498" height="49" rx="12" fill="#fffdf8" stroke="#b8c5ce" stroke-width="2"/><text x="300" y="458" font-size="24" fill="#46586a" font-weight="500" text-anchor="middle">Possible change during evolution</text><path d="M300 475 L300 491" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M293 481 L300 491 L307 481" fill="none" stroke="#46586a" stroke-width="3"/><rect x="24" y="494" width="552" height="298" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="44" y="531" font-size="28" fill="#233344" font-weight="700" text-anchor="start">Time 2 · later tumor sample</text><text x="44" y="578" font-size="26" fill="#6b4387" font-weight="700" text-anchor="start">Cause</text><text x="175" y="578" font-size="24" fill="#233344" font-weight="400" text-anchor="start">A restoration mechanism</text><text x="175" y="610" font-size="24" fill="#233344" font-weight="400" text-anchor="start">may now be present</text><text x="44" y="647" font-size="26" fill="#6b4387" font-weight="700" text-anchor="start">History</text><path d="M190 643 L302 643" fill="none" stroke="#6b4387" stroke-width="12" stroke-dasharray=""/><path d="M212 630 L220 656" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><path d="M247 630 L255 656" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><path d="M278 630 L286 656" fill="none" stroke="#a54218" stroke-width="4" stroke-dasharray=""/><text x="328" y="651" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Old scars remain</text><text x="44" y="712" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">Function</text><circle cx="204" cy="750" r="28" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="204" cy="750" r="15.400000000000002" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="196" cy="744" r="3" fill="#176c69" stroke="#176c69" stroke-width="2"/><circle cx="211" cy="742" r="3" fill="#176c69" stroke="#176c69" stroke-width="2"/><circle cx="206" cy="758" r="3" fill="#176c69" stroke="#176c69" stroke-width="2"/><text x="251" y="738" font-size="24" fill="#233344" font-weight="400" text-anchor="start">RAD51 foci can support</text><text x="251" y="770" font-size="24" fill="#233344" font-weight="400" text-anchor="start">current repair activity</text><rect x="24" y="816" width="552" height="160" rx="20" fill="#edf4f1" stroke="#b8c5ce" stroke-width="2"/><text x="42" y="850" font-size="24" fill="#233344" font-weight="500" text-anchor="start">One possible transition in selected studies.</text><text x="42" y="882" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Scores and assays keep their method + time.</text><text x="42" y="914" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Scars do not establish inheritance or</text><text x="42" y="946" font-size="24" fill="#233344" font-weight="500" text-anchor="start">guarantee a drug response.</text></g></svg>
