<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">TNM staging</title><desc id="desc">Attach specimen collection and treatment timing to clinical and pathological prefixes rather than a later report date. Original schematics and explicitly fictional teaching examples; not diagnostic source slides or patient findings.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#18333e"/></marker><radialGradient id="cell"><stop offset="0" stop-color="#f4c4ca"/><stop offset="1" stop-color="#d88b9b"/></radialGradient></defs><rect width="600" height="1000" fill="#fbf7ed"/>
<text x="28" y="44" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#18333e" text-anchor="start">Collection time stays with the evidence</text>
<text x="28" y="85" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Illustrative paths; timing is not a care plan</text>
<rect x="47" y="133" width="73" height="83" rx="8" fill="#dce8e9" stroke="#18333e" stroke-width="2"/>
<rect x="60" y="117" width="47" height="16" rx="3" fill="#d8bd8b" stroke="#18333e" stroke-width="2"/>
<text x="83" y="184" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#18333e" text-anchor="middle">B</text>
<text x="145" y="154" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Pretreatment biopsy collected</text>
<text x="145" y="196" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">Clinical record: c</text>
<path d="M300 223 L300 256" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round"/>
<path d="M160 256 L443 256" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round"/>
<path d="M160 256 L160 275" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M443 256 L443 275" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="22" y="286" width="264" height="390" rx="12" fill="#fffdf8" stroke="#879fa9" stroke-width="2"/>
<rect x="314" y="286" width="264" height="390" rx="12" fill="#fffdf8" stroke="#879fa9" stroke-width="2"/>
<text x="42" y="328" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Surgery first</text>
<text x="42" y="375" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Surgical specimen</text>
<text x="42" y="415" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">Assessment: p</text>
<rect x="69" y="448" width="170" height="90" rx="8" fill="#dce8e9" stroke="#18333e" stroke-width="2"/>
<ellipse cx="152" cy="491" rx="42" ry="25" fill="#e6a0aa" stroke="#18333e" stroke-width="2"/>
<text x="42" y="590" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Keep the operation</text>
<text x="42" y="630" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">and tissue context</text>
<text x="330" y="327" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Neoadjuvant</text>
<text x="330" y="366" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">treatment</text>
<path d="M442 386 L442 409" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="330" y="445" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Clinical check: yc</text>
<path d="M442 467 L442 490" fill="none" stroke="#18333e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="330" y="526" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Tissue record: yp</text>
<rect x="359" y="549" width="168" height="69" rx="8" fill="#dce8e9" stroke="#18333e" stroke-width="2"/>
<ellipse cx="443" cy="583" rx="32" ry="18" fill="#e6a0aa" stroke="#18333e" stroke-width="2"/>
<rect x="22" y="713" width="556" height="224" rx="12" fill="#fffdf8" stroke="#879fa9" stroke-width="2"/>
<text x="42" y="755" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">Later addendum for biopsy B</text>
<rect x="53" y="779" width="61" height="78" rx="5" fill="#dce8e9" stroke="#18333e" stroke-width="2"/>
<text x="83" y="829" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#18333e" text-anchor="middle">B</text>
<text x="142" y="805" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18333e" text-anchor="start">Still the old specimen</text>
<text x="142" y="848" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Not a residual surgical sample</text>
<text x="42" y="900" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">A later issue date does not supply yp.</text>
<path d="M121 168 H588 V749 H565" fill="none" stroke="#879fa9" stroke-width="2" stroke-linecap="round"/>
<text x="28" y="980" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Retain each assessment’s own timing.</text>
</svg>
