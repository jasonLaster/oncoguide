<text x="404" y="685" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="404" dy="0">&gt;10% tumor cells</tspan><tspan x="404" dy="44">Negative IHC</tspan></text>
<text x="155" y="761" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="155" dy="0">Faint • Incomplete</tspan></text>
<rect x="24" y="821" width="732" height="174" rx="22" fill="#fffdf8" stroke="#c9c9bd" stroke-width="2"/>
<text x="47" y="889" fill="#293c40" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="47" dy="0">2+</tspan></text>
