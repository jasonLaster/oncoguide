<text x="404" y="493" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="404" dy="0">≤10% tumor cells</tspan><tspan x="404" dy="44">Negative IHC</tspan></text>
<text x="155" y="569" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="155" dy="0">Faint • Incomplete</tspan></text>
<rect x="24" y="629" width="732" height="174" rx="22" fill="#fffdf8" stroke="#c9c9bd" stroke-width="2"/>
<text x="47" y="697" fill="#293c40" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="47" dy="0">1+</tspan></text>
<circle cx="215" cy="695" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
<circle cx="215" cy="695" r="12" fill="#c0d7e0"/>
