<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1510" viewBox="0 0 780 1510" role="img" aria-labelledby="title desc"><title id="title">HER2 IHC: three separate features</title><desc id="desc">Five illustrative membrane-pattern rows for CAP September 2026 scores 0, 0+, 1+, 2+ and 3+. Representative cells show absent, faint incomplete, weak-to-moderate complete and intense complete membrane stain. Separate text gives the fraction of tumor cells with that pattern; drawn cells are magnified examples, not a counted field. Integrated status and treatment eligibility require their own interpretation.</desc>
<defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4d7f72"/></marker><marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52676a"/></marker></defs>
<rect x="0" y="0" width="780" height="1510" rx="0" fill="#faf5eb"/>
<text x="40" y="65" fill="#293c40" font-family="Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start"><tspan x="40" dy="0">HER2 IHC: three features</tspan></text>
<text x="40" y="112" fill="#52676a" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Completeness • intensity • extent</tspan></text>
<text x="40" y="165" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Brown = membrane stain; gray = outline.</tspan><tspan x="40" dy="42">Cells show patterns, not a counted field.</tspan></text>
<rect x="24" y="245" width="732" height="174" rx="22" fill="#fffdf8" stroke="#c9c9bd" stroke-width="2"/>
<text x="47" y="313" fill="#293c40" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="47" dy="0">0</tspan></text>
<circle cx="215" cy="311" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
<circle cx="215" cy="311" r="12" fill="#c0d7e0"/>
