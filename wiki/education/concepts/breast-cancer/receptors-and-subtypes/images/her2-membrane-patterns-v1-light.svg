<text x="404" y="877" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="404" dy="0">&gt;10% tumor cells</tspan><tspan x="404" dy="44">Equivocal IHC</tspan></text>
<text x="155" y="953" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="155" dy="0">Weak–moderate • Complete</tspan></text>
<rect x="24" y="1013" width="732" height="174" rx="22" fill="#fffdf8" stroke="#c9c9bd" stroke-width="2"/>
<text x="47" y="1081" fill="#293c40" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="47" dy="0">3+</tspan></text>
<circle cx="215" cy="1079" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
<circle cx="215" cy="1079" r="12" fill="#c0d7e0"/>
<circle cx="215" cy="1079" r="43" fill="none" stroke="#57331e" stroke-width="11"/>
<circle cx="319" cy="1079" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
<circle cx="319" cy="1079" r="12" fill="#c0d7e0"/>
<circle cx="319" cy="1079" r="43" fill="none" stroke="#57331e" stroke-width="11"/>
<text x="404" y="1069" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="404" dy="0">&gt;10% tumor cells*</tspan><tspan x="404" dy="44">Positive IHC</tspan></text>
<text x="155" y="1145" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="155" dy="0">Intense • Complete</tspan></text>
<text x="40" y="1252" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="40" dy="0">*3+: homogeneous, contiguous population.</tspan><tspan x="40" dy="42">2+ here shows one common pattern.</tspan></text>
<text x="40" y="1350" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Use full rules, controls and workup.</tspan><tspan x="40" dy="42">A score is not a drug-benefit prediction.</tspan><tspan x="40" dy="42">CAP reporting template • September 2026</tspan></text>
</svg>
