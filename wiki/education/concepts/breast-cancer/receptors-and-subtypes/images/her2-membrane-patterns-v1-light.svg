<circle cx="319" cy="311" r="12" fill="#c0d7e0"/>
<text x="404" y="301" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="404" dy="0">Absent staining</tspan><tspan x="404" dy="44">Negative IHC</tspan></text>
<text x="155" y="377" fill="#293c40" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="155" dy="0">No membrane stain detected</tspan></text>
<rect x="24" y="437" width="732" height="174" rx="22" fill="#fffdf8" stroke="#c9c9bd" stroke-width="2"/>
<text x="47" y="505" fill="#293c40" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="47" dy="0">0+</tspan></text>
<circle cx="215" cy="503" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
<circle cx="215" cy="503" r="12" fill="#c0d7e0"/>
<path d="M178 483 A43 43 0 0 1 242 469" fill="none" stroke="#ba936b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="319" cy="503" r="43" fill="#f1e5cc" stroke="#c9c9bd" stroke-width="3"/>
