<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" role="img" aria-labelledby="diagram-title diagram-desc" lang="en">
<title id="diagram-title">Living cells or matrix? Normal breast duct layers</title>
<desc id="diagram-desc">A normal breast duct cross-section has a central lumen, inner luminal cells, outer myoepithelial cells, a separate extracellular basement-membrane band and surrounding stroma. A magnified inset shows one myoepithelial cell’s plasma membrane beside the separate matrix layer.</desc>
<!-- Original editable schematic. Quantities, shape and thicknesses are illustrative. No stain result. -->
<defs>
 <pattern id="basement-texture" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#baa270"/><path d="M-2 13 Q5 3 16 1 M-2 5 Q7 13 16 7" fill="none" stroke="#6d512f" stroke-width="1.4"/></pattern>
 <pattern id="stroma-texture" width="76" height="52" patternUnits="userSpaceOnUse"><rect width="76" height="52" fill="#344046"/><path d="M-6 19 Q25 2 80 18 M-6 37 Q30 19 82 34" fill="none" stroke="#77807d" stroke-width="1.7" opacity=".55"/></pattern>
 <style>.label{font-family:Arial,Helvetica,sans-serif;fill:#eff2e9;font-weight:600} .leader{fill:none;stroke:#eff2e9;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round} .endpoint{fill:#eff2e9}</style>
</defs>
<rect width="600" height="1000" rx="18" fill="#17242a"/>
