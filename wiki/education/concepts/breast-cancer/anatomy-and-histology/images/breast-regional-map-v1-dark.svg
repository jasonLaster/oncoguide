<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1720" viewBox="0 0 780 1720" role="img" aria-labelledby="title desc"><title id="title">Where breast lymph drains</title><desc id="desc">Illustrative left-breast front view with internal mammary nodes beside sternum, an intramammary node within breast and axillary nodes at armpit. An enlarged front projection places levels I, II and III relative to pectoralis minor and clavicle. Dashed arrows indicate possible drainage, not cancer involvement or a personal sentinel map.</desc>
