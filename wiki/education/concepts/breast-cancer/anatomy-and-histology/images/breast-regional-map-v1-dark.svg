<text x="40" y="1580" fill="#f5eddc" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Levels are locations, not cancer stages.</tspan><tspan x="40" dy="40">A tracer maps drainage; pathology tests</tspan><tspan x="40" dy="40">the nodes actually sampled.</tspan></text>
