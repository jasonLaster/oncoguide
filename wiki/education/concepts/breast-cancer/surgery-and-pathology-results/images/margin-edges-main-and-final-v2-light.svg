<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="art-title art-description"><title id="art-title">Which edge is final?</title><desc id="art-description">Panel 1 of 2. Fictional tissue schematics show invasive cells at the original lateral ink of a main specimen and at the final outer ink of a separate, confirmed lateral strip. An orientation inset keeps the specimens separate, with the old-facing surface distinct from the final outer edge. Continue to panel 2 for DCIS near versus at ink.</desc><style>:root{color:#18353c}
text{fill:#18353c;font-family:Arial,Helvetica,sans-serif}
.title{font-weight:700;letter-spacing:-.3px}.section{font-weight:700}.note{font-weight:400}.label{font-weight:500}
