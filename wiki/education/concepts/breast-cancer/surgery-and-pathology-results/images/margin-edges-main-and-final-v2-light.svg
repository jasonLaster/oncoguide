.grid{stroke:#a3b2b4;stroke-width:.9;stroke-dasharray:2 5;fill:none}.axis{stroke:#a3b2b4;stroke-width:1;fill:none}
.planned{fill:#fffdf9;stroke:#54768e;stroke-width:2.5}.administered{fill:#54768e;stroke:#18353c;stroke-width:1}.held{fill:#fffdf9;stroke:#604e73;stroke-width:2.5}
