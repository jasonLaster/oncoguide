<rect x="20" y="840" width="560" height="420" rx="20" fill="#fffdf7" stroke="#b9c8c4" stroke-width="2"/>
<text x="40" y="883" fill="#19363e" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Keep the definitions attached</text>
<text x="40" y="929" fill="#19363e" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">1 · Fibrous bed: altered tissue region</text>
<text x="40" y="979" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">2 · ypT: largest contiguous invasive focus</text>
<text x="40" y="1025" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">3 · RCB: two-dimensional residual span</text>
<text x="40" y="1061" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Includes separated invasive foci; blue bars.</text>
<text x="40" y="1120" fill="#19363e" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Cellularity is a separate area question.</text>
<text x="40" y="1162" fill="#19363e" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">A broad scar can still contain cancer.</text>
<text x="40" y="1204" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Sampling and microscopy define the map.</text>
<text x="28" y="1320" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">ypT: post-treatment pathologic T category</text>
<text x="28" y="1355" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">RCB: residual cancer burden; no score shown</text>
</svg>
