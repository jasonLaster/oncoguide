<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="art-title art-description"><title id="art-title">Near ink, or at ink?</title><desc id="art-description">Panel 2 of 2. Two fictional tissue insets contrast DCIS 0.7 mm from ink with DCIS reaching the cut ink of a transected duct. The distance is not to scale, and distance alone does not choose an operation. Panel 1 shows the separate main and additional specimens.</desc><style>:root{color:#18353c}
text{fill:#18353c;font-family:Arial,Helvetica,sans-serif}
.title{font-weight:700;letter-spacing:-.3px}.section{font-weight:700}.note{font-weight:400}.label{font-weight:500}
.muted{fill:#506269}.panel{fill:#fffdf9;stroke:#a3b2b4;stroke-width:1}
.tissue{fill:#eee0c5;stroke:#c6b99e;stroke-width:1.5}.fiber{fill:none;stroke:#c6b99e;stroke-width:1.1}
.leader{fill:none;stroke:#18353c;stroke-width:1.4}.reference{fill:none;stroke:#54768e;stroke-width:1.6;stroke-dasharray:5 4}
.inkedge{fill:none;stroke:#18353c;stroke-width:4}.oldedge{fill:none;stroke:#18353c;stroke-width:3;stroke-dasharray:6 4}
.invasive{fill:#c76d60;stroke:#633c40;stroke-width:1.2}.nucleus{fill:#633c40}
.duct{fill:#d7b8a6;stroke:#604e73;stroke-width:1.6}.lumen{fill:#fffdf9;stroke:#604e73;stroke-width:1.2}
.situ{fill:url(#situ-hatch);stroke:#604e73;stroke-width:1.2}.node{fill:#b5c5b5;stroke:#507167;stroke-width:1.8}
.grid{stroke:#a3b2b4;stroke-width:.9;stroke-dasharray:2 5;fill:none}.axis{stroke:#a3b2b4;stroke-width:1;fill:none}
.planned{fill:#fffdf9;stroke:#54768e;stroke-width:2.5}.administered{fill:#54768e;stroke:#18353c;stroke-width:1}.held{fill:#fffdf9;stroke:#604e73;stroke-width:2.5}
.soft{fill:#e9eff1;stroke:none}.bracket{fill:none;stroke:#18353c;stroke-width:1.3}</style><defs><pattern id="situ-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#a989b1"/><path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#604e73" stroke-width="1.1"/></pattern><marker id="reference-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54768e"/></marker></defs><rect width="360" height="800" fill="#fbf8f2"/><text x="24" y="30" class="section" font-size="17" text-anchor="start">Margins · panel 2 of 2</text><g transform="translate(0 -570)"><text x="24" y="644" class="section" font-size="21.0" text-anchor="start">Near ink, or at ink?</text><text x="24" y="675" class="section" font-size="17.0" text-anchor="start">DCIS near ink</text><rect x="24" y="695" width="312" height="164" rx="12" class="panel"/><rect x="40" y="712" width="264" height="110" rx="6" class="tissue"/><ellipse cx="133" cy="764" rx="65" ry="42" class="duct"/><ellipse cx="133" cy="764" rx="56" ry="34" class="lumen"/><ellipse cx="113" cy="763" rx="15" ry="17" class="situ"/><ellipse cx="140" cy="753" rx="15" ry="17" class="situ"/><ellipse cx="160" cy="773" rx="15" ry="17" class="situ"/><line id="close-inset-ink" x1="304" y1="711" x2="304" y2="835" class="inkedge"/><text x="49" y="738" class="label" font-size="15.5" text-anchor="start">Duct</text><line x1="81" y1="742" x2="83" y2="745" class="leader"/><line x1="175" y1="773" x2="175" y2="835" class="reference"/><line x1="175" y1="835" x2="304" y2="835" class="leader"/><line x1="175" y1="830" x2="175" y2="840" class="leader"/><line x1="304" y1="830" x2="304" y2="840" class="leader"/><text x="239.5" y="857" class="label" font-size="15.5" text-anchor="middle">0.7 mm</text><text x="24" y="889" class="section" font-size="17.0" text-anchor="start">Not at ink: narrow negative</text><text x="24" y="919" class="muted" font-size="15.5" text-anchor="start">Distance shown is not to scale.</text><text x="24" y="963" class="section" font-size="17.0" text-anchor="start">DCIS at ink</text><rect x="24" y="982" width="312" height="177" rx="12" class="panel"/><rect x="40" y="1000" width="264" height="115" rx="6" class="tissue"/><defs><clipPath id="margin-cut-clip"><rect x="40" y="1000" width="264" height="115"/></clipPath></defs><g clip-path="url(#margin-cut-clip)" id="transected-duct"><ellipse cx="279" cy="1057" rx="65" ry="44" class="duct"/><ellipse cx="279" cy="1057" rx="56" ry="36" class="lumen"/><ellipse cx="282" cy="1053" rx="25" ry="22" class="situ"/><ellipse cx="302" cy="1072" rx="17" ry="18" class="situ"/></g><line id="at-inset-ink" x1="304" y1="1000" x2="304" y2="1115" class="inkedge"/><text x="56" y="1037" class="label" font-size="15.5" text-anchor="start">Duct cut</text><text x="56" y="1058" class="label" font-size="15.5" text-anchor="start">at this edge</text><line x1="159" y1="1049" x2="304" y2="1049" class="leader"/><text x="24" y="1191" class="section" font-size="17.0" text-anchor="start">Cancer reaches the inked cut.</text><text x="24" y="1244" class="muted" font-size="15.5" text-anchor="start">DCIS = ductal carcinoma in situ.</text><text x="24" y="1266" class="muted" font-size="15.5" text-anchor="start">Hatching identifies the in situ example.</text><text x="24" y="1308" class="label" font-size="16.0" text-anchor="start">Distance alone does not choose</text><text x="24" y="1330" class="label" font-size="16.0" text-anchor="start">an operation.</text></g><text x="24" y="780" class="muted" font-size="15.5" text-anchor="start">See panel 1 for specimen orientation.</text></svg>
