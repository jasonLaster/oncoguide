<svg xmlns="http://www.w3.org/2000/svg" width="360" height="865" viewBox="0 0 360 865" role="img" aria-labelledby="art-title art-description"><title id="art-title">Read the response components</title><desc id="art-description">Panel 1 of 2. Two fictional post-treatment assessments of the complete resected breast and all sampled regional nodes share no residual invasive breast cancer and residual DCIS. Only the nodal finding changes: case A has no residual nodal cancer found, and case B has a fictional 4 mm invasive deposit. Continue to panel 2 for both response definitions and the separate margin question.</desc><style>:root{color:#edf1e8}
text{fill:#edf1e8;font-family:Arial,Helvetica,sans-serif}
.title{font-weight:700;letter-spacing:-.3px}.section{font-weight:700}.note{font-weight:400}.label{font-weight:500}
.muted{fill:#bdcbcd}.panel{fill:#223238;stroke:#667c82;stroke-width:1}
.tissue{fill:#625e50;stroke:#87806c;stroke-width:1.5}.fiber{fill:none;stroke:#87806c;stroke-width:1.1}
.leader{fill:none;stroke:#edf1e8;stroke-width:1.4}.reference{fill:none;stroke:#a4bfce;stroke-width:1.6;stroke-dasharray:5 4}
.inkedge{fill:none;stroke:#edf1e8;stroke-width:4}.oldedge{fill:none;stroke:#edf1e8;stroke-width:3;stroke-dasharray:6 4}
.invasive{fill:#d78d7c;stroke:#583940;stroke-width:1.2}.nucleus{fill:#583940}
.duct{fill:#ab8a78;stroke:#ece1f2;stroke-width:1.6}.lumen{fill:#223238;stroke:#ece1f2;stroke-width:1.2}
.situ{fill:url(#situ-hatch);stroke:#ece1f2;stroke-width:1.2}.node{fill:#698b78;stroke:#b4cdbf;stroke-width:1.8}
.grid{stroke:#667c82;stroke-width:.9;stroke-dasharray:2 5;fill:none}.axis{stroke:#667c82;stroke-width:1;fill:none}
.planned{fill:#223238;stroke:#a4bfce;stroke-width:2.5}.administered{fill:#a4bfce;stroke:#edf1e8;stroke-width:1}.held{fill:#223238;stroke:#ece1f2;stroke-width:2.5}
.soft{fill:#2f434b;stroke:none}.bracket{fill:none;stroke:#edf1e8;stroke-width:1.3}</style><defs><pattern id="situ-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ad95bd"/><path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#ece1f2" stroke-width="1.1"/></pattern><marker id="reference-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a4bfce"/></marker></defs><rect width="360" height="865" fill="#1a272c"/><text x="24" y="36" class="title" font-size="23.0" text-anchor="start">Read the components,</text><text x="24" y="65" class="title" font-size="23.0" text-anchor="start">then apply definitions</text><text x="24" y="100" class="muted" font-size="15.5" text-anchor="start">Fictional post-treatment · 1 of 2</text><text x="24" y="133" class="section" font-size="16.0" text-anchor="start">Complete resected breast</text><text x="24" y="157" class="section" font-size="15.5" text-anchor="start">All sampled regional nodes assessed</text><text x="102" y="204" class="section" font-size="20.0" text-anchor="middle">Case A</text><text x="258" y="204" class="section" font-size="20.0" text-anchor="middle">Case B</text><text x="102" y="228" class="label" font-size="15.5" text-anchor="middle">Original findings</text><text x="258" y="228" class="label" font-size="15.5" text-anchor="middle">Change one node</text><text x="24" y="180" font-size="15.5" class="muted">Schematic; not to scale.</text><g transform="translate(0 -20)"><text x="24" y="271" class="section" font-size="18.0" text-anchor="start">Breast invasive finding</text><g id="breast-invasive-A" data-identical-group="breast-invasive" transform="translate(43 291)"><path d="M7 18Q35 4 70 15L112 11Q118 42 109 75L10 77Q-1 57 7 18Z" class="tissue"/><path d="M23 31q11 -6 25 2M62 44q18 -8 30 0M18 65q15 -8 33 -2" class="fiber"/></g><text x="102" y="396" class="label" font-size="16.0" text-anchor="middle">No residual</text><text x="102" y="418" class="label" font-size="16.0" text-anchor="middle">invasive cancer</text><g id="breast-invasive-B" data-identical-group="breast-invasive" transform="translate(199 291)"><path d="M7 18Q35 4 70 15L112 11Q118 42 109 75L10 77Q-1 57 7 18Z" class="tissue"/><path d="M23 31q11 -6 25 2M62 44q18 -8 30 0M18 65q15 -8 33 -2" class="fiber"/></g><text x="258" y="396" class="label" font-size="16.0" text-anchor="middle">No residual</text><text x="258" y="418" class="label" font-size="16.0" text-anchor="middle">invasive cancer</text></g><g transform="translate(0 -50)"><text x="24" y="471" class="section" font-size="18.0" text-anchor="start">Breast in situ finding</text><g id="breast-dcis-A" data-identical-group="breast-dcis" transform="translate(43 494)"><ellipse cx="59" cy="48" rx="46" ry="37" class="duct"/><ellipse cx="59" cy="48" rx="39" ry="30" class="lumen"/><ellipse cx="43" cy="50" rx="13" ry="15" class="situ"/><ellipse cx="62" cy="37" rx="13" ry="14" class="situ"/><ellipse cx="75" cy="56" rx="12" ry="14" class="situ"/></g><text x="102" y="602" class="label" font-size="16.0" text-anchor="middle">Residual DCIS</text><g id="breast-dcis-B" data-identical-group="breast-dcis" transform="translate(199 494)"><ellipse cx="59" cy="48" rx="46" ry="37" class="duct"/><ellipse cx="59" cy="48" rx="39" ry="30" class="lumen"/><ellipse cx="43" cy="50" rx="13" ry="15" class="situ"/><ellipse cx="62" cy="37" rx="13" ry="14" class="situ"/><ellipse cx="75" cy="56" rx="12" ry="14" class="situ"/></g><text x="258" y="602" class="label" font-size="16.0" text-anchor="middle">Residual DCIS</text></g><g transform="translate(0 -80)"><text x="24" y="657" class="section" font-size="18.0" text-anchor="start">Sampled regional nodes</text><g id="node-A" transform="translate(43 681)"><path d="M11 24Q19 0 58 7Q106 7 115 38Q111 75 75 84Q30 90 11 62Q1 47 11 24Z" class="node"/><path d="M23 26Q46 12 86 24M19 55Q42 78 76 68" class="fiber"/></g><g id="node-B" transform="translate(199 681)"><path d="M11 24Q19 0 58 7Q106 7 115 38Q111 75 75 84Q30 90 11 62Q1 47 11 24Z" class="node"/><path d="M23 26Q46 12 86 24M19 55Q42 78 76 68" class="fiber"/><g><circle cx="61" cy="38" r="8" class="invasive"/><circle cx="60" cy="38" r="2.56" class="nucleus"/></g><g><circle cx="74" cy="48" r="8" class="invasive"/><circle cx="73" cy="48" r="2.56" class="nucleus"/></g><g><circle cx="62" cy="59" r="8" class="invasive"/><circle cx="61" cy="59" r="2.56" class="nucleus"/></g><g><circle cx="47" cy="51" r="8" class="invasive"/><circle cx="46" cy="51" r="2.56" class="nucleus"/></g></g><text x="102" y="798" class="label" font-size="16.0" text-anchor="middle">No residual</text><text x="102" y="820" class="label" font-size="16.0" text-anchor="middle">cancer found</text><text x="258" y="798" class="label" font-size="16.0" text-anchor="middle">Residual invasive</text><text x="258" y="820" class="label" font-size="16.0" text-anchor="middle">deposit</text><text x="258" y="847" class="label" font-size="15.5" text-anchor="middle">4 mm (fictional)</text><path d="M102 867V881H258V867" class="bracket"/><text x="180" y="902" class="section" font-size="16.0" text-anchor="middle">Only the node finding changes</text></g><text x="24" y="853" class="muted" font-size="15.5" text-anchor="start">Next: same cases, two definitions.</text></svg>
