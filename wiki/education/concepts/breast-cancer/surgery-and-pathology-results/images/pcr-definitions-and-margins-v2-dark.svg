<svg xmlns="http://www.w3.org/2000/svg" width="360" height="835" viewBox="0 0 360 835" role="img" aria-labelledby="art-title art-description"><title id="art-title">Apply both response definitions</title><desc id="art-description">Panel 2 of 2. The same fictional post-treatment cases share no residual invasive breast cancer, residual DCIS and identical DCIS at final ink. Case A has no residual nodal cancer found; case B has a fictional 4 mm invasive nodal deposit. A meets ypT0/Tis ypN0 but not ypT0 ypN0; B meets neither. Response does not settle margins or mean cure. Panel 1 shows the breast and nodal components.</desc><style>:root{color:#edf1e8}
text{fill:#edf1e8;font-family:Arial,Helvetica,sans-serif}
.title{font-weight:700;letter-spacing:-.3px}.section{font-weight:700}.note{font-weight:400}.label{font-weight:500}
.muted{fill:#bdcbcd}.panel{fill:#223238;stroke:#667c82;stroke-width:1}
.tissue{fill:#625e50;stroke:#87806c;stroke-width:1.5}.fiber{fill:none;stroke:#87806c;stroke-width:1.1}
.leader{fill:none;stroke:#edf1e8;stroke-width:1.4}.reference{fill:none;stroke:#a4bfce;stroke-width:1.6;stroke-dasharray:5 4}
.inkedge{fill:none;stroke:#edf1e8;stroke-width:4}.oldedge{fill:none;stroke:#edf1e8;stroke-width:3;stroke-dasharray:6 4}
.invasive{fill:#d78d7c;stroke:#583940;stroke-width:1.2}.nucleus{fill:#583940}
.duct{fill:#ab8a78;stroke:#ece1f2;stroke-width:1.6}.lumen{fill:#223238;stroke:#ece1f2;stroke-width:1.2}
.situ{fill:url(#situ-hatch);stroke:#ece1f2;stroke-width:1.2}.node{fill:#698b78;stroke:#b4cdbf;stroke-width:1.8}
.grid{stroke:#667c82;stroke-width:.9;stroke-dasharray:2 5;fill:none}.axis{stroke:#667c82;stroke-width:1;fill:none}
.planned{fill:#223238;stroke:#a4bfce;stroke-width:2.5}.administered{fill:#a4bfce;stroke:#edf1e8;stroke-width:1}.held{fill:#223238;stroke:#ece1f2;stroke-width:2.5}
.soft{fill:#2f434b;stroke:none}.bracket{fill:none;stroke:#edf1e8;stroke-width:1.3}</style><defs><pattern id="situ-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ad95bd"/><path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#ece1f2" stroke-width="1.1"/></pattern><marker id="reference-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a4bfce"/></marker></defs><rect width="360" height="835" fill="#1a272c"/><text x="24" y="35" class="title" font-size="23" text-anchor="start">pCR · panel 2 of 2</text><text x="24" y="68" class="section" font-size="20" text-anchor="start">Apply the same cases</text><text x="24" y="104" class="muted" font-size="15.5" text-anchor="start">Fictional specimens after treatment</text><text x="24" y="126" class="muted" font-size="15.5" text-anchor="start">Complete resected breast; all sampled</text><text x="24" y="148" class="muted" font-size="15.5" text-anchor="start">regional nodes assessed.</text><text x="24" y="184" class="label" font-size="16" text-anchor="start">Both: no residual invasive breast</text><text x="24" y="206" class="label" font-size="16" text-anchor="start">cancer; residual DCIS.</text><text x="24" y="237" class="label" font-size="15.5" text-anchor="start">A: no residual nodal cancer found.</text><text x="24" y="263" class="label" font-size="15.5" text-anchor="start">B: invasive node deposit, 4 mm.</text><text x="24" y="299" class="section" font-size="18" text-anchor="start">Margin: a separate question</text><text x="102" y="328" class="section" font-size="16" text-anchor="middle">Case A</text><text x="258" y="328" class="section" font-size="16" text-anchor="middle">Case B</text><g transform="translate(0 -626)"><g id="margin-A" data-identical-group="margin-cut" transform="translate(43 970)"><defs><clipPath id="pcr-cut-A"><rect x="0" y="0" width="112" height="95"/></clipPath></defs><rect x="0" y="0" width="112" height="95" rx="6" class="tissue"/><g clip-path="url(#pcr-cut-A)"><ellipse cx="89" cy="47" rx="49" ry="33" class="duct"/><ellipse cx="89" cy="47" rx="41" ry="27" class="lumen"/><ellipse cx="105" cy="46" rx="23" ry="18" class="situ"/></g><line x1="112" y1="0" x2="112" y2="95" class="inkedge"/></g><text x="102" y="1097" class="label" font-size="16.0" text-anchor="middle">DCIS at</text><text x="102" y="1119" class="label" font-size="16.0" text-anchor="middle">final ink</text><g id="margin-B" data-identical-group="margin-cut" transform="translate(199 970)"><defs><clipPath id="pcr-cut-B"><rect x="0" y="0" width="112" height="95"/></clipPath></defs><rect x="0" y="0" width="112" height="95" rx="6" class="tissue"/><g clip-path="url(#pcr-cut-B)"><ellipse cx="89" cy="47" rx="49" ry="33" class="duct"/><ellipse cx="89" cy="47" rx="41" ry="27" class="lumen"/><ellipse cx="105" cy="46" rx="23" ry="18" class="situ"/></g><line x1="112" y1="0" x2="112" y2="95" class="inkedge"/></g><text x="258" y="1097" class="label" font-size="16.0" text-anchor="middle">DCIS at</text><text x="258" y="1119" class="label" font-size="16.0" text-anchor="middle">final ink</text><text x="24" y="1149" class="section" font-size="19.0" text-anchor="start">Apply each definition</text><text x="102" y="1178" class="section" font-size="15.5" text-anchor="middle">Case A</text><text x="258" y="1178" class="section" font-size="15.5" text-anchor="middle">Case B</text><line x1="24" y1="1187" x2="336" y2="1187" class="axis"/><text x="180" y="1213" class="section" font-size="18.0" text-anchor="middle">ypT0/Tis ypN0</text><text x="102" y="1243" class="label" font-size="16.0" text-anchor="middle">Meets stated</text><text x="102" y="1264" class="label" font-size="16.0" text-anchor="middle">definition</text><text x="258" y="1254" class="label" font-size="16.0" text-anchor="middle">Does not meet</text><line x1="24" y1="1278" x2="336" y2="1278" class="axis"/><text x="180" y="1306" class="section" font-size="18.0" text-anchor="middle">ypT0 ypN0</text><text x="102" y="1339" class="label" font-size="16.0" text-anchor="middle">Does not meet</text><text x="258" y="1339" class="label" font-size="16.0" text-anchor="middle">Does not meet</text><text x="24" y="1373" class="label" font-size="15.5" text-anchor="start">DCIS remains a finding.</text><text x="24" y="1395" class="label" font-size="15.5" text-anchor="start">Response does not settle margins</text><text x="24" y="1417" class="label" font-size="15.5" text-anchor="start">or mean cure.</text><text x="24" y="1440" class="muted" font-size="15.5" text-anchor="start">Schematic; not to scale.</text></g></svg>
