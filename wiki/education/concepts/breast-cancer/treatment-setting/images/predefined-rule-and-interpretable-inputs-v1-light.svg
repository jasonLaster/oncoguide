<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">A combined rule needs both inputs</title><desc id="desc">Fictional trial checkpoint: MRI criterion met, biopsy inadequate. An AND rule requires both MRI criterion met and an adequate negative biopsy, so the rule is not met. Outcome evidence remains separate.</desc><rect width="600" height="900" rx="20" fill="#f6f8fb"/>
<text x="28" y="48" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#153044">A combined rule</text>
<text x="28" y="91" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#153044">needs both inputs</text>
<text x="28" y="145" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#3d5970">Fictional trial checkpoint</text>
<rect x="28" y="175" width="544" height="110" rx="16" fill="#e0f3ee" stroke="#6d879b" stroke-width="2"/>
<text x="48" y="215" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#007968">MRI input</text>
<text x="48" y="255" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#153044">Criterion met</text>
<path d="M300 289v16m-10-10 10 10 10-10" fill="none" stroke="#6d879b" stroke-width="3"/>
<rect x="28" y="310" width="544" height="110" rx="16" fill="#fff0db" stroke="#6d879b" stroke-width="2"/>
<text x="48" y="350" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#8b4900">Biopsy input</text>
<text x="48" y="390" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#153044">Inadequate; cannot interpret</text>
<path d="M300 424v16m-10-10 10 10 10-10" fill="none" stroke="#6d879b" stroke-width="3"/>
<rect x="28" y="445" width="544" height="158" rx="16" fill="#ffffff" stroke="#6d879b" stroke-width="2"/>
<text x="48" y="485" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#007968">Predefined AND rule</text>
<text x="48" y="525" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#153044">MRI criterion met AND</text>
<text x="48" y="564" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#153044">biopsy adequate + negative</text>
<path d="M300 607v16m-10-10 10 10 10-10" fill="none" stroke="#6d879b" stroke-width="3"/>
<rect x="28" y="630" width="544" height="110" rx="16" fill="#fff0db" stroke="#6d879b" stroke-width="2"/>
<text x="48" y="670" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#8b4900">Rule not met in this case</text>
<text x="48" y="710" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#153044">One favorable input is insufficient.</text>
<text x="28" y="797" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#3d5970">Separate question: does acting</text>
<text x="28" y="836" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#3d5970">on this rule improve outcomes?</text>
</svg>
