<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Survival endpoints</title><desc id="desc">Identify the same event that stops one endpoint clock but not another. All new counts/times/statistical estimates are fictional teaching examples.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#18333e"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#18333e" stroke-width="2" opacity=".3"/></pattern></defs><rect width="600" height="1000" fill="#fbf7ed"/>
<text x="28" y="44" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#18333e" text-anchor="start">One participant, two stop rules</text>
<text x="28" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Fictional months from randomization</text>
<text x="28" y="143" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">0: randomization</text>
<text x="28" y="184" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">12: objective progression; 30: death</text>
<path d="M80 249 L530 249" fill="none" stroke="#9bb0b7" stroke-width="3" stroke-linecap="round"/>
