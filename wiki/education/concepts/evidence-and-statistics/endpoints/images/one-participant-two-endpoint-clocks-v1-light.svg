<text x="112" y="379" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">OS: death from any cause</text>
<path d="M80 436 L530 436" fill="none" stroke="#315769" stroke-width="10" stroke-linecap="round"/>
<circle cx="80" cy="436" r="10" fill="#e4bd74" stroke="#18333e" stroke-width="2"/>
