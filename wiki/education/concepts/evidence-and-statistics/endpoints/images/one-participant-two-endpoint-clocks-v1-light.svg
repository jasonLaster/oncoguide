<path d="M260 789 L260 808" fill="none" stroke="#9bb0b7" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<path d="M530 789 L530 808" fill="none" stroke="#e6a0aa" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
