<text x="42" y="486" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">Progression does not stop this clock.</text>
<text x="42" y="530" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">OS event at month 30.</text>
