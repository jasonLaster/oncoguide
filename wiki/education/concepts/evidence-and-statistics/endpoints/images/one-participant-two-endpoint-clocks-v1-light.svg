<circle cx="66" cy="344" r="2" fill="#18333e" stroke="#18333e" stroke-width="1"/>
<circle cx="90" cy="368" r="2" fill="#18333e" stroke="#18333e" stroke-width="1"/>
<circle cx="66" cy="392" r="2" fill="#18333e" stroke="#18333e" stroke-width="1"/>
