<text x="170" y="294" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="middle">6</text>
<circle cx="260" cy="249" r="4" fill="#9bb0b7" stroke="#9bb0b7" stroke-width="2"/>
<text x="260" y="294" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="middle">12</text>
