<circle cx="66" cy="630" r="2" fill="#18333e" stroke="#18333e" stroke-width="1"/>
<circle cx="42" cy="606" r="2" fill="#18333e" stroke="#18333e" stroke-width="1"/>
<text x="112" y="617" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">PFS: progression or death</text>
<path d="M80 677 L260 677" fill="none" stroke="#315769" stroke-width="10" stroke-linecap="round"/>
<path d="M272 677 L530 677" fill="none" stroke="#9bb0b7" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<circle cx="80" cy="677" r="10" fill="#e4bd74" stroke="#18333e" stroke-width="2"/>
<circle cx="260" cy="677" r="11" fill="#e6a0aa" stroke="#18333e" stroke-width="2"/>
<circle cx="530" cy="677" r="7" fill="#fffdf8" stroke="#9bb0b7" stroke-width="2"/>
<text x="42" y="729" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">First qualifying event stops this clock.</text>
<text x="42" y="773" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">PFS event at month 12.</text>
<rect x="22" y="827" width="556" height="144" rx="14" fill="#fffdf8" stroke="#9bb0b7" stroke-width="2"/>
<text x="42" y="869" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#18333e" text-anchor="start">Same origin; different event sets</text>
<text x="42" y="914" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">OS = overall survival; PFS =</text>
<text x="42" y="953" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#18333e" text-anchor="start">progression-free survival. Check protocol.</text>
</svg>
