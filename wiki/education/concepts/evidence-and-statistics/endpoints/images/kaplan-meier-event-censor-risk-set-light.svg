 <title id="km-title">Fictional Kaplan–Meier curve: event, censor tick and risk set</title>
 <desc id="km-description">Five fictional participants followed for first recurrence from enrollment. The estimate starts at 100 percent, drops to 80 percent after one recurrence at month 1 with five at risk, stays at 80 percent at the month 2 censor tick, and drops to eight fifteenths, approximately 53.3 percent, after one recurrence at month 3 with three at risk. The curve ends at month 3; no later outcome or confidence interval is shown.</desc>
