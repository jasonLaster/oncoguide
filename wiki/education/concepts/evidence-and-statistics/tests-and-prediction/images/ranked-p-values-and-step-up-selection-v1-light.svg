<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">The last passing rank sets the list</title><desc id="desc">Original five fictional p-values .001,.008,.026,.080,.200 at q.05 select ranks1..3. The three-test practice p-values .018,.030,.060 at q.05 show rank1 failing its own comparison but rank2 passing; step-up selects both first two. Charts use different clearly labeled p ranges.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#293743"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#976729" stroke-width="2"/></pattern></defs>
