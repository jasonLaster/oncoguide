<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Count rankings, then trace the ROC</title><desc id="desc">Two fictional cases score.9,.6 and two non-cases .7,.2, givingthree of four correctlyordered pairs andbinaryAUC.75. ROC step coordinates(0,0),(0,.5),(.5,.5),(.5,1),(1,1). Separate A eventmonth2/Bcensor month1 sketch leaves their laterorderunknown, not a non-case label.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#edc585" stroke-width="2"/></pattern></defs>
<rect width="760" height="1320" fill="#152630"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f1ecd9" text-anchor="start">Ranking has two equivalent views</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Binary example: two cases; two non-cases</text>
<rect x="24" y="142" width="712" height="316" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="195" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">1  Compare every case/non-case pair</text>
<rect x="52" y="206" width="308" height="78" rx="9" fill="#38505a" />
<text x="75" y="258" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">0.9 &gt; 0.7</text>
<text x="277" y="258" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#b0c395" text-anchor="start">✓</text>
<rect x="401" y="206" width="308" height="78" rx="9" fill="#38505a" />
<text x="424" y="258" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">0.9 &gt; 0.2</text>
<text x="626" y="258" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#b0c395" text-anchor="start">✓</text>
<rect x="52" y="306" width="308" height="78" rx="9" fill="#38505a" />
<text x="75" y="358" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">0.6 &lt; 0.7</text>
<text x="277" y="358" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f1ecd9" text-anchor="start">×</text>
<rect x="401" y="306" width="308" height="78" rx="9" fill="#38505a" />
<text x="424" y="358" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">0.6 &gt; 0.2</text>
<text x="626" y="358" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#b0c395" text-anchor="start">✓</text>
<text x="48" y="428" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">Three higher pairs / four pairs = 0.75</text>
<rect x="24" y="478" width="712" height="545" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="531" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">2  Trace thresholds: ROC area = 0.75</text>
<path d="M161 878 L161 747.5 L404.5 747.5 L404.5 617 L648 617 L648 878 Z" fill="#38505a" stroke="#8fbedc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M161 878 L662 878" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M161 878 L161 605" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="139" y="889" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="end">0.0</text>
<text x="161" y="927" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="middle">0.0</text>
<text x="139" y="758.5" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="end">0.5</text>
<text x="404.5" y="927" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="middle">0.5</text>
<text x="139" y="628" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="end">1.0</text>
<text x="648" y="927" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="middle">1.0</text>
<path d="M 161 878 L 161 747.5 L 404.5 747.5 L 404.5 617 L 648 617" fill="none" stroke="#8fbedc" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="161" cy="878" r="8" fill="#8fbedc" stroke="#f1ecd9" stroke-width="2" data-fpr="0" data-tpr="0"/>
<circle cx="161" cy="747.5" r="8" fill="#8fbedc" stroke="#f1ecd9" stroke-width="2" data-fpr="0" data-tpr="0.5" data-threshold="0.9"/>
<text x="185" y="722.5" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">≥0.9</text>
<circle cx="404.5" cy="747.5" r="8" fill="#8fbedc" stroke="#f1ecd9" stroke-width="2" data-fpr="0.5" data-tpr="0.5" data-threshold="0.7"/>
<text x="428.5" y="722.5" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">≥0.7</text>
<circle cx="404.5" cy="617" r="8" fill="#8fbedc" stroke="#f1ecd9" stroke-width="2" data-fpr="0.5" data-tpr="1" data-threshold="0.6"/>
<text x="428.5" y="665" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">≥0.6</text>
<circle cx="648" cy="617" r="8" fill="#8fbedc" stroke="#f1ecd9" stroke-width="2" data-fpr="1" data-tpr="1" data-threshold="0.2"/>
<text x="624" y="665" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="end">≥0.2</text>
<text x="48" y="585" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">True-positive fraction</text>
<text x="402" y="977" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="middle">False-positive fraction</text>
<rect x="24" y="1043" width="712" height="219" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="1096" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">Censoring asks a different question</text>
<text x="48" y="1167" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">A event: 2 mo</text>
<path d="M350 1156 L502 1156" fill="none" stroke="#8fbedc" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="502" cy="1156" r="10" fill="#e5a0ab" stroke="#f1ecd9" stroke-width="2" />
<text x="48" y="1234" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">B censor: 1 mo</text>
<path d="M350 1223 L426 1223" fill="none" stroke="#8fbedc" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M426 1208 L426 1238" fill="none" stroke="#f1ecd9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M432 1223 L655 1223" fill="none" stroke="#a8bcc0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" />
<text x="680" y="1235" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">?</text>
<text x="38" y="1300" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">B’s later event order is unknown.</text>
</svg>
