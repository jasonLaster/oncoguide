<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Move the line, retain the measurements</title><desc id="desc">Identical fictional four present and six absent reference samples appear twice on a0..1scoreaxis. Threshold .7 yieldsTP2FP1FN2TN5; threshold.4 yieldsTP3FP3FN1TN3. Equality is positive; scores and reference classes remain fixed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#edc585" stroke-width="2"/></pattern></defs>
