<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1540" viewBox="0 0 760 1540" role="img" aria-labelledby="title desc"><title id="title">Hazards and risks have different scales</title><desc id="desc">On the same fictional constant-hazard exponential model, control and treatment hazards are 0.10 and 0.07 per year. Their accumulated event-risk curves reach 39.3 and 29.5 percent at five years, giving a risk ratio near 0.75 while the hazard ratio stays 0.70.</desc>
<rect width="760" height="1540" fill="#171f28"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#f2ecdf">A rate is not an accumulated risk</text>
<text x="38" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">Fictional constant-hazard model</text>
<text x="38" y="145" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">One event type; no competing events</text>
<rect x="24" y="201" width="712" height="506" rx="20" fill="#202b35" stroke="#a5aaa8" stroke-width="2"/>
