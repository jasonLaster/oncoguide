<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Keep the whole search visible</title><desc id="desc">Twenty fictional independent valid null tests each have false rejection probability0.05. A single selected p0.03 does not expose the full family. The probability of at least one false rejection is1−0.95^m, about5%,22.6%,64.2% at m1,5,20. Bonferroni0.05/20=.0025 differs from a per-hit truth probability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#293743"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#976729" stroke-width="2"/></pattern></defs>
