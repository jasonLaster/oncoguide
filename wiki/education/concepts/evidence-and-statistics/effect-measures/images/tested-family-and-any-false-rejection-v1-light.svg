<rect x="226" y="864" width="338" height="45" rx="0" fill="#e8e0d3" />
<rect x="226" y="864" width="216.83175822591284" height="45" rx="0" fill="#bd7480" data-tests="20" data-probability="0.641514077591458"/>
<text x="590" y="898" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="start">64.2%</text>
<text x="48" y="966" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Probability = 1 − 0.95ᵐ</text>
<rect x="24" y="1009" width="712" height="246" rx="16" fill="#fffdf8" stroke="#969e9e" stroke-width="2" />
<text x="48" y="1062" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#293743" text-anchor="start">Control a defined family</text>
<text x="48" y="1110" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Bonferroni: 0.05 / 20 = 0.0025</text>
<text x="48" y="1169" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">p = 0.03 does not pass that rule.</text>
<text x="48" y="1228" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Correlation changes the toy calculation.</text>
<text x="38" y="1300" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Any error ≠ FDR ≠ one hit’s truth probability.</text>
