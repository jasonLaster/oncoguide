<rect x="226" y="781" width="76.46204312500008" height="45" rx="0" fill="#bd7480" data-tests="5" data-probability="0.226219062500000"/>
<text x="590" y="815" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="start">22.6%</text>
