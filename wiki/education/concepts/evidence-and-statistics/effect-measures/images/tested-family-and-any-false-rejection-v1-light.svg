<text x="611" y="377" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">p = 0.03</text>
<path d="M482 360 L505 360" fill="none" stroke="#293743" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<text x="48" y="553" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">One reported result is not the family.</text>
<rect x="24" y="611" width="712" height="378" rx="16" fill="#fffdf8" stroke="#969e9e" stroke-width="2" />
<text x="48" y="664" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#293743" text-anchor="start">Chance of ≥1 false rejection</text>
<text x="48" y="731" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">1 test</text>
<rect x="226" y="698" width="338" height="45" rx="0" fill="#e8e0d3" />
<rect x="226" y="698" width="16.900000000000016" height="45" rx="0" fill="#bd7480" data-tests="1" data-probability="0.050000000000000"/>
<text x="590" y="732" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="start">5.0%</text>
