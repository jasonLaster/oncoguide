<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1550" viewBox="0 0 760 1550" role="img" aria-labelledby="title desc"><title id="title">Coverage belongs to the method</title><desc id="desc">Ten hand-picked fictional sample proportions and approximate intervals share a fixed 50 percent population parameter; nine cover it and one misses. A second plot compares the existing 100 and 10000 person examples on one percentage scale.</desc>
<rect width="760" height="1550" fill="#171f28"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#f2ecdf">Repeated intervals, one fixed truth</text>
<text x="38" y="101" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">Fictional independent binary samples</text>
<rect x="24" y="134" width="712" height="899" rx="20" fill="#202b35" stroke="#a5aaa8" stroke-width="2"/>
<text x="48" y="186" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f2ecdf">1  Reapply the same method</text>
<text x="48" y="231" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">n = 100 in each illustrative sample</text>
<text x="48" y="273" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">Normal approximation; 95% intervals</text>
<line x1="387.091" y1="342.000" x2="387.091" y2="884.000" stroke="#a5aaa8" stroke-width="3" stroke-dasharray="8 7"/>
<text x="387.0909090909091" y="332" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">Truth: 50%</text>
<text x="118" y="386" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">1</text>
<line x1="267.402" y1="376.000" x2="450.598" y2="376.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="359.000" cy="376.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="440" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">2</text>
<line x1="304.709" y1="430.000" x2="488.200" y2="430.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="396.455" cy="430.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="494" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">3</text>
<line x1="230.686" y1="484.000" x2="412.405" y2="484.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="321.545" cy="484.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="548" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">4</text>
<line x1="352.172" y1="538.000" x2="534.373" y2="538.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="443.273" cy="538.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="602" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">5</text>
<line x1="295.327" y1="592.000" x2="478.855" y2="592.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="387.091" cy="592.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="656" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">6</text>
<line x1="276.673" y1="646.000" x2="460.054" y2="646.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="368.364" cy="646.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="710" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">7</text>
<line x1="314.128" y1="700.000" x2="497.508" y2="700.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="405.818" cy="700.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="764" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">8</text>
<line x1="258.167" y1="754.000" x2="441.106" y2="754.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="349.636" cy="754.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="118" y="818" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">9</text>
<line x1="440.009" y1="808.000" x2="615.082" y2="808.000" stroke="#e9bb71" stroke-width="5" stroke-dasharray="9 6"/>
<circle cx="527.545" cy="808.000" r="6" fill="#e9bb71" stroke="#e9bb71" stroke-width="2"/>
<text x="118" y="872" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">10</text>
<line x1="333.076" y1="862.000" x2="516.015" y2="862.000" stroke="#8eb7e4" stroke-width="5"/>
<circle cx="424.545" cy="862.000" r="6" fill="#8eb7e4" stroke="#8eb7e4" stroke-width="2"/>
<text x="199.8181818181818" y="926" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">30%</text>
<text x="387.0909090909091" y="926" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">50%</text>
<text x="574.3636363636363" y="926" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">70%</text>
<text x="410" y="972" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">Population outcome proportion</text>
<text x="48" y="1015" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">Dot: estimate; bar: 95% interval</text>
<rect x="24" y="1057" width="712" height="370" rx="20" fill="#202b35" stroke="#a5aaa8" stroke-width="2"/>
<text x="48" y="1109" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f2ecdf">2  Width measures precision</text>
<text x="48" y="1150" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f2ecdf">Same estimate: 50%; larger n below</text>
<text x="142" y="1221" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">100</text>
<line x1="246.533" y1="1211.000" x2="576.467" y2="1211.000" stroke="#8ec6ae" stroke-width="6"/>
<circle cx="411.500" cy="1211.000" r="6" fill="#8ec6ae" stroke="#8ec6ae" stroke-width="2"/>
<text x="142" y="1288" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="end" fill="#f2ecdf">10,000</text>
<line x1="395.003" y1="1278.000" x2="427.997" y2="1278.000" stroke="#8ec6ae" stroke-width="6"/>
<circle cx="411.500" cy="1278.000" r="6" fill="#8ec6ae" stroke="#8ec6ae" stroke-width="2"/>
<text x="243.16666666666674" y="1340" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">40%</text>
<text x="411.50000000000006" y="1340" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">50%</text>
<text x="579.8333333333334" y="1340" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">60%</text>
<text x="410" y="1395" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#f2ecdf">Population outcome proportion</text>
<text x="38" y="1486" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f2ecdf">Precision does not remove bias.</text>
</svg>
