<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Which claims have support?</title><desc id="desc">Fictional variant-based claim map: sequence supported; activating interpretation untested; growth dependence not demonstrated; drug lowers a pathway signal while growth is unchanged; matched clinical benefit untested. Dashed outlines mark inference gaps.</desc><rect width="600" height="900" rx="20" fill="#f6f8fb"/>
