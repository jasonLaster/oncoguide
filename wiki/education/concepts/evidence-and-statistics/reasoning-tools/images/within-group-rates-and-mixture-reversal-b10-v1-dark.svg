<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Cross-trial comparison</title><desc id="desc">Invented Study A and Study B each enroll 100 people. In the favorable group A has 40 responses among 80 people, 50 percent, versus B 12 among 20, 60 percent; group weights are 80 and 20 percent. In the unfavorable group A has 4 among 20, 20 percent, versus B 24 among 80, 30 percent; weights are 20 and 80 percent. Overall A has 44 among 100, 44 percent, versus B 36 among 100, 36 percent. The within-group ranking reverses overall because of composition; this establishes no adjusted treatment superiority or causal cross-trial comparison.</desc><rect width="600" height="1000" fill="#131f2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#f3eee4" font-weight="700" text-anchor="start">The mix changes the headline</text><text x="28" y="86" font-size="26" fill="#c3d0dc" font-weight="400" text-anchor="start">Invented studies · 100 people in each</text><rect x="24" y="114" width="552" height="271" rx="20" fill="#1d2d3b" stroke="#637f94" stroke-width="2"/><text x="42" y="152" font-size="27" fill="#f3eee4" font-weight="700" text-anchor="start">Favorable baseline group</text><text x="42" y="193" font-size="27" fill="#ffba83" font-weight="700" text-anchor="start">A</text><text x="86" y="193" font-size="26" fill="#f3eee4" font-weight="400" text-anchor="start">40/80 respond = 50%</text><text x="42" y="229" font-size="27" fill="#70d9c4" font-weight="700" text-anchor="start">B</text><text x="86" y="229" font-size="26" fill="#f3eee4" font-weight="400" text-anchor="start">12/20 respond = 60%</text><rect x="390" y="174" width="160" height="23" rx="2" fill="#1d2d3b" stroke="#ffba83" stroke-width="2"/><rect x="390" y="174" width="80.0" height="23" rx="2" fill="#ffba83" stroke="#ffba83" stroke-width="2"/><rect x="390" y="210" width="160" height="23" rx="2" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><rect x="390" y="210" width="96.0" height="23" rx="2" fill="#70d9c4" stroke="#70d9c4" stroke-width="2"/><text x="42" y="276" font-size="24" fill="#c3d0dc" font-weight="400" text-anchor="start">Group weight in each study:</text><rect x="80" y="297" width="332.8" height="28" rx="3" fill="#ffba83" stroke="#ffba83" stroke-width="2"/><rect x="412.8" y="297" width="83.2" height="28" rx="3" fill="#1d2d3b" stroke="#ffba83" stroke-width="2"/><text x="42" y="321" font-size="24" fill="#ffba83" font-weight="700" text-anchor="start">A</text><text x="508" y="321" font-size="24" fill="#ffba83" font-weight="700" text-anchor="start">80%</text><rect x="80" y="337" width="83.2" height="28" rx="3" fill="#70d9c4" stroke="#70d9c4" stroke-width="2"/><rect x="163.2" y="337" width="332.8" height="28" rx="3" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><text x="42" y="361" font-size="24" fill="#70d9c4" font-weight="700" text-anchor="start">B</text><text x="508" y="361" font-size="24" fill="#70d9c4" font-weight="700" text-anchor="start">20%</text><rect x="24" y="405" width="552" height="271" rx="20" fill="#1d2d3b" stroke="#637f94" stroke-width="2"/><text x="42" y="443" font-size="27" fill="#f3eee4" font-weight="700" text-anchor="start">Unfavorable baseline group</text><text x="42" y="484" font-size="27" fill="#ffba83" font-weight="700" text-anchor="start">A</text><text x="86" y="484" font-size="26" fill="#f3eee4" font-weight="400" text-anchor="start">4/20 respond = 20%</text><text x="42" y="520" font-size="27" fill="#70d9c4" font-weight="700" text-anchor="start">B</text><text x="86" y="520" font-size="26" fill="#f3eee4" font-weight="400" text-anchor="start">24/80 respond = 30%</text><rect x="390" y="465" width="160" height="23" rx="2" fill="#1d2d3b" stroke="#ffba83" stroke-width="2"/><rect x="390" y="465" width="32.0" height="23" rx="2" fill="#ffba83" stroke="#ffba83" stroke-width="2"/><rect x="390" y="501" width="160" height="23" rx="2" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><rect x="390" y="501" width="48.0" height="23" rx="2" fill="#70d9c4" stroke="#70d9c4" stroke-width="2"/><text x="42" y="567" font-size="24" fill="#c3d0dc" font-weight="400" text-anchor="start">Group weight in each study:</text><rect x="80" y="588" width="83.2" height="28" rx="3" fill="#ffba83" stroke="#ffba83" stroke-width="2"/><rect x="163.2" y="588" width="332.8" height="28" rx="3" fill="#1d2d3b" stroke="#ffba83" stroke-width="2"/><text x="42" y="612" font-size="24" fill="#ffba83" font-weight="700" text-anchor="start">A</text><text x="508" y="612" font-size="24" fill="#ffba83" font-weight="700" text-anchor="start">20%</text><rect x="80" y="628" width="332.8" height="28" rx="3" fill="#70d9c4" stroke="#70d9c4" stroke-width="2"/><rect x="412.8" y="628" width="83.2" height="28" rx="3" fill="#1d2d3b" stroke="#70d9c4" stroke-width="2"/><text x="42" y="652" font-size="24" fill="#70d9c4" font-weight="700" text-anchor="start">B</text><text x="508" y="652" font-size="24" fill="#70d9c4" font-weight="700" text-anchor="start">80%</text><rect x="24" y="702" width="552" height="113" rx="20" fill="#1d2d3b" stroke="#637f94" stroke-width="2"/><text x="42" y="738" font-size="26" fill="#f3eee4" font-weight="700" text-anchor="start">Overall · add the response counts</text><text x="42" y="780" font-size="26" fill="#ffba83" font-weight="700" text-anchor="start">A: 44/100 = 44%</text><text x="321" y="780" font-size="26" fill="#70d9c4" font-weight="700" text-anchor="start">B: 36/100 = 36%</text><rect x="24" y="838" width="552" height="128" rx="20" fill="#233b45" stroke="#637f94" stroke-width="2"/><text x="42" y="872" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">B is higher within each group; A overall.</text><text x="42" y="904" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">The reversal proves no treatment superiority.</text><text x="42" y="936" font-size="24" fill="#f3eee4" font-weight="500" text-anchor="start">Between-study confounding still matters.</text></g></svg>
