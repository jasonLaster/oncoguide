<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" width="390" height="720" role="img" aria-labelledby="title desc" data-theme="light">
<title id="title">Same five responses, three denominators</title>
<desc id="desc">Three count strips show the same five observed responses among twenty enrolled, fourteen treated and ten scan-evaluable people. Five other evaluable scans did not meet the response rule, four treated people lack evaluable scans, and six were not treated; these last two groups have no supplied response outcome.</desc>
<style>:root{--ground:#FBF8F2;--ink:#202B32;--response:#286788;--unknown:#886E43;--stroke:#435460} text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)} .thin{stroke:var(--stroke);fill:none} .response{fill:var(--response);stroke:var(--response)} .open{fill:var(--ground);stroke:var(--stroke)} .hatch{fill:url(#hatch);stroke:var(--stroke)} .outside{fill:var(--ground);stroke:var(--stroke);stroke-dasharray:2 2}</style>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="var(--ground)"/><path d="M-1 1 L1 -1 M0 5 L5 0 M4 6 L6 4" stroke="var(--unknown)" stroke-width="1.5"/></pattern></defs>
<rect width="390" height="720" rx="12" fill="var(--ground)"/>
<text x="24" y="30" font-size="24" font-weight="bold" text-anchor="start" >Same five responses</text>
<text x="24" y="56" font-size="22.8" font-weight="bold" text-anchor="start" >Three denominators</text>
<text x="24" y="80" font-size="15.6" font-weight="normal" text-anchor="start" >Fictional study; nested sets of people</text>
<text x="24" y="116" font-size="19.2" font-weight="bold" text-anchor="start" >Enrolled: 20 people</text>
<g data-row="enrolled" data-denominator="20">
<rect x="34" y="132" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P01" data-category="observed-response"/>
<rect x="50" y="132" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P02" data-category="observed-response"/>
<rect x="66" y="132" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P03" data-category="observed-response"/>
<rect x="82" y="132" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P04" data-category="observed-response"/>
<rect x="98" y="132" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P05" data-category="observed-response"/>
<rect x="114" y="132" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P06" data-category="evaluable-rule-not-met"/>
<rect x="130" y="132" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P07" data-category="evaluable-rule-not-met"/>
<rect x="146" y="132" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P08" data-category="evaluable-rule-not-met"/>
<rect x="162" y="132" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P09" data-category="evaluable-rule-not-met"/>
<rect x="178" y="132" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P10" data-category="evaluable-rule-not-met"/>
<rect x="194" y="132" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P11" data-category="treated-no-evaluable-scan"/>
<rect x="210" y="132" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P12" data-category="treated-no-evaluable-scan"/>
<rect x="226" y="132" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P13" data-category="treated-no-evaluable-scan"/>
<rect x="242" y="132" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P14" data-category="treated-no-evaluable-scan"/>
<rect x="258" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P15" data-category="not-treated"/>
<rect x="274" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P16" data-category="not-treated"/>
<rect x="290" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P17" data-category="not-treated"/>
<rect x="306" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P18" data-category="not-treated"/>
<rect x="322" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P19" data-category="not-treated"/>
<rect x="338" y="132" width="12" height="22" rx="1" class="outside" stroke-width="1.25" data-person-id="P20" data-category="not-treated"/>
</g>
<text x="24" y="176" font-size="19.2" font-weight="bold" text-anchor="start" >5/20 = 25%</text>
<text x="24" y="260" font-size="19.2" font-weight="bold" text-anchor="start" >Treated: 14 people</text>
<g data-row="treated" data-denominator="14">
<rect x="34" y="276" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P01" data-category="observed-response"/>
<rect x="50" y="276" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P02" data-category="observed-response"/>
