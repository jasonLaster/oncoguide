<rect x="114" y="276" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P06" data-category="evaluable-rule-not-met"/>
<rect x="130" y="276" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P07" data-category="evaluable-rule-not-met"/>
<rect x="146" y="276" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P08" data-category="evaluable-rule-not-met"/>
