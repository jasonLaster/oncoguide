<text x="352" y="498" font-size="15.6" font-weight="normal" text-anchor="middle" >20</text>
<text x="24" y="524" font-size="15.6" font-weight="normal" text-anchor="start" >Counted people; same slot size</text>
<rect x="24" y="542" width="12" height="17" rx="1" class="response" stroke-width="1.25" />
<text x="48" y="555" font-size="15.6" font-weight="normal" text-anchor="start" >Observed response (5)</text>
<rect x="24" y="567" width="12" height="17" rx="1" class="open" stroke-width="1.25" />
<text x="48" y="580" font-size="15.6" font-weight="normal" text-anchor="start" >Evaluable scan: rule not met (5)</text>
<rect x="24" y="592" width="12" height="17" rx="1" class="hatch" stroke-width="1.25" />
<text x="48" y="605" font-size="15.6" font-weight="normal" text-anchor="start" >Treated: no evaluable scan (4)</text>
<rect x="24" y="617" width="12" height="17" rx="1" class="outside" stroke-width="1.25" />
<text x="48" y="630" font-size="15.6" font-weight="normal" text-anchor="start" >Not treated: outcome not supplied (6)</text>
<text x="24" y="680" font-size="15.6" font-weight="normal" text-anchor="start" >Same five response marks in every row.</text>
<text x="24" y="702" font-size="15.6" font-weight="normal" text-anchor="start" >Unknown does not mean non-response.</text>
</svg>
