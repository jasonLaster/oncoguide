<rect x="114" y="420" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P06" data-category="evaluable-rule-not-met"/>
<rect x="130" y="420" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P07" data-category="evaluable-rule-not-met"/>
<rect x="146" y="420" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P08" data-category="evaluable-rule-not-met"/>
<rect x="162" y="420" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P09" data-category="evaluable-rule-not-met"/>
<rect x="178" y="420" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P10" data-category="evaluable-rule-not-met"/>
</g>
<text x="24" y="464" font-size="19.2" font-weight="bold" text-anchor="start" >5/10 = 50%</text>
<path d="M358 186 h6 v52 h-6" class="thin" stroke-width="1.25"/>
<text x="24" y="206" font-size="15.6" font-weight="normal" text-anchor="start" >6 not treated</text>
<text x="24" y="224" font-size="15.6" font-weight="normal" text-anchor="start" >Outcome not supplied</text>
<path d="M358 330 h6 v52 h-6" class="thin" stroke-width="1.25"/>
<text x="24" y="350" font-size="15.6" font-weight="normal" text-anchor="start" >4 without an evaluable scan</text>
<text x="24" y="368" font-size="15.6" font-weight="normal" text-anchor="start" >Response outcome unknown</text>
<path d="M32 482 H352" class="thin" stroke-width="1"/>
<path d="M32 479 V487" class="thin" stroke-width="1"/>
