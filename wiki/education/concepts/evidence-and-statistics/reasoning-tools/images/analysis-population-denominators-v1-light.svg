<rect x="178" y="276" width="12" height="22" rx="1" class="open" stroke-width="1.25" data-person-id="P10" data-category="evaluable-rule-not-met"/>
<rect x="194" y="276" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P11" data-category="treated-no-evaluable-scan"/>
<rect x="210" y="276" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P12" data-category="treated-no-evaluable-scan"/>
<rect x="226" y="276" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P13" data-category="treated-no-evaluable-scan"/>
<rect x="242" y="276" width="12" height="22" rx="1" class="hatch" stroke-width="1.25" data-person-id="P14" data-category="treated-no-evaluable-scan"/>
</g>
<text x="24" y="320" font-size="19.2" font-weight="bold" text-anchor="start" >5/14 ≈ 35.7%</text>
<text x="24" y="404" font-size="19.2" font-weight="bold" text-anchor="start" >Scan-evaluable: 10 people</text>
<g data-row="evaluable" data-denominator="10">
<rect x="34" y="420" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P01" data-category="observed-response"/>
<rect x="50" y="420" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P02" data-category="observed-response"/>
<rect x="66" y="420" width="12" height="22" rx="1" class="response" stroke-width="1.25" data-person-id="P03" data-category="observed-response"/>
