<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Lead-time bias</title><desc id="desc">See earlier detection lengthen survival measured from detection without moving death. All new counts/times/statistical estimates are fictional teaching examples.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#18333e"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#18333e" stroke-width="2" opacity=".3"/></pattern></defs><rect width="600" height="1000" fill="#fbf7ed"/>
