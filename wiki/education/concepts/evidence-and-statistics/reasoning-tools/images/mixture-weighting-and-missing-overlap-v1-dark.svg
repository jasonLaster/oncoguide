<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img"><title>Whose average is this?</title><desc>Fictional effects · conditional arithmetic</desc>
<rect width="600" height="1270" fill="#14242e"/>
<text x="28" y="47" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Whose average is this?</text>
<text x="28" y="86" fill="#ccdae0" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Fictional effects · conditional arithmetic</text>
<rect x="22" y="112" width="556" height="201" rx="18" fill="#1c3541" stroke="#9bb5bf" stroke-width="2"/>
<text x="42" y="154" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Same question, different mixtures</text>
<text x="42" y="193" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Fictional recurrence by three years</text>
<text x="42" y="229" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Clock starts at random assignment</text>
<text x="42" y="265" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Risk difference: treatment − control</text>
<rect x="22" y="339" width="556" height="171" rx="18" fill="#1c3541" stroke="#9bb5bf" stroke-width="2"/>
<text x="42" y="381" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Subgroup contrasts in the trial</text>
<circle cx="65" cy="422" r="12" fill="#8bcdbb" stroke="#9bb5bf" stroke-width="2"/>
<text x="90" y="433" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Group 1: −5 points</text>
<circle cx="65" cy="473" r="12" fill="#f1c576" stroke="#9bb5bf" stroke-width="2"/>
<text x="90" y="484" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Group 2: −15 points</text>
<rect x="22" y="536" width="556" height="254" rx="18" fill="#1c3541" stroke="#9bb5bf" stroke-width="2"/>
<text x="42" y="578" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Reweight only if effects transport</text>
<text x="42" y="615" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Trial: 50% / 50%</text>
<rect x="42" y="637" width="516" height="32" rx="0" fill="#f1c576" stroke="#9bb5bf" stroke-width="2"/>
<rect x="42" y="637" width="258.0" height="32" fill="#8bcdbb"/>
<path d="M300.0 637 L300.0 669" fill="none" stroke="#f6f0e4" stroke-width="2"/>
<text x="42" y="714" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">0.5 × (−5) + 0.5 × (−15) = −10</text>
<rect x="22" y="816" width="556" height="222" rx="18" fill="#1c3541" stroke="#9bb5bf" stroke-width="2"/>
<text x="42" y="858" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Target population: 80% / 20%</text>
<rect x="42" y="892" width="516" height="32" rx="0" fill="#f1c576" stroke="#9bb5bf" stroke-width="2"/>
<rect x="42" y="892" width="412.8" height="32" fill="#8bcdbb"/>
<path d="M454.8 892 L454.8 924" fill="none" stroke="#f6f0e4" stroke-width="2"/>
<text x="42" y="970" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">0.8 × (−5) + 0.2 × (−15) = −7</text>
<rect x="25" y="1064" width="550" height="176" rx="18" fill="#1c3541" stroke="#f1c576" stroke-width="2" stroke-dasharray="9 6"/>
<text x="43" y="1105" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Missing a relevant third group?</text>
<text x="43" y="1141" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Its effect remains unknown.</text>
<text x="43" y="1177" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Overlap and bridging assumptions matter.</text>
<text x="43" y="1213" fill="#f6f0e4" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Eligibility is a separate protocol check.</text>
</svg>
