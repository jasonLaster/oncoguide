<text x="28" y="88" font-size="38" font-weight="700" class="" text-anchor="start">What did we count?</text>
<text x="28" y="130" font-size="28" font-weight="600" class="" text-anchor="start">2 donors → 12 assigned wells</text>
<text x="28" y="170" font-size="26" font-weight="400" class="" text-anchor="start">Cells stay in their own wells.</text>
