<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Trial phases and randomization</title><desc id="desc">The study phase and development purpose sit above a separated participant assignment pathway. Eligible consenting people enter concealed chance assignment, with the next assignment hidden, then branch into groups A and B. Optional blinding is labeled after assignment as a separate feature when feasible. Phase numbers imply neither a benefit ladder nor fixed sample sizes nor proof of effectiveness.</desc><rect width="600" height="1000" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#233344" font-weight="700" text-anchor="start">Purpose and assignment differ</text><text x="28" y="86" font-size="26" fill="#46586a" font-weight="400" text-anchor="start">A phase label does not choose a group</text><rect x="24" y="118" width="552" height="149" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="44" y="155" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Study property · phase purpose</text><text x="44" y="196" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Dose / harms · activity · comparison</text><text x="44" y="228" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Read the actual protocol; phases can overlap.</text><path d="M24 287 L576 287" fill="none" stroke="#b8c5ce" stroke-width="2" stroke-dasharray="8 7"/><text x="28" y="324" font-size="27" fill="#233344" font-weight="700" text-anchor="start">People · eligible and consenting</text><circle cx="216" cy="352" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M198 392 Q198 366 216 366 Q234 366 234 392" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><circle cx="272" cy="352" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M254 392 Q254 366 272 366 Q290 366 290 392" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><circle cx="328" cy="352" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M310 392 Q310 366 328 366 Q346 366 346 392" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><circle cx="384" cy="352" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M366 392 Q366 366 384 366 Q402 366 402 392" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><path d="M300 407 L300 437" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M293 427 L300 437 L307 427" fill="none" stroke="#46586a" stroke-width="3"/><rect x="71" y="450" width="458" height="121" rx="18" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><text x="300" y="487" font-size="27" fill="#233344" font-weight="700" text-anchor="middle">Concealed chance assignment</text><text x="300" y="529" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">Next assignment stays hidden</text><path d="M300 574 L300 604" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M164 604 L436 604" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M164 604 L164 630" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M157 620 L164 630 L171 620" fill="none" stroke="#46586a" stroke-width="3"/><path d="M436 604 L436 630" fill="none" stroke="#46586a" stroke-width="3" stroke-dasharray=""/><path d="M429 620 L436 630 L443 620" fill="none" stroke="#46586a" stroke-width="3"/><rect x="24" y="641" width="264" height="137" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><rect x="312" y="641" width="264" height="137" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="156" y="682" font-size="28" fill="#a54218" font-weight="700" text-anchor="middle">Group A</text><text x="444" y="682" font-size="28" fill="#176c69" font-weight="700" text-anchor="middle">Group B</text><circle cx="136" cy="706" r="10" fill="#ffffff" stroke="#a54218" stroke-width="2"/><path d="M118 746 Q118 720 136 720 Q154 720 154 746" fill="#edf4f1" stroke="#a54218" stroke-width="3"/><circle cx="177" cy="706" r="10" fill="#ffffff" stroke="#a54218" stroke-width="2"/><path d="M159 746 Q159 720 177 720 Q195 720 195 746" fill="#edf4f1" stroke="#a54218" stroke-width="3"/><circle cx="424" cy="706" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M406 746 Q406 720 424 720 Q442 720 442 746" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><circle cx="465" cy="706" r="10" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M447 746 Q447 720 465 720 Q483 720 483 746" fill="#edf4f1" stroke="#176c69" stroke-width="3"/><text x="300" y="816" font-size="27" fill="#233344" font-weight="700" text-anchor="middle">Blinding after assignment?</text><text x="300" y="850" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">Separate feature · when feasible</text><rect x="24" y="882" width="552" height="96" rx="20" fill="#edf4f1" stroke="#b8c5ce" stroke-width="2"/><text x="42" y="916" font-size="24" fill="#233344" font-weight="500" text-anchor="start">No phase benefit ladder or fixed sample size.</text><text x="42" y="948" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Chance assignment is not proof of efficacy.</text></g></svg>
