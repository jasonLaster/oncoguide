<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">Controlled perturbation: change one thing and test the response</title><desc id="desc">Matched culture wells distinguish vehicle with carrier only, a known-response positive control, an independent disruption of the same function, and a perturbation plus restoration rescue. Each asks a distinct carrier, detection, mechanism or reversal question. Invented direct counts show 100 at baseline, 200 with vehicle and 100 with treatment, so half the endpoint count does not measure 50 percent killing. Rescue is context dependent and no one control proves target specificity or clinical relevance.</desc><rect width="600" height="1100" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#233344" font-weight="700" text-anchor="start">Each control asks a question</text><text x="28" y="86" font-size="26" fill="#46586a" font-weight="400" text-anchor="start">Matched model, timing and readout</text><rect x="24" y="120" width="552" height="140" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><circle cx="83" cy="188" r="39" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="177" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="177" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="179" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="179" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="203" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="203" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M66 128 H96 V138 H86 V148 H76 V138 H66 Z" fill="#a54218"/><circle cx="81" cy="158" r="5" fill="#ffffff" stroke="#a54218" stroke-width="2"/><text x="141" y="157" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Vehicle</text><text x="141" y="194" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Carrier; no active drug</text><text x="141" y="231" font-size="24" fill="#233344" font-weight="400" text-anchor="start">What does the carrier change?</text><rect x="24" y="276" width="552" height="140" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><circle cx="83" cy="344" r="39" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="333" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="333" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="335" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="335" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="359" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="359" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M66 284 H96 V294 H86 V304 H76 V294 H66 Z" fill="#6b4387"/><circle cx="81" cy="314" r="5" fill="#ffffff" stroke="#6b4387" stroke-width="2"/><path d="M87 311 L94 317" fill="none" stroke="#6b4387" stroke-width="2" stroke-dasharray=""/><path d="M94 311 L87 317" fill="none" stroke="#6b4387" stroke-width="2" stroke-dasharray=""/><text x="141" y="313" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Positive control</text><text x="141" y="350" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Known relevant perturbation</text><text x="141" y="387" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Can the assay detect a response?</text><rect x="24" y="432" width="552" height="140" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><circle cx="83" cy="500" r="39" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="489" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="489" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="491" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="491" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="515" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="515" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M66 440 H96 V450 H86 V460 H76 V450 H66 Z" fill="#285ea2"/><circle cx="81" cy="470" r="5" fill="#ffffff" stroke="#285ea2" stroke-width="2"/><path d="M74 467 L87 467" fill="none" stroke="#285ea2" stroke-width="2" stroke-dasharray=""/><text x="141" y="469" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Independent mechanism</text><text x="141" y="506" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Different route; same function</text><text x="141" y="543" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Does another method support it?</text><rect x="24" y="588" width="552" height="140" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><circle cx="83" cy="656" r="39" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="645" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="71" cy="645" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="647" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="96" cy="647" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="671" r="7" fill="#edf4f1" stroke="#176c69" stroke-width="2"/><circle cx="82" cy="671" r="3.8500000000000005" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M66 596 H96 V606 H86 V616 H76 V606 H66 Z" fill="#176c69"/><circle cx="81" cy="626" r="5" fill="#ffffff" stroke="#176c69" stroke-width="2"/><path d="M78 620 L78 631" fill="none" stroke="#176c69" stroke-width="2" stroke-dasharray=""/><path d="M73 625 L84 625" fill="none" stroke="#176c69" stroke-width="2" stroke-dasharray=""/><text x="141" y="625" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Rescue</text><text x="141" y="662" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Perturbation + restored function</text><text x="141" y="699" font-size="24" fill="#233344" font-weight="400" text-anchor="start">Does restoration reverse it here?</text><rect x="24" y="762" width="552" height="179" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="42" y="802" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Invented direct cell counts</text><text x="50" y="846" font-size="26" fill="#233344" font-weight="400" text-anchor="start">Start</text><text x="230" y="846" font-size="26" fill="#a54218" font-weight="400" text-anchor="start">Vehicle</text><text x="418" y="846" font-size="26" fill="#176c69" font-weight="400" text-anchor="start">Treated</text><text x="50" y="898" font-size="38" fill="#233344" font-weight="700" text-anchor="start">100</text><text x="230" y="898" font-size="38" fill="#a54218" font-weight="700" text-anchor="start">200</text><text x="418" y="898" font-size="38" fill="#176c69" font-weight="700" text-anchor="start">100</text><rect x="24" y="961" width="552" height="128" rx="20" fill="#edf4f1" stroke="#b8c5ce" stroke-width="2"/><text x="42" y="995" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Half the endpoint count ≠ 50% killing.</text><text x="42" y="1027" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Rescue depends on context; no one control</text><text x="42" y="1059" font-size="24" fill="#233344" font-weight="500" text-anchor="start">proves specificity or patient benefit.</text></g></svg>
