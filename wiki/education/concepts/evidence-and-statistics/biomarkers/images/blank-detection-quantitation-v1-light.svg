<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1590" viewBox="0 0 760 1590" role="img" aria-labelledby="title desc"><title id="title">Detection is not quantitation</title><desc id="desc">Three charts separate a fictional blank response distribution, detection probability versus known amount, and a detected result below a separately assumed quantitation limit. No clinical cutoff is supplied.</desc>
