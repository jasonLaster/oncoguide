<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Prognostic versus predictive biomarkers</title><desc id="desc">A fictional randomized trial plots bad-outcome risks by two years on a 0 to 100 percent axis. Marker-positive risks are 40 percent with comparator and 20 percent with treatment; marker-negative risks are 20 and 10 percent. Named absolute reductions are 20 and 10 percentage points, while both named treatment-to-comparator risk ratios equal 0.5. Exact invented quantities lack sampling uncertainty; separate subgroup significance is not an interaction test.</desc><rect width="600" height="1000" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="48" font-size="32" fill="#233344" font-weight="700" text-anchor="start">Same halving. Different gaps.</text><text x="28" y="86" font-size="26" fill="#46586a" font-weight="400" text-anchor="start">Fictional bad-outcome risk by two years</text><text x="30" y="128" font-size="26" fill="#233344" font-weight="700" text-anchor="start">Outcome level · percent with event</text><path d="M220 164 L220 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="220" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">0</text><path d="M280 164 L280 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="280" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">20</text><path d="M340 164 L340 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="340" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">40</text><path d="M400 164 L400 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="400" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">60</text><path d="M460 164 L460 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="460" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">80</text><path d="M520 164 L520 469" fill="none" stroke="#b8c5ce" stroke-width="1" stroke-dasharray=""/><text x="520" y="158" font-size="24" fill="#46586a" font-weight="400" text-anchor="middle">100</text><text x="28" y="211" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Marker +</text><text x="28" y="248" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Comparator</text><text x="28" y="296" font-size="24" fill="#176c69" font-weight="400" text-anchor="start">Treatment</text><rect x="220" y="229" width="120" height="27" rx="3" fill="#a54218" stroke="#a54218" stroke-width="2"/><text x="350" y="253" font-size="26" fill="#a54218" font-weight="700" text-anchor="start">40%</text><rect x="220" y="277" width="60" height="27" rx="3" fill="#176c69" stroke="#176c69" stroke-width="2"/><text x="290" y="301" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">20%</text><text x="28" y="370" font-size="27" fill="#233344" font-weight="700" text-anchor="start">Marker −</text><text x="28" y="407" font-size="24" fill="#46586a" font-weight="400" text-anchor="start">Comparator</text><text x="28" y="455" font-size="24" fill="#176c69" font-weight="400" text-anchor="start">Treatment</text><rect x="220" y="388" width="60" height="27" rx="3" fill="#a54218" stroke="#a54218" stroke-width="2"/><text x="290" y="412" font-size="26" fill="#a54218" font-weight="700" text-anchor="start">20%</text><rect x="220" y="436" width="30" height="27" rx="3" fill="#176c69" stroke="#176c69" stroke-width="2"/><text x="260" y="460" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">10%</text><rect x="24" y="504" width="552" height="155" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="44" y="542" font-size="26" fill="#233344" font-weight="700" text-anchor="start">Absolute scale · percentage points</text><text x="44" y="586" font-size="26" fill="#a54218" font-weight="700" text-anchor="start">Marker + : 40 − 20 = 20 points</text><text x="44" y="628" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">Marker − : 20 − 10 = 10 points</text><rect x="24" y="679" width="552" height="136" rx="20" fill="#ffffff" stroke="#b8c5ce" stroke-width="2"/><text x="44" y="717" font-size="26" fill="#233344" font-weight="700" text-anchor="start">Relative scale · risk ratio</text><text x="44" y="760" font-size="26" fill="#a54218" font-weight="700" text-anchor="start">Marker + : 20 ÷ 40 = 0.5</text><text x="44" y="799" font-size="26" fill="#176c69" font-weight="700" text-anchor="start">Marker − : 10 ÷ 20 = 0.5</text><rect x="24" y="838" width="552" height="128" rx="20" fill="#edf4f1" stroke="#b8c5ce" stroke-width="2"/><text x="42" y="872" font-size="24" fill="#233344" font-weight="500" text-anchor="start">Exact invented quantities; no uncertainty</text><text x="42" y="904" font-size="24" fill="#233344" font-weight="500" text-anchor="start">is supplied. Real effects need an interaction</text><text x="42" y="936" font-size="24" fill="#233344" font-weight="500" text-anchor="start">comparison, not subgroup significance.</text></g></svg>
