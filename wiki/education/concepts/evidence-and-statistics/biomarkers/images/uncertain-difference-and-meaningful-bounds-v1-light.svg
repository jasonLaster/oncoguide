<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" role="img"><title>Uncertain is not equivalent</title><desc>All values are fictional teaching quantities</desc>
<rect width="600" height="1200" fill="#fbf8f1"/>
<text x="28" y="47" fill="#243944" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Uncertain is not equivalent</text>
<text x="28" y="86" fill="#47616d" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">All values are fictional teaching quantities</text>
<rect x="22" y="112" width="556" height="444" rx="18" fill="#fffdf8" stroke="#6e8790" stroke-width="2"/>
<text x="42" y="154" fill="#243944" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Fictional randomized comparison</text>
<text x="42" y="195" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">One-year event risk difference</text>
<text x="42" y="231" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">New treatment minus control</text>
<rect x="221.66666666666666" y="278" width="156.66666666666666" height="171" rx="0" fill="#e7eee9" stroke="#e7eee9" stroke-width="2"/>
<path d="M221.66666666666666 270 L221.66666666666666 455" fill="none" stroke="#ae7225" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M378.3333333333333 270 L378.3333333333333 455" fill="none" stroke="#ae7225" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M300.0 270 L300.0 455" fill="none" stroke="#6e8790" stroke-width="2" stroke-dasharray="3 6"/>
<path d="M112.0 356 L425.33333333333337 356" fill="none" stroke="#326fa1" stroke-width="7"/>
<path d="M112.0 342 L112.0 370" fill="none" stroke="#326fa1" stroke-width="4"/>
<path d="M425.33333333333337 342 L425.33333333333337 370" fill="none" stroke="#326fa1" stroke-width="4"/>
<circle cx="268.6666666666667" cy="356" r="9" fill="#326fa1" stroke="#6e8790" stroke-width="2"/>
<text x="268.6666666666667" y="321" fill="#243944" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">−2</text>
<text x="112.0" y="402" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">−12</text>
<text x="425.33333333333337" y="402" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">+8</text>
<path d="M65 449 L535 449" fill="none" stroke="#6e8790" stroke-width="3"/>
<text x="65.0" y="489" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">−15</text>
<text x="221.66666666666666" y="489" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">−5</text>
<text x="300.0" y="489" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">0</text>
<text x="378.3333333333333" y="489" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">+5</text>
<text x="535.0" y="489" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">+15</text>
<text x="300" y="532" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">Percentage points · bar = 95% CI</text>
<rect x="22" y="582" width="556" height="222" rx="18" fill="#fffdf8" stroke="#6e8790" stroke-width="2"/>
<text x="42" y="624" fill="#243944" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Question 1: difference from zero?</text>
<text x="42" y="663" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Zero lies inside the interval.</text>
<text x="42" y="702" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">That does not establish no effect.</text>
<text x="42" y="741" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Benefit and harm remain unresolved.</text>
<rect x="22" y="830" width="556" height="276" rx="18" fill="#fffdf8" stroke="#6e8790" stroke-width="2"/>
<text x="42" y="872" fill="#243944" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Question 2: equivalence?</text>
<text x="42" y="908" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Gold lines: invented −5 / +5 bounds.</text>
<text x="42" y="945" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">The interval extends beyond both.</text>
<text x="42" y="982" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Bounds need justification in advance;</text>
<text x="42" y="1019" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">equivalence needs its own analysis.</text>
<text x="42" y="1056" fill="#243944" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">This is not a formal equivalence test.</text>
<text x="30" y="1155" fill="#243944" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">CI = confidence interval · all numbers fictional</text>
</svg>
