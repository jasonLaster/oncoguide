<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Put each label on its own object</title><desc id="desc">Three distinct objects carry their own labels: RUO belongs to the intended research purpose of a product, CLIA certification attaches to a laboratory building, and authorization attaches to the product and intended-use record. Separate scenes have no ladder or progression arrows. A note identifies an LDT by its development and use within a laboratory, not by approval status. Badges alone do not establish clinical utility, patient benefit or payment.</desc><metadata>Original authored SVG by agent:/root/batch10_author_group2; no image model used. Private candidate; expert and learner review pending. All shapes schematic, not quantitative.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b6cbd5"/></marker></defs><rect width="600" height="1000" fill="#101c28"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="100" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="52" font-size="32" font-weight="700" text-anchor="start" fill="#f3f1e8">Put each label</text><text x="32" y="87" font-size="32" font-weight="700" text-anchor="start" fill="#f3f1e8">on its own object</text><rect x="12" y="130" width="576" height="219" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="169" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">Purpose label → research product</text><rect x="45" y="221" width="65" height="92" rx="12" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><rect x="50" y="266" width="55" height="40" rx="7" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><rect x="42" y="213" width="71" height="21" rx="4" fill="#b6cbd5" stroke="#b6cbd5" stroke-width="2"/><rect x="145" y="223" width="81" height="50" rx="5" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><text x="186" y="260" font-size="28" font-weight="700" text-anchor="middle" fill="#f3f1e8">RUO</text><text x="253" y="229" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Research use only</text><text x="253" y="264" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Intended purpose</text><text x="253" y="299" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Not clinical utility</text><rect x="12" y="371" width="576" height="219" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="410" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">CLIA certification → laboratory</text><rect x="49" y="462" width="166" height="95" rx="3" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><path d="M38 462L132 422L226 462Z" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><rect x="108" y="506" width="47" height="51" rx="3" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><rect x="248" y="449" width="323" height="48" rx="8" fill="#376f60" stroke="#b6cbd5" stroke-width="2"/><text x="262" y="482" font-size="28" font-weight="700" text-anchor="start" fill="#f3f1e8">Lab quality standards</text><text x="248" y="536" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Analytical requirements</text><text x="248" y="571" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Not every clinical claim</text><rect x="12" y="612" width="576" height="220" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="651" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">Authorization → product + use</text><rect x="48" y="695" width="92" height="110" rx="7" fill="#8d692e" stroke="#b6cbd5" stroke-width="2"/><path d="M64 721L121 721" fill="none" stroke="#b6cbd5" stroke-width="4"/><path d="M64 744L121 744" fill="none" stroke="#b6cbd5" stroke-width="4"/><path d="M64 767L121 767" fill="none" stroke="#b6cbd5" stroke-width="4"/><text x="174" y="711" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Exact product record</text><text x="174" y="746" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Specified intended use</text><text x="174" y="781" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Check the actual pathway</text><rect x="12" y="852" width="576" height="136" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="893" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">LDT: developed / used within a lab.</text><text x="32" y="928" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">No ladder; no badge-to-benefit rule.</text><text x="32" y="963" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Clinical utility + payment need more.</text></g></svg>