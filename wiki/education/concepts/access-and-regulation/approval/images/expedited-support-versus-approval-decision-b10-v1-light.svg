<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Support is one question. Approval is another.</title><desc id="desc">Two separate document scenes distinguish development and review support from an actual FDA approval decision. Support documents list fast track, breakthrough therapy and priority review without an approval stamp or progression arrow. The separate decision document identifies the product and specified use, with traditional and accelerated approval as approval pathways; accelerated approval retains required benefit confirmation. A footer says that support does not guarantee approval, timing, superiority or individual access.</desc><metadata>Original authored SVG by agent:/root/batch10_author_group2; no image model used. Private candidate; expert and learner review pending. All shapes schematic, not quantitative.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486677"/></marker></defs><rect width="600" height="1000" fill="#f3f0e8"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="100" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="52" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">Support is one question.</text><text x="32" y="87" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">Approval is another.</text><rect x="12" y="130" width="576" height="335" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="169" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Development / review support</text><rect x="43" y="230" width="92" height="110" rx="7" fill="#b7dce5" stroke="#486677" stroke-width="2"/><path d="M59 256L116 256" fill="none" stroke="#486677" stroke-width="4"/><path d="M59 279L116 279" fill="none" stroke="#486677" stroke-width="4"/><path d="M59 302L116 302" fill="none" stroke="#486677" stroke-width="4"/><text x="171" y="253" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Fast track</text><text x="171" y="288" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Breakthrough therapy</text><text x="171" y="323" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Priority review</text><text x="32" y="400" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Support or review goal</text><text x="32" y="435" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">A separate approval decision remains.</text><rect x="12" y="492" width="576" height="367" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="531" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Actual approval: product + use</text><rect x="44" y="578" width="92" height="110" rx="7" fill="#b9d9c7" stroke="#486677" stroke-width="2"/><path d="M60 604L117 604" fill="none" stroke="#486677" stroke-width="4"/><path d="M60 627L117 627" fill="none" stroke="#486677" stroke-width="4"/><path d="M60 650L117 650" fill="none" stroke="#486677" stroke-width="4"/><text x="168" y="600" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">Product + exact use</text><text x="168" y="635" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">Current decision + label</text><text x="32" y="738" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Traditional approval</text><text x="32" y="773" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Accelerated approval:</text><text x="32" y="808" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">benefit confirmation required.</text><rect x="12" y="885" width="576" height="103" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="924" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Support guarantees neither approval</text><text x="32" y="959" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">nor timing, superiority or access.</text></g></svg>