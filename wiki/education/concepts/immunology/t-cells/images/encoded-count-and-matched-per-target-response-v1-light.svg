<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Three background-adjusted bars show 40, 6 and 0 spots for A, B and C with separate matched background of 5 and raw counts of 45, 11 and 5.</title><desc id="desc">In the fictional matched assay, subtracting 5 background spots from raw counts of 45, 11 and 5 gives 40, 6 and 0 spots per 200,000 plated peripheral blood mononuclear cells. Three encoded targets yield an uneven measured response; zero adjusted spots do not prove absent tumor display. These are invented teaching values, not patient data or a universal ranking.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Three targets, unequal</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Fictional • not patient data</text><rect x="10" y="122" width="580" height="537" rx="18" fill="#f7f3e9"/><text x="28" y="167" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Background-adjusted spots</text><text x="36" y="263" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">A</text><rect x="99" y="222" width="320" height="48" rx="4" fill="#166b70"/><text x="446" y="260" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">40</text><text x="97" y="312" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">45 − 5 = 40</text><text x="36" y="391" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">B</text><rect x="99" y="350" width="48" height="48" rx="4" fill="#166b70"/><text x="446" y="388" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">6</text><text x="97" y="440" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">11 − 5 = 6</text><text x="36" y="519" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">C</text><path d="M99,478 L99,526" fill="none" stroke="#166b70" stroke-width="4"/><text x="446" y="516" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">0</text><text x="97" y="568" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">5 − 5 = 0</text><text x="28" y="643" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">per 200,000 plated cells</text><rect x="10" y="671" width="580" height="153" rx="18" fill="#f7f3e9"/><text x="28" y="714" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Matched background: 5</text><circle cx="51" cy="758" r="7" fill="#a33850" stroke="#a33850" stroke-width="3"/><circle cx="85" cy="758" r="7" fill="#a33850" stroke="#a33850" stroke-width="3"/><circle cx="119" cy="758" r="7" fill="#a33850" stroke="#a33850" stroke-width="3"/><circle cx="153" cy="758" r="7" fill="#a33850" stroke="#a33850" stroke-width="3"/><circle cx="187" cy="758" r="7" fill="#a33850" stroke="#a33850" stroke-width="3"/><text x="28" y="806" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Same assay denominator</text><rect x="10" y="836" width="580" height="124" rx="18" fill="#f7f3e9"/><text x="30" y="882" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">C: zero adjusted spots</text><text x="30" y="929" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Not proof of absent display.</text></g></svg>
