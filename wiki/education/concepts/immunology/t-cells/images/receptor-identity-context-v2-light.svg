<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">Same receptor; different observations</title><desc id="desc">Two independent fictional observations carry the same paired-receptor identifier R1 but different history and program annotations: a memory-associated context and a progenitor-like exhausted context. No transition arrow connects them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#243340;--card:#fbfaf6;--mem:#d7d8df;--t:#accfe4;--co:#82a995;--h:#d6b7c8;--support:#ccbde0;--peptide:#e7b482;--field:#f5eddb;--nest:#e9c3c6}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">Same receptor; different observations</text><text x="30" y="85" class="small" text-anchor="start">Fictional IDs; separate observations</text><rect x="30" y="130" width="540" height="270" rx="12" class="card"/><circle cx="85" cy="205" r="35" class="tcell"/><text x="85" y="213" class="label" text-anchor="middle">R1</text><text x="145" y="184" class="label" text-anchor="start">Observation A</text><text x="145" y="222" class="label" text-anchor="start">Paired receptor: R1</text><text x="50" y="280" class="small" text-anchor="start">Prior response; resolved stimulation</text><text x="50" y="330" class="small" text-anchor="start">Memory-associated context</text><rect x="30" y="440" width="540" height="270" rx="12" class="card"/><circle cx="85" cy="515" r="35" class="tcell"/><text x="85" y="523" class="label" text-anchor="middle">R1</text><text x="145" y="494" class="label" text-anchor="start">Observation B</text><text x="145" y="532" class="label" text-anchor="start">Paired receptor: R1</text><text x="50" y="590" class="small" text-anchor="start">Persistent stimulation</text><text x="50" y="640" class="small" text-anchor="start">Progenitor-like exhausted context</text><text x="30" y="780" class="small" text-anchor="start">Same receptor ID is not the same state</text><text x="30" y="820" class="small" text-anchor="start">No measured transition is implied</text></svg>
