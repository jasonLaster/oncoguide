<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">A fixed encoded A and B set is compared with baseline and follow-up target-specific assay readouts, where unencoded C becomes newly detectable.</title><desc id="desc">The fictional vaccine encodes A and B throughout. A newly detected response to unencoded C adds a specificity; a larger A response alone does not. Matched baseline and follow-up assays are needed, and newly detected C does not prove a newly created receptor, vaccine causation or clinical benefit.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Larger or broader?</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Fictional • not patient data</text><rect x="10" y="122" width="580" height="174" rx="18" fill="#f7f3e9"/><text x="28" y="167" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Encoded set stays A + B</text><rect x="46" y="187" width="510" height="87" rx="24" fill="#dfebe6" stroke="#43596a" stroke-width="3"/><text x="210" y="242" font-size="36" font-weight="700" fill="#166b70" text-anchor="middle">A</text><text x="386" y="242" font-size="36" font-weight="700" fill="#a33850" text-anchor="middle">B</text><rect x="10" y="308" width="580" height="286" rx="18" fill="#f7f3e9"/><text x="28" y="353" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Matched target assays</text><text x="184" y="406" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Baseline</text><text x="374" y="406" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Follow-up</text><text x="50" y="459" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">A</text><text x="250" y="459" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">+</text><text x="459" y="459" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">+</text><path d="M306,446 L365,446" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="365.0,446.0 350.6,453.0 350.6,439.0" fill="#43596a"/><text x="50" y="512" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">B</text><text x="250" y="512" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">+</text><text x="459" y="512" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">+</text><path d="M306,499 L365,499" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="365.0,499.0 350.6,506.0 350.6,492.0" fill="#43596a"/><text x="50" y="565" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">C</text><text x="250" y="565" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">ND</text><text x="459" y="565" font-size="38" font-weight="500" fill="#182a37" text-anchor="middle">+</text><path d="M306,552 L365,552" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="365.0,552.0 350.6,559.0 350.6,545.0" fill="#43596a"/><path d="M210,191 l38,39 l-38,39 l-38,-39 Z" fill="none" stroke="#166b70" stroke-width="4"/><path d="M368,194 L404,194 L424,230 L404,266 L368,266 L348,230 Z" fill="none" stroke="#a33850" stroke-width="4"/><rect x="10" y="606" width="580" height="218" rx="18" fill="#f7f3e9"/><text x="28" y="649" font-size="40" font-weight="750" fill="#182a37">Expansion: same target</text><circle cx="83" cy="727" r="37" fill="none" stroke="#166b70" stroke-width="4"/><text x="83" y="739" text-anchor="middle" font-size="36" fill="#182a37" font-weight="700">A</text><circle cx="283" cy="727" r="37" fill="none" stroke="#166b70" stroke-width="4"/><text x="283" y="739" text-anchor="middle" font-size="36" fill="#182a37" font-weight="700">A</text><circle cx="392" cy="727" r="37" fill="none" stroke="#166b70" stroke-width="4"/><text x="392" y="739" text-anchor="middle" font-size="36" fill="#182a37" font-weight="700">A</text><circle cx="501" cy="727" r="37" fill="none" stroke="#166b70" stroke-width="4"/><text x="501" y="739" text-anchor="middle" font-size="36" fill="#182a37" font-weight="700">A</text><path d="M141,727 L223,727" stroke="#43596a" stroke-width="4"/><path d="M223,727 l-15,-9 v18 Z" fill="#43596a"/><text x="28" y="801" font-size="36" fill="#182a37">More A is not a new target.</text><rect x="10" y="836" width="580" height="124" rx="18" fill="#f7f3e9"/><text x="30" y="882" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">ND = not detected</text><text x="30" y="929" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">New C: cause / benefit unproven</text></g></svg>
