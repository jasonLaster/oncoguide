<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">Same PD-1 marker; different tested targets</title><desc id="desc">Two equal-looking fictional six-symbol populations both have PD-1 observed near cancer cells, but paired receptor tags differ: R1 has a viral-peptide response and R2 a tumor-peptide response in controlled tests. Natural tumor display, access and killing remain unestablished.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#243340;--card:#fbfaf6;--mem:#d7d8df;--t:#accfe4;--co:#82a995;--h:#d6b7c8;--support:#ccbde0;--peptide:#e7b482;--field:#f5eddb;--nest:#e9c3c6}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">Same PD-1 marker; different tested targets</text><text x="30" y="85" class="small" text-anchor="start">Fictional observations and IDs</text><rect x="30" y="125" width="540" height="385" rx="12" class="card"/><text x="50" y="167" class="label" text-anchor="start">R1 — PD-1 observed</text><rect x="385" y="190" width="140" height="115" rx="12" class="nest"/><text x="395" y="327" class="small" text-anchor="start">Near cancer</text><circle cx="75" cy="225" r="17" class="tcell" id="R1-cell-1"/><circle cx="140" cy="225" r="17" class="tcell" id="R1-cell-2"/><circle cx="205" cy="225" r="17" class="tcell" id="R1-cell-3"/><circle cx="75" cy="285" r="17" class="tcell" id="R1-cell-4"/><circle cx="140" cy="285" r="17" class="tcell" id="R1-cell-5"/><circle cx="205" cy="285" r="17" class="tcell" id="R1-cell-6"/><text x="50" y="368" class="small" text-anchor="start">Controlled test: Viral peptide</text><text x="50" y="410" class="small" text-anchor="start">Observed: peptide response</text><text x="50" y="453" class="small" text-anchor="start">State not assigned by PD-1</text><text x="50" y="490" class="small" text-anchor="start">Not a natural tumor-killing assay</text><rect x="30" y="545" width="540" height="385" rx="12" class="card"/><text x="50" y="587" class="label" text-anchor="start">R2 — PD-1 observed</text><rect x="385" y="610" width="140" height="115" rx="12" class="nest"/><text x="395" y="747" class="small" text-anchor="start">Near cancer</text><circle cx="75" cy="645" r="17" class="tcell" id="R2-cell-1"/><circle cx="140" cy="645" r="17" class="tcell" id="R2-cell-2"/><circle cx="205" cy="645" r="17" class="tcell" id="R2-cell-3"/><circle cx="75" cy="705" r="17" class="tcell" id="R2-cell-4"/><circle cx="140" cy="705" r="17" class="tcell" id="R2-cell-5"/><circle cx="205" cy="705" r="17" class="tcell" id="R2-cell-6"/><text x="50" y="788" class="small" text-anchor="start">Controlled test: Tumor peptide</text><text x="50" y="830" class="small" text-anchor="start">Observed: peptide response</text><text x="50" y="873" class="small" text-anchor="start">State not assigned by PD-1</text><text x="50" y="910" class="small" text-anchor="start">Not a natural tumor-killing assay</text><text x="30" y="1010" class="small" text-anchor="start">Natural display / access / killing: open</text><text x="30" y="1050" class="small" text-anchor="start">No receptor rewrite or rescue promise</text></svg>
