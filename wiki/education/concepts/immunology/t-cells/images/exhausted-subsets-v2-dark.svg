<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" role="img" aria-labelledby="title desc"><title id="title">Tpex is distinct from ordinary memory</title><desc id="desc">Ordinary memory is separate from a scoped exhausted-subset inset. Only progenitor-like exhausted to more differentiated exhausted has a dashed model-scoped descendant connector; no clinical outcome arrow is present.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#e9edf0;--card:#1e2a35;--mem:#5a6370;--t:#587f98;--co:#527667;--h:#82596e;--support:#6c5c85;--peptide:#9f6a36;--field:#393629;--nest:#67474b}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">Tpex is distinct from ordinary memory</text><text x="30" y="85" class="small" text-anchor="start">Schematic / fictional example as labeled</text><rect x="30" y="125" width="540" height="185" rx="12" class="card"/><text x="50" y="167" class="label" text-anchor="start">Ordinary memory</text><text x="50" y="213" class="label" text-anchor="start">A separate context</text><text x="50" y="250" class="label" text-anchor="start">for renewed responses.</text><rect x="30" y="370" width="540" height="185" rx="12" class="card"/><text x="50" y="412" class="label" text-anchor="start">Progenitor-like exhausted</text><text x="50" y="458" class="label" text-anchor="start">Persistent-stimulation context</text><text x="50" y="495" class="label" text-anchor="start">can sustain a response.</text><rect x="30" y="650" width="540" height="185" rx="12" class="card"/><text x="50" y="692" class="label" text-anchor="start">More differentiated exhausted</text><text x="50" y="738" class="label" text-anchor="start">Distinct capacities; not</text><text x="50" y="775" class="label" text-anchor="start">uniformly inert.</text><path id="exhausted-descendant-only" d="M550 555 L550 645" class="descendant" marker-end="url(#arrow)"/><text x="30" y="590" class="small" text-anchor="start">Selected tumor models; persistent</text><text x="30" y="624" class="small" text-anchor="start">TCR stimulation; not a memory arrow</text><text x="30" y="900" class="small" text-anchor="start">TCF1 alone does not assign a category</text></svg>
