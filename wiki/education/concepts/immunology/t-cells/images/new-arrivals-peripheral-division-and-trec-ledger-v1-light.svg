<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">A thymic-arrival and peripheral-maintenance sketch is followed by a fictional two-cell to four-cell ledger retaining four total TREC circles while average copies per cell fall.</title><desc id="desc">In this invented closed ledger, 2 cells carrying 4 total T-cell receptor excision circles (TRECs) divide into 4 cells with the same 4 circles: the average falls from 2 to 1 copy per cell. The uneven allocation shown is one illustration. The ledger isolates division; it does not measure ongoing thymic arrivals, immune age or daily output.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Arrivals and maintenance</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Different sources of cells</text><rect x="10" y="122" width="580" height="157" rx="18" fill="#f7f3e9"/><text x="28" y="168" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Thymus</text><text x="315" y="168" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Peripheral pool</text><path d="M184,177 L292,177" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="292.0,177.0 277.6,184.0 277.6,170.0" fill="#43596a"/><text x="28" y="231" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">New arrivals</text><text x="325" y="231" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Survive / divide</text><rect x="10" y="291" width="580" height="220" rx="18" fill="#f7f3e9"/><text x="28" y="336" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Fictional closed ledger</text><text x="28" y="383" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Before: 2 cells, 4 circles</text><circle cx="167" cy="444" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="167" cy="444" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M139.05,469.8 L147.65,467.65" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="152" cy="438" r="9" fill="none" stroke="#866016" stroke-width="3"/><circle cx="182" cy="457" r="9" fill="none" stroke="#866016" stroke-width="3"/><circle cx="410" cy="444" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="410" cy="444" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M382.05,469.8 L390.65,467.65" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="395" cy="438" r="9" fill="none" stroke="#866016" stroke-width="3"/><circle cx="425" cy="457" r="9" fill="none" stroke="#866016" stroke-width="3"/><rect x="10" y="523" width="580" height="245" rx="18" fill="#f7f3e9"/><text x="28" y="568" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">After division: 4 cells</text><circle cx="90" cy="625" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="90" cy="625" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M62.05,650.8 L70.65,648.65" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="74" cy="624" r="8" fill="none" stroke="#866016" stroke-width="3"/><circle cx="88" cy="642" r="8" fill="none" stroke="#866016" stroke-width="3"/><circle cx="230" cy="625" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="230" cy="625" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M202.05,650.8 L210.65,648.65" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="370" cy="625" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="370" cy="625" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M342.05,650.8 L350.65,648.65" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="510" cy="625" r="43" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="510" cy="625" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M482.05,650.8 L490.65,648.65" fill="none" stroke="#166b70" stroke-width="4"/><text x="28" y="707" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Total circles: 4 → 4</text><text x="28" y="754" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Copies / cell: 2 → 1</text><rect x="10" y="780" width="580" height="180" rx="18" fill="#f7f3e9"/><text x="28" y="823" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">TREC circles do not copy.</text><text x="28" y="872" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Allocation need not be even.</text><text x="28" y="921" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">This does not count arrivals.</text><circle cx="354" cy="624" r="8" fill="none" stroke="#866016" stroke-width="3"/><circle cx="494" cy="624" r="8" fill="none" stroke="#866016" stroke-width="3"/></g></svg>
