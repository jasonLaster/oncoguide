<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" role="img" aria-labelledby="title desc"><title id="title">State labels need response history</title><desc id="desc">Four separate context cards define naive, effector, memory and exhaustion using response-history and program annotations. No arrows join them into a universal developmental sequence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#e9edf0;--card:#1e2a35;--mem:#5a6370;--t:#587f98;--co:#527667;--h:#82596e;--support:#6c5c85;--peptide:#9f6a36;--field:#393629;--nest:#67474b}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">State labels need response history</text><text x="30" y="85" class="small" text-anchor="start">Schematic / fictional example as labeled</text><rect x="30" y="120" width="540" height="185" rx="12" class="card"/><text x="50" y="162" class="title" text-anchor="start">Naive</text><text x="50" y="208" class="label" text-anchor="start">Initial antigen-driven activation</text><text x="50" y="245" class="label" text-anchor="start">has not yet occurred.</text><rect x="30" y="340" width="540" height="185" rx="12" class="card"/><text x="50" y="382" class="title" text-anchor="start">Effector</text><text x="50" y="428" class="label" text-anchor="start">Response functions develop</text><text x="50" y="465" class="label" text-anchor="start">after activation; jobs vary.</text><rect x="30" y="560" width="540" height="185" rx="12" class="card"/><text x="50" y="602" class="title" text-anchor="start">Memory</text><text x="50" y="648" class="label" text-anchor="start">Persistence and potential</text><text x="50" y="685" class="label" text-anchor="start">for a renewed response.</text><rect x="30" y="780" width="540" height="185" rx="12" class="card"/><text x="50" y="822" class="title" text-anchor="start">Exhaustion</text><text x="50" y="868" class="label" text-anchor="start">Persistent-stimulation program</text><text x="50" y="905" class="label" text-anchor="start">with altered function.</text><text x="30" y="1020" class="small" text-anchor="start">No universal trajectory arrows</text></svg>
