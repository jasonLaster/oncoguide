<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Costimulation</title><desc id="desc">The same peptide–HLA recognition is compared with present and absent CD80/CD86 support for CD28; a separate scene shows CTLA-4 can remove shared ligands.</desc>
