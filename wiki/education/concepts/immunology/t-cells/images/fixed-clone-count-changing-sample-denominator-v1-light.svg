<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Two identical rows of ten clonotype A cells accompany sampled denominators of 1000 and 100 and fractions of 1 and 10 percent.</title><desc id="desc">The fictional sampled count of clonotype A stays at 10, while the sampled denominator falls from 1,000 to 100. Its fraction rises from 1% to 10% without a larger sampled count. These are not patient data or calibrated whole-body counts, and the fraction does not identify an antigen.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Same cells, new fraction</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Fictional • not patient data</text><rect x="10" y="122" width="580" height="275" rx="18" fill="#f7f3e9"/><text x="28" y="168" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Baseline</text><circle cx="53" cy="215" r="19" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="53" cy="215" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M40.65,226.4 L44.45,225.45" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="108" cy="215" r="19" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="108" cy="215" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M95.65,226.4 L99.45,225.45" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="163" cy="215" r="19" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="163" cy="215" r="10" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M150.65,226.4 L154.45,225.45" fill="none" stroke="#166b70" stroke-width="4"/><circle cx="218" cy="215" r="19" fill="none" stroke="#166b70" stroke-width="3"/><circle cx="218" cy="215" r="10" fill="#166b70" stroke="#166b70" stroke-widt