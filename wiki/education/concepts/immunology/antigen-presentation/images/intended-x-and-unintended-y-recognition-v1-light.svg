<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Tumor-associated antigen</title><desc id="desc">Two fictional comparisons separate intended X recognition on tumor and healthy cells by a CAR from an X-directed T-cell receptor that also recognizes peptide Y.</desc>
