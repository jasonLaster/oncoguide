<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1900" viewBox="0 0 600 1900" role="img" aria-labelledby="title desc">
<title id="title">Antigen origin and three class-I display routes</title>
<desc id="desc">Direct presentation uses protein made and processed by the presenting cell. Cross-presentation receives external protein and processes it onto recipient HLA. Cross-dressing receives an intact donor-surface peptide–HLA complex; upstream peptide origin is unspecified. The three matched cell scenes show provenance rather than one intracellular mechanism. Display and uptake do not establish priming.</desc>
<defs><marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#586b74"/></marker></defs>
