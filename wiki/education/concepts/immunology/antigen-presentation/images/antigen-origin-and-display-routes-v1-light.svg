<path d="M412,458 L412,423" stroke="#465860" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" id="direct-presenter-cell-leader"/>
<g id="direct-presenter-display" data-origin="presenter" data-connected-peptide-hla="true" transform="translate(412 147)">
<path d="M-24,-45 L-24,-30 Q-22,-20 0,-20 Q22,-20 24,-30 L24,-45" stroke="#427e78" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M0,-20 L0,0" stroke="#427e78" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
