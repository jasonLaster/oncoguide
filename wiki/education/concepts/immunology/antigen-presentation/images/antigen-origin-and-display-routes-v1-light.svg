<g font-family="Arial, Helvetica, sans-serif">
<text x="300" y="46" font-size="32" text-anchor="middle" font-weight="700" fill="#26343b">Where did antigen start?</text>
<text x="300" y="88" font-size="32" text-anchor="middle" font-weight="700" fill="#26343b">What did this cell receive?</text>
