<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc"><title id="title">Which contacts inspect class I?</title><desc id="desc">Schematic conventional class-I contact: a membrane-anchored heavy chain holds a peptide beside B2M; the T-cell receptor meets peptide plus HLA, while a separately anchored CD8 contacts a lower HLA region.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#e9edf0;--card:#1e2a35;--mem:#5a6370;--t:#587f98;--co:#527667;--h:#82596e;--support:#6c5c85;--peptide:#9f6a36;--field:#393629;--nest:#67474b}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">Which contacts inspect class I?</text><text x="30" y="85" class="small" text-anchor="start">Schematic / fictional example as labeled</text><rect x="35" y="150" width="530" height="30" rx="12" class="membrane" id="t-cell-membrane"/><rect x="35" y="530" width="530" height="30" rx="12" class="membrane" id="presenting-cell-membrane"/><text x="35" y="125" class="label" text-anchor="start">T-cell membrane</text><text x="35" y="602" class="label" text-anchor="start">Presenting-cell membrane</text><path id="TCR" d="M270 150 L270 230 Q248 260 258 310 L270 338 M310 150 L310 230 Q332 260 322 310 L310 338" class="receptor"/><text x="35" y="230" class="label" text-anchor="start">T-cell receptor</text><line x1="225" y1="235" x2="266" y2="250" class="leader"/><path id="heavy-chain" d="M290 350 L290 565" class="hla-chain"/><ellipse cx="290" cy="435" rx="32" ry="72" class="hla"/><circle cx="235" cy="440" r="25" class="support" id="B2M"/><text x="35" y="390" class="label" text-anchor="start">Heavy chain</text><line x1="205" y1="390" x2="275" y2="418" class="leader"/><text x="35" y="475" class="label" text-anchor="start">B2M</text><line x1="100" y1="470" x2="217" y2="450" class="leader"/><path id="HLA-groove" d="M250 332 Q250 372 290 375 Q330 372 330 332" class="groove"/><path id="TCR-recognition-surface" d="M270 338 L310 338" class="receptor"/><rect x="275" y="338" width="30" height="10" rx="12" class="peptide" id="bound-peptide"/><text x="35" y="315" class="label" text-anchor="start">Bound peptide</text><line x1="215" y1="321" x2="275" y2="343" class="leader" id="bound-peptide-leader"/><path id="CD8" d="M447 150 Q455 250 420 330 Q392 405 321 455 M465 150 Q476 270 441 350 Q416 418 325 463" class="coreceptor"/><text x="500" y="260" class="label" text-anchor="start">CD8</text><line x1="492" y1="254" x2="468" y2="254" class="leader" id="coreceptor-label-leader"/><circle cx="321" cy="455" r="6" class="contact" id="coreceptor-contact"/><circle cx="290" cy="340" r="2" fill="none" stroke="var(--ink)" stroke-width="1" id="TCR-recognition-contact"/><text x="30" y="650" class="small" text-anchor="start">Separate contacts; no function promise</text></svg>
