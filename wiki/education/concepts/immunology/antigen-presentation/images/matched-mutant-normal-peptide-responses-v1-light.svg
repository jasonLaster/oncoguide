<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc"><title id="title">A sequence difference does not guarantee a selective receptor response.</title><desc id="desc">Invented loaded-peptide concentration-response chart: at the same 1, 10, 100 and 1000 nanomolar concentrations, one receptor responds to both mutant and normal peptides after 24 hours. Natural processing and clinical safety remain untested.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607789"/></marker></defs>
