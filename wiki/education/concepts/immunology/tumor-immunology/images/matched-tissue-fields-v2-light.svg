<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1500" role="img" aria-labelledby="title desc"><title id="title">Equal totals; different locations</title><desc id="desc">Three matching fictional tumor-tissue fields show eight specified T-cell symbols in both inflamed and excluded patterns, relocated from mainly inside cancer-cell regions to surrounding stroma; a desert field has two. Symbol count is distinct from a stromal-area score.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><style>:root{--ink:#243340;--card:#fbfaf6;--mem:#d7d8df;--t:#accfe4;--co:#82a995;--h:#d6b7c8;--support:#ccbde0;--peptide:#e7b482;--field:#f5eddb;--nest:#e9c3c6}svg{color:var(--ink)}text{font-family:Arial,sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:600}.label{font-size:25px}.small{font-size:23px}.card{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.membrane{fill:var(--mem);stroke:var(--ink);stroke-width:1.5}.leader{stroke:var(--ink);stroke-width:1.5;fill:none}.receptor{stroke:var(--t);stroke-width:17;fill:none;stroke-linecap:round}.coreceptor{stroke:var(--co);stroke-width:9;fill:none;stroke-linecap:round}.hla-chain{stroke:var(--h);stroke-width:13;fill:none}.hla,.groove{fill:var(--h);stroke:var(--ink);stroke-width:1.5}.support{fill:var(--support);stroke:var(--ink);stroke-width:1.5}.peptide{fill:var(--peptide);stroke:var(--ink);stroke-width:1}.contact{fill:var(--ink)}.field{fill:var(--field);stroke:var(--ink);stroke-width:1}.nest{fill:var(--nest);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4}.tcell{fill:var(--t);stroke:var(--ink);stroke-width:1.5}.descendant{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;fill:none}</style><rect width="100%" height="100%" fill="var(--card)"/><text x="30" y="45" class="title" text-anchor="start">Equal totals; different locations</text><text x="30" y="85" class="small" text-anchor="start">Fictional sampled tumor fields</text><text x="30" y="130" class="label" text-anchor="start">Inflamed: 8 T-cell symbols</text><rect x="40" y="150" width="520" height="300" rx="12" class="field" id="field-0"/><rect x="180" y="210" width="220" height="160" rx="12" class="nest" id="nest-0"/><text x="195" y="190" class="small" text-anchor="start">Cancer-cell region</text><text x="65" y="435" class="small" text-anchor="start">Stroma</text><circle cx="230" cy="250" r="14" class="tcell" id="inflamed-symbol-1"/><circle cx="290" cy="250" r="14" class="tcell" id="inflamed-symbol-2"/><circle cx="350" cy="250" r="14" class="tcell" id="inflamed-symbol-3"/><circle cx="230" cy="330" r="14" class="tcell" id="inflamed-symbol-4"/><circle cx="290" cy="330" r="14" class="tcell" id="inflamed-symbol-5"/><circle cx="350" cy="330" r="14" class="tcell" id="inflamed-symbol-6"/><circle cx="100" cy="300" r="14" class="tcell" id="inflamed-symbol-7"/><circle cx="490" cy="300" r="14" class="tcell" id="inflamed-symbol-8"/><text x="30" y="560" class="label" text-anchor="start">Excluded: 8 T-cell symbols</text><rect x="40" y="580" width="520" height="300" rx="12" class="field" id="field-1"/><rect x="180" y="640" width="220" height="160" rx="12" class="nest" id="nest-1"/><text x="195" y="620" class="small" text-anchor="start">Cancer-cell region</text><text x="65" y="865" class="small" text-anchor="start">Stroma</text><circle cx="100" cy="650" r="14" class="tcell" id="excluded-symbol-1"/><circle cx="490" cy="650" r="14" class="tcell" id="excluded-symbol-2"/><circle cx="100" cy="730" r="14" class="tcell" id="excluded-symbol-3"/><circle cx="490" cy="730" r="14" class="tcell" id="excluded-symbol-4"/><circle cx="150" cy="830" r="14" class="tcell" id="excluded-symbol-5"/><circle cx="300" cy="840" r="14" class="tcell" id="excluded-symbol-6"/><circle cx="450" cy="830" r="14" class="tcell" id="excluded-symbol-7"/><circle cx="440" cy="610" r="14" class="tcell" id="excluded-symbol-8"/><text x="30" y="990" class="label" text-anchor="start">Desert: 2 T-cell symbols</text><rect x="40" y="1010" width="520" height="300" rx="12" class="field" id="field-2"/><rect x="180" y="1070" width="220" height="160" rx="12" class="nest" id="nest-2"/><text x="195" y="1050" class="small" text-anchor="start">Cancer-cell region</text><text x="65" y="1295" class="small" text-anchor="start">Stroma</text><circle cx="100" cy="1160" r="14" class="tcell" id="desert-symbol-1"/><circle cx="490" cy="1160" r="14" class="tcell" id="desert-symbol-2"/><text x="30" y="1380" class="small" text-anchor="start">Same first-two totals; positions differ</text><text x="30" y="1420" class="small" text-anchor="start">Count is not a stromal-area score</text><text x="30" y="1460" class="small" text-anchor="start">Region outlines are not proven walls</text></svg>
