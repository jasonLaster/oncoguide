<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc"><title id="title">Locate signals, vessel changes and responders before interpreting whether inflammation helps.</title><desc id="desc">A tissue cross-section locates a blood vessel, recruited white cells, fluid and proteins, and signals near damaged tissue. The response can support containment and repair or persist and injure; permeability is not angiogenesis.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9bafc2"/></marker></defs>
