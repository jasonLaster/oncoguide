<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Extracellular ATP and ADP pass through CD39 and CD73 to adenosine and a cell-surface receptor; a separate intracellular IDO1 route starts tryptophan breakdown.</title><desc id="desc">Follow the chemistry and the location: surface enzymes generate extracellular adenosine for a receptor, while intracellular IDO1 starts tryptophan breakdown. The kynurenine-pathway arrow summarizes several downstream steps. Component expression does not establish local activity or inhibitor benefit.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Two metabolic routes</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Enzyme ≠ receptor</text><rect x="10" y="122" width="580" height="375" rx="18" fill="#f7f3e9"/><text x="28" y="167" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Outside cells</text><text x="34" y="223" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">ATP / ADP</text><text x="410" y="223" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">AMP</text><path d="M220,215 L392,215" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="392.0,215.0 377.6,222.0 377.6,208.0" fill="#43596a"/><text x="257" y="195" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">CD39</text><text x="350" y="300" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">CD73</text><path d="M456,241 L456,320" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="456.0,320.0 449.0,305.6 463.0,305.6" fill="#43596a"/><text x="266" y="360" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Adenosine</text><path d="M285,380 L200,421" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="200.0,421.0 210.0,408.5 216.0,421.0" fill="#43596a"/><path d="M30,439 Q200,414 571,439" fill="none" stroke="#166b70" stroke-width="7"/><path d="M167,434 L167,408 L192,424 L218,408 L218,434" fill="none" stroke="#166b70" stroke-width="6"/><text x="249" y="475" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">A2A receptor</text><rect x="10" y="509" width="580" height="315" rx="18" fill="#f7f3e9"/><text x="28" y="554" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Inside a producing cell</text><rect x="38" y="573" width="524" height="184" rx="72" fill="#dfebe6" stroke="#43596a" stroke-width="3"/><text x="77" y="620" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Tryptophan</text><path d="M285,646 L285,684" fill="none" stroke="#43596a" stroke-width="4"/><polygon points="285.0,684.0 278.0,669.6 292.0,669.6" fill="#43596a"/><text x="325" y="667" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">IDO1</text><text x="90" y="730" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Kynurenine pathway</text><text x="28" y="805" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Local supply + metabolites</text><rect x="10" y="836" width="580" height="124" rx="18" fill="#f7f3e9"/><text x="30" y="882" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Test activity and effects.</text><text x="30" y="929" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">Expression alone cannot.</text></g></svg>
