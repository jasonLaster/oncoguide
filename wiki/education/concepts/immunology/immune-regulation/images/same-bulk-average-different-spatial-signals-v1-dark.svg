<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Two equal-sized compartment pairs show 0 and 20 versus 10 and 10 pg/mL, both averaging 10, beside a compatible receptor and traversable route.</title><desc id="desc">Both fictional preparations average 10 pg/mL across equal-sized compartments, but only A has a concentration difference. Dots illustrate the pattern, not individual molecules or a physiological gradient. Receptors, signal presentation and traversable routes still matter; these values are not patient data or a dose.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#1c2d3d"/><text x="30" y="45" font-size="42" font-weight="750" fill="#f6f0df" text-anchor="start">Same mean, new pattern</text><text x="30" y="88" font-size="36" font-weight="500" fill="#f6f0df" text-anchor="start">Fictional • not patient data</text><rect x="10" y="122" width="580" height="254" rx="18" fill="#1c2d3d"/><text x="28" y="165" font-size="40" font-weight="750" fill="#f6f0df" text-anchor="start">A: uneven</text><rect x="32" y="182" width="252" height="110" rx="13" fill="#314a58" stroke="#abc7d8" stroke-width="3"/><text x="158" y="229" font-size="42" font-weight="700" fill="#f6f0df" text-anchor="middle">0</text><rect x="314" y="182" width="252" height="110" rx="13" fill="#314a58" stroke="#abc7d8" stroke-width="3"/><text x="440" y="229" font-size="42" font-weight="700" fill="#f6f0df" text-anchor="middle">20</text><circle cx="331" cy="254" r="4" fill="#6ed1ca" stroke="#6ed1ca" stroke-width="3"/><circle cx="354" cy="254" r="4" fill="#6ed1ca" stroke="#6ed1ca" stroke-width="3"/><circle cx="377" cy="254" r="4" fill="#6ed1ca" stroke="#6ed1ca" stroke-width="3"/><circle cx="400" cy="254" r="4" fill="#6ed1ca" stroke="#6ed1ca" stroke-width="3"/><circle cx="423" cy="254" r="4" fill="#6ed1ca" stroke="#6ed1ca" stroke-width="3"/><circle cx="446" cy="254" r="4