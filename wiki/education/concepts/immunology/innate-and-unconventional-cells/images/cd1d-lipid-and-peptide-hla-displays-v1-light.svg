<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Natural killer T (NKT) cells</title><desc id="desc">An illustrative iNKT T-cell receptor contacts lipid displayed by CD1d, compared with a conventional T-cell receptor contacting peptide displayed by HLA.</desc>
