<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc"><title id="title">Describe several measured programs together; test the relevant function separately.</title><desc id="desc">Invented 24-hour macrophage RNA program scores compare profiles A and B on interferon, lipid handling and antigen-display axes. Several programs coexist; a program score is neither an independent control nor a measured function.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607789"/></marker></defs>
