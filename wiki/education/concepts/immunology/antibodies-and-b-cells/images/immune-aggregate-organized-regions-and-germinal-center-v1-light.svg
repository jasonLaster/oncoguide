<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Three tissue scenes distinguish mixed T and B cells, separate T and B regions, and a B-cell follicle containing a germinal center.</title><desc id="desc">Three tissue arrangements, not a required developmental sequence: a loose aggregate, organized T/B regions, and a follicle with a demonstrated germinal center. Study-specific architecture and marker criteria determine maturity; counts alone establish neither maturity nor treatment benefit.</desc><g font-family="Arial, sans-serif"><rect x="10" y="0" width="580" height="110" rx="18" fill="#f7f3e9"/><text x="30" y="45" font-size="42" font-weight="750" fill="#182a37" text-anchor="start">Read the arrangement</text><text x="30" y="88" font-size="36" font-weight="500" fill="#182a37" text-anchor="start">T cells: circles   B: diamonds</text><rect x="10" y="122" width="580" height="223" rx="18" fill="#f7f3e9"/><text x="28" y="167" font-size="40" font-weight="750" fill="#182a37" text-anchor="start">Loose aggregate</text><path d="M50,205 Q280,187 551,214 L551,285 Q290,309 50,282 Z" fill="#dfebe6" stroke="#43596a" stroke-width="2"/><path d="M85,214 l13,13 l-13,13 l-13,-13 Z" fill="#a33850"/><circle cx="185" cy="227" r="12" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M285,214 l13,13 l-13,13 l-13,-13 Z" fill="#a33850"/><circle cx="385" cy="227" r="12" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M485,214 l13,13 l-13,13 l-13,-13 Z" fill="#a33850"/><circle cx="85" cy="252" r="12" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M185,239 l13,13 l-13,13 l-13,-13 Z" fill="#a33850"/><circle cx="285" cy="252" r="12" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M385,239 l13,13 l-13,13 l-13,-13 Z" fill="#a33850"/><circle cx="485" cy="252" r="12" fill="#166b70" stroke="#166b70" stroke-width="3"/><path d="M85,264 l13,13 l-13,13 l-13,-13 Z" fill="