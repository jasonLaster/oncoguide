<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">Same tips, different contacts</title><desc id="desc">Matched IgG sketches retain the same green target-binding tips while selected Fc receptor and complement contacts are reduced; a separate vesicle asks about FcRn recycling.</desc><rect width="600" height="1100" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="28" y="45" font-size="32" text-anchor="start" fill="#203346" font-weight="700">Same tips, different contacts</text><text x="28" y="84" font-size="26" text-anchor="start" fill="#203346" font-weight="500">A matched IgG comparison</text><rect x="18" y="112" width="564" height="320" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="148" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="156" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">1</text><text x="78" y="157" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Hold recognition constant</text><text x="153" y="195" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Comparison</text><text x="439" y="195" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Selected change</text><path d="M96 222 L153 280 L210 222" fill="none" stroke="#267898" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 222 L116 242 M210 222 L190 242" fill="none" stroke="#277e70" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 279 L146 347 M160 279 L160 347" fill="none" stroke="#267898" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M382 222 L439 280 L496 222" fill="none" stroke="#87519b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M382 222 L402 242 M496 222 L476 242" fill="none" stroke="#277e70" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M432 279 L432 347 M446 279 L446 347" fill="none" stroke="#87519b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="404" font-size="26" text-anchor="middle" fill="#277e70" font-weight="500">Same green target-binding tips</text><rect x="18" y="452" width="564" height="280" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="488" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="496" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">2</text><text x="78" y="497" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Ask which contact changed</text><text x="45" y="554" font-size="26" text-anchor="start" fill="#203346" font-weight="500">Fc gamma</text><text x="45" y="586" font-size="26" text-anchor="start" fill="#203346" font-weight="500">receptor</text><text x="325" y="554" font-size="26" text-anchor="start" fill="#203346" font-weight="500">Complement</text><text x="325" y="586" font-size="26" text-anchor="start" fill="#203346" font-weight="500">C1q</text><path d="M 293 548 L 293 596 M 307 548 L 307 596" fill="none" stroke="#87519b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M139 664 L139 622 M123 604 Q139 632 155 604" fill="none" stroke="#277e70" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="638" r="27" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><path d="M 150 610 L 279 596" fill="none" stroke="#87519b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M 389 620 L 321 596" fill="none" stroke="#87519b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="300" y="700" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Reduced is a tested comparison</text><rect x="18" y="752" width="564" height="270" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="788" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="796" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">3</text><text x="78" y="797" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Recycling is a separate job</text><circle cx="135" cy="890" r="57" fill="#eee1f1" stroke="#87519b" stroke-width="3"/><g transform="translate(135 880) scale(.58)"><path d="M-57 -50 L0 8 L57 -50" fill="none" stroke="#267898" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M-57 -50 L-37 -30 M57 -50 L37 -30" fill="none" stroke="#277e70" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 7 L-7 75 M7 7 L7 75" fill="none" stroke="#267898" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 35 L47 -7 M31 -25 Q47 3 63 -25" fill="none" stroke="#87519b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="235" y="864" font-size="26" text-anchor="start" fill="#203346" font-weight="500">FcRn in a vesicle</text><text x="235" y="896" font-size="26" text-anchor="start" fill="#203346" font-weight="500">Binding? Exposure?</text><text x="235" y="928" font-size="26" text-anchor="start" fill="#203346" font-weight="500">Measure separately.</text><text x="300" y="1065" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">Schematic contacts; no safety ranking</text></g></svg>