<path d="M395 316 L375 321" fill="none" stroke="#344b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M274 385 L326 385" fill="none" stroke="#344b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
