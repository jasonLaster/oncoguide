<ellipse cx="348" cy="443" rx="43" ry="29" fill="#e5eef4" stroke="#176599" stroke-width="4"/>
<text x="348" y="454" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#182c42">CH2</text>
<ellipse cx="343" cy="534" rx="43" ry="29" fill="#e5eef4" stroke="#176599" stroke-width="4"/>
