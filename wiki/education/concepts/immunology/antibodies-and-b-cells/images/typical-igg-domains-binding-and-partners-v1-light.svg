<text x="461" y="535" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#182c42">Fc</text>
<path d="M450 522 L384 496" fill="none" stroke="#344b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="603" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#182c42">V: variable     C: constant</text>
<rect x="12" y="648" width="576" height="240" rx="24" fill="#fffaf0"/>
<text x="32" y="692" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#182c42">Fab contains V and C domains.</text>
<path d="M54 730 L98 730" fill="none" stroke="#176599" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="113" y="742" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#176599">Heavy chain</text>
<path d="M339 730 L378 730" fill="none" stroke="#704697" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="390" y="742" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#704697">Light chain</text>
<text x="32" y="790" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#182c42">Fc: heavy-chain CH2 + CH3.</text>
<text x="32" y="838" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#182c42">Fc partners may engage;</text>
<text x="32" y="879" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#182c42">binding does not guarantee killing.</text>
