<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Antibody structure</title><desc id="desc">A typical IgG antibody with two heavy and two light chains; variable and constant domains are labeled, Fab includes both types and Fc contains CH2 and CH3 domains from both heavy chains.</desc>
<rect x="12" y="12" width="576" height="100" rx="24" fill="#fffaf0"/>
<text x="32" y="54" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#182c42">A typical IgG molecule</text>
<text x="32" y="96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#344b60">Two binding tips; a partner region</text>
<rect x="12" y="124" width="576" height="510" rx="24" fill="#fffaf0"/>
<text x="32" y="169" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#182c42">2 heavy + 2 light chains</text>
<path d="M209 224 L245 307 L275 390 L252 443 L257 534" fill="none" stroke="#176599" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M147 235 L185 318" fill="none" stroke="#704697" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
