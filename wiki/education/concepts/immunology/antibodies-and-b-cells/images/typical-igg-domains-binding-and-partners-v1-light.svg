<text x="252" y="454" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#182c42">CH2</text>
<ellipse cx="257" cy="534" rx="43" ry="29" fill="#e5eef4" stroke="#176599" stroke-width="4"/>
