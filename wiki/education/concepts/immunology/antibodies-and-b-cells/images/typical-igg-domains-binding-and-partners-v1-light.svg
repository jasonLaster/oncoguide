<text x="185" y="329" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#182c42">CL</text>
<path d="M172 244 L192 255" fill="none" stroke="#344b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M205 316 L225 321" fill="none" stroke="#344b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M391 224 L355 307 L325 390 L348 443 L343 534" fill="none" stroke="#176599" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
