<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1540" viewBox="0 0 780 1540" role="img" aria-labelledby="title desc"><title id="title">A mark, a reader, a blocked pocket</title><desc id="desc">Three stacked molecular comparisons retain the same DNA-wrapped histone and acetyl mark on a histone tail. A continuous generic BET protein contains two bromodomains, BD1 and BD2, and an extra-terminal interaction region, ET. The first comparison shows acetyl-mark recognition at a pocket. The second places an inhibitor in that pocket while the mark and other protein regions remain. The third uses a dashed outline to indicate less reader protein after depletion, a distinct perturbation requiring verification. One representative pocket is drawn; the illustration does not claim single-domain specificity, identical BET family functions or a clinical response.</desc><metadata>Original code-authored SVG; image model null; creation source commit null; proposal only.</metadata><defs><style>.panel{stroke:#fffdf7;}.ink{fill:#24343e;stroke:none;}.muted{fill:#435c66;stroke:none;}.edge{stroke:#456474;}.dna{stroke:#416b7d;}.glyphborder{stroke:#24343e;}.panel{fill:#fffdf7;stroke:#456474;} .glyphtext{fill:#24343e;stroke:none;} text{font-family:Arial,Helvetica,sans-serif;} path,circle,rect{stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456474"/></marker></defs><rect width="780" height="1540" fill="#faf6ed"/><text x="42" y="64" font-size="42" font-weight="700" class="ink" text-anchor="start">A mark is not its reader</text><text x="42" y="114" font-size="32" font-weight="400" class="muted" text-anchor="start">Compare three operations on the same mark</text><rect x="34" y="145" width="712" height="377" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="198" font-size="32" font-weight="700" class="ink" text-anchor="start">1 • Reader recognizes an acetyl mark</text><circle cx="170" cy="375" r="59" fill="#b4c9dc" class="edge" stroke-width="6.0" /><circle cx="170" cy="375" r="59" fill="#b4c9dc" class="glyphborder" stroke-width="3" /><circle cx="156" cy="357" r="15" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="156" cy="357" r="15" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><circle cx="190" cy="388" r="16" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="190" cy="388" r="16" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><path d="M73 405 C92 310 249 310 267 381 C260 445 111 453 83 384" class="dna" stroke-width="8" fill="none" /><path d="M206 353 Q225 310 248 310 L320 310" class="edge" stroke-width="9" fill="none" /><path d="M310 310 V285" class="edge" stroke-width="4" fill="none" /><circle cx="310" cy="274" r="16" fill="#e8b66b" class="edge" stroke-width="6.0" /><circle cx="310" cy="274" r="16" fill="#e8b66b" class="glyphborder" stroke-width="3" /><g transform="translate(-55 0)"><path d="M349 257 Q349 222 380 222 H401 Q426 222 426 253 V298 Q426 320 402 320 H380 Q349 320 349 289 L368 289 Q389 273 368 257 Z" class="edge" stroke-width="7.0" fill="#c6b5d5" /><path d="M349 257 Q349 222 380 222 H401 Q426 222 426 253 V298 Q426 320 402 320 H380 Q349 320 349 289 L368 289 Q389 273 368 257 Z" class="glyphborder" stroke-width="4" fill="#c6b5d5" /><path d="M426 275 H690" class="edge" stroke-width="10" fill="none" /><rect x="454" y="226" width="85" height="95" rx="26" fill="#c6b5d5" class="edge" stroke-width="6.0" /><rect x="454" y="226" width="85" height="95" rx="26" fill="#c6b5d5" class="glyphborder" stroke-width="3" /><rect x="586" y="242" width="104" height="68" rx="20" fill="#a8c9bc" class="edge" stroke-width="6.0" /><rect x="586" y="242" width="104" height="68" rx="20" fill="#a8c9bc" class="glyphborder" stroke-width="3" /><text x="355" y="370" font-size="32" font-weight="400" class="ink" text-anchor="start">BD1</text><text x="462" y="370" font-size="32" font-weight="400" class="ink" text-anchor="start">BD2</text><text x="608" y="370" font-size="32" font-weight="400" class="ink" text-anchor="start">ET</text></g><text x="75" y="240" font-size="32" font-weight="400" class="ink" text-anchor="start">Acetyl mark</text><path d="M269 241 L292 262" class="edge" stroke-width="2" fill="none" /><text x="81" y="498" font-size="32" font-weight="400" class="ink" text-anchor="start">Histone + DNA</text><text x="377" y="498" font-size="32" font-weight="700" class="ink" text-anchor="start">BET reader</text><rect x="34" y="544" width="712" height="377" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="597" font-size="32" font-weight="700" class="ink" text-anchor="start">2 • Pocket occupied by an inhibitor</text><circle cx="170" cy="774" r="59" fill="#b4c9dc" class="edge" stroke-width="6.0" /><circle cx="170" cy="774" r="59" fill="#b4c9dc" class="glyphborder" stroke-width="3" /><circle cx="156" cy="756" r="15" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="156" cy="756" r="15" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><circle cx="190" cy="787" r="16" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="190" cy="787" r="16" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><path d="M73 804 C92 709 249 709 267 780 C260 844 111 852 83 783" class="dna" stroke-width="8" fill="none" /><path d="M206 752 Q225 709 248 709 L320 709" class="edge" stroke-width="9" fill="none" /><path d="M310 709 V684" class="edge" stroke-width="4" fill="none" /><circle cx="310" cy="673" r="16" fill="#e8b66b" class="edge" stroke-width="6.0" /><circle cx="310" cy="673" r="16" fill="#e8b66b" class="glyphborder" stroke-width="3" /><path d="M349 656 Q349 621 380 621 H401 Q426 621 426 652 V697 Q426 719 402 719 H380 Q349 719 349 688 L368 688 Q389 672 368 656 Z" class="edge" stroke-width="7.0" fill="#c6b5d5" /><path d="M349 656 Q349 621 380 621 H401 Q426 621 426 652 V697 Q426 719 402 719 H380 Q349 719 349 688 L368 688 Q389 672 368 656 Z" class="glyphborder" stroke-width="4" fill="#c6b5d5" /><path d="M426 674 H690" class="edge" stroke-width="10" fill="none" /><rect x="454" y="625" width="85" height="95" rx="26" fill="#c6b5d5" class="edge" stroke-width="6.0" /><rect x="454" y="625" width="85" height="95" rx="26" fill="#c6b5d5" class="glyphborder" stroke-width="3" /><rect x="586" y="641" width="104" height="68" rx="20" fill="#a8c9bc" class="edge" stroke-width="6.0" /><rect x="586" y="641" width="104" height="68" rx="20" fill="#a8c9bc" class="glyphborder" stroke-width="3" /><circle cx="365" cy="672" r="16" fill="#e49f87" class="edge" stroke-width="6.0" /><circle cx="365" cy="672" r="16" fill="#e49f87" class="glyphborder" stroke-width="3" /><path d="M356 666 l17 13" class="edge" stroke-width="2" fill="none" /><text x="355" y="769" font-size="32" font-weight="400" class="ink" text-anchor="start">BD1</text><text x="462" y="769" font-size="32" font-weight="400" class="ink" text-anchor="start">BD2</text><text x="608" y="769" font-size="32" font-weight="400" class="ink" text-anchor="start">ET</text><text x="65" y="644" font-size="32" font-weight="400" class="ink" text-anchor="start">The mark stays.</text><text x="65" y="897" font-size="32" font-weight="700" class="ink" text-anchor="start">Other protein regions remain.</text><rect x="34" y="943" width="712" height="377" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="996" font-size="32" font-weight="700" class="ink" text-anchor="start">3 • Deplete the protein: a different test</text><circle cx="170" cy="1173" r="59" fill="#b4c9dc" class="edge" stroke-width="6.0" /><circle cx="170" cy="1173" r="59" fill="#b4c9dc" class="glyphborder" stroke-width="3" /><circle cx="156" cy="1155" r="15" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="156" cy="1155" r="15" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><circle cx="190" cy="1186" r="16" fill="#b4c9dc" class="edge" stroke-width="4.5" /><circle cx="190" cy="1186" r="16" fill="#b4c9dc" class="glyphborder" stroke-width="1.5" /><path d="M73 1203 C92 1108 249 1108 267 1179 C260 1243 111 1251 83 1182" class="dna" stroke-width="8" fill="none" /><path d="M206 1151 Q225 1108 248 1108 L320 1108" class="edge" stroke-width="9" fill="none" /><path d="M310 1108 V1083" class="edge" stroke-width="4" fill="none" /><circle cx="310" cy="1072" r="16" fill="#e8b66b" class="edge" stroke-width="6.0" /><circle cx="310" cy="1072" r="16" fill="#e8b66b" class="glyphborder" stroke-width="3" /><path d="M349 1055 Q349 1020 380 1020 H401 Q426 1020 426 1051 V1096 Q426 1118 402 1118 H380 Q349 1118 349 1087 L368 1087 Q389 1071 368 1055 Z" class="edge" stroke-width="4" fill="none" stroke-dasharray="8 8"/><path d="M426 1073 H690" class="edge" stroke-width="10" fill="none" stroke-dasharray="8 8"/><rect x="454" y="1024" width="85" height="95" rx="26" fill="none" class="edge" stroke-width="3" stroke-dasharray="8 8"/><rect x="586" y="1040" width="104" height="68" rx="20" fill="none" class="edge" stroke-width="3" stroke-dasharray="8 8"/><text x="65" y="1043" font-size="32" font-weight="400" class="ink" text-anchor="start">The mark stays.</text><text x="370" y="1215" font-size="32" font-weight="700" class="ink" text-anchor="start">Less reader protein</text><text x="65" y="1296" font-size="32" font-weight="400" class="ink" text-anchor="start">Verify depletion and test its consequences.</text><text x="42" y="1398" font-size="32" font-weight="400" class="ink" text-anchor="start">Reader ≠ writer • occupancy ≠ depletion</text><text x="42" y="1438" font-size="32" font-weight="400" class="ink" text-anchor="start">BET family members are not interchangeable.</text><text x="42" y="1510" font-size="32" font-weight="400" class="muted" text-anchor="start">Selected interactions • shapes are not to scale</text></svg>
