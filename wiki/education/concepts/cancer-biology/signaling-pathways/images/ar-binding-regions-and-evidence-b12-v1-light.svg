<text x="43" y="1309" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#203d49" text-anchor="start">Does growth require this program?</text>
<text x="43" y="1382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#203d49" text-anchor="start">Location or RNA ≠ growth dependence.</text>
