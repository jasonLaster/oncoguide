<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1130" viewBox="0 0 600 1130" role="img"><title>NRF2: change the turnover</title><desc>A specific example of selected protein cargo</desc>
<rect width="600" height="1130" fill="#14252d"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#f4eee0"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-2 2L2-2 M0 9L9 0 M7 11L11 7" stroke="#f4eee0" stroke-width="1.5" opacity=".5"/></pattern></defs>
<text x="28" y="49" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f4eee0" text-anchor="start">NRF2: change the turnover</text>
<text x="28" y="91" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#c0cbd0" text-anchor="start">A specific example of selected protein cargo</text>
<rect x="20" y="135" width="560" height="360" rx="18" fill="#203740" stroke="#56717b" stroke-width="2"/>
<text x="40" y="179" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">1  Suitable unstressed conditions</text>
<rect x="42" y="221" width="221" height="95" rx="18" fill="#416f61" stroke="#56717b" stroke-width="2"/>
<text x="152" y="259" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="middle">KEAP1 adaptor</text>
<text x="152" y="293" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="middle">CUL3 complex</text>
<line x1="263" y1="268" x2="340" y2="268" stroke="#f4eee0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="357" y="226" width="178" height="83" rx="35" fill="#b98b40" stroke="#56717b" stroke-width="2"/>
<text x="446" y="278" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4eee0" text-anchor="middle">NRF2</text>
<text x="42" y="358" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f4eee0" text-anchor="start">Tagging favors turnover</text>
<text x="42" y="402.0" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">Proteasome removes selected NRF2.</text>
<rect x="20" y="535" width="560" height="360" rx="18" fill="#203740" stroke="#56717b" stroke-width="2"/>
<text x="40" y="579" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">2  Stress can change regulation</text>
<rect x="42" y="621" width="221" height="95" rx="18" fill="#416f61" stroke="#56717b" stroke-width="2"/>
<text x="152" y="659" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="middle">KEAP1 adaptor</text>
<text x="152" y="693" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="middle">CUL3 complex</text>
<line x1="263" y1="668" x2="340" y2="668" stroke="#f4eee0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="357" y="626" width="178" height="83" rx="35" fill="#b98b40" stroke="#56717b" stroke-width="2"/>
<text x="446" y="678" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4eee0" text-anchor="middle">NRF2</text>
<text x="42" y="758" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f4eee0" text-anchor="start">Tagging / turnover can fall</text>
<text x="42" y="802.0" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">More NRF2 can become available</text>
<text x="42" y="837.1" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">for nuclear gene regulation.</text>
<rect x="25" y="930" width="550" height="160" rx="18" fill="#625875" stroke="#56717b" stroke-width="2"/>
<text x="43" y="972" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">Binding need not be lost.</text>
<text x="43" y="1012" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">CUL3 also serves other substrates.</text>
<text x="43" y="1052" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#f4eee0" text-anchor="start">Defense amount ≠ dependence.</text>
</svg>
