</g><rect x="20" y="1410" width="860" height="405" rx="18" fill="#fffdf7" stroke="#9ab0b5" stroke-width="2" /><text x="30" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#18333e">Lipids, proteins,</text>
<text x="30" y="105" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#18333e">two mTOR complexes</text>
<text x="45" y="179" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">Membrane lipids</text>
<text x="180" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">PIP2</text>
<text x="720" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">PIP3</text>
<text x="450" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Class I PI3K: adds phosphate</text>
<text x="450" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">PTEN: removes 3-phosphate</text>
<text x="45" y="560" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">Cell interior</text>
<text x="190" y="643" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">PDK1</text>
<text x="665" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">mTORC2</text>
<text x="665" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">mTOR + rictor</text>
<text x="665" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">AKT1 protein</text>
<text x="220" y="745" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Thr308</text>
<text x="642" y="743" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Ser473</text>
<text x="590" y="560" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Recruitment</text>
<text x="640" y="883" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Via other</text>
<text x="640" y="935" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">regulators</text>
<text x="665" y="991" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">mTORC1</text>
<text x="665" y="1043" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">mTOR + raptor</text>
<text x="60" y="933" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Resource</text>
<text x="60" y="985" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">cues</text>
<text x="235" y="1178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">Protein-production</text>
<text x="235" y="1230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">control</text>
<text x="710" y="1178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">Can restrain</text>
<text x="710" y="1230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">initiation</text>
<text x="235" y="1365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Protein substrates</text>
<text x="545" y="1340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Autophagy</text>
<text x="710" y="1392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">initiation</text>
<text x="45" y="1460" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">Possible response after</text>
<text x="45" y="1512" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#18333e">a C1-directed perturbation</text>
<text x="45" y="1567" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Regulator phosphorylation ↓</text>
<text x="45" y="1619" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Later AKT1 Ser473 signal ↑</text>
<text x="45" y="1671" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Growth unchanged</text>
<text x="45" y="1740" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Timing alone does not</text>
<text x="45" y="1792" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">prove the connection.</text>
<text x="30" y="1855" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="400" fill="#18333e">Selected routes; no benefit inference.</text>
