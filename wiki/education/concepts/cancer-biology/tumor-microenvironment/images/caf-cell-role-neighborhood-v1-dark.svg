<text x="52" y="799" fill="#f5eedb" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">Green spindle cells: fibroblasts</text>
<text x="52" y="839" fill="#f5eedb" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Stroma also includes matrix and vessels.</text>
<rect x="20" y="900" width="560" height="325" rx="20" fill="#203b44" stroke="#617e84" stroke-width="2"/>
<text x="40" y="943" fill="#f5eedb" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Possible jobs, not one fixed effect</text>
<text x="40" y="988" fill="#f5eedb" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Solid arrow: make or remodel matrix</text>
<text x="40" y="1033" fill="#f5eedb" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Dashed arrows: exchange signals</text>
<text x="40" y="1088" fill="#f5eedb" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">State and context change the outcome.</text>
<text x="40" y="1133" fill="#f5eedb" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">More fibroblasts alone does not prove</text>
<text x="40" y="1169" fill="#f5eedb" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">immune exclusion or a harmful effect.</text>
<text x="28" y="1298" fill="#f5eedb" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Cartoon shapes identify roles, not stain markers.</text>
