<text x="94" y="724" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Longer paths can limit availability</text>
<text x="57" y="804" fill="#19363e" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Dots: oxygen symbols, not a concentration.</text>
<text x="57" y="844" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Cells consume oxygen along the way.</text>
<rect x="20" y="909" width="560" height="340" rx="20" fill="#fffdf7" stroke="#b9c8c4" stroke-width="2"/>
<text x="40" y="952" fill="#19363e" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">The balance can vary across a tumor</text>
<text x="40" y="999" fill="#19363e" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Supply: flow and delivery to this region</text>
<text x="40" y="1044" fill="#19363e" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Demand: local oxygen consumption</text>
<text x="40" y="1098" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">A shortage in one region does not mean</text>
<text x="40" y="1134" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">every region has the same oxygen level.</text>
<text x="40" y="1191" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">A HIF response is not an oxygen meter.</text>
<text x="28" y="1318" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">No universal distance cutoff is depicted.</text>
<text x="28" y="1357" fill="#19363e" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">HIF: hypoxia-inducible factor</text>
