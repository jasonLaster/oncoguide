<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Ferroptosis: death through uncontrolled lipid oxidation</title><desc id="desc">A schematic lipid bilayer patch contains illustrative oxidized tails, with GPX4/glutathione and FSP1/coenzyme-Q defenses shown as separate examples rather than a complete ferroptosis diagnosis. A selected membrane patch locates oxidized lipid tails; the icons do not specify an actual lipid composition, atom count or assay signal. Here OOH marks a lipid hydroperoxide and OH its alcohol product. GPX4 with glutathione can reduce lipid hydroperoxides, while FSP1 regenerates reduced coenzyme Q as a parallel radical-trapping defense. These are examples within a larger protection network. General ROS, protein abundance or the sketch alone cannot diagnose ferroptosis or predict compound sensitivity.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
