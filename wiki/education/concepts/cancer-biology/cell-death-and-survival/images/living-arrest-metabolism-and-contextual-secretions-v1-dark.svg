<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Cellular senescence</title><desc id="desc">An intact living cell has separate division-arrest, metabolism and variable-secretion branches, followed by a distinct contextual-neighbor panel with no fixed secreted mixture or prescribed outcome. This conceptual living cell separates arrested division, continuing metabolism and possible secretions. It is not a marker-defined specimen or a claim that every senescent cell releases the same mixture. The neighboring cells represent separate context-dependent tests of the actual signals, cell identities and timing. Low proliferation with p21 alone does not establish durable senescence, harmful secretions or inevitable relapse; no universal arrest duration is specified.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f1ecd9" text-anchor="start">Still alive; division held in arrest</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Conceptual state; establish it with evidence</text>
<rect x="24" y="142" width="712" height="478" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="195" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">Separate the cell’s ongoing jobs</text>
<circle cx="173" cy="399" r="94" fill="#e5a0ab" stroke="#293743" stroke-width="2" />
<circle cx="168" cy="404" r="34.78" fill="#bfa9db" stroke="#293743" stroke-width="2" />
<ellipse cx="146" cy="433" rx="20" ry="10" fill="#dfc79f" stroke="#293743" stroke-width="2"/>
<ellipse cx="215" cy="420" rx="22" ry="11" fill="#dfc79f" stroke="#293743" stroke-width="2"/>
<path d="M291 325 L331 325" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="369" y="307" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">Division: arrest</text>
<text x="369" y="352" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Follow over time</text>
<path d="M291 433 L331 433" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="369" y="414" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">Metabolism</text>
<text x="369" y="459" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Can continue</text>
<path d="M173 521 L173 560" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<circle cx="131" cy="580" r="10" fill="#8fbedc" stroke="#293743" stroke-width="2" />
<circle cx="178" cy="580" r="10" fill="#edc585" stroke="#293743" stroke-width="2" />
<circle cx="220" cy="580" r="10" fill="#b0c395" stroke="#293743" stroke-width="2" />
<text x="357" y="564" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">Secretions vary</text>
<text x="357" y="609" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Measure the mix</text>
<rect x="24" y="641" width="712" height="417" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="694" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">Neighbors need their own tests</text>
<circle cx="119" cy="856" r="45" fill="#e5a0ab" stroke="#293743" stroke-width="2" />
<circle cx="114" cy="861" r="16.65" fill="#bfa9db" stroke="#293743" stroke-width="2" />
<circle cx="219" cy="821" r="11" fill="#edc585" stroke="#293743" stroke-width="2" />
<circle cx="272" cy="856" r="11" fill="#8fbedc" stroke="#293743" stroke-width="2" />
<circle cx="242" cy="900" r="11" fill="#b0c395" stroke="#293743" stroke-width="2" />
<path d="M303 856 L373 856" fill="none" stroke="#f1ecd9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<circle cx="470" cy="810" r="41" fill="#8fbedc" stroke="#293743" stroke-width="2" />
<circle cx="465" cy="815" r="15.17" fill="#bfa9db" stroke="#293743" stroke-width="2" />
<circle cx="601" cy="915" r="41" fill="#b0c395" stroke="#293743" stroke-width="2" />
<circle cx="596" cy="920" r="15.17" fill="#bfa9db" stroke="#293743" stroke-width="2" />
<text x="414" y="754" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f1ecd9" text-anchor="start">Context matters</text>
<text x="414" y="982" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Cells / signals</text>
<text x="414" y="1027" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">time / environment</text>
<text x="48" y="1130" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Low division + p21 is not enough.</text>
<text x="48" y="1175" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Secreted signals are a separate question.</text>
<text x="38" y="1250" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Arrest is not death or inevitable relapse.</text>
<text x="38" y="1295" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Senescence is not a synonym for aging.</text>
</svg>
