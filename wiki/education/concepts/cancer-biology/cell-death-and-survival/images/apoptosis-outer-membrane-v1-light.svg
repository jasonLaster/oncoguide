<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
<title id="title">Where cytochrome c leaves the mitochondrion</title>
<desc id="desc">BH3-only proteins promote the mitochondrial death route; survival proteins restrain death-promoting partners. Activated BAX or BAK forms pores in the outer mitochondrial membrane. Cytochrome c crosses from the intermembrane space through that membrane into the cytosol. The folded inner membrane separates the intermembrane space from the matrix. Released cytochrome c supports apoptosome assembly and caspase-9 activation. This enlarged local cutaway omits detailed protein interactions and crista remodeling.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#00695a"/></marker>
<marker id="release" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L13 6.5 L0 13" fill="#a64155"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182d38;font-size:24px} .small{font-size:22px;fill:#4e606b} .bold{font-weight:700} .pro{fill:#00695a} .anti{fill:#8b4a29} .cyto{fill:#a64155}</style>
</defs>
