<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">ER sensors lead to different molecular readouts</title><desc id="desc">Three ER-spanning sensors lead to different outputs: IRE1 toward XBP1 RNA splice forms, PERK toward a phosphate on eIF2α, and ATF6 through Golgi cleavage to a released fragment in the nucleus, with compartment boundaries shown. The unfolded protein response (UPR) includes distinct sensors in the endoplasmic reticulum (ER). The sketches separate IRE1-associated XBP1 RNA processing, PERK-associated eIF2α phosphorylation, and ATF6 transport to Golgi processing followed by nuclear entry of a released fragment. RNA segments and molecular shapes are schematic. Total XBP1 is not its splice-form fraction, other kinases can phosphorylate eIF2α, and one branch does not establish the whole response, cell death or dependency.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
