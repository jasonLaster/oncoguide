<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1560" viewBox="0 0 600 1560" role="img"><title>Who remains under pressure?</title><desc>Fictional controlled comparison · toy counts</desc>
<rect width="600" height="1560" fill="#14252d"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#f4eee0"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-2 2L2-2 M0 9L9 0 M7 11L11 7" stroke="#f4eee0" stroke-width="1.5" opacity=".5"/></pattern></defs>
<text x="28" y="49" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f4eee0" text-anchor="start">Who remains under pressure?</text>
<text x="28" y="91" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#c0cbd0" text-anchor="start">Fictional controlled comparison · toy counts</text>
<text x="30" y="137" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="start">A = population recognized by A-reactive T cells</text>
<text x="30" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="start">B = population lacking antigen A from the start</text>
<rect x="20" y="225" width="560" height="340" rx="18" fill="#203740" stroke="#56717b" stroke-width="2"/>
<text x="40" y="268" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">1  Same starting mix in both arms</text>
<text x="48" y="354" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">A</text>
<rect x="120" y="325" width="152.0" height="38" rx="3" fill="#b98b40" stroke="none" stroke-width="2"/>
<text x="281.0" y="354" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">80</text>
<text x="48" y="420" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">B</text>
<rect x="120" y="391" width="38.0" height="38" rx="3" fill="#416f61" stroke="none" stroke-width="2"/>
<text x="167.0" y="420" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">20</text>
<line x1="120" y1="445" x2="500" y2="445" stroke="#c0cbd0" stroke-width="2"/>
<line x1="120.0" y1="439" x2="120.0" y2="452" stroke="#c0cbd0" stroke-width="2"/>
<text x="120.0" y="482" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">0</text>
<line x1="310.0" y1="439" x2="310.0" y2="452" stroke="#c0cbd0" stroke-width="2"/>
<text x="310.0" y="482" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">100</text>
<line x1="500.0" y1="439" x2="500.0" y2="452" stroke="#c0cbd0" stroke-width="2"/>
<text x="500.0" y="482" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">200</text>
<text x="42" y="532" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f4eee0" text-anchor="start">B is 20 / 100 = 20% of the total.</text>
<rect x="20" y="610" width="560" height="340" rx="18" fill="#203740" stroke="#56717b" stroke-width="2"/>
<text x="40" y="653" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">2  Without A-reactive T cells</text>
<text x="48" y="739" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">A</text>
<rect x="120" y="710" width="304.0" height="38" rx="3" fill="#b98b40" stroke="none" stroke-width="2"/>
<text x="433.0" y="739" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">160</text>
<text x="48" y="805" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">B</text>
<rect x="120" y="776" width="76.0" height="38" rx="3" fill="#416f61" stroke="none" stroke-width="2"/>
<text x="205.0" y="805" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">40</text>
<line x1="120" y1="830" x2="500" y2="830" stroke="#c0cbd0" stroke-width="2"/>
<line x1="120.0" y1="824" x2="120.0" y2="837" stroke="#c0cbd0" stroke-width="2"/>
<text x="120.0" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">0</text>
<line x1="310.0" y1="824" x2="310.0" y2="837" stroke="#c0cbd0" stroke-width="2"/>
<text x="310.0" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">100</text>
<line x1="500.0" y1="824" x2="500.0" y2="837" stroke="#c0cbd0" stroke-width="2"/>
<text x="500.0" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">200</text>
<text x="42" y="917" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f4eee0" text-anchor="start">B is 40 / 200 = 20% of the total.</text>
<rect x="20" y="995" width="560" height="340" rx="18" fill="#203740" stroke="#56717b" stroke-width="2"/>
<text x="40" y="1038" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">3  With A-reactive T cells</text>
<text x="48" y="1124" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">A</text>
<rect x="120" y="1095" width="19.0" height="38" rx="3" fill="#b98b40" stroke="none" stroke-width="2"/>
<text x="148.0" y="1124" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">10</text>
<text x="48" y="1190" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f4eee0" text-anchor="start">B</text>
<rect x="120" y="1161" width="76.0" height="38" rx="3" fill="#416f61" stroke="none" stroke-width="2"/>
<text x="205.0" y="1190" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f4eee0" text-anchor="start">40</text>
<line x1="120" y1="1215" x2="500" y2="1215" stroke="#c0cbd0" stroke-width="2"/>
<line x1="120.0" y1="1209" x2="120.0" y2="1222" stroke="#c0cbd0" stroke-width="2"/>
<text x="120.0" y="1252" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">0</text>
<line x1="310.0" y1="1209" x2="310.0" y2="1222" stroke="#c0cbd0" stroke-width="2"/>
<text x="310.0" y="1252" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">100</text>
<line x1="500.0" y1="1209" x2="500.0" y2="1222" stroke="#c0cbd0" stroke-width="2"/>
<text x="500.0" y="1252" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#f4eee0" text-anchor="middle">200</text>
<text x="42" y="1302" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f4eee0" text-anchor="start">B is 40 / 50 = 80% of the total.</text>
<text x="30" y="1391" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#f4eee0" text-anchor="start">All bars use the same 0–200 cell-count scale.</text>
<text x="30" y="1445" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#f4eee0" text-anchor="start">Compare arms at the same later observation.</text>
<text x="30" y="1480" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#f4eee0" text-anchor="start">The surviving B population was already there.</text>
<text x="30" y="1515" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#f4eee0" text-anchor="start">This does not assign a phase to a person’s cancer.</text>
</svg>
