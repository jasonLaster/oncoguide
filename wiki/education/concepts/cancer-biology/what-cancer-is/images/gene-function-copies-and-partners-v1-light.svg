<text x="300" y="323" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="300" dy="0">Product</tspan></text>
<text x="48" y="363" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">Activity does not establish dependence.</tspan></text>
