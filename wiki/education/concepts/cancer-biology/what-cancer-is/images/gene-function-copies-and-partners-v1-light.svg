<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">Four functional mechanisms</title><desc id="desc">Simple two-copy illustrations distinguish an overactive growth product from loss of both useful copies, one retained useful copy with insufficient protective output, and altered-protein interference with a useful partner. Glyphs are schematic rather than actual subunit counts. Two hits are not universal; the p27 challenged-mouse and selected TP53 myeloid-model examples retain their scope in the owner. Activity does not demonstrate dependence or treatment benefit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536b6a"/></marker><pattern id="unknown" patternUnits="userSpaceOnUse" width="18" height="18"><path d="M0 18 L18 0" stroke="#cad0c4" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="780" height="1360" rx="0" fill="#faf4e9" />
<text x="40" y="62" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Four ways function can change</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#536b6a" text-anchor="start"><tspan x="40" dy="0">Illustrative two-copy examples</tspan></text>
