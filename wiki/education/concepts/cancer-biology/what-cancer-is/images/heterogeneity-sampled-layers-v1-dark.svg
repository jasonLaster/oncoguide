<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">DNA, RNA state and surface target are separate layers</title><desc id="desc">An illustrative tissue field contains two sampled regions. R1 has A+B detected and a target-rich pattern; R2 has A detected with B not detected and a target-poor pattern. Both RNA-state symbols appear on both DNA-pattern outlines. An unsampled third site is explicitly unknown, not another inferred genetic branch. A candidate shared A tree represents only sampled DNA evidence. Cell glyphs are illustrative, not a census or response estimate.</desc>
