<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1500" viewBox="0 0 780 1500" role="img" aria-labelledby="title desc"><title id="title">What did the fork copy?</title><desc id="desc">A rightward-moving replication fork opens parental DNA; new strands trail behind, with synthesis machinery simplified. Live cells receive a 30-minute IdU pulse then a 30-minute CldU pulse. Extracted stretched toy molecules have identical first-label lengths and second-label lengths of 15 and 7.5 micrometres. At the stated example calibration of 2 kilobases per micrometre, second-pulse speeds are 1 and 0.5 kilobases per minute. These selected tracks do not measure cell-cycle composition, breaks, recovery or survival.</desc><metadata>Original code-authored SVG; image model null; creation source commit null; proposal only.</metadata><defs><style>.panel{stroke:#1d333c;}.ink{fill:#f3eee1;stroke:none;}.muted{fill:#d0dce0;stroke:none;}.edge{stroke:#accbd3;}.dna{stroke:#a6c6d1;}.glyphborder{stroke:#24343e;}.panel{fill:#1d333c;stroke:#accbd3;} .glyphtext{fill:#24343e;stroke:none;} text{font-family:Arial,Helvetica,sans-serif;} path,circle,rect{stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#accbd3"/></marker></defs><rect width="780" height="1500" fill="#14242b"/><text x="42" y="65" font-size="42" font-weight="700" class="ink" text-anchor="start">What did the fork copy?</text><text x="42" y="116" font-size="32" font-weight="400" class="muted" text-anchor="start">A fork → a timed label → a measured track</text><rect x="34" y="151" width="712" height="408" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="203" font-size="36" font-weight="700" class="ink" text-anchor="start">1 • Locate the moving fork</text><path d="M80 280 Q235 280 440 355 L700 355" class="dna" stroke-width="8" fill="none" /><path d="M80 462 Q235 462 440 385 L700 385" class="dna" stroke-width="8" fill="none" /><path d="M474 359 L474 381" class="edge" stroke-width="3" fill="none" /><path d="M504 359 L504 381" class="edge" stroke-width="3" fill="none" /><path d="M534 359 L534 381" class="edge" stroke-width="3" fill="none" /><path d="M564 359 L564 381" class="edge" stroke-width="3" fill="none" /><path d="M594 359 L594 381" class="edge" stroke-width="3" fill="none" /><path d="M624 359 L624 381" class="edge" stroke-width="3" fill="none" /><path d="M654 359 L654 381" class="edge" stroke-width="3" fill="none" /><path d="M684 359 L684 381" class="edge" stroke-width="3" fill="none" /><path d="M90 307 Q230 307 380 354" stroke-width="16" class="edge" fill="none" stroke="#a8c9bc"/><path d="M90 307 Q230 307 380 354" stroke-width="14" class="glyphborder" fill="none" stroke="#a8c9bc"/><path d="M90 307 Q230 307 380 354" class="nascent" stroke-width="10" fill="none" stroke="#a8c9bc"/><path d="M95 435 Q155 435 207 420" stroke="#a8c9bc" stroke-width="16" class="edge" fill="none"/><path d="M95 435 Q155 435 207 420" stroke="#a8c9bc" stroke-width="14" class="glyphborder" fill="none"/><path d="M95 435 Q155 435 207 420" stroke="#a8c9bc" stroke-width="10" fill="none"/><path d="M236 410 Q290 397 334 380" stroke="#a8c9bc" stroke-width="16" class="edge" fill="none"/><path d="M236 410 Q290 397 334 380" stroke="#a8c9bc" stroke-width="14" class="glyphborder" fill="none"/><path d="M236 410 Q290 397 334 380" stroke="#a8c9bc" stroke-width="10" fill="none"/><path d="M358 373 L388 367" stroke="#a8c9bc" stroke-width="16" class="edge" fill="none"/><path d="M358 373 L388 367" stroke="#a8c9bc" stroke-width="14" class="glyphborder" fill="none"/><path d="M358 373 L388 367" stroke="#a8c9bc" stroke-width="10" fill="none"/><circle cx="405" cy="366" r="34" fill="#b4c9dc" class="edge" stroke-width="6.0" /><circle cx="405" cy="366" r="34" fill="#b4c9dc" class="glyphborder" stroke-width="3" /><path d="M390 369 Q405 351 420 369" class="edge" stroke-width="3" fill="none" /><path d="M492 279 L660 279" class="edge" stroke-width="4" fill="none" marker-end="url(#arrow)" /><text x="477" y="251" font-size="32" font-weight="400" class="ink" text-anchor="start">Fork motion</text><text x="66" y="254" font-size="32" font-weight="400" class="ink" text-anchor="start">New DNA</text><path d="M171 262 L186 323" class="edge" stroke-width="2" fill="none" /><text x="486" y="437" font-size="32" font-weight="400" class="ink" text-anchor="start">Parent DNA</text><path d="M550 409 L576 385" class="edge" stroke-width="2" fill="none" /><text x="65" y="524" font-size="32" font-weight="400" class="ink" text-anchor="start">New strands trail behind the opening junction.</text><rect x="34" y="584" width="712" height="239" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="635" font-size="36" font-weight="700" class="ink" text-anchor="start">2 • Label live cells in sequence</text><rect x="65" y="661" width="295" height="64" rx="16" fill="#9dc3c2" class="edge" stroke-width="6.0" /><rect x="65" y="661" width="295" height="64" rx="16" fill="#9dc3c2" class="glyphborder" stroke-width="3" /><text x="212" y="704" font-size="32" font-weight="400" class="glyphtext" text-anchor="middle">IdU • 30 min</text><path d="M377 693 L401 693" class="edge" stroke-width="4" fill="none" marker-end="url(#arrow)" /><rect x="419" y="661" width="295" height="64" rx="16" fill="#d6a791" class="edge" stroke-width="6.0" /><rect x="419" y="661" width="295" height="64" rx="16" fill="#d6a791" class="glyphborder" stroke-width="3" /><text x="566" y="704" font-size="32" font-weight="400" class="glyphtext" text-anchor="middle">CldU • 30 min</text><text x="65" y="765" font-size="32" font-weight="400" class="ink" text-anchor="start">Extract and stretch DNA; detect the labels.</text><rect x="34" y="847" width="712" height="427" rx="24" fill="none" class="panel" stroke-width="2" /><text x="65" y="899" font-size="36" font-weight="700" class="ink" text-anchor="start">3 • Compare selected toy tracks</text><text x="65" y="993" font-size="36" font-weight="700" class="ink" text-anchor="start">A</text><path d="M120 980 H710" class="edge" stroke-width="2" fill="none" /><rect x="140" y="962" width="180" height="36" rx="4" fill="#9dc3c2" class="edge" stroke-width="5.0" /><rect x="140" y="962" width="180" height="36" rx="4" fill="#9dc3c2" class="glyphborder" stroke-width="2" /><rect x="320" y="962" width="180" height="36" rx="4" fill="#d6a791" class="edge" stroke-width="5.0" /><rect x="320" y="962" width="180" height="36" rx="4" fill="#d6a791" class="glyphborder" stroke-width="2" /><path d="M320 1022 V1032 H500 V1022" class="edge" stroke-width="3" fill="none" /><text x="65" y="1077" font-size="32" font-weight="400" class="ink" text-anchor="start">15 μm → 30 kb / 30 min = 1 kb/min</text><text x="65" y="1133" font-size="36" font-weight="700" class="ink" text-anchor="start">B</text><path d="M120 1120 H710" class="edge" stroke-width="2" fill="none" /><rect x="140" y="1102" width="180" height="36" rx="4" fill="#9dc3c2" class="edge" stroke-width="5.0" /><rect x="140" y="1102" width="180" height="36" rx="4" fill="#9dc3c2" class="glyphborder" stroke-width="2" /><rect x="320" y="1102" width="90" height="36" rx="4" fill="#d6a791" class="edge" stroke-width="5.0" /><rect x="320" y="1102" width="90" height="36" rx="4" fill="#d6a791" class="glyphborder" stroke-width="2" /><path d="M320 1162 V1172 H410 V1162" class="edge" stroke-width="3" fill="none" /><text x="65" y="1217" font-size="32" font-weight="400" class="ink" text-anchor="start">7.5 μm → 15 kb / 30 min = 0.5 kb/min</text><text x="65" y="1250" font-size="32" font-weight="700" class="ink" text-anchor="start">Example calibration: 1 μm = 2 kb</text><text x="42" y="1325" font-size="34" font-weight="700" class="ink" text-anchor="start">Shorter second pulse: less DNA copied</text><text x="42" y="1380" font-size="32" font-weight="400" class="ink" text-anchor="start">Cause, breaks, recovery and survival</text><text x="42" y="1420" font-size="32" font-weight="400" class="ink" text-anchor="start">need separate tests. Cell-cycle mix matters.</text><text x="42" y="1475" font-size="32" font-weight="400" class="muted" text-anchor="start">Fictional lengths • selected ongoing forks</text></svg>
