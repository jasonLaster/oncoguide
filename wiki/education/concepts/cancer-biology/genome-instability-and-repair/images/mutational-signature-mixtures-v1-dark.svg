<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1330" viewBox="0 0 780 1330" role="img" aria-labelledby="title desc"><title id="title">A distribution and its possible mixtures</title><desc id="desc">Invented four-category templates A and B are 40/30/20/10 and 30/40/20/10 percent. Observed fictional counts 35/35/20/10 total 100. An arithmetic 50/50 mixture exactly reconstructs them; 60/40 gives 36/34/20/10. Counts and template percentages are distinct units. Similar predictions and sparse or omitted features limit inference. No signature model was executed; these are not SBS3 or HRDetect.</desc>
