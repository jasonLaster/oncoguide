<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">Three chromosome-pattern questions</title><desc id="desc">Fictional separate-copy chromosome tracks distinguish A/B, A/absent and A/A. A terminal imbalance does not cross the marked centromere. Filtered within-arm transitions join 12/8 or 12/14 megabase states; only the latter meets both-size rule. Original algorithm filters and cancer scopes remain in the owner text. No present-repair or response result is inferred.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536b6a"/></marker><pattern id="unknown" patternUnits="userSpaceOnUse" width="18" height="18"><path d="M0 18 L18 0" stroke="#cad0c4" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="780" height="1360" rx="0" fill="#faf4e9" />
<text x="40" y="62" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="40" dy="0">Read three chromosome patterns</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#536b6a" text-anchor="start"><tspan x="40" dy="0">Fictional separate-copy tracks</tspan></text>
<rect x="24" y="145" width="732" height="400" rx="20" fill="#fffdf7" stroke="#cad0c4" stroke-width="2" />
<text x="46" y="199" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="46" dy="0">1. Which parental versions remain?</tspan></text>
<text x="48" y="242" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">One zoomed region; A and B are versions.</tspan></text>
<text x="48" y="292" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="48" dy="0">Mixed A / B</tspan></text>
<rect x="370" y="265" width="175" height="20" rx="10" fill="#d5a65b" />
<text x="561" y="285" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#293c40" text-anchor="start"><tspan x="561" dy="0">A</tspan></text>
