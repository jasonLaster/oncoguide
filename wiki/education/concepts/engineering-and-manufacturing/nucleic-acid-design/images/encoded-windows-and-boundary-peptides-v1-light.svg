<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">The boundary matters</title><desc id="desc">A fictional encoded protein has window A, an amino-acid spacer, and window B. A candidate peptide spans window A and the spacer. Possible processing products, recovered HLA peptides, recognition and tumor function are distinct.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#40596b"/></marker></defs><rect width="600" height="1000" fill="#f8fafc"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#172a3b">The boundary matters</text><text x="30" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#41596c">Fictional protein; not to scale</text><text x="30" y="168" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172a3b">Encoded amino-acid sequence</text><rect x="30" y="202" width="210" height="75" rx="15" fill="#d9edf5" stroke="#40596b" stroke-width="2"/><rect x="240" y="202" width="120" height="75" rx="15" fill="#8b4600" stroke="#40596b" stroke-width="2"/><rect x="360" y="202" width="210" height="75" rx="15" fill="#d9edf5" stroke="#40596b" stroke-width="2"/><text x="47" y="249" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Window A</text><text x="375" y="249" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Window B</text><path d="M295 283 L295 319" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="239" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Spacer</text><path d="M185 283 L185 304 L285 304 L285 283" fill="none" stroke="#00658a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 314 L110 390" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="413" width="540" height="182" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="456" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">A possible boundary peptide</text><path d="M100 493 L212 493" fill="none" stroke="#00658a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 493 L298 493" fill="none" stroke="#8b4600" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="543" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Part of A + part of spacer</text><text x="50" y="582" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Candidate, not measured display.</text><rect x="30" y="636" width="540" height="145" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2" stroke-dasharray="8 7"/><text x="50" y="681" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Processing + HLA loading</text><text x="50" y="720" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">need evidence in defined cells.</text><path d="M300 597 L300 624" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/><rect x="30" y="822" width="540" height="137" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="865" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Recovered HLA display ≠</text><text x="50" y="904" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">recognition ≠ tumor-cell function.</text><text x="50" y="943" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">HLA: human leukocyte antigen</text><path d="M300 783 L300 810" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/></svg>
