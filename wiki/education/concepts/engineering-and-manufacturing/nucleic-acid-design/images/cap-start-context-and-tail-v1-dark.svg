<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Locate the RNA features</title><desc id="desc">Schematic conventional mRNA from 5 prime cap to 5 prime UTR, AUG coding start and stop, 3 prime UTR, and poly(A) tail. A zoom locates start context across the UTR and coding boundary.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#bacbd8"/></marker></defs><rect width="600" height="1000" fill="#101b27"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f1f5f9">Locate the RNA features</text><text x="30" y="101" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#c4d1dd">Conventional mRNA; not to scale</text><text x="35" y="162" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′</text><path d="M100 150 L485 150" fill="none" stroke="#bacbd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="515" y="162" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′</text><circle cx="62" cy="235" r="23" fill="#294657" stroke="#77cdec" stroke-width="3"/><path d="M85 235 L100 235" fill="none" stroke="#bacbd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="292" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Cap</text><rect x="100" y="205" width="110" height="60" rx="15" fill="#294657" stroke="#bacbd8" stroke-width="2"/><rect x="210" y="205" width="190" height="60" rx="15" fill="#77cdec" stroke="#bacbd8" stroke-width="2"/><rect x="400" y="205" width="95" height="60" rx="15" fill="#294657" stroke="#bacbd8" stroke-width="2"/><path d="M495 235 Q508 210 521 235 T547 235" fill="none" stroke="#ffc78d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="325" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′ UTR</text><text x="228" y="292" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Coding</text><text x="402" y="367" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′ UTR</text><text x="402" y="408" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#ffc78d">Tail: A…A</text><path d="M143 281 L143 295" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M445 281 L445 334" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 265 L530 374" fill="none" stroke="#ffc78d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Start</text><text x="350" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Stop</text><path d="M210 276 L210 415" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M398 276 L398 415" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="490" width="540" height="276" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="536" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f1f5f9">Zoom: the coding start</text><rect x="50" y="566" width="220" height="64" rx="15" fill="#294657" stroke="#bacbd8" stroke-width="2"/><rect x="270" y="566" width="280" height="64" rx="15" fill="#77cdec" stroke="#bacbd8" stroke-width="2"/><text x="66" y="610" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">… upstream</text><text x="287" y="610" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#101b27">AUG …</text><path d="M180 650 L180 666 L390 666 L390 650" fill="none" stroke="#ffc78d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="715" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Start context spans the boundary.</text><text x="50" y="751" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">It is not its own RNA segment.</text><rect x="30" y="799" width="540" height="160" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="843" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">UTR = untranslated region.</text><text x="50" y="882" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Coding sequence specifies protein.</text><text x="50" y="921" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Placement does not prove output.</text></svg>
