<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Three RNA objects</title><desc id="desc">Long paired sense/antisense byproduct, a truncated single strand, and intended intramolecular folding are distinct structural and analytical questions. Shapes are schematic.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#bacbd8"/></marker></defs><rect width="600" height="1000" fill="#101b27"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f1f5f9">Three RNA objects</text><text x="30" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#c4d1dd">Schematic shapes; no size scale</text><rect x="30" y="140" width="540" height="200" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="183" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f1f5f9">Long paired byproduct</text><path d="M100 237 L490 237" fill="none" stroke="#77cdec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 267 L490 267" fill="none" stroke="#ffc78d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 237 L120 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 237 L148 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 237 L176 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 237 L204 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 237 L232 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 237 L260 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 237 L288 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 237 L316 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M344 237 L344 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M372 237 L372 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 237 L400 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 237 L428 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M456 237 L456 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M484 237 L484 267" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="247" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′</text><text x="500" y="247" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′</text><text x="50" y="285" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′</text><text x="500" y="285" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′</text><text x="50" y="323" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Two complementary strands</text><rect x="30" y="369" width="540" height="161" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="413" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f1f5f9">Truncated single strand</text><text x="50" y="473" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′</text><path d="M110 461 Q135 440 160 461 T210 461 T260 461" fill="none" stroke="#77cdec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="473" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′</text><text x="50" y="510" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Shorter is not the same as paired.</text><rect x="30" y="560" width="540" height="210" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="602" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f1f5f9">Fold within one message</text><path d="M110 682 L220 682 L220 653 C220 611 300 611 300 653 L300 682 L475 682" fill="none" stroke="#77cdec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 649 L295 649" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 663 L295 663" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 677 L295 677" fill="none" stroke="#bacbd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="694" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">5′</text><text x="490" y="694" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">3′</text><text x="50" y="746" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">One strand; a local paired region</text><rect x="30" y="801" width="540" height="158" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="846" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Pairing assay ≠ size / integrity.</text><text x="50" y="885" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Signal depends on assay scope.</text><text x="50" y="924" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">No proof of zero impurity.</text></svg>
