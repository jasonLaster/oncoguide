<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img" aria-labelledby="title desc"><title id="title">Three different questions</title><desc id="desc">A category map, not a design recipe</desc><rect width="600" height="1270" rx="22" fill="#fffaf2"/>
<text x="28" y="48" fill="#203442" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Three different questions</text>
<text x="28" y="88" fill="#203442" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">A category map, not a design recipe</text>
<rect x="20" y="125" width="560" height="280" rx="22" fill="#fffefb" stroke="#607986" stroke-width="2" />
<text x="40" y="167" fill="#203442" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">1 • Sequence: the order</text>
<rect x="20" y="430" width="560" height="280" rx="22" fill="#fffefb" stroke="#607986" stroke-width="2" />
<text x="40" y="472" fill="#203442" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">2 • Chemistry: the material</text>
<rect x="20" y="735" width="560" height="280" rx="22" fill="#fffefb" stroke="#607986" stroke-width="2" />
<text x="40" y="777" fill="#203442" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">3 • Byproducts: extra material</text>
<rect x="75" y="205" width="42" height="50" rx="10" fill="#d6edf3" stroke="#247a9b" stroke-width="2" />
<rect x="140" y="205" width="42" height="50" rx="10" fill="#e9dff1" stroke="#80579c" stroke-width="2" />
<rect x="205" y="205" width="42" height="50" rx="10" fill="#d9efe4" stroke="#267e68" stroke-width="2" />
<rect x="270" y="205" width="42" height="50" rx="10" fill="#fae5c2" stroke="#a9661f" stroke-width="2" />
<text x="342" y="216" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Ordered</text>
<text x="342" y="253" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">message</text>
<text x="40" y="315" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start">Which instructions are written?</text>
<text x="40" y="354" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start">No letter sequence is prescribed.</text>
<path d="M65 544q30.0 -24 60.0 0t60.0 0t60.0 0" fill="none" stroke="#247a9b" stroke-width="7" stroke-linecap="round"/>
<circle cx="99" cy="544" r="13" fill="#d6edf3" stroke="#247a9b" stroke-width="3"/>
<circle cx="185" cy="544" r="13" fill="#e9dff1" stroke="#80579c" stroke-width="3"/>
<text x="310" y="539" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Building blocks</text>
<text x="40" y="620" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Intended protein can stay the same.</text>
<text x="40" y="659" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Sensing and translation may differ.</text>
<path d="M70 852q28.333333333333332 -24 56.666666666666664 0t56.666666666666664 0t56.666666666666664 0" fill="none" stroke="#247a9b" stroke-width="7" stroke-linecap="round"/>
<path d="M350 837q22.5 -24 45.0 0t45.0 0t45.0 0" fill="none" stroke="#ad526b" stroke-width="7" stroke-linecap="round"/>
<path d="M350 868q22.5 -24 45.0 0t45.0 0t45.0 0" fill="none" stroke="#ad526b" stroke-width="7" stroke-linecap="round"/>
<text x="65" y="917" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Intended RNA</text>
<text x="330" y="917" fill="#ad526b" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Unwanted RNA</text>
<text x="40" y="970" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Chemistry alone does not establish</text>
<text x="40" y="1009" fill="#203442" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">what unwanted material is present.</text>
<rect x="20" y="1055" width="560" height="180" rx="22" fill="#e9dff1" stroke="#80579c" stroke-width="2" />
<text x="40" y="1098" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start">Keep the checks separate.</text>
<text x="40" y="1141" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start">Protein identity, sensing and benefit</text>
<text x="40" y="1184" fill="#203442" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start">are different evidence questions.</text>
</svg>
