<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Same protein plan</title><desc id="desc">Toy synonymous codons GCU and GCC both specify alanine. RNA sequence and folding can differ; output and immune effects require measurement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#bacbd8"/></marker></defs><rect width="600" height="1000" fill="#101b27"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f1f5f9">Same protein plan</text><text x="30" y="99" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#c4d1dd">Toy coding excerpt; not a recipe</text><rect x="30" y="160" width="270" height="112" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="203" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">RNA A</text><text x="50" y="247" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#77cdec">5′ … GCU … 3′</text><path d="M315 216 Q375 216 420 250" fill="none" stroke="#bacbd8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="305" width="270" height="112" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="348" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">RNA B</text><text x="50" y="392" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#77cdec">5′ … GCC … 3′</text><path d="M315 361 Q375 361 420 325" fill="none" stroke="#bacbd8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="478" cy="287" r="67" fill="#294657" stroke="#77cdec" stroke-width="3"/><text x="478" y="298" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#f1f5f9">Ala</text><text x="340" y="449" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Both specify</text><text x="340" y="488" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">alanine (Ala).</text><rect x="30" y="545" width="540" height="214" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="592" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f1f5f9">Changed layer: RNA</text><path d="M55 641 Q80 610 110 641 T165 641 T220 641" fill="none" stroke="#77cdec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M325 660 L325 628 Q350 597 375 628 L375 660 L430 660 Q450 620 475 660" fill="none" stroke="#77cdec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="716" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Sequence and folding may differ.</text><rect x="30" y="792" width="540" height="166" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="836" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Measure RNA use and protein.</text><text x="50" y="875" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">A redesign name does not prove</text><text x="50" y="914" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">better output or immune effects.</text></svg>
