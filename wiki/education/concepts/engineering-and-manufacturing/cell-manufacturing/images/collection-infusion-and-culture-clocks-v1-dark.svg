<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
<title id="title">Two clocks, one pathway</title><desc id="desc">A fictional elapsed-day timeline runs from collection at day 0 to infusion at day 18. Its culture interval runs from day 0 to day 7; release is day 12. A separate fictional cohort contains 10 people who start collection, 8 who reach infusion, and 2 who never reach infusion.</desc>
<defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4ed3c1"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ffc66b"/></marker><marker id="line" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64818d"/></marker></defs>
<rect x="12" y="2" width="576" height="100" rx="18" fill="#182d3a" stroke="#64818d" stroke-width="2"/>
<rect x="12" y="111" width="576" height="451" rx="18" fill="#182d3a" stroke="#64818d" stroke-width="2"/>
<text x="24" y="44" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9" text-anchor="start">Two clocks, one pathway</text>
<text x="24" y="91" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#b8c8d5" text-anchor="start">Invented • elapsed days</text>
<text x="24" y="149" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9" text-anchor="start">Collection → infusion: 18 days</text>
