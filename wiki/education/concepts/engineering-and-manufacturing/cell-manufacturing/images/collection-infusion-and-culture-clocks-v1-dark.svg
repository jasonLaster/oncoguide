<text x="244" y="247" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="middle">7</text>
<path d="M384 179 L384 205" fill="none" stroke="#4ed3c1" stroke-width="5"/>
<text x="384" y="247" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="middle">12</text>
