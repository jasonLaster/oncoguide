<text x="552" y="247" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="middle">18</text>
<text x="24" y="302" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="start">0: collection</text>
<text x="24" y="348" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="start">7: culture ends</text>
<text x="24" y="394" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="start">12: release</text>
<text x="24" y="440" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#f1f5f9" text-anchor="start">18: infusion</text>
<rect x="48" y="476" width="196" height="25" fill="#ffc66b"/>
<text x="24" y="545" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffc66b" text-anchor="start">Culture: day 0 → 7 = 7 days</text>
