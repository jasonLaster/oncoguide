<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Follow the collection and the return</title><desc id="desc">A simplified blood circuit connects circulation to a separator. One arrow collects a mixed white-cell fraction into a leukopak; a separate return arrow brings other blood components back to circulation. The bag contains circular cell symbols of different colors and sizes representing lymphocytes and monocytes, rather than a pure T-cell population. Named streams are schematic, with no recovery percentages or universal protocol.</desc><metadata>Original authored SVG by agent:/root/batch10_author_group2; no image model used. Private candidate; expert and learner review pending. All shapes schematic, not quantitative.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486677"/></marker></defs><rect width="600" height="1000" fill="#f3f0e8"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="100" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="52" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">Follow the collection</text><text x="32" y="87" font-size="32" font-weight="700" text-anchor="start" fill="#24343e">and the return</text><rect x="12" y="130" width="576" height="422" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="169" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">A simplified collection circuit</text><rect x="42" y="227" width="186" height="99" rx="14" fill="#e9edef" stroke="#486677" stroke-width="2"/><text x="58" y="267" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">Blood in</text><text x="58" y="302" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">circulation</text><rect x="341" y="218" width="210" height="133" rx="14" fill="#b7dce5" stroke="#486677" stroke-width="2"/><text x="359" y="257" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">Separator</text><text x="359" y="292" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">White-cell</text><text x="359" y="327" font-size="28" font-weight="700" text-anchor="start" fill="#24343e">fraction</text><path d="M228 246H325" fill="none" stroke="#486677" stroke-width="4" marker-end="url(#arrow)"/><text x="38" y="199" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Blood out →</text><path d="M420 351V460H140V344" fill="none" stroke="#486677" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="501" font-size="28" font-weight="400" text-anchor="start" fill="#24343e">Return: other blood components</text><path d="M526 351V581" fill="none" stroke="#486677" stroke-width="4" marker-end="url(#arrow)"/><rect x="12" y="580" width="576" height="282" rx="14" fill="#fffdf7" stroke="#486677" stroke-width="2"/><text x="32" y="619" font-size="30" font-weight="700" text-anchor="start" fill="#24343e">Mixed white-cell collection</text><rect x="48" y="661" width="170" height="151" rx="14" fill="#e9edef" stroke="#486677" stroke-width="2"/><rect x="71" y="644" width="124" height="25" rx="4" fill="#486677" stroke="#486677" stroke-width="2"/><circle cx="88" cy="700" r="18" fill="#b7dce5" stroke="#486677" stroke-width="2"/><circle cx="90" cy="698" r="7.2" fill="#e9edef" stroke="#486677" stroke-width="1"/><circle cx="158" cy="708" r="18" fill="#b7dce5" stroke="#486677" stroke-width="2"/><circle cx="160" cy="706" r="7.2" fill="#e9edef" stroke="#486677" stroke-width="1"/><circle cx="115" cy="765" r="18" fill="#b7dce5" stroke="#486677" stroke-width="2"/><circle cx="117" cy="763" r="7.2" fill="#e9edef" stroke="#486677" stroke-width="1"/><circle cx="176" cy="774" r="20" fill="#ecc1cc" stroke="#486677" stroke-width="2"/><circle cx="178" 