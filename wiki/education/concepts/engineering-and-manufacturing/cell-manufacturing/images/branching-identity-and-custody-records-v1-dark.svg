<title id="title">One identity, branching material</title><desc id="desc">A fictional source A and intended recipient A are linked to collection A, lot A, two doses A1 and A2, and test sample S. A separate custody lane records collection-site to manufacturer to clinic handoffs. Recipient matching, quality review and administration or other disposition remain separate checks.</desc>
