<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
<title id="title">Whose cells? Which direction?</title><desc id="desc">Donor immune cells attack recipient tissue in graft-versus-host disease; recipient immune cells attack donor cells in host rejection. A separate source panel distinguishes recipient-derived from donor-derived cells, and a separate location panel distinguishes engineering outside from inside the body.</desc>
<defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#076f66"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#925006"/></marker><marker id="line" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#819ca8"/></marker></defs>
<rect x="12" y="2" width="576" height="100" rx="18" fill="#eef4f6" stroke="#819ca8" stroke-width="2"/>
<rect x="12" y="232" width="576" height="223" rx="18" fill="#eef4f6" stroke="#819ca8" stroke-width="2"/>
<rect x="12" y="467" width="576" height="208" rx="18" fill="#eef4f6" stroke="#819ca8" stroke-width="2"/>
<text x="24" y="44" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#182a37" text-anchor="start">Whose cells? Which direction?</text>
<text x="24" y="91" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#485d6b" text-anchor="start">SOURCE: whose cells?</text>
<rect x="24" y="108" width="552" height="110" rx="18" fill="#eef4f6" stroke="#819ca8" stroke-width="2"/>
<text x="46" y="150" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">Autologous: recipient</text>
<text x="46" y="194" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">Allogeneic: donor</text>
<text x="24" y="268" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#076f66" text-anchor="start">DONOR → RECIPIENT</text>
<circle cx="90" cy="333" r="28" fill="#076f66" stroke="#076f66" stroke-width="3"/>
<circle cx="508" cy="333" r="28" fill="#925006" stroke="#925006" stroke-width="3"/>
<path d="M140 333 L450 333" fill="none" stroke="#076f66" stroke-width="5" marker-end="url(#teal)"/>
<text x="24" y="400" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">Donor immune cells attack</text>
<text x="24" y="444" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">recipient tissue: GVHD</text>
<text x="24" y="502" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#925006" text-anchor="start">RECIPIENT → DONOR</text>
<circle cx="90" cy="548" r="28" fill="#076f66" stroke="#076f66" stroke-width="3"/>
<circle cx="508" cy="548" r="28" fill="#925006" stroke="#925006" stroke-width="3"/>
<path d="M458 548 L150 548" fill="none" stroke="#925006" stroke-width="5" marker-end="url(#amber)"/>
<text x="24" y="610" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">Recipient immune cells attack</text>
<text x="24" y="654" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">donor cells: host rejection</text>
<rect x="24" y="690" width="552" height="76" rx="18" fill="#eef4f6" stroke="#819ca8" stroke-width="2"/>
<text x="44" y="737" font-family="system-ui, sans-serif" font-size="34" font-weight="500" fill="#182a37" text-anchor="start">LOCATION: outside / inside</text>
</svg>