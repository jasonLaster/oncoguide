<title id="title">Count the set before the percent</title><desc id="desc">A fictional 100-cell sample contains 80 live cells, including 60 live receptor-positive cells and 20 other live cells; 20 cells are nonlive. The three percentages are 60 over 80 equals 75 percent receptor positivity among live cells, 80 over 100 equals 80 percent viability, and 60 over 100 equals 60 percent live receptor-positive cells among all counted cells.</desc>
