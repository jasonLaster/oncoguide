<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">DNA location is one layer</title><desc id="desc">A schematic AAV capsid delivers vector DNA to a cell nucleus. Vector DNA outside chromosomes and an integrated DNA cassette are pictured as alternative example fates, both distinct from RNA, protein and function.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#bacbd8"/></marker></defs><rect width="600" height="1000" fill="#101b27"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#f1f5f9">DNA location is one layer</text><text x="30" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#c4d1dd">AAV: adeno-associated virus</text><circle cx="76" cy="172" r="39" fill="#294657" stroke="#77cdec" stroke-width="3"/><path d="M59 165 Q76 141 94 168" fill="none" stroke="#ffc78d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="168" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">Capsid carries DNA</text><text x="138" y="208" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Entry is a separate step.</text><path d="M77 217 L77 267" fill="none" stroke="#bacbd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="283" width="540" height="420" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="328" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">Nucleus: example DNA fates</text><path d="M100 363 A35 35 0 1 1 99.9 363" fill="none" stroke="#ffc78d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="387" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Outside chromosome</text><text x="165" y="426" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Episome: vector DNA</text><path d="M64 514 L226 514" fill="none" stroke="#bacbd8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 514 L308 514" fill="none" stroke="#ffc78d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 514 L526 514" fill="none" stroke="#bacbd8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="569" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Chromosome with inserted DNA</text><text x="50" y="614" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">Integration is possible.</text><text x="50" y="674" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#c4d1dd">Forms shown are not frequencies.</text><path d="M300 707 L300 748" fill="none" stroke="#bacbd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="799" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#f1f5f9">Usable DNA → RNA → protein</text><rect x="30" y="836" width="540" height="125" rx="15" fill="#1e3041" stroke="#bacbd8" stroke-width="2"/><text x="50" y="877" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">Measure expression separately.</text><text x="50" y="916" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">No guaranteed persistence,</text><text x="50" y="955" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#f1f5f9">uniform dilution or function.</text></svg>
