<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1160" viewBox="0 0 600 1160" role="img" aria-labelledby="title desc"><title id="title">Delivery ≠ insertion</title><desc id="desc">A conceptual DNA-transposon system</desc><rect width="600" height="1160" rx="22" fill="#101e28"/>
