<text x="40" y="868" fill="#eef4f8" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">2 • Insertion is a different job</text>
<text x="40" y="912" fill="#eef4f8" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Expression and function</text>
<text x="40" y="956" fill="#eef4f8" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">need separate measurements.</text>
<text x="40" y="1014" fill="#bbccd6" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Shapes are not sequence or scale.</text>
<text x="28" y="1090" fill="#bbccd6" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">No equal-site probabilities, promised</text>
<text x="28" y="1124" fill="#bbccd6" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">persistence or safety ranking shown.</text>
