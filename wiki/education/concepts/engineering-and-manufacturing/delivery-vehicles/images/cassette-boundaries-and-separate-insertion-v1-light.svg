<text x="205" y="548" fill="#203442" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Cargo cassette</text>
<text x="72" y="611" fill="#a9661f" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Boundary</text>
<text x="72" y="643" fill="#a9661f" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">at each end</text>
<path d="M96 577L96 591" fill="none" stroke="#a9661f" stroke-width="4" stroke-linecap="round" />
<path d="M320 577L320 591" fill="none" stroke="#a9661f" stroke-width="4" stroke-linecap="round" />
