<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1160" viewBox="0 0 600 1160" role="img" aria-labelledby="title desc"><title id="title">Delivery ≠ insertion</title><desc id="desc">A conceptual DNA-transposon system</desc><rect width="600" height="1160" rx="22" fill="#fffaf2"/>
<text x="28" y="48" fill="#203442" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Delivery ≠ insertion</text>
<text x="28" y="88" fill="#203442" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">A conceptual DNA-transposon system</text>
<rect x="20" y="115" width="560" height="190" rx="22" fill="#fffefb" stroke="#607986" stroke-width="2" />
<text x="40" y="154" fill="#203442" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">1 • A separate delivery job</text>
<circle cx="77" cy="219" r="31" fill="#d6edf3" stroke="#247a9b" stroke-width="3"/>
<text x="128" y="210" fill="#203442" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Components enter a cell.</text>
<text x="128" y="249" fill="#4e6572" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Method not specified.</text>
