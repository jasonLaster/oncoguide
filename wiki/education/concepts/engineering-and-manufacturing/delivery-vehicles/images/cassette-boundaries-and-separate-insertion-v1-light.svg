<text x="300" y="755" fill="#203442" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Cassette within chromosome</text>
<rect x="20" y="825" width="560" height="220" rx="22" fill="#fffefb" stroke="#607986" stroke-width="2" />
<text x="40" y="868" fill="#203442" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">2 • Insertion is a different job</text>
<text x="40" y="912" fill="#203442" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Expression and function</text>
<text x="40" y="956" fill="#203442" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">need separate measurements.</text>
<text x="40" y="1014" fill="#4e6572" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">Shapes are not sequence or scale.</text>
<text x="28" y="1090" fill="#4e6572" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">No equal-site probabilities, promised</text>
<text x="28" y="1124" fill="#4e6572" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">persistence or safety ranking shown.</text>
</svg>
