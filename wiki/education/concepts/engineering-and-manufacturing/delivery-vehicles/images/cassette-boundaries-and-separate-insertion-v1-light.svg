<text x="40" y="406" fill="#267e68" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Inside a cell</text>
<rect x="40" y="430" width="520" height="340" rx="90" fill="#fffefb" stroke="#80579c" stroke-width="2" />
<text x="70" y="471" fill="#80579c" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Nucleus • DNA machinery</text>
