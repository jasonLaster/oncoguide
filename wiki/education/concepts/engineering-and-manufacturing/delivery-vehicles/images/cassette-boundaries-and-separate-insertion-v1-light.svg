<text x="446" y="548" fill="#203442" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Enzyme</text>
<text x="371" y="612" fill="#80579c" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Transposase</text>
<text x="371" y="644" fill="#80579c" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">recognizes ends</text>
