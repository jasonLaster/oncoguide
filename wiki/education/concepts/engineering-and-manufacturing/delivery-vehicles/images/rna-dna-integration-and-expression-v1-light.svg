<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Follow the incoming cargo</title><desc id="desc">Lentiviral envelope-mediated entry precedes incoming RNA, reverse-transcribed DNA, possible chromosome insertion in an integrating design, and new RNA and protein expression. Integration-deficient designs reduce integration, not necessarily to zero.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#40596b"/></marker></defs><rect width="600" height="1000" fill="#f8fafc"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#172a3b">Follow the incoming cargo</text><text x="30" y="101" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#41596c">Schematic; vector design matters</text><rect x="30" y="133" width="540" height="116" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><circle cx="87" cy="192" r="35" fill="#d9edf5" stroke="#00658a" stroke-width="3"/><path d="M72 192 Q86 171 102 192" fill="none" stroke="#8b4600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="179" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Envelope helps entry.</text><text x="148" y="218" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Entry ≠ tumor recognition.</text><text x="50" y="305" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Inside cell: incoming RNA</text><path d="M73 346 Q94 327 117 346 T165 346 T213 346" fill="none" stroke="#8b4600" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 335 L300 392" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="433" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Reverse transcription</text><text x="50" y="477" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">RNA → DNA copy</text><path d="M360 456 L524 456" fill="none" stroke="#00658a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 472 L524 472" fill="none" stroke="#00658a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="517" width="540" height="185" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="560" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Nucleus: integrating design</text><path d="M68 603 L221 603" fill="none" stroke="#40596b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M221 603 L313 603" fill="none" stroke="#00658a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M313 603 L523 603" fill="none" stroke="#40596b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="652" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">DNA insertion into chromosome</text><path d="M300 480 L300 505" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 704 L300 743" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="787" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">New RNA → encoded protein</text><rect x="30" y="823" width="540" height="137" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="866" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Integration-deficient: reduced</text><text x="50" y="905" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">integration; not necessarily zero.</text><text x="50" y="944" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Check expression and function.</text></svg>
