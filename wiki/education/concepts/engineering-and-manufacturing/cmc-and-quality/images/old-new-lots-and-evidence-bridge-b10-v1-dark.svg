<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">What changed in the lot? Can earlier evidence bridge?</title><desc id="desc">One cellular starting sample splits, where suitable, between old and new manufacturing processes. Paired lot vials lead to matched comparisons of identity, composition, activity, impurities and stability. A dashed conditional connector links those comparisons to earlier quality, safety and efficacy evidence, with additional evidence shown as an open question. Similar readouts alone do not establish clinical equivalence or authorization.</desc><metadata>Original authored SVG by agent:/root/batch10_author_group2; no image model used. Private candidate; expert and learner review pending. All shapes schematic, not quantitative.</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b6cbd5"/></marker></defs><rect width="600" height="1000" fill="#101c28"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="576" height="100" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="52" font-size="32" font-weight="700" text-anchor="start" fill="#f3f1e8">What changed in the lot?</text><text x="32" y="87" font-size="32" font-weight="700" text-anchor="start" fill="#f3f1e8">Can earlier evidence bridge?</text><rect x="12" y="130" width="576" height="326" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="169" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">Compare a change, not just a name</text><rect x="262" y="204" width="65" height="92" rx="12" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><rect x="267" y="249" width="55" height="40" rx="7" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><rect x="259" y="196" width="71" height="21" rx="4" fill="#b6cbd5" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="195" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Same starting material, if suitable</text><path d="M280 311L159 345" fill="none" stroke="#b6cbd5" stroke-width="4" marker-end="url(#arrow)"/><path d="M321 311L444 345" fill="none" stroke="#b6cbd5" stroke-width="4" marker-end="url(#arrow)"/><rect x="94" y="357" width="65" height="92" rx="12" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><rect x="99" y="402" width="55" height="40" rx="7" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><rect x="91" y="349" width="71" height="21" rx="4" fill="#b6cbd5" stroke="#b6cbd5" stroke-width="2"/><rect x="411" y="357" width="65" height="92" rx="12" fill="#384b5b" stroke="#b6cbd5" stroke-width="2"/><rect x="416" y="402" width="55" height="40" rx="7" fill="#316b82" stroke="#b6cbd5" stroke-width="2"/><rect x="408" y="349" width="71" height="21" rx="4" fill="#b6cbd5" stroke="#b6cbd5" stroke-width="2"/><text x="175" y="387" font-size="28" font-weight="700" text-anchor="start" fill="#f3f1e8">Old</text><text x="175" y="422" font-size="28" font-weight="700" text-anchor="start" fill="#f3f1e8">process</text><text x="292" y="387" font-size="28" font-weight="700" text-anchor="start" fill="#f3f1e8">New</text><text x="292" y="422" font-size="28" font-weight="700" text-anchor="start" fill="#f3f1e8">process</text><rect x="12" y="478" width="576" height="212" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="517" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">Compare affected attributes</text><text x="32" y="559" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Identity + composition</text><text x="32" y="594" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Activity + impurities + stability</text><text x="32" y="629" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Methods and criteria must fit.</text><path d="M300 700L300 748" fill="none" stroke="#b6cbd5" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="12" y="760" width="576" height="127" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="799" font-size="30" font-weight="700" text-anchor="start" fill="#f3f1e8">Earlier evidence: bridge justified?</text><text x="32" y="840" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Quality • safety • efficacy</text><rect x="12" y="906" width="576" height="82" rx="14" fill="#192634" stroke="#b6cbd5" stroke-width="2"/><text x="32" y="940" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Or obtain more evidence.</text><text x="32" y="975" font-size="28" font-weight="400" text-anchor="start" fill="#f3f1e8">Similar alone ≠ clinically equivalent.</text></g></svg>