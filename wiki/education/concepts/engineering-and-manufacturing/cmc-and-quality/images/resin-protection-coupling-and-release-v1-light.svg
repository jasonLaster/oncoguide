<svg xmlns="http://www.w3.org/2000/svg" width="600" height="950" viewBox="0 0 600 950" role="img" aria-labelledby="title desc"><title id="title">Resin tether, repeated cycle, separate release</title><desc id="desc">The same resin-bound peptide stays tethered during terminal protection removal, protected amino-acid coupling and washing. A return arrow repeats the cycle before cleavage from resin and separate purification, identity, quality and release checks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#172b38"/></marker></defs><rect width="600" height="950" rx="22" fill="#fffaf0"/><text x="30" y="48" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">Build while the chain stays</text><text x="30" y="90" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">attached to the resin</text><rect x="20" y="122" width="560" height="158" rx="18" fill="#ffffff"/><text x="40" y="167" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">1  Remove terminal protection</text><circle cx="500" cy="211" r="26" fill="#f9e4cc" stroke="#923f14" stroke-width="4"/><path d="M474 211 L360 211" fill="none" stroke="#172b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="447" cy="211" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="382" cy="211" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><rect x="239" y="185" width="33" height="48" rx="6" fill="#f9e4cc" stroke="#923f14" stroke-width="3"/><path d="M346 207 L296 199" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="269" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Protected → open amino end</text><rect x="20" y="293" width="560" height="165" rx="18" fill="#ffffff"/><text x="40" y="338" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">2  Couple next protected unit</text><circle cx="500" cy="382" r="26" fill="#f9e4cc" stroke="#923f14" stroke-width="4"/><path d="M474 382 L272 382" fill="none" stroke="#172b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="447" cy="382" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="382" cy="382" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="317" cy="382" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><rect x="256" y="358" width="33" height="48" rx="6" fill="#f9e4cc" stroke="#923f14" stroke-width="3"/><text x="40" y="447" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">New amino acid joins the chain</text><rect x="20" y="471" width="560" height="151" rx="18" fill="#ffffff"/><text x="40" y="516" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">3  Wash; tether stays attached</text><circle cx="500" cy="551" r="26" fill="#f9e4cc" stroke="#923f14" stroke-width="4"/><path d="M474 551 L272 551" fill="none" stroke="#172b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="447" cy="551" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="382" cy="551" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="317" cy="551" r="22" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><rect x="256" y="527" width="33" height="48" rx="6" fill="#f9e4cc" stroke="#923f14" stroke-width="3"/><path d="M60 551 L168 551" fill="none" stroke="#627787" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="611" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Soluble leftovers leave</text><path d="M560 589 L570 589 L570 188 L553 188" fill="none" stroke="#923f14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="660" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Repeat 1–3 to extend the chain</text><rect x="20" y="689" width="560" height="197" rx="18" fill="#ffffff"/><text x="40" y="735" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">Then: cleave from resin</text><circle cx="508" cy="794" r="24" fill="#f9e4cc" stroke="#923f14" stroke-width="4"/><path d="M410 794 L460 794" fill="none" stroke="#923f14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M449 782 L471 806 M471 782 L449 806" fill="none" stroke="#923f14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="794" r="20" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="155" cy="794" r="20" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><circle cx="205" cy="794" r="20" fill="#d7eeeb" stroke="#006d71" stroke-width="4"/><path d="M105 794 L205 794" fill="none" stroke="#006d71" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="859" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Purify → identity / quality → release</text><text x="30" y="925" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Schematic; no recipe or yield promise</text></svg>
