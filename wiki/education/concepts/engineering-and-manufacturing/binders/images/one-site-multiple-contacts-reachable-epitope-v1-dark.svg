<svg xmlns="http://www.w3.org/2000/svg" width="600" height="950" viewBox="0 0 600 950" role="img" aria-labelledby="title desc"><title id="title">Three questions about binding</title><desc id="desc">Three panels separate a single binder contact, linked contacts to nearby cell-surface targets, and a blocked epitope on a folded target.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#f5f0df"/></marker></defs><rect width="600" height="950" rx="22" fill="#101f2a"/><text x="30" y="48" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">One contact, many contacts,</text><text x="30" y="90" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">and a reachable site</text><rect x="20" y="120" width="560" height="218" rx="18" fill="#182e3b"/><text x="40" y="165" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">1  Affinity: one site</text><g transform="translate(105 244) scale(1.4)"><path d="M-28 -22 Q-44 -4 -28 20 L12 20 L12 9 L0 0 L12 -9 L12 -22 Z" fill="#80ddd4" stroke="#f5f0df" stroke-width="3"/></g><path d="M130 219 L170 219 Q186 244 170 269 L130 269 L130 254 L119 244 L130 234 Z" fill="#513622" stroke="#ffb980" stroke-width="4"/><path d="M220 243 L300 243" fill="none" stroke="#f5f0df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="315" y="228" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start">Single-site</text><text x="315" y="270" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start">interaction</text><text x="40" y="315" fill="#c0d0d8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Measured under stated conditions</text><rect x="20" y="350" width="560" height="237" rx="18" fill="#182e3b"/><text x="40" y="395" fill="#f5f0df" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">2  Avidity: contacts together</text><rect x="45" y="505" width="510" height="22" rx="11" fill="#234f52"/><circle cx="55" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="55" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="79" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="79" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="103" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="103" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="127" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="127" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="151" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="151" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="175" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="175" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="199" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="199" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="223" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="223" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="247" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="247" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="271" cy="511" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="271" cy="521" r="4" fill="#80ddd4" stroke="#80ddd4" stroke-width="4"/><circle cx="295" cy="511" 