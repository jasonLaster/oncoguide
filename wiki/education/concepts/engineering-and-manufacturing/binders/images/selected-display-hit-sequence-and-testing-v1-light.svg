<svg xmlns="http://www.w3.org/2000/svg" width="600" height="950" viewBox="0 0 600 950" role="img" aria-labelledby="title desc"><title id="title">Recover the selected display candidate identity</title><desc id="desc">A displayed fictional candidate B binds a target while its gene stays inside the phage; the gene is recovered and sequenced, then a separate protein is made and tested. A separate lane shows prediction followed by experiments.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#172b38"/></marker></defs><rect width="600" height="950" rx="22" fill="#fffaf0"/><text x="30" y="48" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">Find a hit. Keep its identity.</text><text x="30" y="94" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Fictional candidate B; no recovery rate</text><rect x="20" y="120" width="560" height="290" rx="18" fill="#ffffff"/><text x="40" y="165" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">1  Select a displayed candidate</text><rect x="45" y="223" width="252" height="72" rx="36" fill="#d7eeeb" stroke="#006d71" stroke-width="3"/><path d="M65 254 Q95 230 125 254 T185 254 T245 254" fill="none" stroke="#006d71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="327" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start">Gene B inside</text><g transform="translate(327 258) scale(1.3)"><path d="M-28 -22 Q-44 -4 -28 20 L12 20 L12 9 L0 0 L12 -9 L12 -22 Z" fill="#006d71" stroke="#172b38" stroke-width="3"/></g><path d="M290 258 L300 258" fill="none" stroke="#006d71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M355 233 L395 233 Q411 258 395 283 L355 283 L355 268 L344 258 L355 248 Z" fill="#f9e4cc" stroke="#923f14" stroke-width="4"/><text x="434" y="252" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Target</text><rect x="56" y="345" width="119" height="28" rx="14" fill="#d7eeeb" stroke="#006d71" stroke-width="3"/><path d="M70 359 Q90 347 111 359 T158 359" fill="none" stroke="#006d71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 359 L229 359" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="255" y="381" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Unretained phage</text><path d="M300 423 L300 445" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="457" width="560" height="230" rx="18" fill="#ffffff"/><text x="40" y="502" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">2  Recover, sequence, make</text><rect x="45" y="530" width="146" height="48" rx="24" fill="#d7eeeb"/><text x="118.0" y="566" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Gene B</text><path d="M202 554 L246 554" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="269" y="530" width="272" height="48" rx="24" fill="#d7eeeb"/><text x="405.0" y="566" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Sequence B</text><g transform="translate(129 609) scale(1)"><path d="M-28 -22 Q-44 -4 -28 20 L12 20 L12 9 L0 0 L12 -9 L12 -22 Z" fill="#006d71" stroke="#172b38" stroke-width="3"/></g><text x="220" y="608" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Make protein B</text><text x="40" y="663" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Retest target, tag and negatives</text><rect x="20" y="701" width="560" height="147" rx="18" fill="#ffffff"/><text x="40" y="746" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">3  Computational route</text><path d="M60 789 L96 772 L133 794 L166 778" fill="none" stroke="#006d71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="794" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Rank → make → measure</text><text x="40" y="839" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">A score is a prediction</text><text x="30" y="895" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Selection ≠ measured specificity</text><text x="30" y="937" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">≠ clinical validation</text></svg>
