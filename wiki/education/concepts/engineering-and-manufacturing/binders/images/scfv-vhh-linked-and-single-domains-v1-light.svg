<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Single-chain variable fragments and single-domain nanobodies</title><desc id="desc">Two linked folded variable domains, VH and VL, form the scFv, while one folded VHH forms a nanobody; a whole antibody and a whole cell are drawn as separate objects. Molecular scale and performance are not compared.</desc><rect x="6" y="5" width="588" height="890" rx="20" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="30" y="46" font-size="34" text-anchor="start" fill="#203346" font-weight="700">Count domains, not chains</text><text x="30" y="84" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Two ways to build a recognition module</text><rect x="20" y="110" width="560" height="270" rx="20" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="148" font-size="28" text-anchor="start" fill="#203346" font-weight="700">scFv: one protein chain</text><g transform="translate(220 238) scale(1.1)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -24 -20 L -18 -12 L -25 -4 M 19 16 L 12 24 L 19 29" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#203346" font-weight="700">VH</text></g><g transform="translate(320 238) scale(1.1)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#daf2e9" stroke="#277e70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -24 -20 L -18 -12 L -25 -4 M 19 16 L 12 24 L 19 29" fill="none" stroke="#277e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="mid