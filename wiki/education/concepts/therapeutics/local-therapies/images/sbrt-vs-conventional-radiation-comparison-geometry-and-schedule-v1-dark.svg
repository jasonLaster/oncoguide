<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2060" viewBox="0 0 780 2060" role="img" aria-labelledby="title desc">
<title id="title">Delivery and timing</title><desc id="desc">A shared moving target and nearby structure introduce two delivery cards and a separate schedule question. No dose map is shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A7D8DA"/></marker></defs>
<g font-family="Arial, sans-serif"><rect width="780" height="2060" fill="#14282C"/>
<text x="40" y="70" font-size="44" fill="#F1ECE3" font-weight="700" text-anchor="start">Delivery and timing</text>
<text x="40" y="124" font-size="36" fill="#CAD5D2" font-weight="500" text-anchor="start">Where and how · then when</text>
<rect x="24" y="166" width="732" height="579" rx="25" fill="#20383D"/>
<text x="50" y="228" font-size="40" fill="#F1ECE3" font-weight="700" text-anchor="start">One shared coverage question</text>
<ellipse cx="330" cy="424" rx="255" ry="135" fill="#544A43"/>
