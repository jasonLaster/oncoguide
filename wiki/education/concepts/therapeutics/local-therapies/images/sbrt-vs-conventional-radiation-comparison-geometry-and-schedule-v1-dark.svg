<text x="241" y="435" font-size="36" fill="#F1ECE3" font-weight="700" text-anchor="start">Target</text>
<text x="480" y="594" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Nearby</text>
<text x="480" y="641" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">structure</text>
<line x1="580" y1="566" x2="610" y2="509" stroke="#A7D8DA" stroke-width="5"/>
<text x="50" y="701" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Are coverage and limits verified?</text>
<rect x="24" y="780" width="732" height="392" rx="25" fill="#20383D"/>
<text x="50" y="844" font-size="40" fill="#F1ECE3" font-weight="700" text-anchor="start">SBRT</text>
<text x="50" y="908" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Stereotactic 3D localization</text>
<text x="50" y="973" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Specialized conformal delivery</text>
<text x="50" y="1038" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">High dose per fraction</text>
<text x="50" y="1103" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Motion + delivery verification</text>
<rect x="24" y="1200" width="732" height="392" rx="25" fill="#20383D"/>
<text x="50" y="1264" font-size="40" fill="#F1ECE3" font-weight="700" text-anchor="start">Conventional · defined here</text>
<text x="50" y="1328" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Modern non-stereotactic course</text>
<text x="50" y="1393" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Beam shaping + image guidance</text>
<text x="50" y="1458" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Motion assessment as needed</text>
<text x="50" y="1523" font-size="36" fill="#F1ECE3" font-weight="500" text-anchor="start">Conventional fractions; longer</text>
<rect x="24" y="1644" width="732" height="376" rx="25" fill="#20383D"/>
