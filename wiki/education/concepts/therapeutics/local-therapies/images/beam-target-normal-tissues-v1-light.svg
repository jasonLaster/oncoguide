<text x="43" y="568" fill="#007e80" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Normal tissues</text>
<path d="M195 522 L230 427" fill="none" stroke="#007e80" stroke-width="4" opacity="1"/>
<text x="321" y="489" fill="#675198" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Target</text>
<path d="M352 455 L349 397" fill="none" stroke="#675198" stroke-width="4" opacity="1"/>
<rect x="24" y="637" width="552" height="243" rx="22" fill="#ffffff"/>
<text x="44" y="685" fill="#173d46" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">Target: tissue at risk.</text>
<text x="44" y="727" fill="#173d46" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">A mass need not be visible.</text>
<text x="44" y="769" fill="#173d46" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">Normal tissues also receive</text>
<text x="44" y="811" fill="#173d46" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">some radiation exposure.</text>
<text x="32" y="919" fill="#42616a" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">No dose plan or sharp cutoff.</text>
<text x="32" y="961" fill="#42616a" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start">Gy measures energy per mass.</text>
