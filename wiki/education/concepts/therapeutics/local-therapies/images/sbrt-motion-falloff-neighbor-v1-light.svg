<text x="44" y="486" class="small">Solid + dashed: two possible positions</text><text x="44" y="520" class="small">of the same target, not two lesions.</text><text x="44" y="563" class="bold">Color fades: qualitative dose falloff</text><text x="44" y="599" class="small">No drawn edge proves zero exposure.</text>
<rect x="22" y="650" width="556" height="172" rx="20" fill="#ffffff"/><text x="42" y="691" class="bold">Read all three together</text><text x="42" y="729">• Where can the target be?</text><text x="42" y="765">• How does dose change nearby?</text><text x="42" y="801">• Which organ needs protection?</text>
