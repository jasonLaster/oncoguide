<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080" role="img" aria-labelledby="title desc"><title id="title">Target motion, dose falloff and a nearby organ</title><desc id="desc">A fictional unscaled body cross-section shows two possible positions of the same target, a qualitative dose gradient and a nearby organ. No numeric dose, safe distance, planning tolerance or patient anatomy is supplied.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#233c46;font-size:25px}.title{font-size:32px;font-weight:750}.small{font-size:23px;fill:#526972}.bold{font-weight:700}.line{fill:none;stroke:#233c46;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="1080" rx="22" fill="#fcf8ef"/><text x="28" y="48" class="title">A target can move</text><text x="28" y="84" class="small">SBRT: conceptual geometry, no dose plan</text><rect x="22" y="110" width="556" height="520" rx="24" fill="#ffffff"/>
<ellipse cx="300" cy="324" rx="235" ry="145" fill="#edc7b5" fill-opacity=".24" stroke="#80979f" stroke-width="3"/>
