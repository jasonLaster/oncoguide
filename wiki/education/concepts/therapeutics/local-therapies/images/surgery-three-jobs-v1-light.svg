<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080" role="img" aria-labelledby="title desc"><title id="title">Locate three separate jobs in breast surgery</title><desc id="desc">One simplified anterior torso locates a local breast excision, regional axillary nodes and a dashed reconstruction-role contour on one breast. Numbered text separates removal, nodal sampling and reconstruction; no specific plan or clearance is shown.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#233c46;font-size:25px}.title{font-size:32px;font-weight:750}.small{font-size:23px;fill:#526972}.bold{font-weight:700}.line{fill:none;stroke:#233c46;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="1080" rx="22" fill="#fcf8ef"/><text x="28" y="48" class="title">One anatomy, three jobs</text><text x="28" y="84" class="small">Illustrative map, not an operation plan</text><rect x="22" y="110" width="556" height="420" rx="24" fill="#ffffff"/>
