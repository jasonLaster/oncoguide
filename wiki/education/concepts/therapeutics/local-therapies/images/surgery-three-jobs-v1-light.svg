<rect x="22" y="550" width="556" height="112" rx="18" fill="#ffffff"/><text x="42" y="586" class="bold">1 · Breast procedure</text><text x="42" y="619">Which breast tissue is removed?</text><text x="42" y="648" class="small">Pink: one local excision example</text>
<rect x="22" y="678" width="556" height="112" rx="18" fill="#ffffff"/><text x="42" y="714" class="bold">2 · Nodal procedure</text><text x="42" y="747">Which regional nodes are sampled?</text><text x="42" y="776" class="small">Green: illustrative nodes, not all nodes</text>
<rect x="22" y="806" width="556" height="112" rx="18" fill="#ffffff"/><text x="42" y="842" class="bold">3 · Reconstruction, if chosen</text><text x="42" y="875">Restore or reshape the breast.</text><text x="42" y="904" class="small">Gold dashes: a role, not a repair method</text>
<text x="30" y="963" class="bold">Name the jobs separately.</text><text x="30" y="1002">They are not a required sequence.</text><text x="30" y="1040" class="small">No margin result or clearance is shown.</text></svg>