<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1490" viewBox="0 0 760 1490" role="img" aria-labelledby="title desc"><title id="title">A network has locations and a return loop</title><desc id="desc">Membrane lipid conversion recruits AKT; distinct inhibitor nodes and an indirect negative-feedback loop.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#f4f0e3" stroke-width="1.5"/></marker></defs><rect width="760" height="1490" fill="#142531"/><g font-family="system-ui,Arial,sans-serif" fill="#f4f0e3"><text x="30" y="52" font-size="38" font-weight="750" fill="#f4f0e3" text-anchor="start">Find the node. Follow the loop.</text><text x="30" y="101" font-size="31" font-weight="400" fill="#bdced5" text-anchor="start">Selected growth-signaling route</text><rect x="24" y="130" width="712" height="345" rx="20" fill="#203b47" stroke="#a2b8bf" stroke-width="2"/><rect x="270" y="143" width="438" height="66" rx="20" fill="#634c2c" stroke="#f4c27c" stroke-width="2"/><text x="489" y="186" font-size="30" font-weight="750" fill="#f4f0e3" text-anchor="middle">Upstream receptor input</text><path d="M400 212 V268" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="217" width="660" height="36" rx="4" fill="#49385f" stroke="#c9a6ef" stroke-width="2"/><circle cx="145" cy="257" r="20" fill="#634c2c" stroke="#f4c27c" stroke-width="3"/><path d="M136 239 l-7 -24 M154 239 l7 -24" fill="none" stroke="#c9a6ef" stroke-width="3"/><text x="145" y="314" font-size="33" font-weight="750" fill="#f4f0e3" text-anchor="middle">PIP2</text><circle cx="593" cy="257" r="20" fill="#634c2c" stroke="#f4c27c" stroke-width="3"/><path d="M584 239 l-7 -24 M602 239 l7 -24" fill="none" stroke="#c9a6ef" stroke-width="3"/><text x="593" y="314" font-size="33" font-weight="750" fill="#f4f0e3" text-anchor="middle">PIP3</text><text x="291" y="327" font-size="34" font-weight="750" fill="#f4f0e3" text-anchor="start">PI3K</text><path d="M203 280 H535" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><path d="M538 365 H206" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="405" font-size="33" font-weight="750" fill="#f4f0e3" text-anchor="start">PTEN</text><text x="256" y="449" font-size="29" font-weight="400" fill="#f4f0e3" text-anchor="start">Opposes lipid signal</text><path d="M585 326 V541" fill="none" stroke="#f4f0e3" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="398" y="516" font-size="29" font-weight="400" fill="#bdced5" text-anchor="start">Recruitment</text><rect x="285" y="550" width="316" height="95" rx="20" fill="#26584f" stroke="#78dcc8" stroke-width="2"/><text x="443" y="611" font-size="35" font-weight="750" fill="#f4f0e3" text-anchor="middle">AKT kinase</text><path d="M443 648 V749" fill="none" stroke="#f4f0e3" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="473" y="704" font-size="28" font-weight="400" fill="#bdced5" text-anchor="start">Indirect</text><rect x="285" y="771" width="316" height="98" rx="20" fill="#49385f" stroke="#c9a6ef" stroke-width="2"/><text x="443" y="831" font-size="35" font-weight="750" fill="#f4f0e3" text-anchor="middle">mTORC1</text><path d="M443 874 V953" fill="none" stroke="#f4f0e3" stroke-width="3" marker-end="url(#arrow)"/><text x="443" y="1001" font-size="31" font-weight="700" fill="#f4f0e3" text-anchor="middle">Production-related output</text><path d="M287 815 H55 V176 H263" fill="none" stroke="#f0a0b8" stroke-width="3" stroke-dasharray="10 7"/><path d="M264 151 V200" fill="none" stroke="#f0a0b8" stroke-width="5"/><text x="75" y="596" font-size="28" font-weight="700" fill="#f0a0b8" text-anchor="start">Feedback</text><text x="75" y="631" font-size="28" font-weight="700" fill="#f0a0b8" text-anchor="start">brake</text><text x="30" y="1051" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Dashed return: indirect negative feedback.</text><text x="30" y="1093" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">Reducing mTORC1 can release this brake</text><text x="30" y="1135" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="start">and raise upstream AKT signaling.</text><text x="45" y="445" font-size="27" font-weight="700" fill="#bdced5" text-anchor="start">Membrane</text><rect x="24" y="1181" width="712" height="269" rx="20" fill="#634c2c" stroke="#f4c27c" stroke-width="2"/><text x="44" y="1225" font-size="31" font-weight="750" fill="#f4f0e3" text-anchor="start">Fictional readout: output ↓, AKT site ↑</text><text x="44" y="1271" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">A possible network response, not proof</text><text x="44" y="1312" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">of the return loop in this sample.</text><text x="44" y="1353" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">One phosphosite is not universal activity.</text><text x="44" y="1394" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">Adjacent targets do not promise benefit.</text></g></svg>