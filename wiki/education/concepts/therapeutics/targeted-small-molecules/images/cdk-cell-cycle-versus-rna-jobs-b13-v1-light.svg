<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1310" viewBox="0 0 760 1310" role="img" aria-labelledby="title desc"><title id="title">Same family, different jobs</title><desc id="desc">Separate cell-cycle control from RNA transcription; major roles overlap.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#193746" stroke-width="1.5"/></marker></defs><rect width="760" height="1310" fill="#fffaf2"/><g font-family="system-ui,Arial,sans-serif" fill="#193746"><text x="32" y="53" font-size="39" font-weight="750" fill="#193746" text-anchor="start">Which job does this CDK do?</text><text x="32" y="103" font-size="30" font-weight="400" fill="#455e69" text-anchor="start">Selected roles; not exclusive assignments</text><rect x="24" y="133" width="712" height="370" rx="20" fill="#edf4f2" stroke="#66818b" stroke-width="2"/><text x="45" y="181" font-size="34" font-weight="750" fill="#193746" text-anchor="start">CELL CYCLE · preparing to copy DNA</text><circle cx="115" cy="265" r="33" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><circle cx="103.78" cy="265" r="8" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><g fill="#193746"><circle cx="122" cy="258" r="2.6"/><circle cx="132" cy="258" r="2.6"/></g><path d="M122 271 q5 6 11 0" fill="none" stroke="#193746" stroke-width="2"/><text x="115" y="330" font-size="34" font-weight="700" fill="#193746" text-anchor="middle">G1</text><circle cx="380" cy="265" r="33" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><circle cx="368.78" cy="265" r="8" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><g fill="#193746"><circle cx="387" cy="258" r="2.6"/><circle cx="397" cy="258" r="2.6"/></g><path d="M387 271 q5 6 11 0" fill="none" stroke="#193746" stroke-width="2"/><text x="380" y="330" font-size="34" font-weight="700" fill="#193746" text-anchor="middle">S</text><circle cx="645" cy="265" r="33" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><circle cx="633.78" cy="265" r="8" fill="#c8e7dd" stroke="#147d75" stroke-width="3"/><g fill="#193746"><circle cx="652" cy="258" r="2.6"/><circle cx="662" cy="258" r="2.6"/></g><path d="M652 271 q5 6 11 0" fill="none" stroke="#193746" stroke-width="2"/><text x="645" y="330" font-size="34" font-weight="700" fill="#193746" text-anchor="middle">G2 / M</text><path d="M160 265 H333" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><path d="M425 265 H596" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="245" font-size="32" font-weight="700" fill="#193746" text-anchor="start">CDK4/6</text><text x="415" y="245" font-size="32" font-weight="700" fill="#193746" text-anchor="start">CDK2</text><text x="45" y="391" font-size="31" font-weight="400" fill="#193746" text-anchor="start">CDK4/6 → RB control near G1 → S</text><text x="45" y="433" font-size="31" font-weight="400" fill="#193746" text-anchor="start">CDK2 → progression around DNA copying</text><text x="45" y="478" font-size="30" font-weight="400" fill="#a94865" text-anchor="start">RB present ≠ an intact working circuit</text><rect x="24" y="529" width="712" height="367" rx="20" fill="#e6dcf2" stroke="#76549d" stroke-width="2"/><text x="45" y="578" font-size="35" font-weight="750" fill="#193746" text-anchor="start">TRANSCRIPTION · making RNA</text><path d="M65 695 H695" fill="none" stroke="#76549d" stroke-width="7"/><text x="50" y="642" font-size="30" font-weight="400" fill="#193746" text-anchor="start">Gene start</text><text x="467" y="642" font-size="30" font-weight="400" fill="#193746" text-anchor="start">Along the gene</text><circle cx="152" cy="695" r="34" fill="#f5dfb5" stroke="#996020" stroke-width="3"/><circle cx="514" cy="695" r="34" fill="#f5dfb5" stroke="#996020" stroke-width="3"/><path d="M187 695 H462" fill="none" stroke="#193746" stroke-width="3" marker-end="url(#arrow)"/><path d="M155 714 Q170 756 218 752" fill="none" stroke="#a94865" stroke-width="5"/><path d="M516 714 Q539 770 635 750" fill="none" stroke="#a94865" stroke-width="5"/><text x="72" y="809" font-size="36" font-weight="750" fill="#193746" text-anchor="start">CDK7</text><text x="443" y="809" font-size="36" font-weight="750" fill="#193746" text-anchor="start">CDK9</text><text x="48" y="854" font-size="31" font-weight="400" fill="#193746" text-anchor="start">Helps initiation</text><text x="398" y="854" font-size="31" font-weight="400" fill="#193746" text-anchor="start">Helps elongation</text><text x="36" y="948" font-size="31" font-weight="400" fill="#193746" text-anchor="start">CDK7 also helps activate other CDKs.</text><text x="36" y="990" font-size="31" font-weight="400" fill="#193746" text-anchor="start">These are connected jobs, not sealed boxes.</text><rect x="24" y="1038" width="712" height="234" rx="20" fill="#f5dfb5" stroke="#996020" stroke-width="2"/><text x="46" y="1088" font-size="33" font-weight="750" fill="#193746" text-anchor="start">Fictional culture: pause → regrowth</text><text x="46" y="1135" font-size="31" font-weight="400" fill="#193746" text-anchor="start">Arrest does not establish cell death.</text><text x="46" y="1177" font-size="31" font-weight="400" fill="#193746" text-anchor="start">Protecting marrow is a different endpoint</text><text x="46" y="1219" font-size="31" font-weight="400" fill="#193746" text-anchor="start">from controlling a tumor in patients.</text></g></svg>