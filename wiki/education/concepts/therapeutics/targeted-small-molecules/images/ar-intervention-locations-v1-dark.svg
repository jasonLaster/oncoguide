<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1300" viewBox="0 0 600 1300" role="img" aria-labelledby="title desc"><title id="title">Where does the signal change?</title><desc id="desc">Four cartoon panels separate androgen supply, intracellular androgen receptor binding with an antagonist symbol, nuclear DNA regulation and RNA output, and a variant receptor missing a binding region. AR expression alone does not establish dependence or clinical benefit.</desc><metadata>{&quot;creativeAuthor&quot;: &quot;agent:/root/batch11_pathology_symptoms_author&quot;, &quot;technique&quot;: &quot;original source-code SVG&quot;, &quot;imageModelCalls&quot;: 0, &quot;scientificReview&quot;: &quot;pending&quot;}</metadata><rect x="6" y="5" width="588" height="1290" rx="20" fill="#111827"/><g font-family="system-ui,sans-serif"><text x="30" y="48" font-size="32" text-anchor="start" fill="#edf4fa" font-weight="700">Where does the signal change?</text><text x="30" y="87" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">A hormone signal has several intervention sites</text><rect x="20" y="117" width="560" height="215" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="156" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">1  Hormone supply</text><circle cx="88" cy="211" r="13" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><circle cx="155" cy="211" r="13" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><circle cx="222" cy="211" r="13" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><path d="M265 211 L403 211" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393.0950818741206 215.78462087522354 L403 211 L393.0950818741206 206.21537912477646" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M431 176 C462 177 478 198 475 230" fill="none" stroke="#80d5bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="280" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">Reducing production changes supply.</text><rect x="20" y="358" width="560" height="295" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="397" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">2  Binding inside a cell</text><path d="M67 450 C177 450 420 450 533 450 M67 464 C177 464 420 464 533 464" fill="none" stroke="#80d5bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="502" font-size="26" text-anchor="start" fill="#80d5bd" font-weight="500">cell interior</text><path d="M154 528 Q139 558 165 577 Q197 588 211 556 L190 546 L194 521 Z" fill="#193e51" stroke="#7ac7e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="204" cy="532" r="12" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><circle cx="277" cy="535" r="12" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><path d="M264 535 L218 535" fill="none" stroke="#efa0ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M227.90491812587945 530.2153791247765 L218 535 L227.90491812587945 539.7846208752235" fill="none" stroke="#efa0ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M368 529 L389 551 L368 573 L347 551 Z" fill="#392b4d" stroke="#c7a5e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M336 551 L224 560" fill="none" stroke="#c7a5e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.48984970231126 554.437378978616 L224 560 L234.25633590645666 563.9758739635365" fill="none" stroke="#c7a5e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="405" y="534" font-size="24" text-anchor="start" fill="#c0cedd" font-weight="500">antagonist</text><text x="151" y="620" font-size="26" text-anchor="start" fill="#7ac7e5" font-weight="500">AR</text><text x="69" y="436" font-size="26" text-anchor="start" fill="#80d5bd" font-weight="500">cell boundary</text><rect x="20" y="679" width="560" height="310" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="718" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">3  Nuclear transcription</text><circle cx="300" cy="838" r="94" fill="#392b4d" stroke="#c7a5e3" stroke-width="3"/><path d="M236 833 H369" fill="none" stroke="#7ac7e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 893 H369" fill="none" stroke="#80d5bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 833 V893" fill="none" stroke="#61758b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M301 833 V893" fill="none" stroke="#61758b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M346 833 V893" fill="none" stroke="#61758b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 774 Q243 804 269 823 Q301 834 315 802 L294 792 L298 767 Z" fill="#193e51" stroke="#7ac7e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="308" cy="778" r="12" fill="#4b2938" stroke="#efa0ba" stroke-width="3"/><text x="39" y="807" font-size="26" text-anchor="start" fill="#c7a5e3" font-weight="500">nucleus</text><path d="M390 855 L461 855" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.0950818741206 859.7846208752235 L461 855 L451.0950818741206 850.2153791247765" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M468 855 q10 -19 18 0 t18 0 t18 0" fill="none" stroke="#efa0ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="429" y="910" font-size="26" text-anchor="start" fill="#efa0ba" font-weight="500">RNA</text><text x="40" y="954" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">AR works with DNA and partner proteins.</text><rect x="20" y="1015" width="560" height="205" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="1054" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">4  A variant can change the target</text><path d="M84 1095 Q55 1131 85 1157 Q118 1173 132 1132" fill="none" stroke="#7ac7e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M137 1104 L170 1121" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="220" y="1104" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">Binding region may be absent.</text><text x="220" y="1136" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">Expression does not prove</text><text x="220" y="1168" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">growth dependence.</text><text x="30" y="1262" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">Mechanism is not a treatment-selection rule.</text></g></svg>
