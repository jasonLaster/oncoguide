<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">DNA damage response inhibitors: which repair dependency?</title><desc id="desc">Three distinct DDR sketches show a stalled copying fork and ATR stress signaling, WEE1 inhibitory phosphorylation of a CDK, and POLθ-associated short-match end joining, with possible inhibition sites kept separate. Three parallel sketches locate different DDR jobs: ATR-associated signaling at replication stress, WEE1 delivery of an inhibitory phosphate to a cyclin-dependent kinase, and POLθ-supported joining of exposed DNA ends through short matching sequences. DNA strokes and matches are schematic, not literal bases or a complete network. Bars mark possible target-blocking sites, not clinical doses or guaranteed effects. Current repair function needs testing; a historical scar or PARP resistance alone does not establish POLθ sensitivity.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#293743"/></marker></defs><rect width="760" height="1320" fill="#fcf8f1"/>
