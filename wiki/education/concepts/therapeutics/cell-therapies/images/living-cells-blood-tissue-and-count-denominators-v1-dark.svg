<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1060" viewBox="0 0 600 1060" role="img" aria-labelledby="title desc"><title id="title">The percentage changes; the concentration does not</title><desc id="desc">Fictional same-method blood samples: twenty percent of one hundred viable T cells per microliter and ten percent of two hundred both give twenty receptor-positive cells per microliter. Blood sampling does not establish tumor access or useful function.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="3" markerHeight="3" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a5cddd" stroke-width="2"/></marker></defs>
