<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1180" viewBox="0 0 600 1180" role="img" aria-labelledby="title desc"><title id="title">Two cells, one contact</title><desc id="desc">An abstract instruction card points only into a T cell; its surface paired TCR with adjacent CD3 meets peptide–HLA across a gap. Inside the tumor cell, source protein processing supplies the displayed fragment; the receptor never enters the tumor.</desc><rect width="600" height="1180" fill="#171d29"/><g font-family="system-ui, sans-serif"><text x="28" y="45" font-size="32" text-anchor="start" fill="#eef3fa" font-weight="700">Two cells, one contact</text><text x="28" y="84" font-size="26" text-anchor="start" fill="#eef3fa" font-weight="500">Instructions and target take different paths</text><rect x="18" y="112" width="564" height="245" rx="18" fill="#222d3c" stroke="#6b8198" stroke-width="2"/><circle cx="48" cy="148" r="17" fill="#203f51" stroke="#78c2de" stroke-width="3"/><text x="48" y="156" font-size="24" text-anchor="middle" fill="#eef3fa" font-weight="700">1</text><text x="78" y="157" font-size="28" text-anchor="start" fill="#eef3fa" font-weight="700">Put instructions in the right cell</text><rect x="45" y="210" width="175" height="87" rx="18" fill="#3d2d49" stroke="#c6a0dc" stroke-width="2"/><text x="132" y="247" font-size="26" text-anchor="middle" fill="#eef3fa" font-weight="500">Receptor</text><text x="132" y="279" font-size="26" text-anchor="middle" fill="#eef3fa" font-weight="500">instructions</text><path d="M232 256 L344 256" fill="none" stroke="#c6a0dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.5914266954251 262.2325320018546 L344 256 L332.5914266954251 249.76746799814535" fill="none" stroke="#c6a0dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="431" cy="251" r="62" fill="#213e38" stroke="#8bd3b9" stroke-width="3"/><text x="431" y="260" font-size="26" text-anchor="middle" fill="#eef3fa" font-weight