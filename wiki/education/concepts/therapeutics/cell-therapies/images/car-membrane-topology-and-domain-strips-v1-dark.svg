<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">CAR (chimeric antigen receptor) anatomy</title><desc id="desc">A CAR binding region and spacer extend outside the engineered cell, an anchor crosses its membrane, and costimulatory and CD3-zeta activation domains lie inside. Aligned generation strips keep activation in the same position and add zero, one or two costimulatory domains without ranking. Receptor, gene and cell differ; some CARs bind peptide-HLA.</desc><rect x="6" y="5" width="588" height="890" rx="20" fill="#0f0f1a"/><g font-family="system-ui, sans-serif"><text x="30" y="46" font-size="34" text-anchor="start" fill="#edf5fa" font-weight="700">A receptor crosses a membrane</text><text x="30" y="84" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Locate outside binding and inside signaling</text><text x="38" y="130" font-size="27" text-anchor="start" fill="#edf5fa" font-weight="700">Outside the engineered cell</text><g transform="translate(245 220) scale(1)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#193f51" stroke="#77cbe3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -24 -20 L -18 -12 L -25 -4 M 19 16 L 12 24 L 19 29" fill="none" stroke="#77cbe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#77cbe3" font-weight="700">VH</text></g><g transform="translate(325 220) scale(1)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#173f37" stroke="#81d9bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -24 -20 L -18 -12 L -25 -4 M 19 16 L 12 24 L 19 29" fill="none" stroke="#81d9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26"