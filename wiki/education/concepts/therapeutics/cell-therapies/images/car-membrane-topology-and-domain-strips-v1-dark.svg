roke="#c1cfdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="353" y="699" width="72" height="37" rx="8" fill="#493920" stroke="#5b768a" stroke-width="2"/><text x="389" y="727" font-size="26" text-anchor="middle" fill="#edf5fa" font-weight="500">co</text><rect x="435" y="699" width="115" height="37" rx="8" fill="#4b2837" stroke="#5b768a" stroke-width="2"/><text x="492" y="727" font-size="26" text-anchor="middle" fill="#edf5fa" font-weight="500">CD3ζ</text><text x="38" y="776" font-size="26" text-anchor="start" fill="#edf5fa" font-weight="500">3rd: + two</text><path d="M 273 765 H 553" fill="none" stroke="#c1cfdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="353" y="746" width="72" height="37" rx="8" fill="#493920" stroke="#5b768a" stroke-width="2"/><text x="389" y="774" font-size="26" text-anchor="middle" fill="#edf5fa" font-weight="500">co</text><rect x="275" y="746" width="72" height="37" rx="8" fill="#352945" stroke="#5b768a" stroke-width="2"/><text x="311" y="774" font-size="26" text-anchor="middle" fill="#edf5fa" font-weight="500">co</text><rect x="435" y="746" width="115" height="37" rx="8" fill="#4b2837" stroke="#5b768a" stroke-width="2"/><text x="492" y="774" font-size="26" text-anchor="middle" fill="#edf5fa" font-weight="500">CD3ζ</text><text x="30" y="815" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">A protein receptor ≠ its gene ≠ the cell.</text><text x="30" y="846" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">More domains are not an efficacy ranking.</text><text x="30" y="877" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Some CARs bind peptide–HLA targets.</text></g></svg>
