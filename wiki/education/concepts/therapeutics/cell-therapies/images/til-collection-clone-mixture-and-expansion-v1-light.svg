or="middle" fill="#203346" font-weight="700">A</text><circle cx="345" cy="220" r="21" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="355.16129032258067" cy="213.2258064516129" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="353.46774193548384" cy="229.48387096774195" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="334.83870967741933" cy="213.2258064516129" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><text x="345" y="229" font-size="26" text-anchor="middle" fill="#9b4860" font-weight="700">B</text><circle cx="389" cy="279" r="21" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="399.16129032258067" cy="272.2258064516129" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="397.46774193548384" cy="288.48387096774195" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><circle cx="378.83870967741933" cy="272.2258064516129" r="2" fill="#f8dfe7" stroke="#9b4860" stroke-width="3"/><text x="389" y="288" font-size="26" text-anchor="middle" fill="#9b4860" font-weight="700">B</text><circle cx="493" cy="291" r="21" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="503.16129032258067" cy="284.2258064516129" r="2" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="501.46774193548384" cy="300.48387096774195" r="2" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="482.83870967741933" cy="284.2258064516129" r="2" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><text x="493" y="300" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700">C</text><circle cx="77" cy="297" r="21" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="87.16129032258064" cy="290.2258064516129" r="2" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="85.46774193548387" cy="306.48387096774195" r="2" fill="#ece1f4" stroke="#73538f" stroke-width="3"/><circle cx="66.83870967741936" cy="290.2258064516129" r="2" fill="#ece1f4" stroke="#73538f" stro