<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Tumor-infiltrating lymphocyte (TIL) therapy</title><desc id="desc">An invented tumor-tissue snapshot contains six T cells: two each from native clones A, B and C. After culture, twelve cells include two A, eight virus-reactive bystander B and two unknown C. Each lettered cell is one counted cell; changed mixture and yield do not prove potency. A complete treatment regimen includes more than these cells.</desc><rect x="6" y="5" width="588" height="890" rx="20" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="30" y="46" font-size="34" text-anchor="start" fill="#203346" font-weight="700">The mixture can change in culture</text><text x="30" y="84" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Native clones stay distinct as cells expand</text><text x="30" y="125" font-size="27" text-anchor="start" fill="#9b4860" font-weight="700">Invented counted-cell example</text><rect x="20" y="146" width="560" height="200" rx="20" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="37" y="182" font-size="26" text-anchor="start" fill="#203346" font-weight="700">Collected tumor tissue: 6 T cells</text><circle cx="90" cy="225" r="43" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="83.75806451612902" cy="229.8548387096774" r="16.34" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="110.80645161290323" cy="211.1290322580645" r="2.774193548387097" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="107.33870967741936" cy="244.41935483870967" r="2.774193548387097" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="69.19354838709677" cy="211.1290322580645" r="2.774193548387097" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="285" cy="260" r="43" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="278.758064516129" cy="264.85483870967744