<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">Same M; different products</title><desc id="desc">Two fictional M-positive target models face T cells. The upper lane has a separate dosed M/CD3 protein bridging a recruited T cell&#x27;s CD3. The lower lane has an M-binding CAR anchored in an administered engineered T cell, with signaling inside that cell. Neither lane depicts completed killing.</desc><style>text{fill:#19363e;font-family:Arial,Helvetica,sans-serif}.title,.strong{font-weight:700}.muted{fill:#50656c}.panel{fill:#fffdf9;stroke:#19363e;stroke-width:1.6}.target{fill:#ebd4b4;stroke:#19363e;stroke-width:1.6}.cell{fill:#c7dfe7;stroke:#19363e;stroke-width:1.6}.product{fill:#997ca6;stroke:#19363e;stroke-width:1.6}.signal{fill:#657f56;stroke:#19363e;stroke-width:1.6}.lead{fill:none;stroke:#19363e;stroke-width:1.3}.proposal{fill:none;stroke:#50656c;stroke-width:1.5;stroke-dasharray:4 3}</style><rect width="360" height="760" fill="#fbf8f2"/><text x="24" y="35" font-size="21.5" text-anchor="start" class="title">Same M</text><text x="24" y="63" font-size="21.5" text-anchor="start" class="title">Different administered products</text><text x="24" y="94" font-size="15.5" text-anchor="start" class="muted">Fictional comparison · not to scale</text><rect x="16" y="125" width="328" height="245" rx="12" class="panel"/><text x="24" y="156" font-size="20" text-anchor="start" class="strong">Dosed T-cell engager</text><text x="24" y="182" font-size="16" text-anchor="start" class="muted">Protein product</text><circle cx="74" cy="255" r="38" class="target"/><rect x="240" y="217" width="76" height="76" rx="17" class="cell"/><rect x="108" y="245" width="24" height="20" rx="4" class="target"/><text x="120" y="261" font-size="16" text-anchor="middle" class="strong">M</text><path d="M137 248L151 255L165 248M151 255H204" class="lead"/><rect x="204" y="246" width="23" height="18" rx="6" class="product"/><line x1="227" y1="255" x2="236" y2="255" class="lead"/><rect x="236" y="240" width="7" height="30" rx="2" class="signal"/><rect x="245" y="240" width="7" height="30" rx="2" class="signal"/><line x1="248" y1="270" x2="268" y2="288" class="lead"/><line x1="268" y1="288" x2="280" y2="288" class="lead"/><text x="181" y="220" font-size="15.5" text-anchor="middle" class="strong">M/CD3 protein</text><text x="74" y="324" font-size="15.5" text-anchor="middle" class="">M target</text><text x="278" y="324" font-size="15.5" text-anchor="middle" class="">Recruited T cell</text><text x="24" y="355" font-size="15.5" text-anchor="start" class="">Measure protein + responder access.</text><rect x="16" y="405" width="328" height="245" rx="12" class="panel"/><text x="24" y="436" font-size="20" text-anchor="start" class="strong">Living CAR-T cells</text><text x="24" y="462" font-size="16" text-anchor="start" class="muted">Cell product</text><circle cx="74" cy="535" r="38" class="target"/><rect x="240" y="497" width="76" height="76" rx="17" class="cell"/><rect x="108" y="525" width="24" height="20" rx="4" class="target"/><text x="120" y="541" font-size="16" text-anchor="middle" class="strong">M</text><path d="M137 535Q151 522 163 535L239 535" class="lead"/><rect x="236" y="523" width="10" height="24" rx="3" class="product"/><line x1="240" y1="535" x2="258" y2="535" class="lead"/><line x1="258" y1="535" x2="272" y2="561" class="lead"/><text x="181" y="500" font-size="15.5" text-anchor="middle" class="strong">Membrane CAR</text><text x="74" y="604" font-size="15.5" text-anchor="middle" class="">M target</text><text x="278" y="604" font-size="15.5" text-anchor="middle" class="">Engineered T cell</text><text x="24" y="635" font-size="15.5" text-anchor="start" class="">Measure cell access + behavior.</text><text x="24" y="686" font-size="16" text-anchor="start" class="strong">Both need a functional encounter.</text><text x="24" y="713" font-size="15.5" text-anchor="start" class="">Binding does not prove killing.</text><text x="24" y="744" font-size="15.5" text-anchor="start" class="muted">Same M does not match geometry.</text></svg>
