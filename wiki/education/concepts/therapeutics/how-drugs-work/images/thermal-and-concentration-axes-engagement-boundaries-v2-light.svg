<text x="28" y="86" fill="#47616d" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Fictional curves · not an occupancy scale</text>
<rect x="22" y="112" width="556" height="381" rx="18" fill="#fffdf8" stroke="#6e8790" stroke-width="2"/>
<text x="42" y="154" fill="#243944" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">1  Vary temperature</text>
<text x="42" y="192" fill="#243944" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Soluble target signal · relative units</text>
<path d="M90 388 L530 388" fill="none" stroke="#6e8790" stroke-width="3"/>
<path d="M90 388 L90 233" fill="none" stroke="#6e8790" stroke-width="3"/>
