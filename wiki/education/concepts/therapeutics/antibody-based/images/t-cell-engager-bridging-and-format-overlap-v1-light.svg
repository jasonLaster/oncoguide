<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">T-cell engager</title><desc id="desc">An engager bridges CD3 on a T cell to target M on another cell, with native TCR separate. Below, a compact BiTE core and a BiTE core joined to Fc show that half-life-extension labels can overlap architecture. Contact or cytokines alone do not establish killing.</desc><rect x="6" y="5" width="588" height="890" rx="20" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="30" y="46" font-size="34" text-anchor="start" fill="#203346" font-weight="700">Build a bridge between cells</text><text x="30" y="84" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Two binding jobs; function needs evidence</text><circle cx="125" cy="275" r="100" fill="#d7edf3" stroke="#267898" stroke-width="3"/><circle cx="110.48387096774194" cy="286.2903225806452" r="38.0" fill="#d7edf3" stroke="#267898" stroke-width="3"/><circle cx="173.38709677419354" cy="242.74193548387098" r="6.451612903225806" fill="#d7edf3" stroke="#267898" stroke-width="3"/><circle cx="165.32258064516128" cy="320.16129032258067" r="6.451612903225806" fill="#d7edf3" stroke="#267898" stroke-width="3"/><circle cx="76.61290322580645" cy="242.74193548387098" r="6.451612903225806" fill="#d7edf3" stroke="#267898" stroke-width="3"/><circle cx="475" cy="275" r="100" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="460.48387096774195" cy="286.2903225806452" r="38.0" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="523.3870967741935" cy="242.74193548387098" r="6.451612903225806" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="515.3225806451613" cy="320.16129032258067" r="6.451612903225806" fill="#fff0ce" stroke="#996218" stroke-width="3"/><circle cx="426.61290322580646" cy="242.74193548387098" r="6.451612903225806" fill="#fff0ce" stroke="#996218" stroke-width="3"/><text x="125" y="141" font-size="28" text-anchor="middle" fill="#267898" font-weight="700">T cell</text><text x="475" y="141" font-size="28" text-anchor="middle" fill="#996218" font-weight="700">target cell</text><path d="M 221 253 H 246" fill="none" stroke="#996218" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="248" cy="253" r="13" fill="#fff0ce" stroke="#996218" stroke-width="3"/><path d="M 379 253 H 355" fill="none" stroke="#996218" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="353" cy="253" r="13" fill="#fff0ce" stroke="#996218" stroke-width="3"/><g transform="translate(280 253) scale(0.65)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#267898" font-weight="700"></text></g><g transform="translate(321 253) scale(0.65)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#ece1f4" stroke="#73538f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#73538f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700"></text></g><path d="M 294 274 Q 301 293 308 273" fill="none" stroke="#9b4860" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="218" y="204" font-size="26" text-anchor="middle" fill="#996218" font-weight="500">CD3</text><text x="389" y="204" font-size="26" text-anchor="middle" fill="#996218" font-weight="500">target M</text><text x="300" y="345" font-size="26" text-anchor="middle" fill="#9b4860" font-weight="500">engager</text><path d="M 300 326 L 300 280" fill="none" stroke="#485c70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 90 367 L 85 396 M 104 371 L 110 400" fill="none" stroke="#267898" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="443" font-size="26" text-anchor="start" fill="#203346" font-weight="500">native TCR is separate; it need not</text><text x="35" y="474" font-size="26" text-anchor="start" fill="#203346" font-weight="500">recognize a tumor peptide here.</text><rect x="20" y="497" width="560" height="282" rx="20" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="539" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Format names can overlap</text><g transform="translate(115 605) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#267898" font-weight="700"></text></g><g transform="translate(155 605) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#267898" font-weight="700"></text></g><g transform="translate(210 605) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#ece1f4" stroke="#73538f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#73538f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700"></text></g><g transform="translate(250 605) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#ece1f4" stroke="#73538f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#73538f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700"></text></g><path d="M 175 605 H 190" fill="none" stroke="#9b4860" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="325" y="613" font-size="26" text-anchor="start" fill="#203346" font-weight="500">compact BiTE</text><g transform="translate(115 691) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#267898" font-weight="700"></text></g><g transform="translate(155 691) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#d7edf3" stroke="#267898" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#267898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#267898" font-weight="700"></text></g><g transform="translate(210 691) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#ece1f4" stroke="#73538f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#73538f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700"></text></g><g transform="translate(250 691) scale(0.48)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#ece1f4" stroke="#73538f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#73538f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#73538f" font-weight="700"></text></g><path d="M 175 691 H 190 M 270 691 H 283" fill="none" stroke="#9b4860" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="283" y="675" width="39" height="32" rx="10" fill="#fff0ce" stroke="#a4b8c5" stroke-width="2"/><text x="349" y="679" font-size="26" text-anchor="start" fill="#203346" font-weight="500">BiTE core + Fc</text><text x="349" y="710" font-size="26" text-anchor="start" fill="#203346" font-weight="500">an HLE design</text><text x="30" y="812" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">HLE means intended longer exposure.</text><text x="30" y="843" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Fc also appears in IgG-like designs.</text><text x="30" y="874" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Binding or cytokines do not prove killing.</text></g></svg>
