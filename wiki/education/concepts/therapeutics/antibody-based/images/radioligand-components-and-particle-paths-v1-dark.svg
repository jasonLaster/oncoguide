<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Radioligand therapy: targeting radiation with a molecule</title><desc id="desc">A targeting vector, attachment with a chelator shown as one example, and radioisotope sit above tumor and healthy cell neighborhoods. A short alpha track and a longer beta-minus track illustrate exposure and crossfire without a dose scale or treatment ranking.</desc><rect x="6" y="5" width="588" height="890" rx="20" fill="#0f0f1a"/><g font-family="system-ui, sans-serif"><text x="30" y="46" font-size="34" text-anchor="start" fill="#edf5fa" font-weight="700">A molecule carries an isotope</text><text x="30" y="84" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Track the product, then the particle paths</text><rect x="20" y="110" width="560" height="225" rx="20" fill="#182735" stroke="#5b768a" stroke-width="2"/><g transform="translate(105 198) scale(1)"><path d="M -27 -33 C -48 -10 -40 27 -13 39 C 5 46 35 34 39 12 C 48 -17 27 -43 7 -43 C -7 -49 -18 -40 -27 -33" fill="#193f51" stroke="#77cbe3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -22 -19 L 15 -23 L -17 -6 L 20 0 L -12 16 L 12 25" fill="none" stroke="#77cbe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="8" font-size="26" text-anchor="middle" fill="#77cbe3" font-weight="700"></text></g><path d="M 145 198 H 230" fill="none" stroke="#f3a1b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 230 175 L 265 175 L 280 198 L 265 221 L 230 221 L 215 198 Z" fill="#352945" stroke="#c6ace3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="248" cy="198" r="10" fill="#493920" stroke="#f4c579" stroke-width="3"/><text x="350" y="209" font-size="26" text-anchor="start" fill="#f4c579" font-weight="500">radioisotope</text><path d="M 342 202 L 264 199" fill="none" stroke="#c1cfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="278" font-size="26" text-anchor="start" fill="#77cbe3" font-weight="500">targeting vector</text><text x="40" y="309" font-size="26" text-anchor="start" fill="#77cbe3" font-weight="500">recognizes a target</text><text x="293" y="279" font-size="26" text-anchor="start" fill="#c6ace3" font-weight="500">attachment chemistry</text><text x="293" y="310" font-size="26" text-anchor="start" fill="#c6ace3" font-weight="500">chelator shown here</text><text x="30" y="378" font-size="28" text-anchor="start" fill="#edf5fa" font-weight="700">Illustrative tissue neighborhood</text><circle cx="132" cy="471" r="60" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="123.29032258064517" cy="477.7741935483871" r="22.8" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="161.03225806451613" cy="451.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="156.19354838709677" cy="498.0967741935484" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="102.96774193548387" cy="451.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="305" cy="460" r="60" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="296.2903225806452" cy="466.7741935483871" r="22.8" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="334.0322580645161" cy="440.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="329.19354838709677" cy="487.0967741935484" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="275.9677419354839" cy="440.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="465" cy="480" r="60" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="456.2903225806452" cy="486.7741935483871" r="22.8" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="494.0322580645161" cy="460.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="489.19354838709677" cy="507.0967741935484" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="435.9677419354839" cy="460.64516129032256" r="3.870967741935484" fill="#493920" stroke="#f4c579" stroke-width="3"/><circle cx="132" cy="664" r="60" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="123.29032258064517" cy="670.7741935483871" r="22.8" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="161.03225806451613" cy="644.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="156.19354838709677" cy="691.0967741935484" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="102.96774193548387" cy="644.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="321" cy="660" r="60" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="312.2903225806452" cy="666.7741935483871" r="22.8" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="350.0322580645161" cy="640.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="345.19354838709677" cy="687.0967741935484" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="291.9677419354839" cy="640.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="480" cy="660" r="60" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="471.2903225806452" cy="666.7741935483871" r="22.8" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="509.0322580645161" cy="640.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="504.19354838709677" cy="687.0967741935484" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><circle cx="450.9677419354839" cy="640.6451612903226" r="3.870967741935484" fill="#173f37" stroke="#81d9bd" stroke-width="3"/><text x="32" y="567" font-size="26" text-anchor="start" fill="#edf5fa" font-weight="500">tumor cells</text><text x="342" y="750" font-size="26" text-anchor="start" fill="#edf5fa" font-weight="500">healthy cells</text><circle cx="170" cy="458" r="10" fill="#4b2837" stroke="#f3a1b8" stroke-width="3"/><path d="M 170 458 L 213 417" fill="none" stroke="#f3a1b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="399" font-size="26" text-anchor="start" fill="#f3a1b8" font-weight="500">short α track</text><path d="M 244 401 L 210 417" fill="none" stroke="#c1cfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="273" cy="500" r="10" fill="#193f51" stroke="#77cbe3" stroke-width="3"/><path d="M 273 500 C 308 531 545 527 550 578 S 530 650 482 683" fill="none" stroke="#77cbe3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="250" y="566" font-size="26" text-anchor="start" fill="#77cbe3" font-weight="500">longer β− track</text><text x="250" y="597" font-size="26" text-anchor="start" fill="#77cbe3" font-weight="500">can reach neighbors</text><circle cx="112" cy="617" r="10" fill="#4b2837" stroke="#f3a1b8" stroke-width="3"/><path d="M 112 617 L 155 650" fill="none" stroke="#f3a1b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="27" y="790" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Healthy-tissue uptake can expose cells too.</text><text x="27" y="821" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Lengths are illustrative, not dose estimates.</text><text x="27" y="852" font-size="26" text-anchor="start" fill="#c1cfdc" font-weight="500">Alpha/beta is not a treatment ranking.</text></g></svg>
