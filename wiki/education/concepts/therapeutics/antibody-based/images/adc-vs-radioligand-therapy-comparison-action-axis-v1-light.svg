<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">Same M; different actions</title><desc id="desc">Two fictional M-addressed routes distinguish a chosen ADC processing pathway supplying active chemical material from a radioactive ligand whose distribution over time supplies radiation exposure in tumor and normal tissue. Dashed links are measurements still needed; no dose values, cell killing or clinical outcome is depicted.</desc><style>text{fill:#19363e;font-family:Arial,Helvetica,sans-serif}.title,.strong{font-weight:700}.muted{fill:#50656c}.panel{fill:#fffdf9;stroke:#19363e;stroke-width:1.6}.target{fill:#ebd4b4;stroke:#19363e;stroke-width:1.6}.cell{fill:#c7dfe7;stroke:#19363e;stroke-width:1.6}.product{fill:#997ca6;stroke:#19363e;stroke-width:1.6}.signal{fill:#657f56;stroke:#19363e;stroke-width:1.6}.lead{fill:none;stroke:#19363e;stroke-width:1.3}.proposal{fill:none;stroke:#50656c;stroke-width:1.5;stroke-dasharray:4 3}</style><rect width="360" height="760" fill="#fbf8f2"/><text x="24" y="35" font-size="22" text-anchor="start" class="title">Same M</text><text x="24" y="63" font-size="22" text-anchor="start" class="title">Chemical action or radiation</text><text x="24" y="94" font-size="15.5" text-anchor="start" class="muted">Fictional routes · not to scale</text><rect x="16" y="125" width="328" height="245" rx="12" class="panel"/><text x="24" y="156" font-size="20" text-anchor="start" class="strong">Chosen ADC route</text><rect x="32" y="172" width="296" height="40" rx="7" class="panel"/><text x="180" y="197" font-size="16" text-anchor="middle" class="strong">Complete antibody + cargo</text><line x1="180" y1="212" x2="180" y2="227" class="proposal"/><rect x="32" y="227" width="296" height="40" rx="7" class="panel"/><text x="180" y="252" font-size="16" text-anchor="middle" class="strong">Processing / active material</text><line x1="180" y1="267" x2="180" y2="282" class="proposal"/><rect x="32" y="282" width="296" height="40" rx="7" class="panel"/><text x="180" y="307" font-size="16" text-anchor="middle" class="strong">Chemical action site</text><text x="24" y="355" font-size="15.5" text-anchor="start" class="">Measure exposure + cell response.</text><rect x="16" y="405" width="328" height="245" rx="12" class="panel"/><text x="24" y="436" font-size="20" text-anchor="start" class="strong">Radioligand route</text><rect x="32" y="452" width="296" height="40" rx="7" class="panel"/><text x="180" y="477" font-size="16" text-anchor="middle" class="strong">Complete ligand + radionuclide</text><line x1="180" y1="492" x2="180" y2="507" class="proposal"/><rect x="32" y="507" width="296" height="40" rx="7" class="panel"/><text x="180" y="532" font-size="16" text-anchor="middle" class="strong">Tissue activity over time</text><line x1="180" y1="547" x2="180" y2="562" class="proposal"/><rect x="32" y="562" width="296" height="40" rx="7" class="panel"/><text x="180" y="587" font-size="16" text-anchor="middle" class="strong">Tumor + normal absorbed dose</text><text x="24" y="635" font-size="15.5" text-anchor="start" class="">Measure response and harms.</text><text x="24" y="686" font-size="16" text-anchor="start" class="strong">Binding / uptake leaves steps open.</text><text x="24" y="713" font-size="15.5" text-anchor="start" class="">Dashed links need measurements.</text><text x="24" y="744" font-size="15.5" text-anchor="start" class="muted">No dose values or outcome ranking.</text></svg>
