<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">Where the insertion lands</title><desc id="desc">Three schematic insertion locations: no shown gene effect, disruption within a gene, and regulatory insertion beside a gene. A fictional clone is followed over time without percentages. Expansion, malignant diagnosis, and insertion-driven causation are distinct.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#40596b"/></marker></defs><rect width="600" height="1000" fill="#f8fafc"/><text x="30" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#172a3b">Where the insertion lands</text><text x="30" y="98" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#41596c">Illustrations, not risk estimates</text><rect x="30" y="139" width="540" height="142" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="182" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172a3b">No shown gene effect</text><path d="M55 229 L535 229" fill="none" stroke="#40596b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="344" y="208" width="171" height="43" rx="15" fill="#d9edf5" stroke="#40596b" stroke-width="2"/><rect x="140" y="206" width="58" height="47" rx="15" fill="#8b4600" stroke="#40596b" stroke-width="2"/><text x="366" y="243" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Gene</text><rect x="30" y="304" width="540" height="142" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="347" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172a3b">Gene interruption</text><path d="M55 394 L535 394" fill="none" stroke="#40596b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="373" width="310" height="43" rx="15" fill="#d9edf5" stroke="#40596b" stroke-width="2"/><rect x="252" y="367" width="63" height="55" rx="15" fill="#8b4600" stroke="#40596b" stroke-width="2"/><text x="139" y="408" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Gene</text><rect x="30" y="469" width="540" height="142" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="512" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172a3b">Regulatory insertion</text><path d="M55 559 L535 559" fill="none" stroke="#40596b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="314" y="538" width="206" height="43" rx="15" fill="#d9edf5" stroke="#40596b" stroke-width="2"/><rect x="180" y="533" width="60" height="50" rx="15" fill="#8b4600" stroke="#40596b" stroke-width="2"/><path d="M245 574 Q280 607 316 577" fill="none" stroke="#8b4600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="343" y="573" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Gene</text><text x="35" y="660" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Orange insert; blue-gray gene</text><rect x="30" y="700" width="540" height="124" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><circle cx="68" cy="747" r="16" fill="#8b4600" stroke="#00658a" stroke-width="3"/><path d="M111 751 L218 751" fill="none" stroke="#40596b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="260" cy="740" r="13" fill="#8b4600" stroke="#00658a" stroke-width="3"/><circle cx="302" cy="740" r="13" fill="#8b4600" stroke="#00658a" stroke-width="3"/><circle cx="344" cy="740" r="13" fill="#8b4600" stroke="#00658a" stroke-width="3"/><circle cx="282" cy="764" r="13" fill="#8b4600" stroke="#00658a" stroke-width="3"/><circle cx="324" cy="764" r="13" fill="#8b4600" stroke="#00658a" stroke-width="3"/><text x="390" y="751" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#172a3b">Later</text><text x="50" y="810" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Fictional clone; no time scale</text><rect x="30" y="853" width="540" height="113" rx="15" fill="#eaf1f6" stroke="#40596b" stroke-width="2"/><text x="50" y="891" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Expansion ≠ cancer ≠ causation.</text><text x="50" y="930" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#172a3b">Nonviral systems can also integrate.</text></svg>
