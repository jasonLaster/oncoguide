<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1210" viewBox="0 0 600 1210" role="img" aria-labelledby="title desc"><title id="title">Follow signals, then symptoms</title><desc id="desc">Three panels show abstract gut-to-brain nerve signaling alongside blood-borne and learned inputs, early and later reporting windows with overlapping biology, and separate nausea and vomiting outcomes. No vomiting does not establish absence of nausea.</desc><metadata>{&quot;creativeAuthor&quot;: &quot;agent:/root/batch11_pathology_symptoms_author&quot;, &quot;technique&quot;: &quot;original source-code SVG&quot;, &quot;imageModelCalls&quot;: 0, &quot;scientificReview&quot;: &quot;pending&quot;}</metadata><rect x="6" y="5" width="588" height="1200" rx="20" fill="#111827"/><g font-family="system-ui,sans-serif"><text x="30" y="48" font-size="32" text-anchor="start" fill="#edf4fa" font-weight="700">Follow signals, then symptoms</text><text x="30" y="87" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">Several inputs; two symptom measurements</text><rect x="20" y="117" width="560" height="395" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="156" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">1  Signals can meet in the brain</text><path d="M93 198 C52 183 61 286 91 283 C118 278 66 259 99 238 C135 216 167 245 134 266 C104 287 120 327 155 306" fill="none" stroke="#80d5bd" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="353" font-size="26" text-anchor="start" fill="#80d5bd" font-weight="500">gut</text><path d="M169 239 L369 239" fill="none" stroke="#80d5bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M359.0950818741206 243.78462087522354 L369 239 L359.0950818741206 234.21537912477646" fill="none" stroke="#80d5bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="219" font-size="25" text-anchor="start" fill="#80d5bd" font-weight="500">nerve signals</text><path d="M386 202 C363 179 390 159 410 177 C436 152 456 181 450 196 C484 188 496 218 477 232 C494 258 464 278 446 261 C418 282 391 262 395 246 C366 253 354 221 386 202 Z" fill="#392b4d" stroke="#c7a5e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M407 185 Q429 216 412 248 M445 192 Q428 216 456 246" fill="none" stroke="#c7a5e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="403" y="304" font-size="26" text-anchor="start" fill="#c7a5e3" font-weight="500">brain</text><path d="M293 366 L397 267" fill="none" stroke="#efa0ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393.1247391763793 277.2947731178939 L397 267 L386.52692643063267 270.36373750620044" fill="none" stroke="#efa0ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="414" font-size="23" text-anchor="start" fill="#c0cedd" font-weight="500">blood-borne and learned inputs also contribute</text><text x="44" y="459" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">Serotonin / 5-HT₃ and substance P / NK₁</text><text x="44" y="491" font-size="25" text-anchor="start" fill="#c0cedd" font-weight="500">are parts of overlapping pathways.</text><rect x="20" y="540" width="560" height="295" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="579" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">2  Reporting windows are not pathways</text><path d="M83 671 H522" fill="none" stroke="#c0cedd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 643 V719" fill="none" stroke="#61758b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="627" font-size="25" text-anchor="start" fill="#edf4fa" font-weight="500">before</text><text x="182" y="627" font-size="25" text-anchor="start" fill="#edf4fa" font-weight="500">after administration</text><rect x="170" y="648" width="93" height="36" rx="6" fill="#193e51" stroke="#7ac7e5" stroke-width="2"/><rect x="264" y="648" width="258" height="36" rx="6" fill="#392b4d" stroke="#c7a5e3" stroke-width="2"/><text x="175" y="721" font-size="25" text-anchor="start" fill="#7ac7e5" font-weight="500">0–24 h</text><text x="305" y="721" font-size="25" text-anchor="start" fill="#c7a5e3" font-weight="500">beyond 24 h</text><text x="44" y="775" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">Biological signals can overlap both windows.</text><rect x="20" y="865" width="560" height="255" rx="16" fill="#1e293b" stroke="#61758b" stroke-width="2"/><text x="38" y="904" font-size="28" text-anchor="start" fill="#edf4fa" font-weight="700">3  Ask about both outcomes</text><rect x="43" y="935" width="244" height="89" rx="12" fill="#193e36" stroke="#80d5bd" stroke-width="2"/><rect x="311" y="935" width="244" height="89" rx="12" fill="#392b4d" stroke="#c7a5e3" stroke-width="2"/><text x="58" y="970" font-size="25" text-anchor="start" fill="#80d5bd" font-weight="500">Nausea</text><text x="58" y="1002" font-size="25" text-anchor="start" fill="#80d5bd" font-weight="500">felt and reported</text><text x="326" y="970" font-size="25" text-anchor="start" fill="#c7a5e3" font-weight="500">Vomiting</text><text x="326" y="1002" font-size="25" text-anchor="start" fill="#c7a5e3" font-weight="500">physical event</text><text x="43" y="1065" font-size="26" text-anchor="start" fill="#c0cedd" font-weight="500">No vomiting can coexist with real nausea.</text><text x="30" y="1163" font-size="24" text-anchor="start" fill="#c0cedd" font-weight="500">A concept map, not a diagnosis or medicine plan.</text></g></svg>
