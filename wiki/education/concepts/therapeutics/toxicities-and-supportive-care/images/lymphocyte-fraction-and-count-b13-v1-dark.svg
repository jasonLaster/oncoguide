<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1310" viewBox="0 0 760 1310" role="img" aria-labelledby="title desc"><title id="title">A bigger percentage can hide a lower count</title><desc id="desc">Fictional blood concentration comparison on a common scale: 400 then 200 lymphocytes per microliter.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#f4f0e3" stroke-width="1.5"/></marker></defs><rect width="760" height="1310" fill="#142531"/><g font-family="system-ui,Arial,sans-serif" fill="#f4f0e3"><text x="30" y="54" font-size="38" font-weight="750" fill="#f4f0e3" text-anchor="start">The fraction rose. The count fell.</text><text x="30" y="107" font-size="30" font-weight="400" fill="#bdced5" text-anchor="start">Fictional blood samples · same volume unit</text><rect x="24" y="149" width="712" height="620" rx="20" fill="#203b47" stroke="#a2b8bf" stroke-width="2"/><text x="44" y="197" font-size="35" font-weight="750" fill="#f4f0e3" text-anchor="start">Before preparation</text><text x="44" y="244" font-size="32" font-weight="700" fill="#f4f0e3" text-anchor="start">20% × 2,000 = 400 lymphocytes/µL</text><rect x="85" y="282" width="580" height="65" rx="5" fill="#49385f" stroke="#c9a6ef" stroke-width="2"/><rect x="85" y="282" width="116" height="65" rx="5" fill="#26584f" stroke="#78dcc8" stroke-width="2"/><text x="44" y="422" font-size="35" font-weight="750" fill="#f4f0e3" text-anchor="start">Later sample</text><text x="44" y="469" font-size="32" font-weight="700" fill="#f4f0e3" text-anchor="start">40% × 500 = 200 lymphocytes/µL</text><rect x="85" y="508" width="145" height="65" rx="5" fill="#49385f" stroke="#c9a6ef" stroke-width="2"/><rect x="85" y="508" width="58" height="65" rx="5" fill="#26584f" stroke="#78dcc8" stroke-width="2"/><path d="M85 632 H665" fill="none" stroke="#f4f0e3" stroke-width="2"/><path d="M85 621 V643" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="85" y="679" font-size="27" font-weight="400" fill="#f4f0e3" text-anchor="middle">0</text><path d="M230 621 V643" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="230" y="679" font-size="27" font-weight="400" fill="#f4f0e3" text-anchor="middle">500</text><path d="M375 621 V643" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="375" y="679" font-size="27" font-weight="400" fill="#f4f0e3" text-anchor="middle">1000</text><path d="M520 621 V643" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="520" y="679" font-size="27" font-weight="400" fill="#f4f0e3" text-anchor="middle">1500</text><path d="M665 621 V643" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="665" y="679" font-size="27" font-weight="400" fill="#f4f0e3" text-anchor="middle">2000</text><text x="375" y="731" font-size="31" font-weight="400" fill="#f4f0e3" text-anchor="middle">White cells per microliter (µL)</text><text x="35" y="818" font-size="31" font-weight="700" fill="#78dcc8" text-anchor="start">Teal segment = lymphocyte concentration</text><text x="35" y="861" font-size="31" font-weight="700" fill="#c9a6ef" text-anchor="start">Whole bar = all white-cell concentration</text><circle cx="105" cy="955" r="33" fill="#26584f" stroke="#78dcc8" stroke-width="3"/><circle cx="93.78" cy="955" r="8" fill="#26584f" stroke="#78dcc8" stroke-width="3"/><g fill="#f4f0e3"><circle cx="112" cy="948" r="2.6"/><circle cx="122" cy="948" r="2.6"/></g><path d="M112 961 q5 6 11 0" fill="none" stroke="#f4f0e3" stroke-width="2"/><text x="160" y="944" font-size="32" font-weight="700" fill="#f4f0e3" text-anchor="start">Fraction: 20% → 40% (higher)</text><text x="160" y="989" font-size="31" font-weight="700" fill="#f4f0e3" text-anchor="start">Count: 400 → 200 per µL (lower)</text><rect x="24" y="1052" width="712" height="215" rx="20" fill="#634c2c" stroke="#f4c27c" stroke-width="2"/><text x="44" y="1100" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">A blood count does not measure tumor kill.</text><text x="44" y="1142" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">Cells are not filling empty physical slots.</text><text x="44" y="1184" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">Tumor outcomes and harms belong to the</text><text x="44" y="1226" font-size="30" font-weight="400" fill="#f4f0e3" text-anchor="start">whole regimen, with attribution assessed.</text></g></svg>