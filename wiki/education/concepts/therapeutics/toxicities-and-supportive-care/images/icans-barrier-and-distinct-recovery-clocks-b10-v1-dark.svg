<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1630" viewBox="0 0 780 1630" role="img"><title>Brain function needs its own account</title>
<rect width="780" height="1630" fill="#15202b"/>
<text x="38" y="52" fill="#eff4f8" font-family="Arial,sans-serif" font-size="34" font-weight="700">Brain function needs its own account</text>
<text x="38" y="98" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">A barrier hypothesis plus clinical observations</text>
<rect x="28" y="135" width="724" height="556" rx="24" fill="#223342" stroke="#c3cfda" stroke-width="2"/>
<text x="48" y="181" fill="#eff4f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">1  Locate the blood–brain boundary</text>
<text x="50" y="234" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="700">Blood side</text>
<circle cx="120" cy="285" r="13" fill="#e8c374" stroke="#c3cfda" stroke-width="3"/>
<circle cx="240" cy="281" r="13" fill="#e8c374" stroke="#c3cfda" stroke-width="3"/>
<circle cx="535" cy="286" r="13" fill="#e8c374" stroke="#c3cfda" stroke-width="3"/>
<circle cx="659" cy="284" r="13" fill="#e8c374" stroke="#c3cfda" stroke-width="3"/>
<rect x="45" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<rect x="157" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<rect x="269" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<rect x="381" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<rect x="493" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<rect x="605" y="330" width="102" height="90" rx="20" fill="#d89a88" stroke="#c3cfda" stroke-width="2"/>
<text x="74" y="468" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="400">Vascular lining / barrier</text>
<path d="M220,438 L220,415" fill="none" stroke="#eff4f8" stroke-width="3"/>
<text x="50" y="526" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="700">Brain side</text>
<path d="M570 449 C540 476 585 536 619 494 L654 529 M619 494 L659 456 M587 504 L551 538" fill="none" stroke="#796398" stroke-width="7"/>
<path d="M381,261 L381,530" fill="none" stroke="#eff4f8" stroke-width="4" stroke-dasharray="10 8"/>
<path d="M381,530 L373.80861692093697,516.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M381,530 L388.19138307906303,516.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<text x="49" y="603" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Disruption and signal entry are implicated.</text>
<text x="49" y="655" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Association ≠ one universal complete mechanism.</text>
<rect x="28" y="726" width="724" height="389" rx="24" fill="#223342" stroke="#c3cfda" stroke-width="2"/>
<text x="48" y="772" fill="#eff4f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">2  A cognitive tool is one input</text>
<rect x="60" y="812" width="230" height="142" rx="24" fill="#406e8e" stroke="#c3cfda" stroke-width="2"/>
<text x="83" y="859" fill="#eff4f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">ICE tool</text>
<text x="81" y="910" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="400">Cognition</text>
<path d="M175,958 L175,978" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M175,978 L167.80861692093694,964.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M175,978 L182.19138307906303,964.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M550,958 L550,978" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M550,978 L542.808616920937,964.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<path d="M550,978 L557.191383079063,964.8362615716444" fill="none" stroke="#eff4f8" stroke-width="4"/>
<text x="395" y="840" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="700">Other domains:</text>
<text x="395" y="885" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">awareness, seizures,</text>
<text x="395" y="930" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">motor findings, swelling</text>
<text x="227" y="1010" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="700">Clinical assessment</text>
<text x="49" y="1055" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Baseline, other causes and examination matter.</text>
<text x="49" y="1093" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Name the ASTCT version (2019 / 2026).</text>
<rect x="28" y="1150" width="724" height="315" rx="24" fill="#223342" stroke="#c3cfda" stroke-width="2"/>
<text x="48" y="1196" fill="#eff4f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">3  Follow recovery separately</text>
<text x="50" y="1258" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">CRS course</text>
<path d="M328,1248 L700,1248" fill="none" stroke="#c3cfda" stroke-width="3"/>
<path d="M328,1248 L638,1248" fill="none" stroke="#77b9e0" stroke-width="14"/>
<circle cx="638" cy="1248" r="10" fill="#223342" stroke="#c3cfda" stroke-width="3"/>
<text x="50" y="1333" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Neurologic course</text>
<path d="M328,1323 L700,1323" fill="none" stroke="#c3cfda" stroke-width="3"/>
<path d="M328,1323 L695,1323" fill="none" stroke="#b69bd3" stroke-width="14"/>
<circle cx="695" cy="1323" r="10" fill="#223342" stroke="#c3cfda" stroke-width="3"/>
<text x="49" y="1410" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">Fictional timelines; no typical order or duration.</text>
<text x="38" y="1524" fill="#eff4f8" font-family="Arial,sans-serif" font-size="30" font-weight="700">ICE alone is neither diagnosis nor full grade.</text>
<text x="38" y="1583" fill="#eff4f8" font-family="Arial,sans-serif" font-size="28" font-weight="400">CRS improvement does not prove brain recovery.</text>
</svg>
