<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1260" viewBox="0 0 600 1260" role="img" aria-labelledby="title desc"><title id="title">Block a particular contact</title><desc id="desc">PD-1 contacts PD-L1 or PD-L2; a PD-L1-blockade scene interrupts only the PD-L1 contact. A separate comparison shows CD28 and CTLA-4 sharing CD80/CD86 partners. The figure does not assign exclusive sites or guarantee response.</desc><rect width="600" height="1260" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="28" y="45" font-size="32" text-anchor="start" fill="#203346" font-weight="700">Block a particular contact</text><text x="28" y="84" font-size="26" text-anchor="start" fill="#203346" font-weight="500">Partner identity changes what is blocked</text><rect x="18" y="112" width="564" height="270" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="148" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="156" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">1</text><text x="78" y="157" font-size="28" text-anchor="start" fill="#203346" font-weight="700">PD-1 has two named partners</text><rect x="157" y="206" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="206" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="223" width="104" height="34" rx="12" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><rect x="335" y="223" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 240 L 335 240" fill="none" stroke="#277e70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="249" font-size="26" text-anchor="end" fill="#203346" font-weight="500">PD-1</text><text x="455" y="249" font-size="26" text-anchor="start" fill="#203346" font-weight="500">PD-L1</text><rect x="157" y="290" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="290" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="307" width="104" height="34" rx="12" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><rect x="335" y="307" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 324 L 335 324" fill="none" stroke="#277e70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="333" font-size="26" text-anchor="end" fill="#203346" font-weight="500">PD-1</text><text x="455" y="333" font-size="26" text-anchor="start" fill="#203346" font-weight="500">PD-L2</text><text x="95" y="196" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">T cell</text><text x="300" y="196" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">Cell gap</text><text x="496" y="196" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">Neighbor</text><rect x="18" y="402" width="564" height="300" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="438" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="446" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">2</text><text x="78" y="447" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Block PD-L1 specifically</text><rect x="157" y="498" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="498" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="515" width="104" height="34" rx="12" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><rect x="335" y="515" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 532 L 335 532" fill="none" stroke="#277e70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="148" y="541" font-size="26" text-anchor="end" fill="#203346" font-weight="500">PD-1</text><text x="455" y="541" font-size="26" text-anchor="start" fill="#203346" font-weight="500">PD-L1</text><path d="M 288 511 L 316 553 M 316 511 L 288 553" fill="none" stroke="#9b4860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="157" y="586" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="586" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="603" width="104" height="34" rx="12" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><rect x="335" y="603" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 620 L 335 620" fill="none" stroke="#277e70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="629" font-size="26" text-anchor="end" fill="#203346" font-weight="500">PD-1</text><text x="455" y="629" font-size="26" text-anchor="start" fill="#203346" font-weight="500">PD-L2</text><text x="300" y="685" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">PD-L2 contact not directly blocked</text><rect x="18" y="722" width="564" height="300" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="758" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="766" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">3</text><text x="78" y="767" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Different receptors share partners</text><rect x="157" y="818" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="818" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="835" width="104" height="34" rx="12" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="335" y="835" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 852 L 335 852" fill="none" stroke="#267898" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="861" font-size="26" text-anchor="end" fill="#203346" font-weight="500">CD28</text><text x="455" y="861" font-size="26" text-anchor="start" fill="#203346" font-weight="500">CD80/86</text><rect x="157" y="908" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="438" y="908" width="8" height="68" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="162" y="925" width="104" height="34" rx="12" fill="#eee1f1" stroke="#87519b" stroke-width="2"/><rect x="335" y="925" width="104" height="34" rx="12" fill="#f9e6d1" stroke="#996024" stroke-width="2"/><path d="M 266 942 L 335 942" fill="none" stroke="#87519b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="951" font-size="26" text-anchor="end" fill="#203346" font-weight="500">CTLA-4</text><text x="455" y="951" font-size="26" text-anchor="start" fill="#203346" font-weight="500">CD80/86</text><text x="300" y="810" font-size="26" text-anchor="middle" fill="#485c70" font-weight="500">Supporting vs limiting signals</text><text x="38" y="1070" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Sites of action overlap.</text><text x="38" y="1102" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">No restored HLA or universal awakening.</text><text x="38" y="1134" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Cancer activity and tissue injury</text><text x="38" y="1166" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">both remain possible.</text></g></svg>