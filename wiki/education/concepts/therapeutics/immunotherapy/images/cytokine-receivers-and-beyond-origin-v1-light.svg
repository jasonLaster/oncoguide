<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">Same signal, different receivers</title><desc id="desc">Identical cytokine symbols reach two cells with different receptors and internal states; a second scene follows signal symbols from a local origin through circulation toward a distant tissue.</desc><rect width="600" height="1100" fill="#ffffff"/><g font-family="system-ui, sans-serif"><text x="28" y="45" font-size="32" text-anchor="start" fill="#203346" font-weight="700">Same signal, different receivers</text><text x="28" y="84" font-size="26" text-anchor="start" fill="#203346" font-weight="500">The cell and the exposure both matter</text><rect x="18" y="112" width="564" height="435" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="148" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="156" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">1</text><text x="78" y="157" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Look at the receiver</text><circle cx="160" cy="360" r="76" fill="#daf2e9" stroke="#277e70" stroke-width="3"/><circle cx="440" cy="360" r="76" fill="#eee1f1" stroke="#87519b" stroke-width="3"/><circle cx="160" cy="365" r="25" fill="#daf2e9" stroke="#277e70" stroke-width="3"/><circle cx="440" cy="365" r="25" fill="#eee1f1" stroke="#87519b" stroke-width="3"/><path d="M160 285 L160 243 M144 225 Q160 253 176 225" fill="none" stroke="#277e70" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 285 L440 243 M424 225 Q440 253 456 225" fill="none" stroke="#87519b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M477 300 L477 258 M461 240 Q477 268 493 240" fill="none" stroke="#87519b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="218" r="12" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="440" cy="218" r="12" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="302" cy="256" r="12" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><text x="160" y="475" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Receiver A</text><text x="160" y="507" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Cell state A</text><text x="440" y="475" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Receiver B</text><text x="440" y="507" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Cell state B</text><text x="300" y="195" font-size="26" text-anchor="middle" fill="#996024" font-weight="500">One generic cytokine signal</text><rect x="18" y="567" width="564" height="360" rx="18" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><circle cx="48" cy="603" r="17" fill="#d7edf3" stroke="#267898" stroke-width="3"/><text x="48" y="611" font-size="24" text-anchor="middle" fill="#203346" font-weight="700">2</text><text x="78" y="612" font-size="28" text-anchor="start" fill="#203346" font-weight="700">Follow where it can go</text><rect x="40" y="646" width="167" height="143" rx="18" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><rect x="393" y="646" width="167" height="143" rx="18" fill="#eee1f1" stroke="#87519b" stroke-width="2"/><text x="123" y="691" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Local</text><text x="123" y="723" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">origin</text><text x="476" y="691" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">Distant</text><text x="476" y="723" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">tissue</text><path d="M 205 801 C 260 840 340 840 394 801" fill="none" stroke="#9b4860" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 816 L366 816" fill="none" stroke="#9b4860" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M354.5914266954251 822.2325320018547 L366 816 L354.5914266954251 809.7674679981453" fill="none" stroke="#9b4860" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="732" r="10" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="247" cy="791" r="10" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="303" cy="815" r="10" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="359" cy="802" r="10" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><circle cx="408" cy="753" r="10" fill="#f9e6d1" stroke="#996024" stroke-width="3"/><text x="300" y="890" font-size="26" text-anchor="middle" fill="#203346" font-weight="500">If it reaches circulation and persists</text><text x="38" y="980" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Receptor engagement is not tumor killing.</text><text x="38" y="1012" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Measure activity and unwanted effects.</text></g></svg>