<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1110" viewBox="0 0 600 1110" role="img" aria-labelledby="title desc"><title id="title">Follow the chemical change</title><desc id="desc">Three schematic panels show an alkyl attachment to DNA, illustrative links within a strand or between two strands, and parent cyclophosphamide separated from active metabolites by metabolism. Continuous DNA backbones remain distinct from a break.</desc><metadata>{&quot;creativeAuthor&quot;: &quot;agent:/root/batch11_pathology_symptoms_author&quot;, &quot;technique&quot;: &quot;original source-code SVG&quot;, &quot;imageModelCalls&quot;: 0, &quot;scientificReview&quot;: &quot;pending&quot;}</metadata><rect x="6" y="5" width="588" height="1100" rx="20" fill="#ffffff"/><g font-family="system-ui,sans-serif"><text x="30" y="48" font-size="32" text-anchor="start" fill="#203346" font-weight="700">Follow the chemical change</text><text x="30" y="87" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Attachments and activation are different jobs</text><rect x="20" y="118" width="560" height="230" rx="16" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="157" font-size="28" text-anchor="start" fill="#203346" font-weight="700">1  One alkyl attachment</text><path d="M62 231 H532" fill="none" stroke="#267898" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 291 H532" fill="none" stroke="#277e70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M127 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M307 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M397 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M442 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M487 231 V291" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="153" y="249" width="34" height="28" rx="4" fill="#d7edf3" stroke="#267898" stroke-width="2"/><path d="M187 263 H216" fill="none" stroke="#9b4860" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="263" r="14" fill="#f4dde5" stroke="#9b4860" stroke-width="3"/><text x="280" y="272" font-size="26" text-anchor="start" fill="#9b4860" font-weight="500">alkyl group</text><text x="55" y="320" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Backbones remain continuous</text><rect x="20" y="374" width="560" height="285" rx="16" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="413" font-size="28" text-anchor="start" fill="#203346" font-weight="700">2  A two-ended agent can link sites</text><path d="M62 486 H532" fill="none" stroke="#267898" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 546 H532" fill="none" stroke="#277e70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M127 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M307 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M397 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M442 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M487 486 V546" fill="none" stroke="#a4b8c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="112" y="493" width="30" height="18" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="202" y="493" width="30" height="18" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="382" y="493" width="30" height="18" rx="3" fill="#d7edf3" stroke="#267898" stroke-width="2"/><rect x="382" y="521" width="30" height="18" rx="3" fill="#daf2e9" stroke="#277e70" stroke-width="2"/><path d="M127 502 C125 448 213 448 217 502" fill="none" stroke="#9b4860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M412 502 C458 502 458 530 412 530" fill="none" stroke="#73538f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="602" font-size="26" text-anchor="start" fill="#9b4860" font-weight="500">within one strand</text><text x="329" y="602" font-size="26" text-anchor="start" fill="#73538f" font-weight="500">between strands</text><rect x="20" y="685" width="560" height="300" rx="16" fill="#f2f6f8" stroke="#a4b8c5" stroke-width="2"/><text x="38" y="724" font-size="28" text-anchor="start" fill="#203346" font-weight="700">3  Cyclophosphamide is a prodrug</text><circle cx="92" cy="793" r="25" fill="#d7edf3" stroke="#267898" stroke-width="3"/><path d="M125 793 L219 793" fill="none" stroke="#485c70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M209.09508187412055 797.7846208752235 L219 793 L209.09508187412055 788.2153791247765" fill="none" stroke="#485c70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 775 C250 733 322 755 330 793 C321 828 270 832 228 809 Z" fill="#daf2e9" stroke="#277e70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 793 L421 793" fill="none" stroke="#485c70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M411.0950818741206 797.7846208752235 L421 793 L411.0950818741206 788.2153791247765" fill="none" stroke="#485c70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="467" cy="793" r="25" fill="#f4dde5" stroke="#9b4860" stroke-width="3"/><text x="52" y="853" font-size="26" text-anchor="start" fill="#203346" font-weight="500">parent</text><text x="213" y="853" font-size="26" text-anchor="start" fill="#203346" font-weight="500">metabolism</text><text x="419" y="853" font-size="26" text-anchor="start" fill="#203346" font-weight="500">active</text><text x="42" y="913" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Active metabolites create alkyl lesions.</text><text x="42" y="945" font-size="26" text-anchor="start" fill="#485c70" font-weight="500">Not every alkylator cross-links DNA.</text><text x="30" y="1027" font-size="25" text-anchor="start" fill="#485c70" font-weight="500">Platinum links use different chemistry.</text><text x="30" y="1059" font-size="25" text-anchor="start" fill="#485c70" font-weight="500">DNA damage does not ensure cell death.</text></g></svg>
