<svg xmlns="http://www.w3.org/2000/svg" width="600" height="950" viewBox="0 0 600 950" role="img" aria-labelledby="title desc"><title id="title">Activation, metabolites and clearance</title><desc id="desc">Capecitabine becomes fluorouracil through compressed activation steps. Separate FdUMP and FUTP branches affect DNA building material and RNA in both normal and tumor cells. A distinct host branch links the DPYD gene, DPD enzyme and fluorouracil breakdown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#172b38"/></marker></defs><rect width="600" height="950" rx="22" fill="#fffaf0"/><text x="30" y="48" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">Activation, cell effects</text><text x="30" y="90" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">and clearance are different</text><rect x="20" y="121" width="560" height="186" rx="18" fill="#ffffff"/><text x="40" y="166" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">1  Activate the prodrug</text><rect x="40" y="190" width="264" height="48" rx="24" fill="#f9e4cc"/><text x="172.0" y="226" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Capecitabine</text><path d="M320 214 L370 214" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="394" y="190" width="156" height="48" rx="24" fill="#d7eeeb"/><text x="472.0" y="226" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">5-FU</text><text x="40" y="283" fill="#415565" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Enzyme steps are compressed</text><rect x="20" y="321" width="560" height="317" rx="18" fill="#ffffff"/><text x="40" y="366" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">2  Active metabolites in cells</text><text x="40" y="408" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Normal cells AND tumor cells</text><rect x="45" y="440" width="175" height="48" rx="24" fill="#d7eeeb"/><text x="132.5" y="476" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">FdUMP</text><path d="M232 466 L273 466" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="293" y="456" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Less DNA</text><text x="293" y="498" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">building material</text><rect x="45" y="545" width="175" height="48" rx="24" fill="#d7eeeb"/><text x="132.5" y="581" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">FUTP</text><path d="M232 569 L273 569" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="293" y="557" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Enters RNA;</text><text x="293" y="599" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">disrupts its work</text><rect x="20" y="653" width="560" height="206" rx="18" fill="#ffffff"/><text x="40" y="698" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">3  Host breakdown / clearance</text><rect x="40" y="721" width="118" height="48" rx="24" fill="#d7eeeb"/><text x="99.0" y="757" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">5-FU</text><path d="M173 745 L214 745" fill="none" stroke="#172b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="236" y="721" width="313" height="48" rx="24" fill="#f9e4cc"/><text x="392.5" y="757" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">DPD breakdown</text><text x="40" y="800" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start">DPYD gene → DPD enzyme</text><text x="40" y="843" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start">Lower activity can raise toxicity risk</text><text x="30" y="902" fill="#172b38" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Host handling ≠ tumor sensitivity</text></svg>
