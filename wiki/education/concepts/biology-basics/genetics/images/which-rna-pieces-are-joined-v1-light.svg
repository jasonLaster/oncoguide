<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1520" viewBox="0 0 600 1520" role="img" aria-labelledby="title desc">
<title id="title">Which RNA pieces are joined?</title><desc id="desc">A precursor RNA contains A, B and C regions separated by gray introns. Two processed RNA alternatives retain A-B-C or A-C in order, with hatched untranslated ends. An example sequencing read crosses the A-C junction while protein consequence remains unknown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#596976"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" fill="none" stroke="#5f7380" stroke-width="2"/></pattern></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="600" height="1520" fill="#fbf7ef"/>
