<rect x="297" y="1032" width="48" height="45" rx="7" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="321" y="1066" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="321" dy="0">C</tspan></text>
