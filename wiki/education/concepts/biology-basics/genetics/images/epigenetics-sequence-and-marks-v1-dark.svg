<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1360" viewBox="0 0 780 1360" role="img" aria-labelledby="title desc"><title id="title">A chemical mark is separate from a sequence change</title><desc id="desc">Original AACGT and marked AACGT keep the same base letters; C-to-T mutation reads AATGT. A mark on the DNA strand is separate from a mark on a schematic histone-protein spool. 5mC and 5hmC are distinct modifications even though standard bisulfite reads both as a C signal. Promoter and gene-body positions are separated, and regulation still requires cell context and measured consequences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c1cfca"/></marker><pattern id="unknown" patternUnits="userSpaceOnUse" width="18" height="18"><path d="M0 18 L18 0" stroke="#617c77" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="780" height="1360" rx="0" fill="#192a2e" />
<text x="40" y="62" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Same letters, different chemistry</tspan></text>
<text x="40" y="108" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#c1cfca" text-anchor="start"><tspan x="40" dy="0">Read the sequence separately from its marks</tspan></text>
<rect x="24" y="145" width="732" height="470" rx="20" fill="#233a3e" stroke="#617c77" stroke-width="2" />
<text x="46" y="199" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="46" dy="0">1. Chemical mark or changed base?</tspan></text>
<text x="48" y="255" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Original</tspan></text>
<rect x="271" y="231" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="297.5" y="271" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="297.5" dy="0">A</tspan></text>
<rect x="341" y="231" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="367.5" y="271" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="367.5" dy="0">A</tspan></text>
<rect x="411" y="231" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="437.5" y="271" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="437.5" dy="0">C</tspan></text>
<rect x="481" y="231" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="507.5" y="271" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="507.5" dy="0">G</tspan></text>
<rect x="551" y="231" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="577.5" y="271" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="577.5" dy="0">T</tspan></text>
<text x="48" y="365" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Methyl mark</tspan><tspan x="48" dy="40">added to C</tspan></text>
<rect x="271" y="340" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="297.5" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="297.5" dy="0">A</tspan></text>
<rect x="341" y="340" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="367.5" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="367.5" dy="0">A</tspan></text>
<rect x="411" y="340" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="437.5" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="437.5" dy="0">C</tspan></text>
<rect x="481" y="340" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="507.5" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="507.5" dy="0">G</tspan></text>
<rect x="551" y="340" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="577.5" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="577.5" dy="0">T</tspan></text>
<circle cx="437.5" cy="317" r="20" fill="#e4bd7c"/>
<path d="M437.5 337 L437.5 340" fill="none" stroke="#e4bd7c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="470" y="324" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="470" dy="0">5mC</tspan></text>
<text x="48" y="487" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Sequence</tspan><tspan x="48" dy="40">change C → T</tspan></text>
<rect x="271" y="472" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="297.5" y="512" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="297.5" dy="0">A</tspan></text>
<rect x="341" y="472" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="367.5" y="512" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="367.5" dy="0">A</tspan></text>
<rect x="411" y="472" width="53" height="57" rx="9" fill="#715b38" stroke="#e4bd7c" stroke-width="2" />
<text x="437.5" y="512" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="437.5" dy="0">T</tspan></text>
<rect x="481" y="472" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
