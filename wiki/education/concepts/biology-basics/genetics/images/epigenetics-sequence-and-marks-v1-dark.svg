<rect x="551" y="472" width="53" height="57" rx="9" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="577.5" y="512" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="577.5" dy="0">T</tspan></text>
<text x="48" y="590" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">The first two rows keep the same letters.</tspan></text>
<rect x="24" y="640" width="732" height="285" rx="20" fill="#233a3e" stroke="#617c77" stroke-width="2" />
<text x="46" y="694" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="46" dy="0">2. DNA marks and histone marks</tspan></text>
<ellipse cx="217" cy="815" rx="75" ry="61" fill="#634d70" stroke="#c7a2db" stroke-width="4"/>
<path d="M70 795 C120 755 300 757 343 802 C387 845 173 900 97 852 C40 806 325 797 381 839" fill="none" stroke="#9bc9df" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="110" cy="784" r="14" fill="#e4bd7c"/>
<text x="48" y="740" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">DNA mark</tspan></text>
<path d="M123 751 L111 766" fill="none" stroke="#c1cfca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="245" cy="802" r="13" fill="#c7a2db"/>
<text x="425" y="795" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="425" dy="0">Histone</tspan><tspan x="425" dy="40">protein mark</tspan></text>
<path d="M401 808 L265 802" fill="none" stroke="#c1cfca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="903" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Strand: DNA • spool: histone proteins.</tspan></text>
<rect x="24" y="950" width="732" height="275" rx="20" fill="#233a3e" stroke="#617c77" stroke-width="2" />
<text x="46" y="1004" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="46" dy="0">3. DNA marks and genomic positions</tspan></text>
<rect x="65" y="1032" width="48" height="45" rx="7" fill="#405f71" stroke="#9bc9df" stroke-width="2" />
<text x="89" y="1066" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="89" dy="0">C</tspan></text>
