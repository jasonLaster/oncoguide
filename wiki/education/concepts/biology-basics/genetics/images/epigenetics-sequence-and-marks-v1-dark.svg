<text x="362" y="1069" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="start"><tspan x="362" dy="0">5hmC</tspan></text>
<text x="48" y="1136" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="48" dy="0">Standard bisulfite reads both as a C signal.</tspan></text>
<path d="M62 1190 L699 1190" fill="none" stroke="#9bc9df" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
<rect x="75" y="1168" width="163" height="45" rx="9" fill="#715b38" />
<rect x="316" y="1168" width="292" height="45" rx="9" fill="#405f71" />
<text x="156" y="1202" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="156" dy="0">Promoter</tspan></text>
<text x="462" y="1202" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f5eddd" text-anchor="middle"><tspan x="462" dy="0">Gene body</tspan></text>
<text x="40" y="1277" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#f5eddd" text-anchor="start"><tspan x="40" dy="0">Which sites? Which cells? Measure the RNA.</tspan><tspan x="40" dy="42">A mark is not a universal “off” switch.</tspan></text>
</svg>
