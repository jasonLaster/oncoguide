<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc"><title id="title">Choose and join receptor-gene pieces before asking what the finished receptor recognizes.</title><desc id="desc">Selected V2, D1 and J3 gene segments form a VDJ receptor-gene join in a developing lymphocyte; a separate VJ example has no D segment. Expression and selection precede later antigen encounter.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607789"/></marker></defs>
