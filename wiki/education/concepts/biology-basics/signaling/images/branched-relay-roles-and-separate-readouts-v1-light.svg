<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">A branched connection map is not measured dependence</title><desc id="desc">A membrane receptor branches toward a RAS molecular switch and a scaffold holding partners, with a kinase phosphate-transfer example kept separate from the fictional 30-minute phosphosite response and two-day unchanged cell count. This is a generic possible circuit, not measured wiring in a tumor. RAS is a GTP-regulated switch; a scaffold holds partners; a kinase can transfer phosphate from ATP to a substrate, leaving ADP. The fictional site X designation adds no measured residue identity: its lower signal after 30 minutes and the unchanged cell number after two days are separate readouts. The cell icons symbolize a count assay, not three measured cells. A phosphate does not universally activate a protein, and either result leaves growth dependence unresolved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#293743"/></marker></defs><rect width="760" height="1320" fill="#fcf8f1"/>
