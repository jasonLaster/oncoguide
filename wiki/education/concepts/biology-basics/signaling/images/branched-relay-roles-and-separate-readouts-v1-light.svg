<text x="459" y="1159" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">unchanged</text>
<text x="48" y="1196" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">A modification is not universal activation.</text>
<text x="38" y="1258" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">A biochemical change alone</text>
<text x="38" y="1303" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">does not prove growth dependence.</text>
