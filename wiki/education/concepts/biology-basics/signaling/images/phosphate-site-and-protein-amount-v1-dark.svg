<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1680" viewBox="0 0 600 1680" role="img" aria-labelledby="title desc">
<title id="title">Site, amount, or function?</title>
<desc id="desc">Two separate reactions add phosphate to and remove it from the same serine site. Below, fictional phosphopeptide and parent-protein signals both change from one to two while their ratio stays one; possible functional effects remain a separate question.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#c1cfd4"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="600" height="1680" fill="#17232d"/>
<text x="24" y="45" font-size="40" font-weight="700" text-anchor="start" fill="#f1eee6">Site, amount,</text>
<text x="24" y="90" font-size="40" font-weight="700" text-anchor="start" fill="#f1eee6">or function?</text>
<rect x="12" y="110" width="576" height="700" rx="18" fill="#20313e" stroke="#6d8491" stroke-width="2"/>
<text x="36" y="160" font-size="34" font-weight="700" text-anchor="start" fill="#f1eee6">Same protein, specified site</text>
<text x="36" y="202" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">Add phosphate</text>
<text x="300" y="242" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Kinase</text>
<rect x="64" y="270" width="120" height="80" rx="20" fill="#385d70" stroke="#b3d1de" stroke-width="2"/>
<path d="M84 310 q20 -23 40 0 t40 0" fill="none" stroke="#b3d1de" stroke-width="3"/>
<line x1="184" y1="310" x2="194" y2="310" stroke="#b3d1de" stroke-width="3"/>
<text x="206" y="319" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">O</text>
<line x1="220" y1="310" x2="228" y2="310" stroke="#b3d1de" stroke-width="3"/>
<text x="244" y="319" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">H</text>
<rect x="382" y="270" width="120" height="80" rx="20" fill="#385d70" stroke="#b3d1de" stroke-width="2"/>
<path d="M402 310 q20 -23 40 0 t40 0" fill="none" stroke="#b3d1de" stroke-width="3"/>
<line x1="502" y1="310" x2="512" y2="310" stroke="#b3d1de" stroke-width="3"/>
<text x="524" y="319" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">O</text>
<line x1="538" y1="310" x2="546" y2="310" stroke="#b3d1de" stroke-width="3"/>
<circle cx="562" cy="310" r="17" fill="#c49c60" stroke="#ead1a5" stroke-width="2"/>
<text x="562" y="319" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">P</text>
<line x1="274" y1="310" x2="362" y2="310" stroke="#c1cfd4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="366" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Specified site</text>
<line x1="230" y1="354" x2="213" y2="318" stroke="#b3d1de" stroke-width="3"/>
<text x="124" y="397" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Ser–OH</text>
<text x="442" y="397" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Ser–O–P</text>
<text x="300" y="440" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">ATP → ADP</text>
<path d="M330 418 Q490 415 550 328" fill="none" stroke="#c1cfd4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="36" y1="459" x2="564" y2="459" stroke="#6d8491" stroke-width="3"/>
<text x="36" y="499" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">Remove phosphate</text>
<text x="300" y="539" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Phosphatase</text>
<text x="300" y="575" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Water</text>
<line x1="300" y1="582" x2="300" y2="621" stroke="#c1cfd4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="582" width="120" height="80" rx="20" fill="#385d70" stroke="#b3d1de" stroke-width="2"/>
<path d="M84 622 q20 -23 40 0 t40 0" fill="none" stroke="#b3d1de" stroke-width="3"/>
<line x1="184" y1="622" x2="194" y2="622" stroke="#b3d1de" stroke-width="3"/>
<text x="206" y="631" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">O</text>
<line x1="220" y1="622" x2="228" y2="622" stroke="#b3d1de" stroke-width="3"/>
<circle cx="244" cy="622" r="17" fill="#c49c60" stroke="#ead1a5" stroke-width="2"/>
<text x="244" y="631" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">P</text>
<rect x="382" y="582" width="120" height="80" rx="20" fill="#385d70" stroke="#b3d1de" stroke-width="2"/>
<path d="M402 622 q20 -23 40 0 t40 0" fill="none" stroke="#b3d1de" stroke-width="3"/>
<line x1="502" y1="622" x2="512" y2="622" stroke="#b3d1de" stroke-width="3"/>
<text x="524" y="631" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">O</text>
<line x1="538" y1="622" x2="546" y2="622" stroke="#b3d1de" stroke-width="3"/>
<text x="562" y="631" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">H</text>
<line x1="274" y1="622" x2="362" y2="622" stroke="#c1cfd4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="124" y="699" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Ser–O–P</text>
<text x="442" y="699" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Ser–OH</text>
<line x1="440" y1="710" x2="521" y2="731" stroke="#c1cfd4" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="541" cy="739" r="17" fill="#c49c60" stroke="#ead1a5" stroke-width="2"/>
<text x="541" y="748" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">P</text>
<text x="310" y="754" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">Free phosphate</text>
<text x="36" y="792" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">P = phosphate group</text>
<rect x="12" y="835" width="576" height="535" rx="18" fill="#20313e" stroke="#6d8491" stroke-width="2"/>
<text x="36" y="879" font-size="34" font-weight="700" text-anchor="start" fill="#f1eee6">Fictional matched</text>
<text x="36" y="918" font-size="34" font-weight="700" text-anchor="start" fill="#f1eee6">measurements</text>
<text x="300" y="958" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Relative signal (A=1)</text>
<line x1="270" y1="1001" x2="510" y2="1001" stroke="#c1cfd4" stroke-width="3"/>
<line x1="270" y1="995" x2="270" y2="1007" stroke="#c1cfd4" stroke-width="3"/>
<text x="270" y="991" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">0</text>
<line x1="390" y1="995" x2="390" y2="1007" stroke="#c1cfd4" stroke-width="3"/>
<text x="390" y="991" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">1</text>
<line x1="510" y1="995" x2="510" y2="1007" stroke="#c1cfd4" stroke-width="3"/>
<text x="510" y="991" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">2</text>
<text x="30" y="1038" font-size="28" font-weight="700" text-anchor="start" fill="#f1eee6">Sample A</text>
<text x="30" y="1086" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">Phosphopeptide</text>
<text x="30" y="1123" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">Parent protein</text>
<text x="30" y="1155" font-size="28" font-weight="700" text-anchor="start" fill="#f1eee6">Sample B</text>
<text x="30" y="1193" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">Phosphopeptide</text>
<text x="30" y="1230" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">Parent protein</text>
<rect x="270" y="1066" width="120" height="22" fill="#9bbfd4"/>
<text x="402" y="1089" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">1</text>
<rect x="270" y="1103" width="120" height="22" fill="#dbbd8c"/>
<text x="402" y="1126" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">1</text>
<rect x="270" y="1173" width="240" height="22" fill="#9bbfd4"/>
<text x="522" y="1196" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">2</text>
<rect x="270" y="1210" width="240" height="22" fill="#dbbd8c"/>
<text x="522" y="1233" font-size="28" font-weight="600" text-anchor="start" fill="#f1eee6">2</text>
<text x="36" y="1262" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">A: 1/1 = 1</text>
<text x="326" y="1262" font-size="28" font-weight="400" text-anchor="start" fill="#f1eee6">B: 2/2 = 1</text>
<text x="300" y="1294" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Ratio unchanged</text>
<text x="300" y="1326" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">No occupancy % established</text>
<text x="300" y="1358" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Comparable measurements assumed</text>
<rect x="12" y="1395" width="576" height="265" rx="18" fill="#20313e" stroke="#6d8491" stroke-width="2"/>
<text x="300" y="1448" font-size="34" font-weight="700" text-anchor="middle" fill="#f1eee6">Function needs its own test</text>
<rect x="24" y="1480" width="176" height="129" rx="12" fill="#293e4b" stroke="#6d8491" stroke-width="2"/>
<text x="112" y="1520" font-size="32" font-weight="600" text-anchor="middle" fill="#f1eee6">↑</text>
<text x="112" y="1561" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Can</text>
<text x="112" y="1595" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">increase</text>
<rect x="206" y="1480" width="176" height="129" rx="12" fill="#293e4b" stroke="#6d8491" stroke-width="2"/>
<text x="294" y="1520" font-size="32" font-weight="600" text-anchor="middle" fill="#f1eee6">↓</text>
<text x="294" y="1561" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Can</text>
<text x="294" y="1595" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">decrease</text>
<rect x="388" y="1480" width="176" height="129" rx="12" fill="#293e4b" stroke="#6d8491" stroke-width="2"/>
<text x="476" y="1520" font-size="32" font-weight="600" text-anchor="middle" fill="#f1eee6">?</text>
<text x="476" y="1561" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">Context</text>
<text x="476" y="1595" font-size="28" font-weight="600" text-anchor="middle" fill="#f1eee6">matters</text>
<text x="300" y="1643" font-size="28" font-weight="400" text-anchor="middle" fill="#f1eee6">Protein + site + context</text>
</g></svg>
