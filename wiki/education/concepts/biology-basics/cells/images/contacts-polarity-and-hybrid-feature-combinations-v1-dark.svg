<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Illustrative feature combinations, not a compulsory route</title><desc id="desc">Three separate sketches show linked cells with organized polarity, elongated hybrid cells retaining contacts, and more elongated cells with fewer contacts, without transition arrows or a malignancy label. These independent cell sketches illustrate combinations of contacts, polarity and shape, including a contact-retaining hybrid example. They are not a filmed transition, a universal marker test, or a ranking by invasion or drug resistance. Similar programs can occur in normal development and repair; cellular movement, malignancy and reversibility require their own evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
