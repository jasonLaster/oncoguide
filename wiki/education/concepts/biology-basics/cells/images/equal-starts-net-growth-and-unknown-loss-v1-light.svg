<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Smaller increase is not a count of killed cells</title><desc id="desc">Two equal 1,000-cell starts lead to separate 2,000 and 1,200 endpoint bars, with net increases and a final gap distinguished from unknown cell-production and cell-loss contributions. Both fictional cultures start at 1,000 cells, with final counts of 2,000 untreated and 1,200 treated. The bars show endpoints, not an observed growth trajectory. The final 800-cell difference leaves production and loss unresolved; the icons ask about those processes rather than record events. The nondividing-cell vulnerability discussed above remains a separate point.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#293743"/></marker></defs><rect width="760" height="1320" fill="#fcf8f1"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#293743" text-anchor="start">A smaller increase leaves questions</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Fictional cultures; same observation interval</text>
<rect x="24" y="142" width="712" height="565" rx="16" fill="#fffdf8" stroke="#969e9e" stroke-width="2" />
<text x="48" y="195" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#293743" text-anchor="start">Both start at 1,000 cells</text>
<text x="218" y="243" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">Untreated</text>
<rect x="116" y="451.0" width="70" height="146.0" rx="4" fill="#4f7999" data-arm="Untreated" data-count="1000" data-time="Start"/>
<text x="151" y="432.0" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">1,000</text>
<text x="151" y="644" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">Start</text>
<rect x="224" y="305.0" width="70" height="292.0" rx="4" fill="#4f7999" data-arm="Untreated" data-count="2000" data-time="End"/>
<text x="259" y="286.0" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">2,000</text>
<text x="259" y="644" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">End</text>
<text x="214" y="689" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">Net +1,000</text>
<text x="554" y="243" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">Treated</text>
<rect x="452" y="451.0" width="70" height="146.0" rx="4" fill="#bd7480" data-arm="Treated" data-count="1000" data-time="Start"/>
<text x="487" y="432.0" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">1,000</text>
<text x="487" y="644" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">Start</text>
<rect x="560" y="421.8" width="70" height="175.2" rx="4" fill="#bd7480" data-arm="Treated" data-count="1200" data-time="End"/>
<text x="595" y="402.8" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">1,200</text>
<text x="595" y="644" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">End</text>
<text x="550" y="689" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="middle">Net +200</text>
<path d="M76 597 L687 597" fill="none" stroke="#293743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="749" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="start">Final gap: 800 fewer than the control</text>
<rect x="24" y="782" width="712" height="374" rx="16" fill="#fffdf8" stroke="#969e9e" stroke-width="2" />
<text x="48" y="835" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#293743" text-anchor="start">Production and loss are unmeasured</text>
<circle cx="113" cy="930" r="36" fill="#4f7999" stroke="#293743" stroke-width="2" />
<circle cx="110" cy="934" r="13.68" fill="#806a9c" stroke="#293743" stroke-width="2" />
<circle cx="196" cy="909" r="25" fill="#4f7999" stroke="#293743" stroke-width="2" />
<circle cx="193" cy="913" r="9.5" fill="#806a9c" stroke="#293743" stroke-width="2" />
<circle cx="203" cy="963" r="25" fill="#4f7999" stroke="#293743" stroke-width="2" />
<circle cx="200" cy="967" r="9.5" fill="#806a9c" stroke="#293743" stroke-width="2" />
<path d="M147 917 L168 909" fill="none" stroke="#293743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<path d="M149 943 L169 961" fill="none" stroke="#293743" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="174" y="1060" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">Produced?</text>
<circle cx="584" cy="933" r="44" fill="#e8e0d3" stroke="#293743" stroke-width="2" />
<text x="584" y="947" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#293743" text-anchor="middle">?</text>
<text x="584" y="1060" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#293743" text-anchor="middle">Lost?</text>
<text x="48" y="1130" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Final = start + produced − lost</text>
<text x="48" y="1237" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">Track divisions, loss and later regrowth.</text>
<text x="38" y="1300" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#293743" text-anchor="start">800 fewer is not 800 measured deaths.</text>
</svg>
