<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Order, optional noncycling and DNA amount</title><desc id="desc">A non-clock G1–S–G2–M loop has an optional G0 exit and conditional return, alongside a separate relative nuclear-DNA key grouping G0/G1 and G2/M without identifying either from DNA alone. DNA (deoxyribonucleic acid) glyphs show relative nuclear material, not a human chromosome count or microscopy image. G0 is an optional noncycling condition; return depends on context. The separate per-cell key applies before cell separation: G0/G1 share a baseline, S lies between baseline and roughly double, and G2/M share roughly double. Neither the drawing’s spacing nor a measured phase fraction is a division rate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f1ecd9" text-anchor="start">Order does not tell you speed</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Schematic sequence; no duration scale</text>
