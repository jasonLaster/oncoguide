<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Proteins and peptides: amino-acid molecules</title><desc id="desc">Linked residue icons form a chain, fold and undergo illustrative segment removal. Two fictional intact protein R forms, one retaining a region and one lacking it, can produce the same shared peptide fragment. The residue icons and shapes are illustrative, not measured sequence lengths or atomic structures. A chain can fold or be processed into another form. In the fictional protein R example, forms A and B share a peptide while only A retains the indicated region; a shared fragment cannot establish which intact form or activity is present. A possible sequence also does not establish HLA presentation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
