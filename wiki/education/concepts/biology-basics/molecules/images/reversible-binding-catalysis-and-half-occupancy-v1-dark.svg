<text x="48" y="1060" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Model fraction: 10 / (10 + 10) = 0.5</text>
<text x="48" y="1126" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Half bound does not mean half dead.</text>
<text x="48" y="1230" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">One site; equilibrium; independent sites;</text>
<text x="48" y="1276" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">no competitor; L is free, not total added.</text>
