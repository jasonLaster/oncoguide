<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Holding a ligand and changing a bond are different</title><desc id="desc">An unchanged ligand reversibly binds a partner, a separate enzyme sketch converts a bonded substrate into products, and five occupied schematic sites out of ten illustrate half occupancy under explicit free-ligand assumptions without a cell-death claim. The ligand stays unchanged when it binds and releases; the separate catalytic sketch changes a substrate bond and reuses the enzyme. Kd is the dissociation constant and nM means nanomolar. Under the stated one-site equilibrium assumptions, free ligand 10 nM and Kd 10 nM predict one-half occupancy. Five of ten illustrated sites visualize that fraction, not an exact observed sample or cell deaths. Binding, Km and IC50 remain different quantities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1ecd9"/></marker></defs><rect width="760" height="1320" fill="#152630"/>
<text x="38" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f1ecd9" text-anchor="start">Binding is not chemical conversion</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#f1ecd9" text-anchor="start">Schematic molecules; shapes are illustrative</text>
<rect x="24" y="142" width="712" height="315" rx="16" fill="#213944" stroke="#a8bcc0" stroke-width="2" />
<text x="48" y="195" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f1ecd9" text-anchor="start">1  Bind / release an unchanged ligand</text>
