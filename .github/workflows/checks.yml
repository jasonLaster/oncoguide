name: Education content checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: education-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bash scripts/build-site.sh
      - run: bun run test:content-sync
      - run: bun --cwd .renderer/apps/oncoguide test:unit
      - run: bun --cwd .renderer/apps/oncoguide typecheck
      - run: bunx playwright install --with-deps chromium
        working-directory: .renderer/apps/oncoguide
      - run: bun run test:reader --reporter=line
